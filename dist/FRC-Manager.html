<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Manager</title>
<style>
:root {
  --bg: #0f1216; --bg2: #151a20; --panel: #1b2128; --panel2: #222a33; --line: #2c353f; --line2: #38434f;
  --text: #e6ebf0; --muted: #94a1ae; --dim: #6c7884;
  --accent: #f5b800; --accent2: #ffd24d; --good: #3ecf8e; --bad: #ff5c5c; --warn: #ffb020; --info: #4aa3ff;
  --red: #e5484d; --blue: #3e8cff;
  --radius: 10px; --shadow: 0 6px 24px rgba(0,0,0,0.35);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; }
body { overflow: hidden; }
button { font: inherit; }
a { color: var(--accent2); }
#app { height: 100%; display: flex; flex-direction: column; }
.hidden { display: none !important; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); }
.red { color: var(--red); } .blue { color: var(--blue); }
.b { font-weight: 700; } .sm { font-size: 12px; } .xs { font-size: 11px; } .lg { font-size: 17px; } .xl { font-size: 22px; }
.mono { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 8px; }
.sp { flex: 1; } .gap4 { gap: 4px; } .gap16 { gap: 16px; } .mt { margin-top: 10px; } .mb { margin-bottom: 10px; } .mt0 { margin-top: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; }
@media (max-width: 1100px) { .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span3 { grid-column: span 2; } }
@media (max-width: 760px) { .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; } .span2, .span3 { grid-column: auto; } }

/* ---------- buttons ---------- */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: #2a3440; border-color: #4a5664; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #1a1400; border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { background: var(--accent2); }
.btn.good { background: #1d4d3a; border-color: #2b7a59; } .btn.bad { background: #4d1f22; border-color: #7a2f34; }
.btn.ghost { background: transparent; } .btn.sm { padding: 4px 9px; font-size: 12px; } .btn.lg { padding: 11px 20px; font-size: 16px; }
.btn.sel { border-color: var(--accent); background: #3a3210; }
.btn.redb { background: #3d1c1f; border-color: var(--red); } .btn.blueb { background: #172a45; border-color: var(--blue); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--line); min-height: 54px; }
.teamchip { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.teamchip .sw { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; color: #000; font-weight: 800; }
.kpi { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.kpi .v { font-weight: 700; font-variant-numeric: tabular-nums; } .kpi .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.datelbl { font-weight: 600; color: var(--accent2); }

/* ---------- layout ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: 190px; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; user-select: none; }
.nav:hover { background: var(--panel); color: var(--text); }
.nav.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.nav .ic { width: 18px; text-align: center; }
.nav .badge { margin-left: auto; background: var(--accent); color: #000; border-radius: 10px; font-size: 10px; padding: 1px 6px; font-weight: 800; }
.main { flex: 1; overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
.main h1 { margin: 0 0 4px; font-size: 22px; } .main h2 { margin: 0 0 10px; font-size: 16px; } .main h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub { color: var(--muted); margin-bottom: 16px; }
@media (max-width: 760px) { .side { width: 58px; } .nav span.t { display: none; } .main { padding: 12px; } .topbar { flex-wrap: wrap; } }

/* ---------- cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card.flat { background: var(--bg2); }
.card.hl { border-color: var(--accent); }
.card .ct { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; }
.card .ct .sp { flex: 1; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--good); border-color: #2b7a59; } .tag.bad { color: var(--bad); border-color: #7a2f34; } .tag.warn { color: var(--warn); border-color: #7a5a1a; } .tag.acc { color: var(--accent2); border-color: #7a6a1a; } .tag.info { color: var(--info); border-color: #1d4f80; }
.hr { height: 1px; background: var(--line); margin: 10px 0; }

/* ---------- bars ---------- */
.bar { position: relative; height: 8px; background: #0c0f13; border-radius: 6px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
.bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.6); }
.statrow { display: grid; grid-template-columns: 110px 1fr 38px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.statrow .n { color: var(--muted); } .statrow .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- tables ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 6px 8px; border-bottom: 1px solid #222a32; vertical-align: middle; }
table.t tr.me td { background: rgba(245,184,0,0.08); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--panel2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- inbox ---------- */
.msg { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; cursor: pointer; }
.msg.unread { border-left: 3px solid var(--accent); }
.msg .mt { font-weight: 700; } .msg .md { font-size: 11px; color: var(--dim); }
.msg .mb { white-space: pre-wrap; color: var(--muted); margin-top: 6px; font-size: 13px; line-height: 1.45; }

/* ---------- modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(5,7,10,0.72); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px; }
.modal.wide { width: min(980px, 100%); }
.modal h2 { margin: 0 0 8px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px; animation: tin .2s ease-out; }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- menu ---------- */
.menu-wrap { flex: 1; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; background: radial-gradient(1200px 600px at 70% -10%, #2a2410 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #10233a 0%, transparent 60%), var(--bg); }
.menu-box { width: min(1060px, 100%); }
.logo { font-size: 42px; font-weight: 900; letter-spacing: -.02em; }
.logo span { color: var(--accent); }
.choice { padding: 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); cursor: pointer; }
.choice:hover { border-color: #56636f; } .choice.on { border-color: var(--accent); background: #2a2610; }
.inp { background: #0f1317; border: 1px solid var(--line2); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; width: 100%; }
select.inp { cursor: pointer; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }

/* ---------- match view ---------- */
.matchview { display: grid; grid-template-columns: 230px 1fr 250px; gap: 12px; }
@media (max-width: 1150px) { .matchview { grid-template-columns: 1fr; } }
.fieldwrap { position: relative; background: #0b0d10; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
.fieldwrap canvas { display: block; width: 100%; height: auto; }
.scorebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
.score { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 2px 14px; border-radius: 8px; }
.score.r { background: rgba(229,72,77,0.15); color: #ff8a8d; text-align: right; } .score.b { background: rgba(62,140,255,0.15); color: #8ab8ff; }
.clock { text-align: center; } .clock .t { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; } .clock .p { font-size: 11px; color: var(--accent2); letter-spacing: .08em; font-weight: 700; }
.log { height: 300px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column-reverse; gap: 2px; }
.log div { padding: 3px 6px; border-radius: 4px; background: #14191e; }
.log .fault { color: var(--warn); } .log .foul { color: #ff9b9b; } .log .phase { color: var(--accent2); font-weight: 700; } .log .call { color: var(--info); } .log .rp { color: var(--good); } .log .end { color: #c9a7ff; }
.calls { display: flex; flex-wrap: wrap; gap: 6px; }
.rbox { padding: 8px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); margin-bottom: 6px; font-size: 12px; }
.rbox.me { border-color: var(--accent); }
.rbox .hd { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; }
.rp-item { margin-bottom: 8px; font-size: 12px; }
.bracket { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 12px; overflow-x: auto; }
.bm { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; margin-bottom: 8px; }
.bm.me { border-color: var(--accent); } .bm .al { display: flex; justify-content: space-between; } .bm .w { font-weight: 800; color: var(--text); } .bm .l { color: var(--dim); }
.pill-red { background: rgba(229,72,77,0.18); color: #ff9a9c; padding: 1px 6px; border-radius: 4px; }
.pill-blue { background: rgba(62,140,255,0.18); color: #9cc3ff; padding: 1px 6px; border-radius: 4px; }
canvas.side { width: 100%; height: auto; display: block; background: #12161b; border-radius: 8px; border: 1px solid var(--line); }
.hint { background: #14202c; border: 1px solid #1d3b57; color: #a8cff5; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.warnbox { background: #2a1f0e; border: 1px solid #6b4f16; color: #ffd38a; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .kv .k { color: var(--muted); }
.big-cta { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; background: linear-gradient(90deg, #2c2508, #1b2128); border: 1px solid #6b5a12; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 6px; }
.chart .c { flex: 1; display: flex; flex-direction: column-reverse; align-items: stretch; gap: 2px; min-width: 6px; }
.chart .c i { display: block; border-radius: 3px 3px 0 0; }

/* ---------- blue banners (event wins & Impact) ---------- */
.banners { display: flex; flex-wrap: wrap; gap: 14px; }
.banner { --fb: #0066b3; position: relative; width: 128px; min-height: 182px; padding: 14px 10px 34px; color: #fff; text-align: center;
  background: linear-gradient(180deg, #0a74c7 0%, var(--fb) 60%, #00539a 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45)); }
.banner .emb { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1; }
.banner .aw { font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; line-height: 1.15; }
.banner .yr { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.banner .ev { font-size: 11px; line-height: 1.25; opacity: .92; }
.banner.gold { border-top: 0; background: linear-gradient(180deg, #0a74c7 0%, #0066b3 60%, #00539a 100%); }
.banner.gold .emb { border-color: #f5c542; color: #f5c542; }
.banner.gold .aw { color: #ffe08a; }
.banner.new { animation: bannerDrop .7s cubic-bezier(.2,.9,.3,1.2); }
@keyframes bannerDrop { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .banner.new { animation: none; } }

/* ---------- team hours ---------- */
.hbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #0c0f13; border: 1px solid var(--line); }
.hbar > span { display: block; height: 100%; min-width: 2px; }
.hbar > span.idle { background: repeating-linear-gradient(45deg, #222a33, #222a33 6px, #1a2027 6px, #1a2027 12px); }
.hbar > span.act { background: #6c7884; }
.hlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.hlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hnum { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hnums { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 10px; }
.hnums .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.batt { display: inline-block; width: 16px; height: 26px; border: 2px solid #8a96a3; border-radius: 3px; position: relative; margin: 0 2px; vertical-align: middle; }
.batt::before { content: ""; position: absolute; top: -5px; left: 4px; width: 4px; height: 3px; background: #8a96a3; border-radius: 1px 1px 0 0; }
.batt i { position: absolute; left: 1px; right: 1px; bottom: 1px; border-radius: 1px; }
/* Impact odds + rating */
.statrow.wide { grid-template-columns: 175px 1fr 38px; }
.imp { display: grid; grid-template-columns: 46px 1fr 34px; gap: 8px; align-items: center; margin: 3px 0 10px; }
.imp > b { text-align: right; font-variant-numeric: tabular-nums; }
.imp:not(:has(.bar)) { display: block; }
.nowrap { white-space: nowrap; }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .g12 { grid-template-columns: 1fr; } }
table.t.tight th, table.t.tight td { padding: 5px 5px; }
.acc { color: var(--accent2); }
/* version notes */
.vnotes { margin: 8px 0 2px; padding-left: 20px; line-height: 1.55; color: var(--muted); font-size: 14px; }
.vnotes li { margin: 4px 0; }

</style>
</head>
<body>
<div id="app"></div>
<script>/* js/core.js */
'use strict';
/* FRC Manager — core utilities, RNG, save system */
window.G = window.G || {};

(function () {
  // ---------- Seeded RNG (mulberry32 with exposed state) ----------
  function Rng(seed) { this.s = (seed >>> 0) || 1; }
  Rng.prototype.next = function () {
    let a = (this.s = (this.s + 0x6D2B79F5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.r = function () { return this.next(); };
  Rng.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
  Rng.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.norm = function (mu, sd) {
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  Rng.prototype.wpick = function (items, wfn) {
    let tot = 0; const ws = items.map(it => { const w = Math.max(0, wfn(it)); tot += w; return w; });
    if (tot <= 0) return items[Math.floor(this.next() * items.length)];
    let x = this.next() * tot;
    for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
    return items[items.length - 1];
  };
  G.Rng = Rng;
  G.makeRng = seed => new Rng(seed);
  G.R = new Rng(Date.now() & 0xffffffff); // global game RNG; re-seeded from save

  // ---------- Utilities ----------
  const U = G.U = {};
  U.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.sum = arr => arr.reduce((s, x) => s + x, 0);
  U.avg = arr => arr.length ? U.sum(arr) / arr.length : 0;
  U.round = (v, d = 0) => { const k = Math.pow(10, d); return Math.round(v * k) / k; };
  U.money = v => (v < 0 ? '-$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US');
  U.kmoney = v => { const a = Math.abs(v); const s = v < 0 ? '-$' : '$'; return a >= 1000 ? s + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k' : s + Math.round(a); };
  U.pct = v => Math.round(v * 100) + '%';
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.clone = o => JSON.parse(JSON.stringify(o));
  let _uid = 0;
  U.uid = (p = 'id') => p + '_' + Date.now().toString(36) + '_' + (++_uid).toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  U.byId = (arr, id) => arr.find(x => x.id === id);
  U.stars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
  U.ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  U.fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // ---------- Version (shown in game; see G.RELEASES in ui/screens-menu.js) ----------
  G.VERSION = '1.4';

  // ---------- Save system ----------
  const KEY = 'frcm_save_';
  const Save = G.Save = {};
  Save.slots = ['auto', '1', '2', '3'];
  Save.write = function (slot) {
    if (!G.S) return false;
    try {
      G.S.rngS = G.R.s;
      G.S.savedAt = Date.now();
      localStorage.setItem(KEY + slot, JSON.stringify(G.S));
      return true;
    } catch (e) { console.warn('Save failed', e); return false; }
  };
  Save.meta = function (slot) {
    try {
      const raw = localStorage.getItem(KEY + slot);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { slot, team: s.team, year: s.year, mode: s.mode, phase: s.phase, savedAt: s.savedAt, money: s.money, si: s.si };
    } catch (e) { return null; }
  };
  Save.load = function (slot) {
    try {
      const raw = localStorage.getItem(KEY + slot);
      if (!raw) return false;
      G.S = JSON.parse(raw);
      G.R = new Rng(G.S.rngS || 12345);
      if (G.Shop) G.Shop.migrate(G.S); // older saves: equipment flags → facility levels
      return true;
    } catch (e) { console.warn('Load failed', e); return false; }
  };
  Save.remove = function (slot) { try { localStorage.removeItem(KEY + slot); } catch (e) { } };
  Save.exportText = function () {
    if (!G.S) return '';
    G.S.rngS = G.R.s;
    return JSON.stringify(G.S);
  };
  Save.importText = function (text, cb) {
    try {
      const s = JSON.parse(String(text).trim());
      if (!s || !s.team || !s.v) throw new Error('this is not a FRC Manager save');
      G.S = s; G.R = new Rng(s.rngS || 777);
      if (G.Shop) G.Shop.migrate(G.S);
      cb(true);
    } catch (e) { cb(false, e.message); }
  };
  Save.importFile = function (file, cb) {
    const fr = new FileReader();
    fr.onload = () => Save.importText(fr.result, cb);
    fr.onerror = () => cb(false, 'the file could not be read');
    fr.readAsText(file);
  };
  Save.settings = function () {
    try { return JSON.parse(localStorage.getItem('frcm_settings') || '{}'); } catch (e) { return {}; }
  };
  Save.saveSettings = function (o) { try { localStorage.setItem('frcm_settings', JSON.stringify(o)); } catch (e) { } };
})();

<script>/* js/sim/engine.js */
'use strict';
/* FRC Manager — headless match engine (10 ticks/s), shared by live view, quick sim and AI matches */
(function () {
  const U = G.U;
  const FW = 16.54, FH = 8.21, DT = 0.1;
  const E = G.Engine = { FW, FH, DT };

  const PACE = E.PACE = {
    push: { name: 'Push', spd: 1.10, cyc: 0.92, acc: -0.06, foul: 1.8, wear: 1.6, brown: 2.0 },
    bal: { name: 'Balanced', spd: 1.00, cyc: 1.00, acc: 0, foul: 1, wear: 1, brown: 1 },
    cons: { name: 'Conserve', spd: 0.92, cyc: 1.07, acc: 0.03, foul: 0.5, wear: 0.6, brown: 0.6 }
  };
  const dist = E.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const opp = a => a === 'red' ? 'blue' : 'red';
  E.opp = opp;

  // Field coordinates are authored for BLUE (left side); red is mirrored or rotated.
  E.P = function (m, a, x, y) {
    if (a === 'blue') return { x, y };
    return m.sym === 'mirror' ? { x: FW - x, y } : { x: FW - x, y: FH - y };
  };

  // ---------------------------------------------------------------
  E.create = function (o) {
    const S = G.Seasons[o.year], R = G.Rules[o.year];
    const m = {
      year: o.year, S, R, sym: S.sym, rng: G.makeRng(o.seed || 1), t: 0, phase: 'auto', done: false, inEnd: false,
      T: S.timing, total: S.timing.auto + S.timing.tele, robots: [], score: {}, ss: {}, log: [], fx: [], obs: [],
      headless: !!o.headless, playoff: !!o.playoff, calls: o.calls == null ? 3 : o.calls, callsUsed: 0, pending: [],
      diff: o.diff || 1, coachSkill: o.coachSkill || 50, playerTeam: o.playerTeam || null,
      feedIQ: Object.assign({ red: 0, blue: 0 }, o.feedIQ || {}) // how well each alliance runs alternative strategies (2024 note feeding)
    };
    ['red', 'blue'].forEach(a => {
      m.score[a] = { auto: 0, tele: 0, end: 0, foul: 0, total: 0 };
      (o[a] || []).forEach((en, i) => m.robots.push(makeRobot(m, a, i, en)));
    });
    R.init(m, H);
    m.robots.forEach(r => {
      const p = R.start(m, r);
      r.x = r.px = r.sx = p.x; r.y = r.py = r.sy = p.y;
      r.hd = (r.a === 'blue') ? 0 : Math.PI;
      r.autoOK = m.rng.chance(U.clamp(0.5 + 0.46 * r.cap.auto / 100 + (r.tuneAuto || 0), 0.3, 0.985));
    });
    return m;
  };

  function makeRobot(m, a, i, en) {
    const drv = en.drv || { drive: 50, comp: 50, aware: 50, mech: 50, hp: 50, strat: 50 };
    const conf = en.conf == null ? 0.5 : en.conf, tune = en.tune == null ? 0.5 : en.tune;
    return {
      team: en.team, a, slot: i, cap: en.cap, look: en.look || {}, drv, isPlayer: !!en.isPlayer,
      plan: Object.assign({ pace: 'bal', role: 'score', target: 'auto', endTiming: 'std', endLevel: 9, rpHunt: false, avoid: false, defTarget: null }, en.plan || {}),
      tune, conf, tuneAuto: en.tuneAuto || 0,
      // practiced drive teams (confidence) drive faster, line up quicker, handle pieces faster, foul less and climb more surely; 0.6 ≈ an average AI team
      drvF: 0.816 + 0.22 * drv.drive / 100 + 0.16 * (conf - 0.6), confK: conf - 0.6,
      opF: 0.86 + 0.14 * drv.mech / 100,
      cond: en.cond == null ? 100 : en.cond, batt: en.batt == null ? 1 : en.batt, hidden: en.hidden || 0,
      x: 0, y: 0, px: 0, py: 0, sx: 0, sy: 0, hd: 0, path: [], st: 'idle', timer: 0, onDone: null, onArrive: null, label: 'Ready',
      held: 0, heldType: null, fault: null, jam: {}, perm: {}, dead: false, left: false,
      end: null, endBusy: false, climbing: false, defBy: null, defT: null, defSlow: 1, contacts: 0, defTime: 0,
      stats: { pts: 0, cycles: 0, shots: 0, hits: 0, fouls: 0, faults: [] }, replan: false, mem: {}
    };
  }

  // ---------------------------------------------------------------
  E.step = function (m) {
    if (m.done) return;
    for (let i = m.pending.length - 1; i >= 0; i--) {
      const c = m.pending[i];
      if (m.t >= c.at) { applyCall(m, c); m.pending.splice(i, 1); }
    }
    if (m.phase === 'auto' && m.t >= m.T.auto - 1e-6) toTeleop(m);
    m.inEnd = m.phase !== 'auto' && m.t >= m.total - m.T.end - 1e-6;
    if (m.inEnd && !m.endAnnounced) { m.endAnnounced = true; log(m, null, 'ENDGAME — ' + m.T.end + ' seconds left', 'phase'); }
    defensePass(m);
    for (const r of m.robots) updateRobot(m, r);
    separate(m);
    if (m.R.tick) m.R.tick(m, H);
    m.t = Math.round((m.t + DT) * 1000) / 1000;
    if (m.t >= m.total - 1e-6) finish(m);
  };
  E.run = function (m) { let g = 0; while (!m.done && g++ < 4000) E.step(m); return m.result; };

  function toTeleop(m) {
    m.phase = 'tele';
    const lp = m.R.leavePts || 0;
    m.robots.forEach(r => {
      if (lp && r.left) { m.score[r.a].auto += lp; r.stats.pts += lp; }
      if (!r.dead) {
        r.st = 'idle'; r.path = []; r.onDone = null; r.onArrive = null; r.onWait = null; r.waitFn = null; r.climbing = false;
        if (!r.keepEnd) { r.end = null; r.endBusy = false; }
      }
    });
    if (m.R.onTeleop) m.R.onTeleop(m, H);
    log(m, null, 'TELEOP', 'phase');
  }

  function updateRobot(m, r) {
    r.px = r.x; r.py = r.y;
    if (r.dead) { r.label = r.tipped ? 'TIPPED' : 'DISABLED'; return; }
    if (r.fault && m.t >= r.fault.until) { r.fault = null; if (r.st === 'idle') r.label = ''; }
    for (const k in r.jam) if (r.jam[k] && m.t >= r.jam[k]) r.jam[k] = 0;
    faultRoll(m, r);
    if (r.dead) return;
    if (r.fault && r.fault.stall) { r.label = r.fault.label; return; }
    if (r.replan && !r.endBusy && (r.st === 'move' || r.st === 'wait' || r.st === 'defend')) {
      r.st = 'idle'; r.path = []; r.onArrive = null; r.onWait = null; r.waitFn = null;
    }
    r.replan = false;
    if (m.phase !== 'auto' && !r.end && !r.endBusy && !r.climbing &&
      (r.st === 'wait' || r.st === 'defend' || r.st === 'move' || (r.st === 'act' && r.timer > 1.0)) && endgameDue(m, r)) {
      r.st = 'idle'; r.path = []; r.onWait = null; r.waitFn = null; r.onArrive = null; r.onDone = null;
    }
    switch (r.st) {
      case 'idle': decide(m, r); break;
      case 'move': moveStep(m, r); break;
      case 'act': {
        r.timer -= DT * (r.defBy && !r.climbing ? 1 - 0.15 * ((m.R.defense && m.R.defense.eff) || 1) : 1);
        if (r.timer <= 0) { const f = r.onDone; r.onDone = null; r.st = 'idle'; if (f) f(); }
        break;
      }
      case 'wait':
        r.timer -= DT;
        if (r.timer <= 0 || (r.waitFn && r.waitFn())) {
          const f = r.onWait; r.onWait = null; r.waitFn = null; r.st = 'idle'; if (f) f();
        }
        break;
      case 'defend': defendStep(m, r); break;
      default: break;
    }
    if (!r.left) r.left = m.R.leftCheck ? m.R.leftCheck(m, r) : dist(r, { x: r.sx, y: r.sy }) > 1.2;
  }

  function decide(m, r) {
    if (r.end) { r.st = 'done'; return; }
    if (m.phase === 'auto') {
      m.R.autoDecide(m, r, H);
      if (r.st === 'idle') { r.st = 'wait'; r.timer = 0.5; if (!r.label) r.label = 'Auto done'; }
      return;
    }
    if (!r.endBusy && endgameDue(m, r)) { goEndgame(m, r); return; }
    let role = r.plan.role;
    if (role !== 'defend' && r.perm.scorer && !(m.R.canStillScore && m.R.canStillScore(r))) role = r.cap.push >= 30 ? 'defend' : 'park';
    if (role === 'defend') { startDefend(m, r); return; }
    if (role === 'park') { r.st = 'wait'; r.timer = 2; r.label = 'Out of action'; return; }
    m.R.decide(m, r, H, role);

  // ---------- movement ----------

  // ---------- defense ----------

  // ---------- faults ----------
  // Comms losses have their own, more frequent hazard (below); the season profile (R.faults) scales brownouts, tips and comms.
  const FAULTS = [{ id: 'brown', w: 30 }, { id: 'intakeJam', w: 18 }, { id: 'scorerJam', w: 18 }, { id: 'mech', w: 9 }];
  // 0 = clean, well-built electronics … about 1.5 = poor wiring, worn robot, hidden defects, tired battery

  // ---------- endgame ----------

        if (r.end && r.end.lvl > 0 && !r.dead) { const p = [10, 20, 30][r.end.lvl - 1]; m.score[r.a].end += p; m.ss[r.a].tower += p; r.stats.pts += p; }
      });
    },
    bonus(m, a) {
      const ss = m.ss[a];
      const tower = m.done ? ss.tower : ss.tower + m.robots.filter(r => r.a === a && r.end && r.end.lvl > 0).reduce((s, r) => s + [10, 20, 30][r.end.lvl - 1], 0);
      return [
        { key: 'energized', name: 'Energized', val: ss.fuel, thr: 100, ok: ss.fuel >= 100, unit: 'fuel' },
        { key: 'super', name: 'Supercharged', val: ss.fuel, thr: 360, ok: ss.fuel >= 360, unit: 'fuel' },
        { key: 'trav', name: 'Traversal', val: tower, thr: 50, ok: tower >= 50, unit: 'tower pts' }
      ];
    },
    hud(m, a) { return [active26(m, a) ? 'HUB ACTIVE' : 'HUB INACTIVE']; }
  };
})();

<script>/* js/sim/ai.js */
'use strict';
/* FRC Manager — robot capability builder (shared by player & AI) and the AI team pool */
(function () {
  const U = G.U, D = G.Data;

  // ------------------------------------------------------------------
  // Capability builder: subsystems -> flat match capability object
  // subs: { subId: { concept, ver, stats:{}, rel, w } }
  // ------------------------------------------------------------------
  const STAT_KEY = { amp: 'ampSkill', algae: 'algaeSkill' };
  G.Cap = {};
  G.Cap.build = function (year, subs, extra) {
    extra = extra || {};
    const cap = {
      speed: 0, agility: 0, push: 0, intake: 0, scoreSpd: 0, accuracy: 0, range: 0, endgame: 0, auto: 20, vision: 0,
      balance: 20, ampSkill: 0, algaeSkill: 0, traverse: 40, feed: 40, endLevel: 0, storage: 1,
      autoTier: extra.autoTier || 0, visionLvl: extra.visionLvl || 0
    };
    const rels = []; let weight = 0; let built = 0;
    G.Seasons[year].subs.forEach(sd => {
      const s = subs[sd.id];
      if (!s || !s.ver) {
        if (sd.id === 'intake') cap.noIntake = true;
        if (sd.id === 'scorer') cap.noScorerMain = true;
        return;
      }
      const c = G.Seasons.concept(year, sd.id, s.concept);
      if (!c) return;
      built++;
      Object.keys(s.stats || {}).forEach(k => { cap[STAT_KEY[k] || k] = s.stats[k]; });
      Object.assign(cap, c.caps || {});
      if (sd.id !== 'soft') rels.push(s.rel == null ? 70 : s.rel);
      weight += s.w == null ? c.w : s.w;
    });
    if (cap.rmax) cap.rangeM = cap.rmin + (cap.rmax - cap.rmin) * (cap.range || 0) / 100;
    if (!subs.drive || !subs.drive.ver) { cap.speed = 15; cap.agility = 15; cap.push = 20; cap.noDrive = true; }
    // no scorer at all?
    const hasAlt = (subs.amp && subs.amp.ver) || (subs.algae && subs.algae.ver);
    cap.noScorer = !!cap.noScorerMain && !hasAlt;
    const avg = rels.length ? U.avg(rels) : 60, mn = rels.length ? Math.min(...rels) : 60;
    const parts = extra.parts || {};
    cap.rel = U.clamp(0.6 * avg + 0.4 * mn + (parts.sensors ? 2 : 0), 5, 99);
    cap.brown = [1.25, 1.0, 0.8][parts.motors || 0];
    cap.weight = Math.round(weight);
    if (cap.endLevel && !cap.endgame) cap.endgame = 40;
    return cap;
  };
  G.Cap.look = function (year, subs, extra) {
    const lk = { drive: 'tank', ver: 1 };
    let maxVer = 0;
    G.Seasons[year].subs.forEach(sd => {
      const s = subs[sd.id];
      if (!s || !s.ver) return;
      const c = G.Seasons.concept(year, sd.id, s.concept);
      if (c && c.look) Object.assign(lk, c.look);
      if (sd.id !== 'soft') maxVer = Math.max(maxVer, s.ver);
    });
    lk.ver = maxVer; lk.vision = (extra && extra.visionLvl) || 0;
    return lk;
  };
  // Expected-points "power" of a capability (used for scouting estimates and AI picks)
  G.Cap.power = function (year, cap) {
    if (cap.noDrive) return 0;
    const sc = cap.noScorer ? 0.15 : (0.35 + 0.65 * (cap.scoreSpd * 0.5 + cap.accuracy * 0.5) / 100);
    const cyc = (0.4 + 0.6 * (cap.speed * 0.6 + cap.intake * 0.4) / 100);
    const end = [0, 0.4, 0.7, 1.0, 1.3][cap.endLevel || 0] * (0.5 + 0.5 * (cap.endgame || 0) / 100);
    return Math.round(100 * (sc * cyc * 0.75 + end * 0.18 + (cap.autoTier || 0) * 0.03) * (0.7 + 0.3 * cap.rel / 100));
  };

  // ------------------------------------------------------------------
  // AI team pool
  // ------------------------------------------------------------------
  const AI = G.AI = {};
  AI.makePool = function (rng, n, playerNum, startYear) {
    const pool = {};
    const used = new Set([playerNum]);
    for (let i = 0; i < n; i++) {
      let num; do { num = rng.int(1, 10999); } while (used.has(num));
      used.add(num);
      const str = Math.round(U.clamp(rng.norm(48, 18) + (num < 2000 ? 6 : 0), 6, 96));
      pool[num] = {
        num, name: D.teamName(rng), region: rng.pick(D.REGIONS), str, traj: rng.pick([-1, 0, 0, 1]),
        impact: AI.impactRoll(rng, str), rookie: false, rb: null
      };
    }
    return pool;
  };
  // Impact strength of an established team: loosely tied to robot strength, plus a few outreach powerhouses.
  AI.impactRoll = (rng, str) => Math.round(U.clamp(rng.norm(str * 0.45 + 20, 14) + (rng.chance(0.1) ? 24 : 0), 5, 98));
  AI.addRookies = function (pool, rng, year, count, playerNum) {
    for (let i = 0; i < count; i++) {
      let num; do { num = rng.int(11000, 11999); } while (pool[num] || num === playerNum);
      pool[num] = { num, name: D.teamName(rng), region: rng.pick(D.REGIONS), str: Math.round(U.clamp(rng.norm(26, 10), 5, 60)), traj: 1,
        impact: Math.round(U.clamp(rng.norm(30, 12), 5, 80)), rookie: year, rb: null };
    }
  };
  AI.evolve = function (pool, rng) {
    Object.values(pool).forEach(t => {
      t.str = Math.round(U.clamp(t.str + t.traj * rng.range(1, 5) + rng.norm(0, 4), 5, 97));
      if (rng.chance(0.2)) t.traj = rng.pick([-1, 0, 1]);
      t.impact = Math.round(U.clamp(t.impact + rng.norm(0, 5), 5, 98));
      t.rb = null;
    });
  };

  function pickArchetype(rng, S, str) {
    const elig = S.archetypes.filter(a => !a.defense && !a.feed && str >= a.min).sort((p, q) => q.min - p.min);
    const spec = S.archetypes.filter(a => (a.defense || a.feed) && str >= a.min);
    if (spec.length && rng.chance(0.08)) return rng.pick(spec);
    const x = rng.next();
    if (x < 0.5 || elig.length === 1) return elig[0];
    if (x < 0.82 && elig[1]) return elig[1];
    return rng.pick(elig);
  }
  // Generate this season's robot design for an AI team (stored on the team)
  AI.seasonRobot = function (team, year, rng) {
    const S = G.Seasons[year], arch = pickArchetype(rng, S, team.str);
    const q = U.clamp(Math.pow(team.str / 100, 1.3) + rng.norm(0, 0.07), 0.03, 0.97);
    const choice = {};
    S.subs.forEach(sd => {
      let p = arch.pick[sd.id];
      if (sd.id === 'soft') p = 'code';
      if (Array.isArray(p)) p = rng.pick(p);
      if (!p) p = sd.concepts[0].id;
      choice[sd.id] = p;
    });
    if (choice.drive === 'swerve' && team.str < 45 && rng.chance(0.6)) choice.drive = 'wcd';
    const jit = {};
    S.subs.forEach(sd => { jit[sd.id] = rng.range(-0.08, 0.08); });
    team.rb = {
      year, arch: arch.name, role: arch.defense ? 'defend' : arch.feed ? 'feed' : 'score', choice, q, jit,
      autoTier: U.clamp(Math.floor(q * 4 + rng.norm(0, 0.6)), 0, 3), visionLvl: q > 0.72 ? 2 : q > 0.45 ? 1 : 0,
      drv: Math.round(U.clamp(30 + 60 * q + rng.norm(0, 8), 15, 97)), comp: Math.round(U.clamp(35 + 50 * q + rng.norm(0, 10), 15, 97))
    };
    return team.rb;
  };
  // Event-time capability for an AI team; weekMult models in-season improvement
  AI.entry = function (team, year, weekMult, diffMult, rng) {
    if (!team.rb || team.rb.year !== year) AI.seasonRobot(team, year, rng);
    const rb = team.rb, S = G.Seasons[year];
    const qe = U.clamp(rb.q * weekMult * diffMult, 0.03, 0.99);
    const subs = {};
    S.subs.forEach(sd => {
      const cid = rb.choice[sd.id];
      const c = sd.concepts.find(x => x.id === cid);
      if (!c) return;
      if (c.id === 'none') { subs[sd.id] = { concept: 'none', ver: 0, stats: {} }; return; }
      const qq = U.clamp(qe + rb.jit[sd.id], 0.02, 0.99);
      const stats = {};
      Object.keys(c.ceil).forEach(k => { stats[k] = Math.round(c.base[k] + (c.ceil[k] - c.base[k]) * qq); });
      subs[sd.id] = { concept: cid, ver: 1 + Math.floor(qq * 3), stats, rel: Math.round(U.clamp(52 + 42 * qq - c.cx * 2 + rng.norm(0, 4), 30, 97)), w: c.w };
    });
    const extra = { autoTier: rb.autoTier, visionLvl: rb.visionLvl, parts: { motors: qe > 0.6 ? 2 : qe > 0.35 ? 1 : 0, sensors: qe > 0.5 ? 1 : 0 } };
    const cap = G.Cap.build(year, subs, extra);
    const look = G.Cap.look(year, subs, extra);
    const d = rb.drv, cp = rb.comp;
    return {
      team: team.num, cap, look, isPlayer: false,
      drv: { drive: d, comp: cp, aware: d, mech: Math.round((d + cp) / 2), hp: Math.round(U.clamp(30 + 55 * qe, 20, 95)), strat: d },
      plan: { role: rb.role }, tune: U.clamp(0.4 + qe * 0.5, 0, 1), conf: U.clamp(0.4 + qe * 0.5, 0, 1), cond: 100, batt: 1, hidden: 0,
      arch: rb.arch, power: G.Cap.power(year, cap)
    };
  };

  // Choose AI teams attending an event
  AI.pickAttendees = function (pool, rng, count, region, star, exclude, champs) {
    const target = champs ? 78 : 28 + star * 9;
    const list = Object.values(pool).filter(t => !exclude.has(t.num));
    const chosen = [];
    const cand = list.map(t => {
      let w = champs ? 1 : (t.region === region ? 3 : (D.ADJ[region] || []).includes(t.region) ? 1.4 : 0.35);
      const z = (t.str - target) / (champs ? 14 : 24);
      w *= Math.exp(-z * z) + (champs ? 0.02 : 0.15);
      return { t, w };
    });
    for (let i = 0; i < count && cand.length; i++) {
      const pick = rng.wpick(cand, c => c.w);
      chosen.push(pick.t.num);
      cand.splice(cand.indexOf(pick), 1);
    }
    return chosen;
  };
})();

<script>/* js/sim/event.js */
'use strict';
/* FRC Manager — event flow: practice, qualification schedule, rankings, OPR, alliance selection, playoffs, awards */
(function () {
  const U = G.U, D = G.Data;
  const Ev = G.Ev = {};

  const KIND = {
    regional: { name: 'Regional', perTeam: n => n <= 44 ? 11 : n <= 54 ? 10 : 9, blocks: 3, sel: true, awards: true },
    champs: { name: 'Championship Division', perTeam: () => 10, blocks: 3, sel: true, awards: true },
    offseason: { name: 'Offseason Event', perTeam: () => 6, blocks: 1, sel: true, awards: false },
    scrimmage: { name: 'Week 0 Scrimmage', perTeam: () => 5, blocks: 2, sel: false, awards: false },
    einstein: { name: 'Einstein', perTeam: () => 0, blocks: 0, sel: false, awards: false }
  };
  Ev.KIND = KIND;

  function hash(a, b) { let h = (a ^ 0x9e3779b9) >>> 0; h = Math.imul(h ^ (b + 0x7f4a7c15), 2654435761) >>> 0; return (h ^ (h >>> 13)) >>> 0; }

  // ------------------------------------------------------------------
  Ev.start = function (def) {
    const S = G.S, rng = G.R;
    const K = KIND[def.kind];
    const year = def.year || S.year;
    const ev = {
      id: def.id || U.uid('ev'), name: def.name, kind: def.kind, year, week: def.week || 0, region: def.region || S.team.region,
      star: def.str || 3, seed: rng.int(1, 2e9), stage: 'practice', teams: [], caps: {}, rank: {}, quals: [], qi: 0,
      practice: { blocks: K.blocks, used: [] }, tune: 0.3, conf: 0.3, tuneAuto: 0, shake: 0, plan: { pace: 'bal', role: 'score', target: 'auto', endTiming: 'std', endLevel: 9, rpHunt: false, avoid: false },
      suggest: {}, sel: null, alliances: null, po: null, awards: [], log: [], lastPlayerMatch: -1, timeouts: {}, matchCount: 0, playerResults: []
    };
    const player = S.team.num;
    const weekMult = def.kind === 'champs' || def.kind === 'einstein' ? 1.08 : def.kind === 'offseason' ? 1.04 : def.kind === 'scrimmage' ? 0.8 : 0.85 + 0.03 * (ev.week - 1);
    const diffMult = { easy: 0.9, normal: 1, hard: 1.1 }[S.diff] || 1;
    const size = def.size || 40;
    const exclude = new Set([player]);
    const ai = G.AI.pickAttendees(S.teams, rng, size - 1, ev.region, ev.star, exclude, def.kind === 'champs');
    ev.teams = [player].concat(ai);
    ai.forEach(n => { ev.caps[n] = G.AI.entry(S.teams[n], year, weekMult, diffMult, rng); });
    ev.teams.forEach(n => { ev.rank[n] = { rp: 0, played: 0, w: 0, l: 0, t: 0, pts: 0, auto: 0, tb: rng.next() }; });
    // practice starting values
    const st = G.Robot.eventStart(S, ev);
    ev.tune = st.tune; ev.conf = st.conf;
    if (def.kind === 'einstein') { ev.stage = 'playoffs'; }
    else ev.quals = makeSchedule(ev.teams, K.perTeam(ev.teams.length), rng);
    ev.inspection = G.Robot.inspect(S, ev);
    S.event = ev;
    return ev;
  };

  function makeSchedule(teams, perTeam, rng) {
    const q = [];
    for (let r = 0; r < perTeam; r++) q.push(...rng.shuffle(teams.slice()));
    const matches = [];
    while (q.length) {
      const m = [];
      while (m.length < 6 && q.length) {
        let k = q.findIndex(t => !m.includes(t));
        if (k < 0) break;
        m.push(q.splice(k, 1)[0]);
      }
      while (m.length < 6) { const t = rng.pick(teams); if (!m.includes(t)) m.push(t); }
      matches.push({ n: matches.length + 1, red: m.slice(0, 3), blue: m.slice(3, 6), res: null });
    }
    // spread consecutive appearances
    for (let i = 1; i < matches.length; i++) {
      const prev = matches[i - 1], cur = matches[i];
      const clash = cur.red.concat(cur.blue).some(t => prev.red.includes(t) || prev.blue.includes(t));
      if (clash && i + 1 < matches.length) {
        const j = i + 1 + Math.floor(rng.next() * (matches.length - i - 1));
        const tmp = matches[i]; matches[i] = matches[j]; matches[j] = tmp;
      }
    }
    matches.forEach((m, i) => m.n = i + 1);
    return matches;
  }

  // ------------------------------------------------------------------
  // Practice
  // ------------------------------------------------------------------
  Ev.PRACTICE = [
    { id: 'driver', name: 'Driver Reps', desc: '+Driver Confidence (faster, cleaner cycles).' },
    { id: 'calib', name: 'Mechanism Calibration', desc: '+Robot Tuning (accuracy).' },
    { id: 'auto', name: 'Auto Validation', desc: '+Autonomous success rate.' },
    { id: 'shake', name: 'Systems Shakedown', desc: 'Find hidden faults, lower fault chance.' },
    { id: 'scout', name: 'Scouting Focus', desc: 'Sharper scouting data on other teams.' },
    { id: 'install', name: 'Install Upgrade', desc: 'Install finished upgrades in the pits.' }
  ];
  Ev.doPractice = function (ev, prog) {
    const S = G.S, rng = G.R, out = [];
    const coach = G.Career.mentorSkill(S, 'coach'), strat = G.Career.mentorSkill(S, 'strat'), prog2 = G.Career.mentorSkill(S, 'prog'), fab = G.Career.mentorSkill(S, 'fab');
    switch (prog) {
      case 'driver': { const d = 0.22 + 0.12 * coach / 100; ev.conf = U.clamp(ev.conf + d, 0, 1); out.push('Driver confidence +' + Math.round(d * 100) + '%'); break; }
      case 'calib': { const d = 0.22 + 0.1 * G.Career.mentorSkill(S, 'design') / 100; ev.tune = U.clamp(ev.tune + d, 0, 1); out.push('Robot tuning +' + Math.round(d * 100) + '%'); break; }
      case 'auto': { const d = 0.06 + 0.05 * prog2 / 100; ev.tuneAuto = U.clamp(ev.tuneAuto + d, 0, 0.2); out.push('Auto success +' + Math.round(d * 100) + '%'); break; }
      case 'shake': {
        ev.shake = Math.min(2, ev.shake + 1);
        const found = G.Robot.shakedown(S, 0.55 + 0.3 * fab / 100);
        out.push(found ? 'Found and fixed ' + found + ' hidden fault' + (found > 1 ? 's' : '') + '.' : 'No hidden faults found. Systems look healthy.');
        break;
      }
      case 'scout': { ev.scoutBonus = (ev.scoutBonus || 0) + 1; out.push('Scouting data sharpened (strategy mentor ' + Math.round(strat) + ').'); break; }
      case 'install': { const n = G.Robot.installPending(S); out.push(n ? 'Installed ' + n + ' upgrade' + (n > 1 ? 's' : '') + '.' : 'No pending upgrades to install.'); break; }
      case 'lighten': { out.push(G.Robot.emergencyLighten(S)); break; }
    }
    ev.practice.used.push(prog);
    if (ev.practice.used.length >= ev.practice.blocks) ev.stage = ev.kind === 'einstein' ? 'playoffs' : 'quals';
    return out;
  };
  Ev.skipPractice = function (ev) { while (ev.stage === 'practice') Ev.doPractice(ev, ev.inspection && !ev.inspection.ok && !ev.practice.used.includes('lighten') ? 'lighten' : 'calib'); };

  // ------------------------------------------------------------------
  // Match building & running
  // ------------------------------------------------------------------
  Ev.entryFor = function (ev, team, alliance, matchIdx, playoff) {
    const S = G.S;
    if (team === S.team.num) {
      const en = G.Robot.matchEntry(S, ev);
      en.plan = Object.assign({}, ev.plan);
      return en;
    }
    const base = ev.caps[team];
    const en = Object.assign({}, base);
    en.plan = Object.assign({}, base.plan);
    return en;
  };
  Ev.matchEntries = function (ev, match, playoff) {
    const S = G.S, rng = G.makeRng(hash(ev.seed, match.key || match.n || 1));
    const out = {};
    ['red', 'blue'].forEach(a => {
      const teams = match[a];
      const ens = teams.map(t => Ev.entryFor(ev, t, a, match.n, playoff));
      const hasPlayer = teams.includes(S.team.num);
      ens.forEach(e => {
        if (e.isPlayer) return;
        if (hasPlayer && ev.suggest[e.team]) {
          const acc = 0.4 + 0.1 * G.Career.mentorStars(S, 'strat') + S.rep / 500;
          if (rng.chance(acc)) e.plan.role = ev.suggest[e.team];
          e.followed = e.plan.role === ev.suggest[e.team];
          e.suggested = true;
        }
        if (playoff || rng.chance(0.5)) e.plan.rpHunt = !playoff;
      });
      // 2024 note feeding: an alliance needs a robot that can lob notes (ranged shooter + ground intake) and another scorer.
      // AI alliances pick it up over the season; your alliance's grasp comes from your team's strategy read.
      let iq = 0, feeding = false;
      if (ev.year === 2024) {
        const ai = Ev.feedChance(ev, playoff), mine = hasPlayer ? G.Career.metaInsight(S) : 0;
        const cands = ens.filter(e => !e.isPlayer && !e.suggested && e.plan.role === 'score' && e.cap.speaker && (e.cap.range || 0) >= 30 && e.cap.ground);
        const scorers = ens.filter(e => e.cap.speaker || e.cap.amp || e.cap.ampViaShooter).length;

    if (ev.po.done) return ev.po.finish[pa];
    return losses >= 2 ? 'Eliminated' : losses === 1 ? 'Lower bracket' : 'Upper bracket';
  };
  Ev.playerEliminated = function (ev) {
    const pa = Ev.playerAlliance(ev);
    if (pa < 0) return true;
    const f = ev.po.matches.find(x => x.id === 'F');
    if (f.winner != null) return true;
    return ev.po.matches.filter(m => m.loser === pa && !m.bo3).length >= 2;
  };

  // ------------------------------------------------------------------
  // Awards & finish
  // ------------------------------------------------------------------
  Ev.computeAwards = function (ev) {
    const S = G.S, rng = G.makeRng(hash(ev.seed, 4242)), me = S.team.num;
    const ps = G.Career.awardScores(S, ev);
    const winners = new Set(), list = [];
    D.AWARDS.forEach(aw => {
      let best = null, bv = -1;
      ev.teams.forEach(t => {
        if (winners.has(t)) return;
        let v;
        if (t === me) { if (aw.rookie && !ps.rookie) return; v = ps[aw.id] || 0; }
        else {
          const T = S.teams[t], e = ev.caps[t];
          if (!T || !e) return;
          if (aw.rookie && T.rookie !== ev.year) return;
          const q = T.str;
          switch (aw.id) {
            case 'impact': v = T.impact; break;
            case 'ei': v = (T.impact + q) / 2; break;
            case 'ras': v = T.impact * 0.6 + q * 0.4; break;
            case 'auto': v = (e.cap.autoTier || 0) * 18 + e.cap.auto * 0.4; break;
            case 'ic': v = e.cap.vision * 0.5 + (e.cap.visionLvl || 0) * 15 + e.cap.auto * 0.3; break;
            case 'quality': v = e.cap.rel * 0.8; break;
            case 'gp': case 'spirit': case 'judges': v = 40 + rng.norm(0, 15); break;
            default: v = q * 0.9;
          }
        }
        v += rng.norm(0, aw.id === 'impact' || aw.id === 'ei' || aw.id === 'ras' ? 6 : 9); // judged awards are steadier than the rest
        if (v > bv) { bv = v; best = t; }
      });
      if (best != null) { winners.add(best); list.push({ id: aw.id, name: aw.name, team: best }); }
    });
    return list;
  };
  Ev.poolPoints = function (ev) {
    const me = G.S.team.num, n = ev.teams.length, rank = Ev.rankOf(ev, me);
    let pts = Math.round(22 - 20 * (rank - 1) / Math.max(1, n - 1));
    const pa = Ev.playerAlliance(ev);
    if (pa >= 0) {
      const pos = ev.alliances[pa].indexOf(me);
      pts += pos <= 1 ? 16 - pa : 8 - pa;
      const f = ev.po.finish[pa];
      pts += { Winner: 30, Finalist: 20, '3rd place': 13, '4th place': 7 }[f] || 0;
    }
    ev.awards.filter(a => a.team === me).forEach(a => { const d = D.AWARDS.find(x => x.id === a.id); pts += d ? d.pool : 5; });
    return pts;
  };
  Ev.finishEvent = function (ev) {
    const S = G.S, me = S.team.num;
    if (KIND[ev.kind].awards) ev.awards = Ev.computeAwards(ev);
    const rk = ev.rank[me];
    const pa = Ev.playerAlliance(ev);
    const finish = pa >= 0 && ev.po && ev.po.finish ? ev.po.finish[pa] : (ev.kind === 'scrimmage' ? 'Scrimmage' : 'Did not qualify for playoffs');
    let winners = [];
    if (ev.po && ev.po.done) { const F = ev.po.matches.find(x => x.id === 'F'); winners = ev.alliances[F.winner].slice(); }
    ev.result = {
      id: ev.id, name: ev.name, kind: ev.kind, week: ev.week, year: ev.year, size: ev.teams.length,
      rank: ev.kind === 'einstein' ? 0 : Ev.rankOf(ev, me), record: rk ? rk.w + '-' + rk.l + '-' + rk.t : '-', avgRP: rk && rk.played ? rk.rp / rk.played : 0,
      rpTotal: rk ? rk.rp : 0, played: rk ? rk.played : 0,
      alliance: pa >= 0 ? pa + 1 : 0, role: pa >= 0 ? ['Captain', '1st pick', '2nd pick'][ev.alliances[pa].indexOf(me)] : '',
      playoffs: pa >= 0, finish, won: finish === 'Winner', finalist: finish === 'Finalist',
      awards: ev.awards.filter(a => a.team === me).map(a => a.id), awardNames: ev.awards.filter(a => a.team === me).map(a => a.name),
      winners, pool: ev.kind === 'regional' ? Ev.poolPoints(ev) : 0, opr: Ev.opr(ev)[me] || 0
    };
    ev.stage = 'done';
    G.Career.onEventDone(S, ev);
  };
})();
