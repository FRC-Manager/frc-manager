<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Manager</title>
<style>
:root {
  --bg: #0f1216; --bg2: #151a20; --panel: #1b2128; --panel2: #222a33; --line: #2c353f; --line2: #38434f;
  --text: #e6ebf0; --muted: #94a1ae; --dim: #6c7884;
  --accent: #f5b800; --accent2: #ffd24d; --good: #3ecf8e; --bad: #ff5c5c; --warn: #ffb020; --info: #4aa3ff;
  --red: #e5484d; --blue: #3e8cff;
  --radius: 10px; --shadow: 0 6px 24px rgba(0,0,0,0.35);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; }
body { overflow: hidden; }
button { font: inherit; }
a { color: var(--accent2); }
#app { height: 100%; display: flex; flex-direction: column; }
.hidden { display: none !important; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); }
.red { color: var(--red); } .blue { color: var(--blue); }
.b { font-weight: 700; } .sm { font-size: 12px; } .xs { font-size: 11px; } .lg { font-size: 17px; } .xl { font-size: 22px; }
.mono { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 8px; }
.sp { flex: 1; } .gap4 { gap: 4px; } .gap16 { gap: 16px; } .mt { margin-top: 10px; } .mb { margin-bottom: 10px; } .mt0 { margin-top: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; }
@media (max-width: 1100px) { .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span3 { grid-column: span 2; } }
@media (max-width: 760px) { .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; } .span2, .span3 { grid-column: auto; } }

/* ---------- buttons ---------- */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: #2a3440; border-color: #4a5664; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink, #1a1400); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { background: var(--accent2); }
.btn.good { background: #1d4d3a; border-color: #2b7a59; } .btn.bad { background: #4d1f22; border-color: #7a2f34; }
.btn.ghost { background: transparent; } .btn.sm { padding: 4px 9px; font-size: 12px; } .btn.lg { padding: 11px 20px; font-size: 16px; }
.btn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel)); }
.btn.redb { background: #3d1c1f; border-color: var(--red); } .btn.blueb { background: #172a45; border-color: var(--blue); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--line); min-height: 54px; }
.teamchip { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.teamchip .sw { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; color: #000; font-weight: 800; }
.kpi { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.kpi .v { font-weight: 700; font-variant-numeric: tabular-nums; } .kpi .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.datelbl { font-weight: 600; color: var(--accent2); }

/* ---------- layout ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: 190px; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; user-select: none; }
.nav:hover { background: var(--panel); color: var(--text); }
.nav.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.nav .ic { width: 18px; text-align: center; }
.nav .badge { margin-left: auto; background: var(--accent); color: var(--accent-ink, #000); border-radius: 10px; font-size: 10px; padding: 1px 6px; font-weight: 800; }
.main { flex: 1; overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
.main h1 { margin: 0 0 4px; font-size: 22px; } .main h2 { margin: 0 0 10px; font-size: 16px; } .main h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub { color: var(--muted); margin-bottom: 16px; }
@media (max-width: 760px) { .side { width: 58px; } .nav span.t { display: none; } .main { padding: 12px; } .topbar { flex-wrap: wrap; } }

/* ---------- cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card.flat { background: var(--bg2); }
.card.hl { border-color: var(--accent); }
.card .ct { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; }
.card .ct .sp { flex: 1; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--good); border-color: #2b7a59; } .tag.bad { color: var(--bad); border-color: #7a2f34; } .tag.warn { color: var(--warn); border-color: #7a5a1a; } .tag.acc { color: var(--accent2); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); } .tag.info { color: var(--info); border-color: #1d4f80; }
.hr { height: 1px; background: var(--line); margin: 10px 0; }

/* ---------- bars ---------- */
.bar { position: relative; height: 8px; background: #0c0f13; border-radius: 6px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
.bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.6); }
.statrow { display: grid; grid-template-columns: 110px 1fr 38px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.statrow .n { color: var(--muted); } .statrow .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- tables ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 6px 8px; border-bottom: 1px solid #222a32; vertical-align: middle; }
table.t tr.me td { background: rgba(245,184,0,0.08); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--panel2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- inbox ---------- */
.msg { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; cursor: pointer; }
.msg.unread { border-left: 3px solid var(--accent); }
.msg .mt { font-weight: 700; } .msg .md { font-size: 11px; color: var(--dim); }
.msg .mb { white-space: pre-wrap; color: var(--muted); margin-top: 6px; font-size: 13px; line-height: 1.45; }

/* ---------- modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(5,7,10,0.72); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px; }
.modal.wide { width: min(980px, 100%); }
.modal h2 { margin: 0 0 8px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px; animation: tin .2s ease-out; }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- menu ---------- */
.menu-wrap { flex: 1; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; background: radial-gradient(1200px 600px at 70% -10%, #2a2410 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #10233a 0%, transparent 60%), var(--bg); }
.menu-box { width: min(1060px, 100%); }
.logo { font-size: 42px; font-weight: 900; letter-spacing: -.02em; }
.logo span { color: var(--accent); }
.choice { padding: 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); cursor: pointer; }
.choice:hover { border-color: #56636f; } .choice.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.inp { background: #0f1317; border: 1px solid var(--line2); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; width: 100%; }
select.inp { cursor: pointer; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }

/* ---------- match view ---------- */
.matchview { display: grid; grid-template-columns: 230px 1fr 250px; gap: 12px; }
@media (max-width: 1150px) { .matchview { grid-template-columns: 1fr; } }
.fieldwrap { position: relative; background: #0b0d10; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
.fieldwrap canvas { display: block; width: 100%; height: auto; }
.scorebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
.score { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 2px 14px; border-radius: 8px; }
.score.r { background: rgba(229,72,77,0.15); color: #ff8a8d; text-align: right; } .score.b { background: rgba(62,140,255,0.15); color: #8ab8ff; }
.clock { text-align: center; } .clock .t { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; } .clock .p { font-size: 11px; color: var(--accent2); letter-spacing: .08em; font-weight: 700; }
.log { height: 300px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column-reverse; gap: 2px; }
.log div { padding: 3px 6px; border-radius: 4px; background: #14191e; }
.log .fault { color: var(--warn); } .log .foul { color: #ff9b9b; } .log .phase { color: var(--accent2); font-weight: 700; } .log .call { color: var(--info); } .log .rp { color: var(--good); } .log .end { color: #c9a7ff; }
.calls { display: flex; flex-wrap: wrap; gap: 6px; }
.rbox { padding: 8px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); margin-bottom: 6px; font-size: 12px; }
.rbox.me { border-color: var(--accent); }
.rbox .hd { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; }
.rp-item { margin-bottom: 8px; font-size: 12px; }
.bracket { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 12px; overflow-x: auto; }
.bm { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; margin-bottom: 8px; }
.bm.me { border-color: var(--accent); } .bm .al { display: flex; justify-content: space-between; } .bm .w { font-weight: 800; color: var(--text); } .bm .l { color: var(--dim); }
.pill-red { background: rgba(229,72,77,0.18); color: #ff9a9c; padding: 1px 6px; border-radius: 4px; }
.pill-blue { background: rgba(62,140,255,0.18); color: #9cc3ff; padding: 1px 6px; border-radius: 4px; }
canvas.side { width: 100%; height: auto; display: block; background: #12161b; border-radius: 8px; border: 1px solid var(--line); }
.hint { background: #14202c; border: 1px solid #1d3b57; color: #a8cff5; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.warnbox { background: #2a1f0e; border: 1px solid #6b4f16; color: #ffd38a; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .kv .k { color: var(--muted); }
.big-cta { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; background: linear-gradient(90deg, #2c2508, #1b2128); border: 1px solid #6b5a12; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 6px; }
.chart .c { flex: 1; display: flex; flex-direction: column-reverse; align-items: stretch; gap: 2px; min-width: 6px; }
.chart .c i { display: block; border-radius: 3px 3px 0 0; }

/* ---------- blue banners (event wins & Impact) ---------- */
.banners { display: flex; flex-wrap: wrap; gap: 14px; }
.banner { --fb: #0066b3; position: relative; width: 128px; min-height: 182px; padding: 14px 10px 34px; color: #fff; text-align: center;
  background: linear-gradient(180deg, #0a74c7 0%, var(--fb) 60%, #00539a 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45)); }
.banner .emb { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1; }
.banner .aw { font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; line-height: 1.15; }
.banner .yr { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.banner .ev { font-size: 11px; line-height: 1.25; opacity: .92; }
.banner.gold { border-top: 0; background: linear-gradient(180deg, #0a74c7 0%, #0066b3 60%, #00539a 100%); }
.banner.gold .emb { border-color: #f5c542; color: #f5c542; }
.banner.gold .aw { color: #ffe08a; }
.banner.new { animation: bannerDrop .7s cubic-bezier(.2,.9,.3,1.2); }
@keyframes bannerDrop { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .banner.new { animation: none; } }

/* ---------- team hours ---------- */
.hbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #0c0f13; border: 1px solid var(--line); }
.hbar > span { display: block; height: 100%; min-width: 2px; }
.hbar > span.idle { background: repeating-linear-gradient(45deg, #222a33, #222a33 6px, #1a2027 6px, #1a2027 12px); }
.hbar > span.act { background: #6c7884; }
.hlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.hlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hnum { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hnums { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 10px; }
.hnums .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.batt { display: inline-block; width: 16px; height: 26px; border: 2px solid #8a96a3; border-radius: 3px; position: relative; margin: 0 2px; vertical-align: middle; }
.batt::before { content: ""; position: absolute; top: -5px; left: 4px; width: 4px; height: 3px; background: #8a96a3; border-radius: 1px 1px 0 0; }
.batt i { position: absolute; left: 1px; right: 1px; bottom: 1px; border-radius: 1px; }
/* Impact odds + rating */
.statrow.wide { grid-template-columns: 175px 1fr 38px; }
.imp { display: grid; grid-template-columns: 46px 1fr 34px; gap: 8px; align-items: center; margin: 3px 0 10px; }
.imp > b { text-align: right; font-variant-numeric: tabular-nums; }
.imp:not(:has(.bar)) { display: block; }
.nowrap { white-space: nowrap; }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .g12 { grid-template-columns: 1fr; } }
table.t.tight th, table.t.tight td { padding: 5px 5px; }
.acc { color: var(--accent2); }
/* version notes */
.vnotes { margin: 8px 0 2px; padding-left: 20px; line-height: 1.55; color: var(--muted); font-size: 14px; }
.vnotes li { margin: 4px 0; }
/* program calendar */
.calgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.calmonth { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.calmh { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.calslot { border-left: 3px solid var(--line2); padding: 3px 0 6px 8px; margin-bottom: 4px; }
.calslot.cur { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 0 6px 6px 0; }
.calslot.past { opacity: .5; }
.calsl { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 2px; }
.calit { font-size: 12px; line-height: 1.35; margin: 2px 0; display: flex; gap: 6px; align-items: baseline; }
.calit.dim { color: var(--dim); } .calit.acc { color: var(--accent2); font-weight: 600; } .calit.good { color: var(--good); } .calit.warn { color: var(--warn); }
.cdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; margin-right: 4px; transform: translateY(-1px); }
/* ---------- v2.0: icons, headers, tabs, parts ---------- */
.ico { display: inline-block; vertical-align: -3px; flex: none; }
.avatar { flex: none; border-radius: 8px; display: block; }
.teamchip { display: flex; align-items: center; gap: 8px; }
.head { gap: 10px; align-items: center; margin-bottom: 2px; }
.head h1 { margin: 0; }
.hico { color: var(--accent); display: inline-flex; }
.helpq { color: var(--muted); padding: 4px 6px; }
.helpq:hover { color: var(--accent2); }
.it { display: inline-flex; align-items: center; gap: 6px; }
.it .ico { color: var(--accent2); }
.nav .ic { display: inline-flex; width: 20px; justify-content: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 600; }
.tab:hover { color: var(--text); background: var(--panel); }
.tab.on { color: var(--text); background: var(--panel2); border-color: var(--line2); box-shadow: inset 0 -2px 0 var(--accent); }
.tab .badge { background: var(--accent); color: var(--accent-ink, #000); border-radius: 10px; font-size: 10px; padding: 0 6px; }
.pcard { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--vc, var(--line2)); border-radius: 10px; padding: 10px 12px; }
.pcard.old { opacity: .75; }
.pcard .statrow { margin: 6px 0; }
.vendor { border-left: 3px solid var(--vc); }
.vendor .ico { color: var(--vc); }
.vtag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 6px; border-radius: 6px; color: var(--vc); border: 1px solid var(--vc); text-transform: uppercase; }
.mini { display: inline-block; width: 70px; vertical-align: middle; }
.mini .bar { margin: 0; }
.fico { display: inline-flex; width: 30px; height: 30px; border-radius: 8px; align-items: center; justify-content: center; background: var(--panel); color: var(--accent2); margin-right: 2px; }
.row.act { padding: 4px 0; }
.row.act.locked { opacity: .55; }
.aico { display: inline-flex; width: 28px; height: 28px; border-radius: 7px; align-items: center; justify-content: center; background: var(--panel2); color: var(--accent2); flex: none; }
.kpi .v.warnc { color: var(--warn); }
.inp.num { text-align: right; }
.inc-list .inc { border-left: 3px solid var(--warn); background: var(--panel2); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-bottom: 8px; }
.cred { display: inline-flex; align-items: center; gap: 6px; }
/* team setup: avatars and colour swatches */
.avpick { display: flex; flex-wrap: wrap; gap: 8px; }
.avpick button { background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 2px; cursor: pointer; }
.avpick button.on { border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line2); cursor: pointer; padding: 0; }
.swatch.on { outline: 2px solid var(--text); outline-offset: 2px; }
/* tutorials */
.tut-bg { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.tut-card { position: fixed; z-index: 62; width: min(380px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; pointer-events: auto; }
.tut-card .tico { color: var(--accent); }
.tut-card h3 { margin: 4px 0 6px; font-size: 16px; }
.tut-card ul { margin: 6px 0 0; padding-left: 18px; }
.tut-card li { margin: 3px 0; }

<script>/* js/core.js */
'use strict';
/* FRC Manager — core utilities, RNG, save system */
window.G = window.G || {};

(function () {
  // ---------- Seeded RNG (mulberry32 with exposed state) ----------
  function Rng(seed) { this.s = (seed >>> 0) || 1; }
  Rng.prototype.next = function () {
    let a = (this.s = (this.s + 0x6D2B79F5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.r = function () { return this.next(); };
  Rng.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
  Rng.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.norm = function (mu, sd) {
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  Rng.prototype.wpick = function (items, wfn) {
    let tot = 0; const ws = items.map(it => { const w = Math.max(0, wfn(it)); tot += w; return w; });
    if (tot <= 0) return items[Math.floor(this.next() * items.length)];
    let x = this.next() * tot;
    for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
    return items[items.length - 1];
  };
  G.Rng = Rng;
  G.makeRng = seed => new Rng(seed);
  G.R = new Rng(Date.now() & 0xffffffff); // global game RNG; re-seeded from save

  // ---------- Utilities ----------
  const U = G.U = {};
  U.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.sum = arr => arr.reduce((s, x) => s + x, 0);
  U.avg = arr => arr.length ? U.sum(arr) / arr.length : 0;
  U.round = (v, d = 0) => { const k = Math.pow(10, d); return Math.round(v * k) / k; };
  U.money = v => (v < 0 ? '-$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US');
  U.kmoney = v => { const a = Math.abs(v); const s = v < 0 ? '-$' : '$'; return a >= 1000 ? s + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k' : s + Math.round(a); };
  U.pct = v => Math.round(v * 100) + '%';
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.clone = o => JSON.parse(JSON.stringify(o));
  let _uid = 0;
  U.uid = (p = 'id') => p + '_' + Date.now().toString(36) + '_' + (++_uid).toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  U.byId = (arr, id) => arr.find(x => x.id === id);
  U.stars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
  U.ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  U.fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // ---------- Version (shown in game; see G.RELEASES in ui/screens-menu.js) ----------
  G.VERSION = '2.3';

  // ---------- Save system ----------
  const KEY = 'frcm_save_';
  const Save = G.Save = {};
  Save.slots = ['auto', '1', '2', '3'];
  Save.write = function (slot) {
    if (!G.S) return false;
    try {
      G.S.rngS = G.R.s;
      G.S.savedAt = Date.now();
      localStorage.setItem(KEY + slot, JSON.stringify(G.S));
      return true;
    } catch (e) { console.warn('Save failed', e); return false; }
  };
  Save.meta = function (slot) {
    try {
      const raw = localStorage.getItem(KEY + slot);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { slot, team: s.team, year: s.year, mode: s.mode, phase: s.phase, savedAt: s.savedAt, money: s.money, si: s.si };
    } catch (e) { return null; }
  };
  Save.load = function (slot) {
    try {
      const raw = localStorage.getItem(KEY + slot);
      if (!raw) return false;
      G.S = JSON.parse(raw);
      G.R = new Rng(G.S.rngS || 12345);
      if (G.Shop) G.Shop.migrate(G.S); // older saves: equipment flags → facility levels
      return true;
    } catch (e) { console.warn('Load failed', e); return false; }
  };
  Save.remove = function (slot) { try { localStorage.removeItem(KEY + slot); } catch (e) { } };
  Save.exportText = function () {
    if (!G.S) return '';
    G.S.rngS = G.R.s;
    return JSON.stringify(G.S);
  };
  Save.importText = function (text, cb) {
    try {
      const s = JSON.parse(String(text).trim());
      if (!s || !s.team || !s.v) throw new Error('this is not a FRC Manager save');
      G.S = s; G.R = new Rng(s.rngS || 777);
      if (G.Shop) G.Shop.migrate(G.S);
      cb(true);
    } catch (e) { cb(false, e.message); }
  };
  Save.importFile = function (file, cb) {
    const fr = new FileReader();
    fr.onload = () => Save.importText(fr.result, cb);
    fr.onerror = () => cb(false, 'the file could not be read');
    fr.readAsText(file);
  };
  Save.settings = function () {
    try { return JSON.parse(localStorage.getItem('frcm_settings') || '{}'); } catch (e) { return {}; }
  };
  Save.saveSettings = function (o) { try { localStorage.setItem('frcm_settings', JSON.stringify(o)); } catch (e) { } };
})();

</script>

<script>/* js/data/parts.js */
'use strict';
/* FRC Manager — parts library: two electronics vendors, mechanical COTS, the kit of parts and game elements.
   Counts follow typical FRC robots: a swerve drive uses 4 modules, 8 brushless motors and 4 absolute encoders;
   most mechanisms use 1–3 motors; every robot needs one control/power hub. */
(function () {
  const D = G.Data = G.Data || {};

  D.VENDORS = {
    A: { id: 'A', name: 'Apex Motion', short: 'Apex', tag: 'Premium', color: '#ff9f43', desc: 'Top-performance electronics at premium prices.' },
    B: { id: 'B', name: 'Lumen Robotics', short: 'Lumen', tag: 'Value', color: '#35c9d6', desc: 'Dependable, economical electronics.' },
    K: { id: 'K', name: 'Kit of Parts', short: 'KOP', tag: 'Basic', color: '#8d97a1', desc: 'Basic, low-performance parts: some free at every Kickoff, more for very little, always in stock.' },
    C: { id: 'C', name: 'COTS suppliers', short: 'COTS', tag: 'Mechanical', color: '#b39dff', desc: 'Mechanical components from many suppliers. Always compatible.' }
  };

  // Part categories. elec: sold by vendor A or B and part of the robot's control system (mixing vendors costs a bit).
  // max: inventory slots (enough for two full robots, with a few to spare).
  D.PART_CATS = [
    { id: 'motor', name: 'Brushless motor + controller', short: 'Motors', icon: 'motor', elec: true, max: 44, desc: 'Drivetrains use 4–8, most mechanisms 1–3.' },
    { id: 'enc', name: 'Absolute encoder', short: 'Encoders', icon: 'sensor', elec: true, max: 18, desc: 'One per swerve module, plus arms, elevators, hoods and turrets.' },
    { id: 'ctrl', name: 'Control & power hub', short: 'Control hubs', icon: 'chip', elec: true, max: 3, desc: 'Power distribution, CAN network and IMU. One per robot.' },
    { id: 'swerve', name: 'Swerve module', short: 'Swerve modules', icon: 'swerve', elec: true, max: 10, desc: 'Four per swerve drivetrain (motors not included).' },
    { id: 'gearbox', name: 'Drive gearbox', short: 'Gearboxes', icon: 'gear', max: 10, desc: 'Tank and West Coast drives use 2, mecanum 4.' },
    { id: 'camera', name: 'Vision camera + coprocessor', short: 'Cameras', icon: 'camera', max: 4, desc: 'Vision Level 1 needs one, Level 2 needs two.' },
    { id: 'pneu', name: 'Pneumatics kit', short: 'Pneumatics', icon: 'air', max: 2, desc: 'Intake and manipulator builds take 15% fewer hours.' },
    { id: 'kElev', kit: 'elevator', name: 'Elevator stage kit', short: 'Elevator kits', icon: 'elevator', max: 6, desc: 'Bearing blocks, tubes and rigging for one elevator stage. Tall elevators use 2.' },
    { id: 'kArm', kit: 'arm', name: 'Arm & pivot kit', short: 'Arm kits', icon: 'arm', max: 6, desc: 'Pivot gearbox, bearings and arm tube for one joint.' },
    { id: 'kShoot', kit: 'shooter', name: 'Flywheel shooter kit', short: 'Shooter kits', icon: 'shooter', max: 6, desc: 'Flywheels, shafts and side plates. Wide dumpers use 2.' },
    { id: 'kTurret', kit: 'turret', name: 'Turret bearing kit', short: 'Turret kits', icon: 'turret', max: 4, desc: 'Large turret bearing, ring gear and mounts.' },
    { id: 'kIntake', kit: 'intake', name: 'Intake roller kit', short: 'Intake kits', icon: 'intake', max: 6, desc: 'Rollers, belts and a deploy pivot. Dual and full-width intakes use 2.' },
    { id: 'kIndex', kit: 'index', name: 'Indexer & hopper kit', short: 'Indexer kits', icon: 'parts', max: 4, desc: 'Belts, rollers and walls for storing game pieces.' },
    { id: 'kClimb', kit: 'climb', name: 'Climber kit', short: 'Climber kits', icon: 'climb', max: 10, desc: 'One telescoping stage with a winch and hooks. Higher climbs use 2 to 4.' }
  ];
  D.PART_CAT = {}; D.PART_CATS.forEach(c => D.PART_CAT[c.id] = c);
  D.KIT_FOR_AREA = { elevator: 'kElev', arm: 'kArm', shooter: 'kShoot', turret: 'kTurret', intake: 'kIntake', index: 'kIndex', climb: 'kClimb' };
  D.KIT_HOURS = 0.72;   // a full set of mechanical COTS kits cuts a build's hours by 28% and removes first-build penalties
  D.KIT_COST = 0.75;    // ... and a quarter of the materials (a partial set gives part of both)
  D.COPY_HOURS = 0.25;  // building another copy of a finished design: a quarter of the first build's hours (no design work)
  D.COPY_COST = 0.6;    // ... and 60% of its materials (electronics and kits on top)
  D.STORE_MAX = 2;      // built subsystems of each kind you can keep in storage (besides the ones on the two robots)
  D.PROTO_COST = 1.1;   // the first one of a new concept or version is a prototype: 10% more in materials
  D.MIX_HOURS = 1.1;    // mixing Apex and Lumen electronics: integration costs 10% more hardware and software hours

  // Products: perf 0 (kit brushed motor) … 1 (best); gen 1 is on sale at the start of every career.
  const ELEC_NAMES = { motor: { A: 'Apex Torque', B: 'Lumen Ion' }, enc: { A: 'Apex TrueAngle', B: 'Lumen SpinSense' }, ctrl: { A: 'Apex Core Hub', B: 'Lumen PowerGrid' }, swerve: { A: 'Apex Vector module', B: 'Lumen Pivot module' } };
  const ELEC_PRICE = { motor: { A: 230, B: 150 }, enc: { A: 65, B: 40 }, ctrl: { A: 700, B: 440 }, swerve: { A: 460, B: 330 } };
  const ELEC_PERF = { A: 0.72, B: 0.5 };
  D.ROMAN = ['', '', ' II', ' III', ' IV'];
  D.makeProduct = function (cat, v, gen) {
    if (v === 'K') return { id: cat + 'K', cat, v, gen: 0, name: { motor: 'Kit brushed motor + controller', enc: 'Kit low-profile encoder', ctrl: 'Kit control hub', gearbox: 'Kitbot gearbox' }[cat] || 'Kit part', price: D.KOP_PRICE[cat] || 0, perf: D.KOP_PERF[cat] || 0.05, kop: true };
    if (v === 'C') {
      const c = D.PART_CAT[cat];
      return { id: cat + 'C', cat, v, gen: 1, name: c.name, price: D.COTS_PRICE[cat], perf: 0.6 };
    }
    const p = ELEC_PRICE[cat][v] * (1 + 0.12 * (gen - 1));
    return { id: cat + v + gen, cat, v, gen, name: ELEC_NAMES[cat][v] + D.ROMAN[gen], price: Math.round(p / 5) * 5, perf: Math.min(1, ELEC_PERF[v] + 0.15 * (gen - 1)) };
  };
  D.COTS_PRICE = { gearbox: 120, camera: 260, pneu: 500, kElev: 480, kArm: 320, kShoot: 420, kTurret: 650, kIntake: 260, kIndex: 220, kClimb: 210 };
  D.ELEC_CATS = ['motor', 'enc', 'ctrl', 'swerve'];
  D.COTS_CATS = ['gearbox', 'camera', 'pneu', 'kElev', 'kArm', 'kShoot', 'kTurret', 'kIntake', 'kIndex', 'kClimb'];

  // Kit of Parts electronics can also be bought any time, even in season: very cheap and always in stock, but slow
  // (brushed motors, low-profile encoders). Mixing them with Apex or Lumen electronics costs a little integration time.
  D.KOP_PRICE = { motor: 45, enc: 18, ctrl: 220, gearbox: 60 };
  D.KOP_PERF = { motor: 0.08, enc: 0.15, ctrl: 0.2, gearbox: 0.3 };
  D.KOP_CATS = ['motor', 'enc', 'ctrl', 'gearbox'];
  D.KOP_MIX_HOURS = 1.05; // KOP electronics next to vendor electronics: 5% more hardware and software hours
  // Kit of parts: limited and basic, free at every Kickoff (rookies get a bigger kit in their first season)
  D.KOP = { motor: 4, enc: 2, gearbox: 2 }; // veterans: no control hub (like FRC, only rookies get the control system)
  D.KOP_ROOKIE = { motor: 8, enc: 4, gearbox: 4, ctrl: 1 };

  // How likely an item is in stock in a given week during the season (the offseason is almost always fine)
  D.STOCK = { elec: 0.42, cots: 0.62, elem: 0.35, off: 0.97, newRelease: -0.12, diff: { easy: 0.15, normal: 0, hard: -0.1 } };
  D.PART_PRICE_DIFF = { easy: 0.9, normal: 1, hard: 1.05 };

  // Wear: parts lose health in matches and practice. Health only nudges performance, but worn parts fail more often.
  D.PART_WEAR_MATCH = [0.004, 0.009];   // per match, each part on the competition robot
  D.PART_WEAR_PRACTICE = 0.0007;        // per driver-practice hour, each part on the robot that practices
  D.PART_MIN_HEALTH = 0.25;
  // Selling: parts above SELL_MIN health sell for RESALE × list price × health (kit parts can't be sold)
  D.SELL_MIN = 0.6;
  D.RESALE = 0.55;

  // Starting inventories by team level: [category, vendor, count, health]
  D.START_PARTS = {
    rookie: [],
    // established: last few seasons' parts at different wear levels (enough for a test chassis once the competition robot
    // takes the best ones), plus leftovers from earlier kits
    established: [['motor', 'B', 10, 0.75], ['motor', 'B', 4, 0.55], ['motor', 'B', 2, 0.4], ['enc', 'B', 3, 0.75], ['enc', 'B', 2, 0.5],
      ['ctrl', 'B', 1, 0.8], ['gearbox', 'C', 2, 0.8], ['gearbox', 'C', 2, 0.55], ['camera', 'C', 1, 0.85],
      ['ctrl', 'K', 1, 0.7], ['motor', 'K', 4, 0.6], ['gearbox', 'K', 2, 0.7]],
    powerhouse: [['motor', 'A', 20, 0.8], ['enc', 'A', 6, 0.8], ['ctrl', 'A', 2, 0.85], ['swerve', 'A', 4, 0.8], ['gearbox', 'C', 2, 0.8], ['camera', 'C', 2, 0.85], ['kShoot', 'C', 1, 0.85], ['kIntake', 'C', 1, 0.85],
      ['ctrl', 'K', 1, 0.7], ['motor', 'K', 4, 0.6]]
  };

  // ---------- Game elements: practice-field sets for one season's game ----------
  // KOP game pieces come free each season: without a Practice Field they are all a team needs. With one, sets give
  // drivers a real field to practice on, up to its size (Level 1 = a quarter field). Coverage is in fields
  // (0.25 = a quarter field); you can hold up to ELEM_MAX fields' worth.

    for (const r of m.robots) { r.defBy = null; r.defSlow = 1; }
    const DF = m.R.defense || { eff: 1, foul: 1 }; // how much defense matters in this game
    const prot = r => (m.R.protect ? m.R.protect(m, r) : '');
    for (const d of m.robots) {
      if (d.st !== 'defend' || !d.defT || d.dead || (d.fault && d.fault.stall)) { d.pinT = 0; continue; }
      const t = d.defT, dd = dist(d, t);
      if (d.backoff > m.t) { if (dd > 1.83) d.sepT += DT; continue; }
      // zone effect: other opponents passing close to the defender get caught in traffic (turrets shrug most of it off)
      if (DF.zone) {
        for (const o of m.robots) {
          if (o === t || o.a === d.a || o.dead || o.climbing || dist(d, o) >= (DF.range || 1.4) * 1.3 || prot(o)) continue;
          const zs = U.clamp(1 - DF.zone * (o.cap.turret ? 0.5 : 1) * (0.5 + (d.cap.push - 0.6 * o.cap.agility) / 200), 0.6, 0.97);

        // contact with a robot in its protected zone is a foul, whoever starts it
        if (dd < 2 * RR + 0.03 && m.rng.next() < 0.15 * DT) foul(m, d, !!DF.protMajor, pz);
        continue;
      }
      if (dd < (DF.range || 1.4) && !t.climbing) {
        t.defBy = d;
        const inner = 0.5 + (d.cap.push * (0.8 + 0.2 * d.drvF) - 0.6 * t.cap.agility - 0.3 * t.cap.push) / 100;
        t.defSlow = U.clamp(1 - 0.4 * inner * DF.eff * (t.cap.turret ? 0.5 : 1), 0.35, 0.97);
        pinCheck(m, d, t, dd, DF);
        t.defTime += DT; d.contacts += DT;
        const pf = 0.012 * DF.foul * PACE[d.plan.pace].foul * (1 - d.drv.comp / 220) * (d.plan.avoid ? 0.4 : 1) * (1 - 0.6 * d.confK);
        if (m.rng.next() < pf * DT) foul(m, d, m.rng.chance(0.2));
        if (m.rng.next() < 0.002 * DT) foul(m, t, false);
        const tall = t.cap.tall || 0;
        if (tall > 0 && m.rng.next() < 0.0015 * tall * ((m.R.faults && m.R.faults.tip) || 1) * PACE[t.plan.pace].wear * (1 - t.drv.comp / 300) * DT) triggerFault(m, t, 'tip');
      }
    }
  }
  function foul(m, r, major, why) {
    const pts = major ? m.S.foul.major : m.S.foul.minor;
    m.score[opp(r.a)].foul += pts; r.stats.fouls++;
    log(m, r.a, (major ? 'MAJOR FOUL' : 'Foul') + ' on ' + r.team + (why ? ' (' + why + ')' : '') + ' (+' + pts + ' ' + opp(r.a) + ')', 'foul');
  }

  // ---------- faults ----------
  // Comms losses have their own, more frequent hazard (below); the season profile (R.faults) scales brownouts, tips and comms.
  const FAULTS = [{ id: 'brown', w: 30 }, { id: 'intakeJam', w: 18 }, { id: 'scorerJam', w: 18 }, { id: 'mech', w: 9 }];
  // 0 = clean, well-built electronics … about 1.5 = poor wiring, worn robot, hidden defects, tired battery
  const elecPoor = r => U.clamp((100 - r.cap.rel) / 60, 0, 1.3) + (100 - r.cond) / 200 + r.hidden * 0.3 + (r.batt < 0.8 ? 0.3 : 0);
  // in contact this tick: being defended, or pinned against the robot it is defending
  const inContact = r => !!r.defBy || (r.st === 'defend' && r.defT && dist(r, r.defT) < 1.5);
  function faultRoll(m, r) {
    const c = r.cap, P = PACE[r.plan.pace], FP = m.R.faults || {};
    const h = 0.0002 * (1 + (100 - c.rel) / 25) * (1 + (100 - r.cond) / 40) * (1 + r.hidden * 0.8) * m.diff * P.wear;
    if (m.rng.next() < h * DT) { triggerFault(m, r, m.rng.wpick(FAULTS, f => f.w * (f.id === 'brown' ? FP.brown || 1 : 1)).id); return; }
    const hb = 0.00012 * P.brown * (r.batt < 0.8 ? 2 : 1) * (c.brown || 1) * (FP.brown || 1);
    if (m.rng.next() < hb * DT) { triggerFault(m, r, 'brown'); return; }
    // brief comms dropouts are common: radio resets, loose connectors, hard hits. Poor electronics and contact make them more frequent and longer.
    if (!r.fault) {
      const hc = 0.0005 * (1 + 2.4 * elecPoor(r)) * (inContact(r) ? 3 : 1) * (FP.comms || 1) * m.diff;
      if (m.rng.next() < hc * DT) { triggerFault(m, r, 'comms'); return; }
    }
    // tall robots tip on their own now and then (high reach, fast turns), more in tip-heavy seasons
    const tall = (c.tall || 0) + (FP.tipAll || 0); // tipAll: risk every robot shares this season (e.g. 2023 Charge Station)
    if (tall > 0 && m.rng.next() < 0.00006 * tall * (FP.tip || 1) * P.wear * (1 - r.drv.comp / 300) * DT) { triggerFault(m, r, 'tip'); return; }
    if (m.rng.next() < 0.0006 * P.foul * (r.plan.avoid ? 0.5 : 1) * (1 - 0.6 * r.confK) * DT) foul(m, r, false);
  }
  function triggerFault(m, r, id) {
    const rng = m.rng; let msg = '';
    switch (id) {
      case 'brown': r.fault = { stall: true, until: m.t + rng.range(2, 5), label: 'BROWNOUT' }; msg = 'Brownout'; break;
      case 'intakeJam': r.jam.intake = m.t + rng.range(5, 20); msg = 'Intake jammed'; break;
      case 'scorerJam': r.jam.scorer = m.t + rng.range(5, 18); msg = 'Scorer jammed'; break;
      case 'mech': {
        const k = rng.pick(['intake', 'scorer', 'endgame']);
        r.perm[k] = true; msg = (k === 'endgame' ? 'Climber' : k === 'intake' ? 'Intake' : 'Scorer') + ' broke';
        break;
      }
      case 'comms': {
        const poor = elecPoor(r), hit = inContact(r);
        if (rng.chance(0.015 + 0.08 * poor * poor + (hit ? 0.05 : 0))) { r.dead = true; r.st = 'dead'; msg = 'Lost comms — disabled'; }
        else { r.fault = { stall: true, until: m.t + rng.range(1.5, 3.5) * (1 + 0.8 * poor) * (hit ? 1.5 : 1), label: 'COMMS LOSS' }; msg = 'Comms dropout'; }
        break;
      }
      case 'tip': r.dead = true; r.tipped = true; r.st = 'dead'; msg = 'TIPPED OVER'; break;
    }
    r.stats.faults.push(msg);
    log(m, r.a, r.team + ': ' + msg, 'fault');
  }

  // ---------- endgame ----------
  function endLevelOf(m, r) {
    if (r.perm.endgame) return 0;
    const cap = m.R.endLevel ? m.R.endLevel(m, r) : (r.cap.endLevel || 0);
    return Math.min(cap, r.plan.endLevel == null ? 9 : r.plan.endLevel);
  }
  function climbTime(m, r, lvl) {
    const L = m.R.endgame.levels[lvl - 1];
    const base = typeof L.time === 'function' ? L.time(m, r) : L.time;
    return base * (1.6 - (r.cap.endgame || 40) / 100);
  }
  function endgameDue(m, r) {
    if (m.phase === 'auto' || r.end || r.endBusy) return false;
    const lvl = endLevelOf(m, r);
    const EG = m.R.endgame;
    if (lvl === 0 && !EG.park) return false;
    const tl = m.total - m.t;
    if (r.plan.endTiming === 'now') return true;
    if (tl > m.T.end + 25) return false;
    const spot = m.R.endSpot(m, r, lvl);
    const travel = dist(r, spot) / speedOf(m, r) + 1;
    const margin = { early: 8, std: 2.5, late: 0.5 }[r.plan.endTiming] || 2.5;
    const need = lvl > 0 ? climbTime(m, r, lvl) + travel + margin : travel + 1.5 + (r.plan.endTiming === 'early' ? 4 : 0);
    return tl <= need;
  }
  function goEndgame(m, r) {
    const lvl = endLevelOf(m, r);
    r.endBusy = true; r.endLvl = lvl;
    const spot = m.R.endSpot(m, r, lvl);
    const nm = m.S.endNames[lvl] || 'Park';
    moveTo(m, r, spot, () => {
      const begin = () => {
        if (lvl === 0) { r.end = { lvl: 0, park: true }; r.st = 'done'; r.label = 'Parked'; return; }
        r.climbing = true;
        act(r, climbTime(m, r, lvl), () => {
          const p = climbChance(m, r, lvl);
          if (m.rng.chance(p)) { r.end = { lvl }; r.label = nm; log(m, r.a, r.team + ' — ' + nm + '!', 'end'); }
          else {
            // a failed high climb can end in a fall from height: the robot is out and badly damaged
            const L = m.R.endgame.levels[lvl - 1];
            if (L.drop && m.rng.chance(L.drop * (1.15 - (r.cap.endgame || 40) / 200))) {
              r.end = { lvl: 0, failed: true, drop: true }; r.dead = true; r.climbing = false;
              r.label = 'FELL FROM ' + nm.toUpperCase(); r.stats.faults.push('Fell from ' + nm);
              log(m, r.a, r.team + ' FELL from ' + nm + '!', 'fault');
              if (!m.headless) m.fx.push({ k: 'pop', x: r.x, y: r.y, text: 'FALL!', t: m.t, a: r.a });
            } else { r.end = { lvl: 0, failed: true, park: true }; r.label = 'Climb failed'; r.stats.faults.push('Climb failed'); log(m, r.a, r.team + ' failed the climb', 'fault'); }
          }
          r.st = 'done';
        }, 'Climbing ' + nm);
      };
      if (!m.inEnd) waitUntil(r, () => m.inEnd, begin, 'Waiting for endgame');
      else begin();

  }
  function climbChance(m, r, lvl) {
    if (m.R.endgame.levels[lvl - 1].sure) return 1;
    return U.clamp(0.62 + 0.36 * (r.cap.endgame || 40) / 100 - 0.05 * (lvl - 1) + 0.06 * (r.drv.comp - 50) / 50 + 0.1 * r.confK
      - (m.playoff ? 0.03 : 0) - (100 - r.cond) / 400 - (r.hidden ? 0.05 : 0) - (m.R.endgame.levels[lvl - 1].risk || 0), 0.2, 0.985);
  }

  // ---------- calls ----------
  E.call = function (m, team, call) {
    if (m.done || m.calls - m.callsUsed <= 0) return false;
    const r = m.robots.find(x => x.team === team);
    if (!r) return false;
    m.callsUsed++;
    const delay = 1 + 2 * (1 - (m.coachSkill || 50) / 100);
    m.pending.push({ at: m.t + delay, team, call });

    return true;
  };
  function applyCall(m, c) {
    const r = m.robots.find(x => x.team === c.team);
    if (!r || r.dead) return;
    if (m.rng.chance(0.1 * (1 - r.drv.comp / 100))) { log(m, r.a, r.team + ' misread the call', 'call'); return; }
    const k = c.call.kind, v = c.call.value;
    switch (k) {
      case 'pace': r.plan.pace = v; break;
      case 'role': r.plan.role = v.role; r.plan.defTarget = v.target || null; r.replan = true; break;
      case 'target': r.plan.target = v; r.replan = true; break;
      case 'endNow': r.plan.endTiming = 'now'; r.replan = true; break;
      case 'endTiming': r.plan.endTiming = v; break;
      case 'endLevel': r.plan.endLevel = v; break;
      case 'rp': r.plan.rpHunt = v; r.replan = true; break;
      case 'avoid': r.plan.avoid = v; break;
      case 'reset':
        if (r.fault && m.rng.chance(0.5)) r.fault.until = m.t;

  }

  // ---------- finish ----------
  function finish(m) {
    m.done = true; m.phase = 'done'; m.t = m.total;
    m.R.finishEnd(m, H);
    ['red', 'blue'].forEach(a => { const s = m.score[a]; s.total = s.auto + s.tele + s.end + s.foul; });
    const res = {};

      const s = m.score[a], so = m.score[opp(a)];
      const bonus = m.R.bonus(m, a);
      const win = s.total > so.total ? 1 : s.total === so.total ? 0.5 : 0;
      let rp = win === 1 ? m.S.rpWin : win === 0.5 ? 1 : 0;
      bonus.forEach(b => { if (b.ok) rp++; });
      res[a] = { score: s.total, auto: s.auto, tele: s.tele, end: s.end, foul: s.foul, rp, bonus, win };
    });
    res.winner = res.red.score > res.blue.score ? 'red' : res.blue.score > res.red.score ? 'blue' : 'tie';
    res.robots = m.robots.map(r => ({
      team: r.team, a: r.a, pts: r.stats.pts, cycles: r.stats.cycles, shots: r.stats.shots, hits: r.stats.hits,
      fouls: r.stats.fouls, faults: r.stats.faults.slice(), defTime: Math.round(r.defTime), contacts: Math.round(r.contacts),
      end: r.end, dead: r.dead, pace: r.plan.pace, role: r.plan.role, autoOK: r.autoOK
    }));

  }

  function log(m, a, msg, kind) {
    if (m.headless && kind !== 'fault') return;
    m.log.push({ t: m.t, a, msg, kind: kind || '' });

  // ---------- helpers exposed to season rules ----------

    P: E.P, dist, opp, moveTo, act, waitUntil, speedOf, log, foul, avoid,
    canCollect: (m, r) => !r.cap.noIntake && !r.perm.intake && !(r.jam.intake > m.t),
    canScore: (m, r) => !r.cap.noScorer && !r.perm.scorer && !(r.jam.scorer > m.t),
    collectTime(m, r, kind, base) {
      const i = r.cap.intake, P = PACE[r.plan.pace];

      return t * P.cyc / (0.9 + 0.1 * r.opF) * (m.R.tempo ? m.R.tempo.c : 1) * (1 - 0.4 * r.confK); // practiced crews handle game pieces faster
    },
    scoreTime(m, r, base, stat) {
      const s = stat == null ? r.cap.scoreSpd : stat;
      return base * (1.5 - 0.8 * s / 100) * PACE[r.plan.pace].cyc / r.opF * (m.R.tempo ? m.R.tempo.s : 1) * (1 - 0.4 * r.confK);
    },
    endDue: (m, r) => m.phase !== 'auto' && !r.end && !r.endBusy && endgameDue(m, r),
    aimTime(m, r) {
      const c = r.cap;
      return (c.turret ? 0.3 : c.dumper ? 1.15 : 0.95) * (c.visionLvl >= 1 ? 0.6 : 1) * (1.2 - 0.4 * r.drv.mech / 100); // a dumper squares the whole robot up to the hub
    },
    hit(m, r, mult, distPen, stat) {

    addPts(m, r, pts, label, at) {
      const k = m.phase === 'auto' ? 'auto' : 'tele';
      m.score[r.a][k] += pts; r.stats.pts += pts;
      if (!m.headless && label) m.fx.push({ k: 'pop', x: at ? at.x : r.x, y: at ? at.y : r.y, text: label, t: m.t, a: r.a });
    },
    shotFx(m, r, to, hit) { if (!m.headless) m.fx.push({ k: 'shot', x0: r.x, y0: r.y, x1: to.x, y1: to.y, t: m.t, hit, a: r.a }); },
    shootSpot(m, r, goal, zone) {
      const c = r.cap, R = (c.rangeM || 1.5) * (c.turret && c.visionLvl >= 2 ? 1.1 : 1), rmin = c.rmin || 1.0;
      const d = dist(r, goal);
      let p;
      const inZone = !zone || (r.x >= zone.x0 && r.x <= zone.x1 && r.y >= zone.y0 && r.y <= zone.y1);
      if (d <= R && d >= rmin && inZone) p = { x: r.x, y: r.y };
      else {
        const want = Math.max(rmin, R * 0.88), k = d > 1e-6 ? (d - want) / d : 0;
        p = { x: r.x + (goal.x - r.x) * k, y: r.y + (goal.y - r.y) * k };
      }
      if (zone) { p.x = U.clamp(p.x, zone.x0, zone.x1); p.y = U.clamp(p.y, zone.y0, zone.y1); }
      const dd = dist(p, goal);
      if (dd > R) { const k = (dd - R * 0.88) / dd; p = { x: p.x + (goal.x - p.x) * k, y: p.y + (goal.y - p.y) * k }; }
      else if (dd < rmin && dd > 1e-6) { const k = rmin / dd; p = { x: goal.x + (p.x - goal.x) * k, y: goal.y + (p.y - goal.y) * k }; }

    },
    climbTime: (m, r, lvl) => climbTime(m, r, lvl), climbChance: (m, r, lvl) => climbChance(m, r, lvl),
    nearest(r, pts) { let best = null, bd = 1e9; for (const p of pts) { const d = dist(r, p); if (d < bd) { bd = d; best = p; } } return best; },
    travelEst(m, r, pt) { return dist(r, pt) / speedOf(m, r); },
    alliance: (m, a) => m.robots.filter(x => x.a === a)
  };
})();

<script>/* js/sim/rules.js */
'use strict';
/* FRC Manager — season rules for the match engine (2022–2026) */
(function () {
  const U = G.U, E = G.Engine, FW = E.FW, FH = E.FH;
  const H = E.H;
  const Rules = G.Rules = {};
  const leavePt = (r, d) => ({ x: U.clamp(r.sx + (r.a === 'blue' ? d : -d), 0.6, FW - 0.6), y: r.sy });
  const zoneOf = (m, a, x0, x1, y0, y1) => {
    const p = E.P(m, a, x0, y0), q = E.P(m, a, x1, y1);
    return { x0: Math.min(p.x, q.x), x1: Math.max(p.x, q.x), y0: Math.min(p.y, q.y), y1: Math.max(p.y, q.y) };
  };
  const claimNearest = (r, list) => {
    let best = null, bd = 1e9;
    for (const p of list) if (!p.claimed) { const d = E.dist(r, p); if (d < bd) { bd = d; best = p; } }

  const setHp = m => { m.hp = {}; ['red', 'blue'].forEach(a => m.hp[a] = Math.max(40, ...m.robots.filter(r => r.a === a).map(r => r.drv.hp || 40))); };

  // =====================================================================
  // 2022 RAPID REACT
  // =====================================================================
  function fender22(m, r) { const h = m.hub, d = E.dist(r, h) || 1; return { x: h.x + (r.x - h.x) / d * 1.8, y: h.y + (r.y - h.y) / d * 1.8 }; }
  // Cargo is tracked: it starts spread around the field, and every ball that is shot comes back out of the Hub

  // Robots chase their own alliance's cargo wherever it ends up.
  function spawnCargo22(m, c, hit) {
    const g = m.rng.range(0, Math.PI * 2), d = hit ? m.rng.range(2.2, 6.5) : m.rng.range(1.9, 4.5);

    const dh = E.dist(p, m.hub); if (dh < 2.0) { const k = 2.0 / (dh || 1); p.x = m.hub.x + (p.x - m.hub.x) * k; p.y = U.clamp(m.hub.y + (p.y - m.hub.y) * k, 0.45, FH - 0.45); }
    m.cargo.push(p);
  }
  function ground22(m, r) {
    let best = null, bv = 1e9;
    for (const p of m.cargo) {
      if (p.c !== r.a || p.t > m.t || (p.claim && p.claim !== r.team && p.claimT > m.t)) continue;
      const v = E.dist(r, p) + (E.dist(p, m.hub) < 1.9 ? 3 : 0);
      if (v < bv) { bv = v; best = p; }
    }

  }
  function collect22(m, r, pt, kind) {
    if (kind === 'ground' && pt.c) { pt.claim = r.team; pt.claimT = m.t + 6; }
    H.moveTo(m, r, pt, () => {
      if (!H.canCollect(m, r)) return;
      if (kind === 'ground' && pt.c && !m.cargo.includes(pt)) return; // someone else got there first
      H.act(r, H.collectTime(m, r, kind, kind === 'ground' ? 1.15 : 2.0), () => {
        if (kind === 'ground' && pt.c) { const i = m.cargo.indexOf(pt); if (i < 0) return; m.cargo.splice(i, 1); }
        r.held++; if (m.phase === 'auto') r.mem.got = (r.mem.got || 1) + 1;
      }, kind === 'ground' ? 'Intaking cargo' : 'Loading at terminal');
    }, kind === 'ground' ? 'To cargo' : 'To terminal');
  }
  function score22(m, r) {
    const c = r.cap, hub = m.hub;

  S[2023].meta = { defense: false, note: 'Scoring wins in CHARGED UP: protected Communities and Loading Zones make defense weak, so most alliances run three scorers.' };

<script>/* js/sim/ai.js */
'use strict';
/* FRC Manager — robot capability builder (shared by player & AI) and the AI team pool */
(function () {
  const U = G.U, D = G.Data;

  // ------------------------------------------------------------------
  // Capability builder: subsystems -> flat match capability object
  // subs: { subId: { concept, ver, stats:{}, rel, w } }
  // ------------------------------------------------------------------
  const STAT_KEY = { amp: 'ampSkill', algae: 'algaeSkill' };
  G.Cap = {};
  G.Cap.build = function (year, subs, extra) {
    extra = extra || {};
    const cap = {
      speed: 0, agility: 0, push: 0, intake: 0, scoreSpd: 0, accuracy: 0, range: 0, endgame: 0, auto: 20, vision: 0,
      balance: 20, ampSkill: 0, algaeSkill: 0, traverse: 40, feed: 40, endLevel: 0, storage: 1,
      autoTier: extra.autoTier || 0, visionLvl: extra.visionLvl || 0
    };
    const rels = []; let weight = 0; let built = 0;
    G.Seasons[year].subs.forEach(sd => {
      const s = subs[sd.id];
      if (!s || !s.ver) {
        if (sd.id === 'intake') cap.noIntake = true;
        if (sd.id === 'scorer') cap.noScorerMain = true;
        return;
      }
      const c = G.Seasons.concept(year, sd.id, s.concept);
      if (!c) return;
      built++;
      Object.keys(s.stats || {}).forEach(k => { cap[STAT_KEY[k] || k] = s.stats[k]; });
      Object.assign(cap, c.caps || {});
      if (sd.id !== 'soft') rels.push(s.rel == null ? 70 : s.rel);
      weight += s.w == null ? c.w : s.w;
    });
    if (cap.rmax) cap.rangeM = cap.rmin + (cap.rmax - cap.rmin) * (cap.range || 0) / 100;
    if (!subs.drive || !subs.drive.ver) { cap.speed = 15; cap.agility = 15; cap.push = 20; cap.noDrive = true; }
    // no scorer at all?
    const hasAlt = (subs.amp && subs.amp.ver) || (subs.algae && subs.algae.ver);
    cap.noScorer = !!cap.noScorerMain && !hasAlt;
    const avg = rels.length ? U.avg(rels) : 60, mn = rels.length ? Math.min(...rels) : 60;
    // the player's parts: sensors help reliability, worn parts fail more, mixed control systems cost a little everywhere
    const pp = extra.pp;
    cap.rel = U.clamp(0.6 * avg + 0.4 * mn + (pp ? 3 * pp.enc - 10 * (1 - pp.health) - (pp.mixed ? 3 : pp.kopMix ? 2 : 0) : 0), 5, 99);
    cap.brown = pp ? (1.25 - 0.5 * pp.motor) * (1 + 0.6 * (1 - pp.health)) : 1.25;
    if (pp) { const k = (0.97 + 0.03 * pp.health) * (pp.mixed ? 0.98 : pp.kopMix ? 0.99 : 1); cap.speed = Math.round(cap.speed * k); cap.scoreSpd = Math.round(cap.scoreSpd * k); }
    cap.weight = Math.round(weight);
    if (cap.endLevel && !cap.endgame) cap.endgame = 40;
    return cap;
  };
  G.Cap.look = function (year, subs, extra) {
    const lk = { drive: 'tank', ver: 1 };
    let maxVer = 0;
    G.Seasons[year].subs.forEach(sd => {
      const s = subs[sd.id];
      if (!s || !s.ver) return;
      const c = G.Seasons.concept(year, sd.id, s.concept);
      if (c && c.look) Object.assign(lk, c.look);
      if (sd.id !== 'soft') maxVer = Math.max(maxVer, s.ver);
    });
    lk.ver = maxVer; lk.vision = (extra && extra.visionLvl) || 0;
    return lk;
  };
  // Expected-points "power" of a capability (used for scouting estimates and AI picks)
  G.Cap.power = function (year, cap) {
    if (cap.noDrive) return 0;
    const sc = cap.noScorer ? 0.15 : (0.35 + 0.65 * (cap.scoreSpd * 0.5 + cap.accuracy * 0.5) / 100);
    const cyc = (0.4 + 0.6 * (cap.speed * 0.6 + cap.intake * 0.4) / 100);
    const end = [0, 0.4, 0.7, 1.0, 1.3][cap.endLevel || 0] * (0.5 + 0.5 * (cap.endgame || 0) / 100);
    return Math.round(100 * (sc * cyc * 0.75 + end * 0.18 + (cap.autoTier || 0) * 0.03) * (0.7 + 0.3 * cap.rel / 100));
  };

  // ------------------------------------------------------------------
  // AI team pool
  // ------------------------------------------------------------------
  const AI = G.AI = {};
  AI.makePool = function (rng, n, playerNum, startYear) {
    const pool = {};
    const used = new Set([playerNum]);
    for (let i = 0; i < n; i++) {
      let num; do { num = rng.int(1, 10999); } while (used.has(num));
      used.add(num);
      const str = Math.round(U.clamp(rng.norm(48, 18) + (num < 2000 ? 6 : 0), 6, 96));
      pool[num] = {
        num, name: D.teamName(rng), region: rng.pick(D.REGIONS), str, traj: rng.pick([-1, 0, 0, 1]),
        impact: AI.impactRoll(rng, str), rookie: false, rb: null
      };
    }
    return pool;
  };
  // Impact strength of an established team: loosely tied to robot strength, plus a few outreach powerhouses.
  AI.impactRoll = (rng, str) => Math.round(U.clamp(rng.norm(str * 0.45 + 20, 14) + (rng.chance(0.1) ? 24 : 0), 5, 98));
  AI.addRookies = function (pool, rng, year, count, playerNum) {
    for (let i = 0; i < count; i++) {
      let num; do { num = rng.int(11000, 11999); } while (pool[num] || num === playerNum);
      pool[num] = { num, name: D.teamName(rng), region: rng.pick(D.REGIONS), str: Math.round(U.clamp(rng.norm(26, 10), 5, 60)), traj: 1,
        impact: Math.round(U.clamp(rng.norm(30, 12), 5, 80)), rookie: year, rb: null };
    }
  };
  AI.evolve = function (pool, rng) {
    Object.values(pool).forEach(t => {
      t.str = Math.round(U.clamp(t.str + t.traj * rng.range(1, 5) + rng.norm(0, 4), 5, 97));
      if (rng.chance(0.2)) t.traj = rng.pick([-1, 0, 1]);
      t.impact = Math.round(U.clamp(t.impact + rng.norm(0, 5), 5, 98));
      t.rb = null;
    });
  };

  function pickArchetype(rng, S, str) {
    const elig = S.archetypes.filter(a => !a.defense && !a.feed && str >= a.min).sort((p, q) => q.min - p.min);
    const spec = S.archetypes.filter(a => (a.defense || a.feed) && str >= a.min);
    if (spec.length && rng.chance(0.08)) return rng.pick(spec);
    const x = rng.next();
    if (x < 0.5 || elig.length === 1) return elig[0];
    if (x < 0.82 && elig[1]) return elig[1];
    return rng.pick(elig);
  }
  // Generate this season's robot design for an AI team (stored on the team)
  AI.seasonRobot = function (team, year, rng) {
    const S = G.Seasons[year], arch = pickArchetype(rng, S, team.str);
    const q = U.clamp(Math.pow(team.str / 100, 1.3) + rng.norm(0, 0.07), 0.03, 0.97);
    const choice = {};
    S.subs.forEach(sd => {
      let p = arch.pick[sd.id];
      if (sd.id === 'soft') p = 'code';
      if (Array.isArray(p)) p = rng.pick(p);
      if (!p) p = sd.concepts[0].id;
      choice[sd.id] = p;
    });
    if (choice.drive === 'swerve' && team.str < 45 && rng.chance(0.6)) choice.drive = 'wcd';
    const jit = {};
    S.subs.forEach(sd => { jit[sd.id] = rng.range(-0.08, 0.08); });
    team.rb = {
      year, arch: arch.name, role: arch.defense ? 'defend' : arch.feed ? 'feed' : 'score', choice, q, jit,
      autoTier: U.clamp(Math.floor(q * 4 + rng.norm(0, 0.6)), 0, 3), visionLvl: q > 0.72 ? 2 : q > 0.45 ? 1 : 0,
      drv: Math.round(U.clamp(30 + 60 * q + rng.norm(0, 8), 15, 97)), comp: Math.round(U.clamp(35 + 50 * q + rng.norm(0, 10), 15, 97))
    };
    return team.rb;
  };
  // Event-time capability for an AI team; weekMult models in-season improvement
  AI.entry = function (team, year, weekMult, diffMult, rng) {
    if (!team.rb || team.rb.year !== year) AI.seasonRobot(team, year, rng);
    const rb = team.rb, S = G.Seasons[year];
    const qe = U.clamp(rb.q * weekMult * diffMult, 0.03, 0.99);
    const subs = {};
    S.subs.forEach(sd => {
      const cid = rb.choice[sd.id];
      const c = sd.concepts.find(x => x.id === cid);
      if (!c) return;
      if (c.id === 'none') { subs[sd.id] = { concept: 'none', ver: 0, stats: {} }; return; }
      const qq = U.clamp(qe + rb.jit[sd.id], 0.02, 0.99);
      const stats = {};
      Object.keys(c.ceil).forEach(k => { stats[k] = Math.round(c.base[k] + (c.ceil[k] - c.base[k]) * qq); });
      subs[sd.id] = { concept: cid, ver: 1 + Math.floor(qq * 3), stats, rel: Math.round(U.clamp(52 + 42 * qq - c.cx * 2 + rng.norm(0, 4), 30, 97)), w: c.w };
    });
    const extra = { autoTier: rb.autoTier, visionLvl: rb.visionLvl, parts: { motors: qe > 0.6 ? 2 : qe > 0.35 ? 1 : 0, sensors: qe > 0.5 ? 1 : 0 } };
    const cap = G.Cap.build(year, subs, extra);
    const look = G.Cap.look(year, subs, extra);
    const d = rb.drv, cp = rb.comp;
    return {
      team: team.num, cap, look, isPlayer: false,
      drv: { drive: d, comp: cp, aware: d, mech: Math.round((d + cp) / 2), hp: Math.round(U.clamp(30 + 55 * qe, 20, 95)), strat: d },
      plan: { role: rb.role }, tune: U.clamp(0.4 + qe * 0.5, 0, 1), conf: U.clamp(0.4 + qe * 0.5, 0, 1), cond: 100, batt: 1, hidden: 0,
      arch: rb.arch, power: G.Cap.power(year, cap)
    };
  };

  // Choose AI teams attending an event
  AI.pickAttendees = function (pool, rng, count, region, star, exclude, champs) {
    const target = champs ? 78 : 28 + star * 9;
    const list = Object.values(pool).filter(t => !exclude.has(t.num));
    const chosen = [];
    const cand = list.map(t => {
      let w = champs ? 1 : (t.region === region ? 3 : (D.ADJ[region] || []).includes(t.region) ? 1.4 : 0.35);
      const z = (t.str - target) / (champs ? 14 : 24);
      w *= Math.exp(-z * z) + (champs ? 0.02 : 0.15);
      return { t, w };
    });
    for (let i = 0; i < count && cand.length; i++) {
      const pick = rng.wpick(cand, c => c.w);
      chosen.push(pick.t.num);
      cand.splice(cand.indexOf(pick), 1);
    }
    return chosen;
  };
})();

<script>/* js/sim/event.js */
'use strict';
/* FRC Manager — event flow: practice, qualification schedule, rankings, OPR, alliance selection, playoffs, awards */
(function () {
  const U = G.U, D = G.Data;
  const Ev = G.Ev = {};

  const KIND = {
    regional: { name: 'Regional', perTeam: n => n <= 44 ? 11 : n <= 54 ? 10 : 9, blocks: 3, sel: true, awards: true },
    champs: { name: 'Championship Division', perTeam: () => 10, blocks: 3, sel: true, awards: true },
    offseason: { name: 'Offseason Event', perTeam: () => 6, blocks: 1, sel: true, awards: false },
    scrimmage: { name: 'Week 0 Scrimmage', perTeam: () => 5, blocks: 2, sel: false, awards: false },
    einstein: { name: 'Einstein', perTeam: () => 0, blocks: 0, sel: false, awards: false }
  };
  Ev.KIND = KIND;

  function hash(a, b) { let h = (a ^ 0x9e3779b9) >>> 0; h = Math.imul(h ^ (b + 0x7f4a7c15), 2654435761) >>> 0; return (h ^ (h >>> 13)) >>> 0; }

  // ------------------------------------------------------------------
  Ev.start = function (def) {
    const S = G.S, rng = G.R;
    const K = KIND[def.kind];
    const year = def.year || S.year;
    const ev = {
      id: def.id || U.uid('ev'), name: def.name, kind: def.kind, year, week: def.week || 0, region: def.region || S.team.region,
      star: def.str || 3, seed: rng.int(1, 2e9), stage: 'practice', teams: [], caps: {}, rank: {}, quals: [], qi: 0,
      practice: { blocks: K.blocks, used: [] }, tune: 0.3, conf: 0.3, tuneAuto: 0, shake: 0, plan: { pace: 'bal', role: 'score', target: 'auto', endTiming: 'std', endLevel: 9, rpHunt: false, avoid: false },
      suggest: {}, sel: null, alliances: null, po: null, awards: [], log: [], lastPlayerMatch: -1, timeouts: {}, matchCount: 0, playerResults: [],
      incidents: [], fatigue: S.fatigue == null ? D.FATIGUE_BASE : S.fatigue
    };
    ev.scoutCred = Ev.credibility(S, ev);
    const player = S.team.num;
    const weekMult = def.kind === 'champs' || def.kind === 'einstein' ? 1.08 : def.kind === 'offseason' ? 1.04 : def.kind === 'scrimmage' ? 0.8 : 0.85 + 0.03 * (ev.week - 1);
    const diffMult = { easy: 0.9, normal: 1, hard: 1.1 }[S.diff] || 1;
    const size = def.size || 40;
    const exclude = new Set([player]);
    const ai = G.AI.pickAttendees(S.teams, rng, size - 1, ev.region, ev.star, exclude, def.kind === 'champs');
    ev.teams = [player].concat(ai);
    ai.forEach(n => { ev.caps[n] = G.AI.entry(S.teams[n], year, weekMult, diffMult, rng); });
    ev.teams.forEach(n => { ev.rank[n] = { rp: 0, played: 0, w: 0, l: 0, t: 0, pts: 0, auto: 0, tb: rng.next() }; });
    // practice starting values
    const st = G.Robot.eventStart(S, ev);
    ev.tune = st.tune; ev.conf = st.conf;
    if (def.kind === 'einstein') { ev.stage = 'playoffs'; }
    else ev.quals = makeSchedule(ev.teams, K.perTeam(ev.teams.length), rng);
    ev.inspection = G.Robot.inspect(S, ev);
    S.event = ev;
    return ev;
  };

  function makeSchedule(teams, perTeam, rng) {
    const q = [];
    for (let r = 0; r < perTeam; r++) q.push(...rng.shuffle(teams.slice()));
    const matches = [];
    while (q.length) {
      const m = [];
      while (m.length < 6 && q.length) {
        let k = q.findIndex(t => !m.includes(t));
        if (k < 0) break;
        m.push(q.splice(k, 1)[0]);
      }
      while (m.length < 6) { const t = rng.pick(teams); if (!m.includes(t)) m.push(t); }
      matches.push({ n: matches.length + 1, red: m.slice(0, 3), blue: m.slice(3, 6), res: null });
    }
    // spread consecutive appearances
    for (let i = 1; i < matches.length; i++) {
      const prev = matches[i - 1], cur = matches[i];
      const clash = cur.red.concat(cur.blue).some(t => prev.red.includes(t) || prev.blue.includes(t));
      if (clash && i + 1 < matches.length) {
        const j = i + 1 + Math.floor(rng.next() * (matches.length - i - 1));
        const tmp = matches[i]; matches[i] = matches[j]; matches[j] = tmp;
      }
    }
    matches.forEach((m, i) => m.n = i + 1);
    return matches;
  }

  // ------------------------------------------------------------------
  // Practice
  // ------------------------------------------------------------------
  Ev.PRACTICE = [
    { id: 'driver', name: 'Driver Reps', desc: '+Driver Confidence (faster, cleaner cycles).' },
    { id: 'calib', name: 'Mechanism Calibration', desc: '+Robot Tuning (accuracy).' },
    { id: 'auto', name: 'Auto Validation', desc: '+Autonomous success rate.' },
    { id: 'shake', name: 'Systems Shakedown', desc: 'Find hidden faults, lower fault chance and rebuild worn parts: robot condition back to 100%.' },
    { id: 'scout', name: 'Scouting Focus', desc: 'Sharper scouting data on other teams.' },
    { id: 'install', name: 'Install Upgrade', desc: 'Install finished upgrades in the pits.' }
  ];
  Ev.doPractice = function (ev, prog) {
    const S = G.S, rng = G.R, out = [];
    const coach = G.Career.mentorSkill(S, 'coach'), strat = G.Career.mentorSkill(S, 'strat'), prog2 = G.Career.mentorSkill(S, 'prog'), fab = G.Career.mentorSkill(S, 'fab');
    switch (prog) {
      case 'driver': {
        const d = 0.22 + 0.12 * coach / 100, f0 = S.robot ? G.Robot.famAvg(S.robot, S.robot.comp || 0) : null;
        ev.conf = U.clamp(ev.conf + d, 0, 1); out.push('Driver confidence +' + Math.round(d * 100) + '%');
        if (f0 != null) { G.Robot.famDrive(S, S.robot.comp || 0, D.FAM.BLOCK); out.push('Robot familiarity ' + Math.round(f0 * 100) + '% → ' + Math.round(G.Robot.famAvg(S.robot, S.robot.comp || 0) * 100) + '%'); }
        break;
      }
      case 'calib': { const d = 0.22 + 0.1 * G.Career.mentorSkill(S, 'design') / 100; ev.tune = U.clamp(ev.tune + d, 0, 1); out.push('Robot tuning +' + Math.round(d * 100) + '%'); break; }
      case 'auto': { const d = 0.06 + 0.05 * prog2 / 100; ev.tuneAuto = U.clamp(ev.tuneAuto + d, 0, 0.2); out.push('Auto success +' + Math.round(d * 100) + '%'); break; }
      case 'shake': {
        ev.shake = Math.min(2, ev.shake + 1);
        const found = G.Robot.shakedown(S, 0.55 + 0.3 * fab / 100);
        out.push(found ? 'Found and fixed ' + found + ' hidden fault' + (found > 1 ? 's' : '') + '.' : 'No hidden faults found. Systems look healthy.');
        // a full teardown: every worn part is rebuilt, using spares first and borrowing from other pits for the rest
        const before = Math.round(G.Robot.condAvg(S));
        if (before < 100) {
          const rep = G.Robot.homeRepair(S, true);
          let borrowed = false;
          Object.values(S.robot.subs).forEach(sb => { if (sb.ver && sb.cond < 100) { sb.cond = 100; borrowed = true; } });
          out.push('Rebuilt worn parts: condition ' + before + '% → 100%' + (rep.used ? ' (' + rep.used + ' spare part' + (rep.used > 1 ? 's' : '') + ')' : '') + (borrowed ? ', finished with parts borrowed from other teams\' pits' : '') + '.');
        } else out.push('Robot condition already 100%.');
        break;
      }
      case 'scout': { ev.scoutBonus = (ev.scoutBonus || 0) + 1; ev.scoutCred = Math.min(0.99, ev.scoutCred + 0.03); out.push('Scouting data sharpened (strategy mentor ' + Math.round(strat) + '). Scouting credibility ' + Math.round(ev.scoutCred * 100) + '%.'); break; }
      case 'install': { const n = G.Robot.installPending(S); out.push(n ? 'Installed ' + n + ' upgrade' + (n > 1 ? 's' : '') + '.' : 'No pending upgrades to install.'); break; }
      case 'lighten': { out.push(G.Robot.emergencyLighten(S)); break; }
    }
    ev.practice.used.push(prog);
    if (ev.practice.used.length >= ev.practice.blocks) ev.stage = ev.kind === 'einstein' ? 'playoffs' : 'quals';
    return out;
  };
  Ev.skipPractice = function (ev) { while (ev.stage === 'practice') Ev.doPractice(ev, ev.inspection && !ev.inspection.ok && !ev.practice.used.includes('lighten') ? 'lighten' : 'calib'); };

  // ------------------------------------------------------------------
  // Match building & running
  // ------------------------------------------------------------------
  Ev.entryFor = function (ev, team, alliance, matchIdx, playoff) {
    const S = G.S;
    if (team === S.team.num) {
      const en = G.Robot.matchEntry(S, ev);
      en.plan = Object.assign({}, ev.plan);
      return en;
    }
    const base = ev.caps[team];
    const en = Object.assign({}, base);
    en.plan = Object.assign({}, base.plan);
    return en;
  };
  Ev.matchEntries = function (ev, match, playoff) {
    const S = G.S, rng = G.makeRng(hash(ev.seed, match.key || match.n || 1));
    const out = {};
    ['red', 'blue'].forEach(a => {
      const teams = match[a];
      const ens = teams.map(t => Ev.entryFor(ev, t, a, match.n, playoff));
      const hasPlayer = teams.includes(S.team.num);
      ens.forEach(e => {
        if (e.isPlayer) return;
        if (hasPlayer && ev.suggest[e.team]) {
          const acc = 0.4 + 0.1 * G.Career.mentorStars(S, 'strat') + S.rep / 500;
          if (rng.chance(acc)) e.plan.role = ev.suggest[e.team];
          e.followed = e.plan.role === ev.suggest[e.team];
          e.suggested = true;
        }
        if (playoff || rng.chance(0.5)) e.plan.rpHunt = !playoff;
      });
      // 2024 note feeding: an alliance needs a robot that can lob notes (ranged shooter + ground intake) and another scorer.
      // AI alliances pick it up over the season; your alliance's grasp comes from your team's strategy read.
      let iq = 0, feeding = false;
      if (ev.year === 2024) {
        const ai = Ev.feedChance(ev, playoff), mine = hasPlayer ? G.Career.metaInsight(S) : 0;
        const cands = ens.filter(e => !e.isPlayer && !e.suggested && e.plan.role === 'score' && e.cap.speaker && (e.cap.range || 0) >= 30 && e.cap.ground);
        const scorers = ens.filter(e => e.cap.speaker || e.cap.amp || e.cap.ampViaShooter).length;
        if (cands.length && scorers >= 2 && rng.chance(hasPlayer ? Math.max(ai, mine * 0.9) : ai)) {
          cands.sort((p, q) => (p.power || 0) - (q.power || 0))[0].plan.role = 'feed';
          feeding = true;
        }
        const k = Ev.metaProgress(ev);

        const srcMissing = (spec) => spec.L && (() => { const s = po.matches.find(x => x.id === spec.L); return s && s.bye; })();
        if (m.red != null && m.blue == null && srcMissing(b.blue)) { m.winner = m.red; m.bye = true; continue; }
        if (m.blue != null && m.red == null && srcMissing(b.red)) { m.winner = m.blue; m.bye = true; continue; }
        continue;
      }
      return m;
    }
    return null;
  };
  Ev.playerAlliance = function (ev) { const me = G.S.team.num; return ev.alliances ? ev.alliances.findIndex(a => a.includes(me)) : -1; };
  Ev.poMatchObj = function (ev, m) {
    const g = m.games.filter(x => !x.replay).length, last = m.games[m.games.length - 1];
    return { key: 1000 + BR.findIndex(b => b.id === m.id) * 10 + m.games.length, game: g, replay: !!(last && last.replay), playoff: true, red: ev.alliances[m.red], blue: ev.alliances[m.blue], id: m.id };
  };
  // FRC playoff tiebreakers (game manuals): foul points first, then the season's auto / endgame points, and only if
  // everything is still equal is the match replayed. 2022 Hangar and 2023 Charge Station come before auto.
  Ev.TIEBREAK = year => (year === 2022 || year === 2023
    ? [['foul', 'foul points'], ['end', year === 2022 ? 'Hangar points' : 'Charge Station points'], ['auto', 'auto points']]
    : [['foul', 'foul points'], ['auto', 'auto points'], ['end', ({ 2024: 'Stage', 2025: 'Barge', 2026: 'Tower' })[year] ? ({ 2024: 'Stage', 2025: 'Barge', 2026: 'Tower' })[year] + ' points' : 'endgame points']]);
  Ev.breakTie = function (ev, res) {
    if (res.winner !== 'tie') return;
    for (const [k, label] of Ev.TIEBREAK(ev.year)) {
      if (res.red[k] === res.blue[k]) continue;
      const w = res.red[k] > res.blue[k] ? 'red' : 'blue';
      res.winner = w; res.tiebreak = label; res.tieVals = { red: res.red[k], blue: res.blue[k] };
      res[w].win = 1; res[w === 'red' ? 'blue' : 'red'].win = 0;

    res.replay = true; // tied on every tiebreaker
  };
  Ev.applyPlayoff = function (ev, m, res) {
    const obj = Ev.poMatchObj(ev, m);
    Ev.breakTie(ev, res);
    // safety: a match tied on everything three times in a row goes to the alliance with more auto points, then the higher seed
    if (res.replay && m.games.filter(x => x.replay).length >= 2) { const w = res.red.auto !== res.blue.auto ? (res.red.auto > res.blue.auto ? 'red' : 'blue') : (m.red < m.blue ? 'red' : 'blue'); res.replay = false; res.winner = w; res.tiebreak = res.red.auto !== res.blue.auto ? 'auto points' : 'alliance seed'; res[w].win = 1; res[w === 'red' ? 'blue' : 'red'].win = 0; }
    m.games.push({ red: res.red.score, blue: res.blue.score, winner: res.winner, res, replay: !!res.replay, tb: res.tiebreak || null });
    m.res = res; m.redT = obj.red; m.blueT = obj.blue;
    ev.matchCount++;
    if (obj.red.includes(G.S.team.num) || obj.blue.includes(G.S.team.num)) G.Career.afterPlayerMatch(G.S, ev, obj, res);
    let w = null;
    if (m.bo3) {
      const rw = m.games.filter(x => x.winner === 'red').length, bw = m.games.filter(x => x.winner === 'blue').length;
      if (rw >= 2) w = 'red'; else if (bw >= 2) w = 'blue';
    } else if (res.winner !== 'tie') w = res.winner;
    if (w) {
      m.winner = w === 'red' ? m.red : m.blue;
      m.loser = w === 'red' ? m.blue : m.red;
    }
    if (m.id === 'F' && m.winner != null) { ev.po.done = true; computeFinish(ev); }
  };
  function computeFinish(ev) {
    const get = id => ev.po.matches.find(x => x.id === id);
    const f = ev.po.finish = {};
    ev.alliances.forEach((a, i) => f[i] = 'Quarterfinalist');
    const F = get('F'), M13 = get('M13'), M12 = get('M12');
    ['M9', 'M10'].forEach(id => { const x = get(id); if (x.loser != null) f[x.loser] = 'Lower R2'; });
    ['M5', 'M6'].forEach(id => { const x = get(id); if (x.loser != null) f[x.loser] = 'Lower R1'; });
    if (M12.loser != null) f[M12.loser] = '4th place';
    if (M13.loser != null) f[M13.loser] = '3rd place';
    f[F.loser] = 'Finalist'; f[F.winner] = 'Winner';
  }
  Ev.simPlayoffsUntilPlayer = function (ev) {
    const pa = Ev.playerAlliance(ev);
    let m;
    while ((m = Ev.nextPlayoff(ev))) {
      if (m.red === pa || m.blue === pa) return m;
      Ev.applyPlayoff(ev, m, Ev.runHeadless(ev, Ev.poMatchObj(ev, m)));
    }
    return null;
  };
  // Losses so far in the double-elimination bracket (finals games count separately)
  Ev.playerLosses = function (ev) {
    const pa = Ev.playerAlliance(ev);
    if (pa < 0 || !ev.po) return { losses: 0, finals: 0 };
    const F = ev.po.matches.find(x => x.id === 'F'), side = F && F.red === pa ? 'blue' : 'red';
    return { losses: ev.po.matches.filter(m => m.loser === pa && !m.bo3).length, finals: F && (F.red === pa || F.blue === pa) ? F.games.filter(g => g.winner === side).length : 0, inFinals: !!(F && (F.red === pa || F.blue === pa)) };
  };
  Ev.playoffStatus = function (ev) {
    const pa = Ev.playerAlliance(ev);
    if (pa < 0) return 'Not in playoffs';
    const losses = ev.po.matches.filter(m => m.loser === pa && !m.bo3).length;
    if (ev.po.done) return ev.po.finish[pa];
