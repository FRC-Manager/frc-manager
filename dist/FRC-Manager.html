    if (fn) fn(el.type === 'checkbox' ? el.checked : el.value, el, e);
  });

  // ---------------- components ----------------
  UI.bar = (v, max, col, mark) => '<div class="bar"><i style="width:' + U.clamp(100 * v / (max || 100), 0, 100) + '%;background:' + (col || 'var(--accent)') + '"></i>' + (mark != null ? '<b style="left:' + U.clamp(100 * mark / (max || 100), 0, 100) + '%"></b>' : '') + '</div>';
  UI.stat = (n, v, ceil, col) => '<div class="statrow"><span class="n">' + h(n) + '</span>' + UI.bar(v, 100, col, ceil) + '<span class="v">' + Math.round(v) + '</span></div>';
  UI.card = (title, body, extra, cls) => '<div class="card ' + (cls || '') + '"><div class="ct">' + title + '<span class="sp"></span>' + (extra || '') + '</div>' + body + '</div>';
  UI.tag = (t, k) => '<span class="tag ' + (k || '') + '">' + h(t) + '</span>';
  // Blue banner (simplified FRC style): emblem, award, year, event
  UI.banner = (b, isNew) => '<div class="banner ' + (b.gold ? 'gold ' : '') + (isNew ? 'new' : '') + '"><div class="emb">' + (b.gold ? '★' : b.award === 'Impact Award' ? '✦' : '⚙') + '</div><div class="aw">' + h(b.award) + '</div><div class="yr">' + h(b.year) + '</div><div class="ev">' + h(b.event) + '</div></div>';
  UI.bannerWall = (list, isNew) => '<div class="banners">' + list.map(b => UI.banner(b, isNew)).join('') + '</div>';
  UI.colorFor = v => v >= 75 ? 'var(--good)' : v >= 50 ? 'var(--accent)' : v >= 30 ? 'var(--warn)' : 'var(--bad)';
  UI.sideCanvas = function (look, a, team, w, hgt) {
    const id = 'cv' + Math.floor(Math.random() * 1e9);

  };
  UI.topCanvas = function (look, a, team, held, year, size) {
    const id = 'tv' + Math.floor(Math.random() * 1e9), sz = size || 120;
    UI.job(() => {
      const c = document.getElementById(id); if (!c) return;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#12161b'; ctx.fillRect(0, 0, sz, sz);

      Array.from({ length: Math.max(0, free) }, () => '<span class="batt" style="opacity:.25" title="empty slot"></span>').join('');
    const btn = n => { const k = Math.min(n, room); if (k <= 0) return ''; const fill = Math.min(k, Math.max(0, free)); const rep = k - fill; return '<button class="btn sm" data-act="buyBatt" data-arg="' + k + '">' + (fill ? '+' + fill + ' new' : '') + (fill && rep ? ', ' : '') + (rep ? 'replace ' + rep + ' worn' : '') + ' · ' + U.money(k * unit) + '</button>'; };
    return '<div><div class="row wrap"><div class="sp"><b>Batteries</b> <span class="xs muted">' + fl.length + '/' + lim + ' slots · fleet health ' + Math.round(Sh.fleetHealth(S) * 100) + '%</span></div>' + (room > 0 ? btn(2) + btn(4) : UI.tag('all healthy', 'good')) + '</div>' +
      '<div class="mt">' + cells + '</div><div class="xs muted mt">Only the battery used in a match wears (about 1% per match), and batteries age slowly on the shelf. New batteries fill empty slots first, then automatically replace your most worn ones. ' + (lim < 20 ? 'The smart charging station (Battery Station level 2) holds 20.' : '') + '</div></div>';
  };
  UI.A.buySpares = n => { if (!UI.err(G.Career.buySpares(G.S, Number(n)))) UI.render(); };

  // =====================================================================
  // FINANCE
  // =====================================================================
  function goalsTxt(sp) { return sp.goals.map(g => '<div class="xs">' + (g.met ? '✔ ' : '• ') + h(D.GOALS[g.id].text) + ' <span class="good">+' + U.money(g.bonus) + '</span></div>').join(''); }
  UI.S.finance = { html() {
    const S = G.S, C = G.Career;
    let o = '<h1>Finance</h1><div class="sub">Budget ' + U.money(S.money) + ' · sponsors pay at Kickoff each season · bonuses when goals are met.</div><div class="grid g2">';
    o += UI.card('Sponsors (' + S.sponsors.filter(s => s.slot === 'partner').length + '/' + C.partnerSlots(S) + ' partner slots)', S.sponsors.length ? S.sponsors.map(sp =>
      '<div class="card flat mb"><div class="row"><b>' + h(sp.name) + '</b>' + UI.tag(sp.slot === 'title' ? 'TITLE' : sp.slot === 'grant' ? 'GRANT' : 'Partner', sp.slot === 'title' ? 'acc' : '') + '<span class="sp"></span><b>' + U.money(sp.base) + '</b><span class="xs muted">/season · ' + sp.seasonsLeft + ' left</span></div>' +
      '<div class="xs muted">' + h(sp.typeName) + ' · expectations ' + sp.exp + (sp.perk ? ' · Perk: <span class="info">' + h(D.PERKS[sp.perk].name) + '</span>' : '') + '</div>' + goalsTxt(sp) +
      '<div class="row mt"><span class="xs muted">Satisfaction</span><div class="sp">' + UI.bar(sp.sat, 100, UI.colorFor(sp.sat)) + '</div><span class="xs">' + Math.round(sp.sat) + '</span></div></div>').join('') : '<p class="muted">No sponsors. Offers arrive in October.</p>');
    // offers
    o += UI.card('Sponsor offers', S.offers.length ? S.offers.map(of =>
      '<div class="card flat mb"><div class="row"><b>' + h(of.name) + '</b>' + UI.tag(of.slot === 'title' ? 'TITLE' : of.slot === 'grant' ? 'GRANT' : 'Partner', of.slot === 'title' ? 'acc' : '') + '<span class="sp"></span><b>' + U.money(of.base) + '</b><span class="xs muted">/season × ' + of.length + '</span></div>' +
      '<div class="xs muted">' + h(of.typeName) + ' · expectations ' + of.exp + (of.perk ? ' · Perk: <span class="info">' + h(D.PERKS[of.perk].name) + '</span>' : '') + '</div>' + goalsTxt(of) +
      (of.obligations.length ? '<div class="xs warn">Obligations: ' + of.obligations.map(h).join('; ') + '</div>' : '') +
      '<div class="row mt"><span class="sp"></span><button class="btn sm primary" data-act="signSp" data-arg="' + of.id + '">Sign</button></div></div>').join('') : '<p class="muted">No open offers. New offers arrive each October.</p>');
    o += '</div>';
    // activities
    const acts = S.activities.filter(a => a.year === S.year);
    if (acts.length) o += '<div class="mt">' + UI.card('Sponsor activities ' + S.year, '<table class="t"><tr><th>Week</th><th>Activity</th><th>Status</th></tr>' + acts.map(a => '<tr><td>Build wk ' + a.week + '</td><td>' + h(a.text) + '</td><td>' + UI.tag(a.status, a.status === 'done' ? 'good' : a.status === 'skipped' ? 'bad' : 'warn') + '</td></tr>').join('') + '</table>') + '</div>';
    // ledger
    o += '<div class="mt">' + UI.card('Ledger', '<table class="t"><tr><th>Date</th><th>Item</th><th class="num">Amount</th></tr>' + S.ledger.slice(0, 40).map(l => '<tr><td class="xs muted">' + h(l.d) + '</td><td>' + h(l.desc) + '</td><td class="num ' + (l.amt < 0 ? 'bad' : 'good') + '">' + U.money(l.amt) + '</td></tr>').join('') + '</table>') + '</div>';
    return o;
  } };
  UI.A.signSp = id => { if (!UI.err(G.Career.signSponsor(G.S, id))) { UI.toast('Sponsor signed', 'good'); UI.render(); } };

  // =====================================================================
  // CALENDAR
  // =====================================================================
  UI.S.calendar = { html() {
    const S = G.S, C = G.Career;
    const nextYear = S.phase === 'off' ? (S.orderMode === 'random' && S.mode === 'career' ? 'next season (game revealed at Kickoff)' : (S.order[S.upcoming] || '')) : S.year;
    let o = '<h1>Calendar</h1><div class="sub">Regionals for ' + h(String(nextYear)) + ' · registered ' + S.registered.length + '/' + S.maxEvents + ' · next fee ' + U.money(C.regFee(S)) + (C.isLate(S) ? ' + ' + U.money(D.FEES.late) + ' late fee' : '') + '</div>';
    o += '<div class="hint mb">Each regional week costs registration + travel and uses most of that week\'s build hours. Early weeks: weaker opponents but a less developed robot. Win a regional, an Impact/EI award, or enough Regional Pool points (best two events, cut-off ' + C.poolThreshold(S) + ') to qualify for the Championship.</div>';
    for (let w = 1; w <= 6; w++) {
      const list = S.regionals.filter(r => r.week === w);
      o += '<div class="card mb"><div class="ct">Week ' + w + (S.phase === 'comp' && S.week === w ? ' ' + UI.tag('this week', 'acc') : '') + '</div><table class="t"><tr><th>Regional</th><th>Region</th><th>Travel</th><th class="num">Teams</th><th>Strength</th><th></th></tr>' +
        list.map(r => {
          const tier = D.travelTier(S.team.region, r.region, r.local), reg = S.registered.includes(r.id), why = C.canRegister(S, r);
          return '<tr class="' + (reg ? 'me' : '') + '"><td><b>' + h(r.name) + '</b></td><td>' + h(r.region) + '</td><td>' + h(D.TRAVEL[tier].name) + ' ' + U.money(C.travelCost(S, Object.assign({ kind: 'regional' }, r))) + '</td><td class="num">' + r.size + '</td><td class="acc">' + '★'.repeat(r.str) + '</td><td>' +
            (reg ? (S.eventsDone[r.id] ? UI.tag('done', 'good') : '<button class="btn sm bad" data-act="withdraw" data-arg="' + r.id + '">Withdraw</button>') : why ? '<span class="xs muted">' + h(why) + '</span>' : '<button class="btn sm primary" data-act="register" data-arg="' + r.id + '">Register</button>') + '</td></tr>';
        }).join('') + '</table></div>';
    }
    // scrimmage & offseason
    const canScrim = (S.phase === 'kickoff' || (S.phase === 'build' && S.week < 7) || S.phase === 'off');
    o += UI.card('Week 0 scrimmage', '<div class="row"><div class="sp sm muted">Cheap practice event before Week 1: real matches, no rankings at stake. Boosts tuning and driver confidence for your first regional. ' + U.money(D.FEES.scrimmage) + ' + local travel.</div>' + (S.scrimmage ? UI.tag('registered', 'good') : '<button class="btn sm" data-act="regScrim" ' + (canScrim ? '' : 'disabled') + '>Register</button>') + '</div>');
    if (S.phase === 'off') {
      o += '<div class="mt">' + UI.card('Offseason events', S.robot ? '<table class="t"><tr><th>Month</th><th>Event</th><th class="num">Teams</th><th class="num">Fee</th><th></th></tr>' + D.OFFSEASON_EVENTS.map(e => '<tr><td>' + e.month + '</td><td>' + h(e.name) + '</td><td class="num">' + e.size + '</td><td class="num">' + U.money(e.fee) + '</td><td>' + (S.offReg.includes(e.id) ? UI.tag(S.eventsDone[e.id + S.year] ? 'done' : 'registered', 'good') : D.MONTHS.indexOf(e.month) < S.month ? '<span class="xs muted">past</span>' : '<button class="btn sm" data-act="regOff" data-arg="' + e.id + '">Register</button>') + '</td></tr>').join('') + '</table><p class="xs muted">Played with last season\'s robot and game. Double XP for students, reputation and sponsor goodwill.</p>' : '<p class="muted">You need a robot from a completed season to attend offseason events.</p>') + '</div>';
    }
    if (S.phase !== 'off' && S.season.events.length) o += '<div class="mt">' + UI.card('Regional Pool', '<div>Pool total (best two events): <b>' + C.poolTotal(S) + '</b> / cut-off ' + C.poolThreshold(S) + '</div>' + (S.season.champsQualified ? '<div class="good mt">Qualified: ' + h(S.season.champsReason) + '</div>' : '')) + '</div>';
    return o;
  } };
  UI.A.register = id => { if (!UI.err(G.Career.register(G.S, id))) { UI.toast('Registered', 'good'); UI.render(); } };
  UI.A.withdraw = id => UI.confirm('Withdraw?', 'You get 50% of the fee back.', 'Withdraw', () => { G.Career.withdraw(G.S, id); UI.render(); });
  UI.A.regScrim = () => { const S = G.S; if (S.money < D.FEES.scrimmage) return UI.err('Not enough money'); G.Career.spend(S, D.FEES.scrimmage, 'Week 0 scrimmage'); S.scrimmage = true; UI.render(); };
  UI.A.regOff = id => { if (!UI.err(G.Career.registerOffseason(G.S, id))) UI.render(); };

  // =====================================================================
  // HISTORY
  // =====================================================================
  UI.S.history = { html() {
    const S = G.S;
    let o = '<h1>History</h1><div class="sub">Legacy points: ' + S.legacy + '</div>';
    const bn = G.Career.banners(S);
    o += UI.card('Banner wall ' + UI.tag(bn.length + ' banner' + (bn.length === 1 ? '' : 's'), bn.length ? 'acc' : ''), bn.length ? UI.bannerWall(bn) : '<p class="muted">No banners yet. Win an event or the Impact Award to hang your first blue banner.</p>', '', 'mb');
    S.history.slice().reverse().forEach(hs => {
      o += UI.card(hs.year + ' ' + h(G.Seasons[hs.year].name) + (hs.worldChamp ? ' ' + UI.tag('WORLD CHAMPIONS', 'acc') : hs.divWin ? ' ' + UI.tag('Division winner', 'acc') : hs.champs ? ' ' + UI.tag('Championship', 'good') : ''),
        '<table class="t"><tr><th>Event</th><th>Rank</th><th>Record</th><th>Playoffs</th><th>Awards</th></tr>' + hs.events.map(e => '<tr><td>' + h(e.name) + '</td><td>' + (e.rank ? e.rank + '/' + e.size : '—') + '</td><td>' + h(e.record) + '</td><td>' + h(e.finish) + '</td><td class="sm">' + h(e.awardNames.join(', ')) + '</td></tr>').join('') + '</table><div class="sm muted mt">Legacy +' + hs.legacy + ' · avg RP ' + hs.avgRP.toFixed(2) + ' · ended with ' + U.money(hs.money) + '</div>', '', 'mb');
    });
    return o;
  } };
})();

</script>
<script>/* js/ui/screens-event.js */
'use strict';
/* FRC Manager — event screens: hub, practice, quals, alliance selection, playoffs, pre-match, live match, results */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI;
  const Ev = () => G.S.event;
  const me = () => G.S.team.num;
  const tname = n => n === me() ? G.S.team.name : (G.S.teams[n] ? G.S.teams[n].name : '');
  const tlink = (n) => '<a href="#" data-act="scoutTeam" data-arg="' + n + '" class="' + (n === me() ? 'b' : '') + '" style="' + (n === me() ? 'color:var(--accent2)' : 'color:inherit') + '">' + n + '</a>';

  // =====================================================================
  // EVENT HUB
  // =====================================================================
  UI.S.event = { nav: 'event', html() {
    const S = G.S, ev = Ev();
    if (!ev) return '<h1>Event</h1><p class="muted">No active event.</p><button class="btn" data-act="nav" data-arg="hq">Back to HQ</button>';
    const K = G.Ev.KIND[ev.kind], rk = ev.rank[me()];
    let o = '<div class="row"><div><h1>' + h(ev.name) + '</h1><div class="sub">' + h(K.name) + (ev.week ? ' · Week ' + ev.week : '') + ' · ' + ev.teams.length + ' teams · ' + ev.year + ' ' + h(G.Seasons[ev.year].name) + '</div></div><span class="sp"></span>' +
      (rk && rk.played ? '<div class="kpi"><span class="v xl">' + U.ord(G.Ev.rankOf(ev, me())) + '</span><span class="l">Rank · ' + rk.w + '-' + rk.l + '-' + rk.t + ' · ' + (rk.rp / rk.played).toFixed(2) + ' RS</span></div>' : '') + '</div>';
    const stages = ['practice', 'quals', 'selection', 'playoffs', 'done'];
    o += '<div class="row wrap mb">' + stages.filter(s => !(ev.kind === 'scrimmage' && (s === 'selection' || s === 'playoffs')) && !(ev.kind === 'einstein' && (s === 'practice' || s === 'quals' || s === 'selection'))).map(s => UI.tag(s.toUpperCase(), s === ev.stage ? 'acc' : stages.indexOf(s) < stages.indexOf(ev.stage) ? 'good' : '')).join(' ') + '</div>';
    if (ev.stage === 'practice') o += practiceView(ev);
    else if (ev.stage === 'quals') o += qualsView(ev);
    else if (ev.stage === 'selection') o += selectionView(ev);
    else if (ev.stage === 'playoffs') o += playoffView(ev);
    else o += doneView(ev);
    if (ev.stage !== 'done' && S.robot) o += pitCard(ev);
    if (ev.stage !== 'practice' && ev.kind !== 'einstein') o += tabs(ev);
    return o;
  } };

  // ---------------- pit crew: condition + spare parts at event prices ----------------
  function pitCard(ev) {
    const S = G.S, R = S.robot, C = G.Career;
    const up = C.spareUnitPrice(S, true), home = C.spareUnitPrice(S, false);
    const conds = Object.keys(R.subs).filter(k => k !== 'soft' && R.subs[k].ver)
      .map(k => UI.stat(G.Seasons.sub(R.year, k).name, R.subs[k].cond, null, UI.colorFor(R.subs[k].cond))).join('');
    return '<div class="card mt"><div class="ct">Pit crew<span class="sp"></span>' + UI.tag(S.parts.spares + ' spare parts', S.parts.spares ? '' : 'bad') + '</div>' +
      '<div class="grid g2"><div>' + (conds || '<p class="muted">Nothing built yet.</p>') + '</div><div class="col">' +
      '<div class="sm muted">Before each match the pit crew repairs the robot. One spare part restores about ' + D.SPARE_COND_PER_UNIT + ' condition points. With no spares left, repairs stop at 60%.</div>' +
      '<div class="row wrap gap4">' + [2, 5, 10].map(n => '<button class="btn sm" data-act="buySparesEvent" data-arg="' + n + '">Buy ' + n + ' · ' + U.money(n * up) + '</button>').join('') + '</div>' +
      '<div class="xs muted">Event price ' + U.money(up) + ' per spare (rush delivery to the pits). Between events they cost ' + U.money(home) + ' in the Workshop.</div></div></div></div>';
  }
  UI.A.buySparesEvent = function (n) {
    if (UI.err(G.Career.buySpares(G.S, Number(n), true))) return;
    UI.toast('Bought ' + n + ' spare parts', 'good');
    G.Save.write('auto');
    UI.render();
  };

  function practiceView(ev) {
    const S = G.S;
    let o = '';
    if (ev.inspection && ev.inspection.notes.length) o += '<div class="warnbox mb">' + ev.inspection.notes.map(h).join('<br>') + '</div>';
    if (ev.arrival && ev.arrival.cond != null && ev.practice.used.length === 0) o += '<div class="' + (ev.arrival.cond < 99 ? 'warnbox' : 'hint') + ' mb">Robot arrived at <b>' + ev.arrival.cond + '%</b> condition.' + (ev.arrival.notes.length ? ' ' + ev.arrival.notes.map(h).join(' ') : '') + (ev.arrival.cond < 99 ? ' The pit crew can repair it between matches with spare parts.' : '') + '</div>';
    o += '<div class="grid g2"><div class="card"><div class="ct">Practice day — block ' + (ev.practice.used.length + 1) + ' of ' + ev.practice.blocks + '</div>';
    const mustLighten = ev.inspection && !ev.inspection.ok;
    o += '<div class="col">' + (mustLighten ? '<button class="btn primary" data-act="practice" data-arg="lighten">Emergency lightening (required to pass inspection)</button>' :
      G.Ev.PRACTICE.map(p => '<button class="btn" data-act="practice" data-arg="' + p.id + '" style="text-align:left"><b>' + h(p.name) + '</b> <span class="xs muted">' + h(p.desc) + (p.id === 'install' ? ' (' + S.robot.pending.length + ' pending)' : '') + '</span></button>').join('')) + '</div>';
    o += '<div class="row mt"><span class="sp"></span><button class="btn sm" data-act="skipPractice">Auto-pick remaining blocks</button></div></div>';
    o += '<div class="card"><div class="ct">Readiness</div>' + UI.stat('Robot tuning', ev.tune * 100) + UI.stat('Driver confidence', ev.conf * 100) + UI.stat('Auto bonus', ev.tuneAuto * 500) +
      UI.stat('Condition', G.Robot.condAvg(S), null, UI.colorFor(G.Robot.condAvg(S))) + '<div class="sm muted mt">Batteries ' + S.parts.batts.length + ' (' + Math.round(G.Shop.fleetHealth(S) * 100) + '% health) · spares ' + S.parts.spares + ' · weight ' + G.Robot.weight(S) + ' lb</div>' +
      (ev.log.length ? '<div class="hr"></div>' + ev.log.slice(-6).map(l => '<div class="sm">• ' + h(l) + '</div>').join('') : '') + '</div></div>';
    return o;
  }
  UI.A.practice = function (p) { const ev = Ev(); const out = G.Ev.doPractice(ev, p); out.forEach(x => ev.log.push(x)); UI.toast(out.join(' '), 'good'); G.Save.write('auto'); UI.render(); };
  UI.A.skipPractice = function () { G.Ev.skipPractice(Ev()); UI.render(); };

  function matchTeamsLine(mt) {
    return '<span class="pill-red">' + mt.red.map(tlink).join(' ') + '</span> vs <span class="pill-blue">' + mt.blue.map(tlink).join(' ') + '</span>';
  }
  function qualsView(ev) {
    const left = G.Ev.playerMatchesLeft(ev);
    const next = ev.quals.slice(ev.qi).find(G.Ev.hasPlayer);
    let o = '<div class="grid g2"><div class="card hl"><div class="ct">Qualification matches ' + UI.tag(left + ' left for you', 'acc') + '</div>';
    if (next) {
      const gap = ev.quals.indexOf(next) - ev.qi;
      o += '<div class="mb">Next: <b>Qual ' + next.n + '</b> ' + matchTeamsLine(next) + '</div><div class="sm muted mb">' + (gap > 0 ? gap + ' other match' + (gap > 1 ? 'es' : '') + ' before yours (pit time for repairs).' : 'You\'re up next.') + '</div>' +
        '<div class="row wrap"><button class="btn primary" data-act="nextQual">Prepare match ▶</button><button class="btn" data-act="simQual">Simulate it</button><button class="btn" data-act="simAllQuals">Simulate all remaining</button></div>';
    } else o += '<p>All your qualification matches are done.</p><button class="btn primary" data-act="finishQuals">Continue</button>';
    o += '</div><div class="card"><div class="ct">Your results</div>' + resultsList(ev) + '</div></div>';
    return o;
  }
  function resultsList(ev) {
    if (!ev.playerResults.length) return '<p class="muted">No matches yet.</p>';
    return '<table class="t"><tr><th>Match</th><th class="num">Score</th><th>Result</th><th class="num">RP</th><th>Faults</th></tr>' + ev.playerResults.map(r => '<tr><td>' + h(r.id) + '</td><td class="num">' + r.our + '–' + r.their + '</td><td class="' + (r.win === 1 ? 'good' : r.win === 0 ? 'bad' : 'warn') + '">' + (r.win === 1 ? 'W' : r.win === 0 ? 'L' : 'T') + '</td><td class="num">' + (String(r.id).startsWith('Q') ? r.rp : '—') + '</td><td class="xs warn">' + h(r.faults.join(', ')) + '</td></tr>').join('') + '</table>';
  }
  function prepQual(ev, mt) { if (!mt.prepped) { G.Career.beforePlayerMatch(G.S, ev); mt.prepped = true; } UI.st.match = { kind: 'qual', mt }; }
  UI.A.nextQual = function () {
    const ev = Ev(); const mt = G.Ev.advanceQuals(ev);
    if (!mt) { UI.render(); return; }
    prepQual(ev, mt); UI.go('prematch');
  };
  UI.A.simQual = function () {
    const ev = Ev(); const mt = G.Ev.advanceQuals(ev);
    if (!mt) { UI.render(); return; }
    prepQual(ev, mt);
    const res = G.Ev.runHeadless(ev, mt);
    G.Ev.completePlayerQual(ev, res);
    UI.st.lastResult = { res, obj: mt, kind: 'qual' };
    G.Save.write('auto');
    UI.go('mresult');
  };
  UI.A.simAllQuals = function () { const ev = Ev(); G.Ev.simRestQuals(ev); G.Save.write('auto'); UI.render(); };
  UI.A.finishQuals = function () { const ev = Ev(); G.Ev.advanceQuals(ev); UI.render(); };

  // ---------------- selection ----------------
  function selectionView(ev) {
    const sel = ev.sel;
    let o = '<div class="grid ' + (sel.pending && sel.pending.type === 'pick' ? 'g12' : 'g2') + '"><div class="card"><div class="ct">Alliances</div><table class="t"><tr><th>#</th><th>Captain</th><th>1st pick</th><th>2nd pick</th></tr>';
    for (let k = 0; k < 8; k++) { const a = sel.alliances[k] || []; o += '<tr class="' + (a.includes(me()) ? 'me' : '') + '"><td>' + (k + 1) + '</td><td>' + (a[0] ? tlink(a[0]) : '') + '</td><td>' + (a[1] ? tlink(a[1]) : '') + '</td><td>' + (a[2] ? tlink(a[2]) : '') + '</td></tr>'; }
    o += '</table>' + (sel.log.length ? '<div class="xs muted mt">' + sel.log.slice(-5).map(h).join('<br>') + '</div>' : '') + '</div><div class="card hl">';
    if (sel.pending && sel.pending.type === 'invite') {
      const p = sel.pending, rank = G.Ev.rankOf(ev, p.from);
      o += '<div class="ct">Invitation!</div><p>Alliance <b>' + (p.k + 1) + '</b> captain <b>' + p.from + ' ' + h(tname(p.from)) + '</b> (ranked ' + U.ord(rank) + ', OPR ' + (G.Ev.opr(ev)[p.from] || 0) + ') invites you to join.</p><p class="sm muted">Declining means no other alliance can pick you — you only play playoffs if you become a captain yourself.</p>' +
        '<div class="row"><button class="btn primary" data-act="selRespond" data-arg="1">Accept</button><button class="btn bad" data-act="selRespond" data-arg="0">Decline</button></div>';
    } else if (sel.pending && sel.pending.type === 'pick') {
      o += '<div class="ct">Your pick — Alliance ' + (sel.pending.k + 1) + ' (' + (sel.round === 1 ? 'first' : 'second') + ' round)</div>' + (sel.pending.declinedMsg ? '<div class="warnbox mb">' + h(sel.pending.declinedMsg) + '</div>' : '') + pickTable(ev);
    } else if (sel.done) o += '<p>Alliance selection complete.</p>';
    else o += '<p class="muted">Waiting…</p>';
    o += '</div></div>';
    return o;
  }
  // ---- scouting data cells (observed in this event's qualification matches) ----

  UI.S.live = { nav: 'event', html() {
    const ev = Ev(), obj = curMatchObj();
    if (!obj) return '<p>No match.</p>';
    const Sz = G.Seasons[ev.year];
    const a = obj.red.includes(me()) ? 'red' : 'blue', o2 = a === 'red' ? 'blue' : 'red';
    const callBtn = (kind, value, label, cls) => '<button class="btn sm ' + (cls || '') + '" data-act="call" data-arg="' + kind + '|' + value + '">' + h(label) + '</button>';
    let calls = '<div class="col">' +
      '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Pace</span>' + callBtn('pace', 'push', 'Push') + callBtn('pace', 'bal', 'Balanced') + callBtn('pace', 'cons', 'Conserve') + '</div>' +
      '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Role</span>' + callBtn('role', 'score', 'Score') + obj[o2].map(t => callBtn('role', 'defend:' + t, 'Defend ' + t)).join('') + (ev.year === 2026 ? callBtn('role', 'feed', 'Feed') : '') + '</div>' +
      '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Target</span>' + Sz.coachTargets.map(t => callBtn('target', t.id, t.name)).join('') + '</div>' +
      '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Endgame</span>' + callBtn('endNow', '1', 'Go now') + callBtn('endTiming', 'late', 'Go late') + Sz.endNames.map((n, i) => i > 0 ? callBtn('endLevel', i, 'Aim ' + n) : '').join('') + '</div>' +
      partnerRow(ev, obj, a, callBtn) +
      '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Other</span>' + callBtn('rp', '1', 'Chase bonus RP') + callBtn('rp', '0', 'Just win') + callBtn('avoid', '1', 'Avoid contact') + callBtn('avoid', '0', 'Allow contact') + callBtn('reset', '1', 'Reset robot!', 'bad') + '</div></div>';
    return '<div class="scorebar"><div class="score r" id="scR">0</div><div class="clock"><div class="t" id="clk">0:00</div><div class="p" id="phs">AUTO</div></div><div class="score b" id="scB">0</div></div>' +
      '<div class="matchview"><div><div class="card" style="padding:10px"><div class="ct sm">Your robot</div><div id="myBox"></div></div><div class="card mt" style="padding:10px"><div class="ct sm">Robots</div><div id="robBox"></div></div></div>' +
      '<div><div class="fieldwrap"><canvas id="fieldCv" width="1100" height="547"></canvas></div>' +
      '<div class="card mt" style="padding:10px"><div class="row mb"><b>Coach Calls</b> <span class="tag acc" id="callsLeft"></span><span class="sp"></span><div class="row gap4" id="spd">' +
      ['0', '1', '2', '4', '8'].map(s => '<button class="btn sm" data-act="spd" data-arg="' + s + '">' + (s === '0' ? '❚❚' : s + '×') + '</button>').join('') + '<button class="btn sm" data-act="skipLive">Skip ⏭</button></div></div>' + calls + '<div class="row mt"><span class="sp"></span><button class="btn primary hidden" id="liveDone" data-act="liveDone">Results ▶</button></div></div></div>' +
      '<div><div class="card" style="padding:10px"><div class="ct sm">Ranking points</div><div id="rpBox"></div></div><div class="card mt" style="padding:10px"><div class="ct sm">Match log</div><div class="log" id="logBox"></div></div></div></div>';
  }, after() { UI.startLive(); } };

  UI.startLive = function () {
    const ev = Ev(), c = UI.st.match, obj = curMatchObj();
    if (!obj) return;
    const m = G.Ev.buildEngine(ev, obj, { headless: false });
    const cv = document.getElementById('fieldCv');
    UI.live = { m, c, obj, ev, speed: UI.prefs.speed || 2, acc: 0, last: 0, raf: 0, domT: 0, cv, ctx: cv.getContext('2d'), a: obj.red.includes(me()) ? 'red' : 'blue', recorded: false };
    markSpeed();
    UI.live.raf = requestAnimationFrame(loop);
  };
  UI.stopLive = function () { if (UI.live) { cancelAnimationFrame(UI.live.raf); UI.live = null; } };
  function loop(ts) {
    const L = UI.live; if (!L) return;
    if (!L.last) L.last = ts;
    const dt = Math.min(0.1, (ts - L.last) / 1000); L.last = ts;
    if (L.speed > 0 && !L.m.done) {
      L.acc += dt * L.speed;
      let n = 0;
      while (L.acc >= 0.1 && !L.m.done && n < 200) { G.Engine.step(L.m); L.acc -= 0.1; n++; }
    }
    draw(L);
    if (ts - L.domT > 180 || L.m.done) { dom(L); L.domT = ts; }
    if (L.m.done) { const b = document.getElementById('liveDone'); if (b) b.classList.remove('hidden'); }
    L.raf = requestAnimationFrame(loop);
  }
  function aimFor(m, r) {
    if (m.year === 2022) return m.hub; if (m.year === 2024) return m.spk[r.a]; if (m.year === 2026) return m.hub[r.a]; return null;
  }
  function draw(L) {
    const m = L.m, ctx = L.ctx, s = L.cv.width / G.Engine.FW;
    G.Render.field(ctx, m.year, s, m);
    const al = m.done ? 1 : U.clamp(L.acc / 0.1, 0, 1);
    m.robots.forEach(r => {
      const rr = Object.create(r);
      rr.x = r.px + (r.x - r.px) * al; rr.y = r.py + (r.y - r.py) * al;
      if (r.isPlayer) rr.look = Object.assign({}, r.look);
      const g = aimFor(m, r);
      G.Render.robot(ctx, s, rr, { aim: g ? Math.atan2(g.y - rr.y, g.x - rr.x) : null, year: m.year });
    });
    G.Render.fx(ctx, s, m);
  }
  function dom(L) {
    const m = L.m, $ = id => document.getElementById(id);
    if (!$('scR')) return;
    const sr = m.score.red, sb = m.score.blue;
    const tot = s => s.auto + s.tele + s.end + s.foul;
    $('scR').textContent = tot(sr); $('scB').textContent = tot(sb);
    const tl = m.phase === 'auto' ? m.T.auto - m.t : m.total - m.t;
    $('clk').textContent = U.fmtTime(tl);
    let ph = m.done ? 'FINAL' : m.phase === 'auto' ? 'AUTONOMOUS' : m.inEnd ? 'ENDGAME' : 'TELEOP';
    if (m.year === 2026 && !m.done) { const si = G.Rules[2026].shiftInfo(m); ph = si.name + ' · ' + (G.Rules[2026].active(m, 'red') ? 'RED' : '') + (G.Rules[2026].active(m, 'blue') ? ' BLUE' : '') + ' active'; }
    $('phs').textContent = ph;
    const meR = m.robots.find(r => r.isPlayer);
    if (meR) {
      const H = G.Engine.PACE[meR.plan.pace].name;
      $('myBox').innerHTML = '<div class="rbox me"><div class="hd"><span>' + meR.team + '</span><span class="xs">' + h(H) + '</span></div><div class="b">' + h(meR.label || '') + '</div><div class="xs muted">Holding: ' + (meR.held || 0) + (meR.heldType ? ' ' + meR.heldType : '') + ' · role ' + h(meR.plan.role) + ' · target ' + h(meR.plan.target) + '</div>' +
        '<div class="xs muted">Points: ' + meR.stats.pts + ' · shots ' + meR.stats.hits + '/' + meR.stats.shots + '</div>' + (meR.stats.faults.length ? '<div class="xs warn">' + h(meR.stats.faults.join(', ')) + '</div>' : '') + '</div>';
    }
    $('robBox').innerHTML = m.robots.filter(r => !r.isPlayer).map(r => '<div class="rbox"><div class="hd"><span class="' + r.a + '">' + r.team + '</span><span class="xs muted">' + r.stats.pts + ' pts</span></div><div class="xs">' + h(r.label || '') + '</div></div>').join('');
    const R = m.R;
    const bon = a => R.bonus(m, a).map(b => '<div class="rp-item"><div class="row"><span>' + h(b.name) + '</span><span class="sp"></span><span class="' + (b.ok ? 'good b' : 'muted') + '">' + b.val + '/' + b.thr + (b.ok ? ' ✔' : '') + '</span></div>' + UI.bar(b.val, b.thr, a === 'red' ? 'var(--red)' : 'var(--blue)') + '</div>').join('');
    const hud = a => (R.hud ? R.hud(m, a) : []).map(x => UI.tag(x, a === 'red' ? 'bad' : 'info')).join(' ');
    $('rpBox').innerHTML = '<div class="xs red b mb">RED ' + hud('red') + '</div>' + bon('red') + '<div class="hr"></div><div class="xs blue b mb">BLUE ' + hud('blue') + '</div>' + bon('blue');
    $('logBox').innerHTML = m.log.slice(-60).reverse().map(l => '<div class="' + l.kind + '"><span class="dim">' + U.fmtTime(l.t) + '</span> ' + h(l.msg) + '</div>').join('');
    const left = m.calls - m.callsUsed;
    $('callsLeft').textContent = left + ' left';
    document.querySelectorAll('[data-act="call"]').forEach(b => b.disabled = left <= 0 || m.done);
  }
  function markSpeed() { const L = UI.live; document.querySelectorAll('#spd [data-act="spd"]').forEach(b => b.classList.toggle('sel', Number(b.dataset.arg) === (L ? L.speed : -1))); }
  UI.A.spd = s => { if (!UI.live) return; UI.live.speed = Number(s); if (Number(s) > 0) { UI.prefs.speed = Number(s); G.Save.saveSettings(UI.prefs); } markSpeed(); };
  UI.A.skipLive = () => { const L = UI.live; if (!L) return; G.Engine.run(L.m); L.acc = 0; };
  // Playoffs only: an alliance captain can call partners to score or defend (costs a Coach Call each).
  function isCaptain(ev) {
    const c = UI.st.match, pa = G.Ev.playerAlliance(ev);
    return !!(c && c.kind === 'po' && pa >= 0 && ev.alliances[pa][0] === me());
  }
  function partnerRow(ev, obj, a, callBtn) {
    if (!(UI.st.match && UI.st.match.kind === 'po')) return '';
    if (!isCaptain(ev)) return '<div class="xs dim">Only the alliance captain can make calls to partners.</div>';
    return '<div class="row wrap gap4"><span class="xs muted" style="width:62px">Partners</span>' +
      obj[a].filter(t => t !== me()).map(t => callBtn('partner', t + ':score', t + ': score') + callBtn('partner', t + ':defend', t + ': defend')).join('') + '</div>';
  }
  UI.A.call = function (arg) {
    const L = UI.live; if (!L) return;
    let [kind, value] = arg.split('|');
    if (kind === 'partner') {
      if (!isCaptain(L.ev)) return UI.toast('Only the alliance captain can call partners.', 'bad');
      const [t, role] = value.split(':');
      const ok = G.Engine.call(L.m, Number(t), { kind: 'role', value: { role }, text: 'Partner ' + t + ': ' + (role === 'defend' ? 'play defense' : 'score') });
      if (!ok) UI.toast('No coach calls left', 'bad');
      dom(L); return;
    }
    let text = kind + ' ' + value, v = value;
    if (kind === 'role') { if (value.startsWith('defend:')) { v = { role: 'defend', target: Number(value.split(':')[1]) }; text = 'Defend ' + value.split(':')[1]; } else { v = { role: value }; text = value === 'feed' ? 'Feed' : 'Score'; } }
    else if (kind === 'pace') text = 'Pace: ' + G.Engine.PACE[value].name;
    else if (kind === 'target') { const t = G.Seasons[L.m.year].coachTargets.find(x => x.id === value); text = 'Target: ' + (t ? t.name : value); }
    else if (kind === 'endNow') text = 'Go to endgame now';
    else if (kind === 'endTiming') text = 'Endgame: go late';
    else if (kind === 'endLevel') { v = Number(value); text = 'Endgame: aim ' + G.Seasons[L.m.year].endNames[v]; }
    else if (kind === 'rp' || kind === 'avoid') { v = value === '1'; text = kind === 'rp' ? (v ? 'Chase bonus RP' : 'Just win') : (v ? 'Avoid contact' : 'Allow contact'); }
    else if (kind === 'reset') text = 'Reset the robot!';
    const ok = G.Engine.call(L.m, me(), { kind, value: v, text });
    if (!ok) UI.toast('No coach calls left', 'bad');
    dom(L);
  };
  UI.A.liveDone = function () {
    const L = UI.live; if (!L || !L.m.done || L.recorded) return;
    L.recorded = true;
    const res = L.m.result, ev = L.ev, c = L.c, obj = L.obj;
    UI.stopLive();
    recordResult(ev, c, obj, res);
  };

  // =====================================================================
  // MATCH RESULT
  // =====================================================================
  UI.S.mresult = { nav: 'event', html() {
    const R = UI.st.lastResult; if (!R) return '<button class="btn" data-act="nav" data-arg="event">Back</button>';
    const res = R.res, obj = R.obj, a = obj.red.includes(me()) ? 'red' : 'blue', o2 = a === 'red' ? 'blue' : 'red';
    const w = res[a].win;
    const ev = Ev();
    let o = '<div class="row"><div><div class="xs muted">' + (R.kind === 'qual' ? 'QUALIFICATION ' + obj.n : 'PLAYOFF ' + obj.id) + '</div><h1 class="' + (w === 1 ? 'good' : w === 0 ? 'bad' : 'warn') + '" style="font-size:34px">' + (w === 1 ? 'VICTORY' : w === 0 ? 'DEFEAT' : 'TIE') + '</h1></div><span class="sp"></span><div class="score r">' + res.red.score + '</div><div class="score b">' + res.blue.score + '</div></div>';
    o += '<div class="grid g2 mt"><div class="card"><div class="ct">Score breakdown</div><table class="t"><tr><th></th><th class="num red">Red</th><th class="num blue">Blue</th></tr>' +
      [['Auto', 'auto'], ['Teleop', 'tele'], ['Endgame', 'end'], ['Fouls received', 'foul'], ['Total', 'score']].map(x => '<tr><td>' + x[0] + '</td><td class="num">' + res.red[x[1]] + '</td><td class="num">' + res.blue[x[1]] + '</td></tr>').join('') + '</table>' +
      (R.kind === 'qual' ? '<div class="hr"></div><div class="b">You earned ' + res[a].rp + ' RP</div>' + res[a].bonus.map(b => '<div class="sm">' + (b.ok ? '<span class="good">✔</span> ' : '<span class="dim">✘</span> ') + h(b.name) + ' <span class="muted">(' + b.val + '/' + b.thr + ')</span></div>').join('') : '') + '</div>';
    o += '<div class="card"><div class="ct">Robots</div><table class="t"><tr><th>Team</th><th class="num">Pts</th><th class="num">Cycles</th><th class="num">Acc</th><th>Endgame</th><th>Issues</th></tr>' + res.robots.map(r => '<tr class="' + (r.team === me() ? 'me' : '') + '"><td class="' + r.a + '">' + r.team + '</td><td class="num">' + r.pts + '</td><td class="num">' + r.cycles + '</td><td class="num">' + (r.shots ? Math.round(100 * r.hits / r.shots) + '%' : '—') + '</td><td class="xs">' + (r.end ? (r.end.lvl ? G.Seasons[ev ? ev.year : G.S.year].endNames[r.end.lvl] : r.end.failed ? 'failed' : 'park') : '—') + '</td><td class="xs warn">' + h(r.faults.concat(r.fouls ? [r.fouls + ' foul' + (r.fouls > 1 ? 's' : '')] : []).join(', ')) + (r.autoOK === false ? ' <span class="dim">auto miss</span>' : '') + '</td></tr>').join('') + '</table></div></div>';
    if (G.S.robot) { const RB = G.S.robot; o += '<div class="card mt"><div class="ct">Robot condition after the match</div><div class="grid g3">' + Object.keys(RB.subs).filter(k => k !== 'soft' && RB.subs[k].ver).map(k => UI.stat(G.Seasons.sub(RB.year, k).name, RB.subs[k].cond, null, UI.colorFor(RB.subs[k].cond))).join('') + '</div><div class="xs muted">Pit repairs happen automatically before your next match (more time between matches = more repairs; uses spare parts).</div></div>'; }
    o += '<div class="row mt"><span class="sp"></span><button class="btn primary lg" data-act="nav" data-arg="event">Continue ▶</button></div>';
    return o;
  } };
})();

</script>
<script>/* js/ui/screens-menu.js */
'use strict';
/* FRC Manager — main menu, new game setup, load, help, settings, season review, career summary */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI;

  // =====================================================================
  // MAIN MENU
  // =====================================================================
  UI.S.menu = { full: true, html() {
    const auto = G.Save.meta('auto');
    return '<div class="menu-wrap"><div class="menu-box"><div class="logo">FRC <span>MANAGER</span></div><div class="muted mb">Run a FIRST Robotics Competition team across five seasons — 2022 to 2026. Unofficial fan game.</div>' +
      '<div class="grid g3 mt">' +
      '<div class="choice" data-act="newGame" data-arg="career"><div class="lg b">New Career</div><div class="sm muted">Five seasons, real or random order. Build a program that learns from every robot.</div></div>' +
      '<div class="choice" data-act="newGame" data-arg="single"><div class="lg b">Single Season Challenge</div><div class="sm muted">Pick one game and a scenario. Graded S to D.</div></div>' +
      '<div class="choice" data-act="continueGame" ' + (auto ? '' : 'style="opacity:.5"') + '><div class="lg b">Continue</div><div class="sm muted">' + (auto ? h(auto.team.num + ' ' + auto.team.name + ' · ' + auto.year + ' · ' + new Date(auto.savedAt).toLocaleString()) : 'No autosave yet') + '</div></div>' +
      '</div><div class="row mt wrap"><button class="btn" data-act="nav" data-arg="load">Load / import</button><button class="btn" data-act="nav" data-arg="help">How to play</button><button class="btn" data-act="nav" data-arg="notes">What\'s new in v' + h(G.VERSION) + '</button></div>' +
      '<div class="grid g5 mt">' + G.SEASON_YEARS.map(y => '<div class="card flat"><div class="xs muted">' + y + '</div><div class="b">' + h(G.Seasons[y].name) + '</div><canvas data-prev="' + y + '" width="330" height="164" style="width:100%;border-radius:6px;margin-top:6px"></canvas><div class="xs muted mt">' + h(G.Seasons[y].tagline) + '</div></div>').join('') + '</div>' +
      '<p class="xs dim mt">Version ' + h(G.VERSION) + ' · Not affiliated with or endorsed by FIRST®, Formula 1® or Frontier Developments. Sponsors, regionals and teams are fictional; team numbers are random.</p></div></div>';
  }, after() { document.querySelectorAll('canvas[data-prev]').forEach(c => G.Render.preview(c, Number(c.dataset.prev))); } };
  UI.A.continueGame = () => { if (G.Save.load('auto')) { UI.go(G.S.phase === 'end' ? 'end' : G.S.event ? 'event' : 'hq'); } else UI.toast('No autosave found', 'bad'); };

  // =====================================================================
  // NEW GAME
  // =====================================================================
  UI.A.newGame = function (mode) {
    const rng = G.makeRng(Date.now() & 0xffffff);
    UI.st.ng = { mode, num: rng.int(1000, 9999), name: D.teamName(rng), school: rng.pick(D.SCHOOLS) + ' High School', c1: '#f5b800', c2: '#111111', region: 'Midwest',
      profile: mode === 'single' ? 'established' : 'established', diff: 'normal', order: 'real', year: 2026, scenario: 'custom' };
    UI.go('newgame');
  };
  UI.S.newgame = { full: true, html() {
    const n = UI.st.ng;
    const inp = (k, lbl, type) => '<label class="f">' + lbl + '<input class="inp" type="' + (type || 'text') + '" value="' + h(n[k]) + '" data-chg="ng" data-k="' + k + '"></label>';
    const choice = (k, v, title, desc) => '<div class="choice ' + (n[k] === v ? 'on' : '') + '" data-act="ngSet" data-arg="' + k + '|' + v + '"><div class="b">' + title + '</div>' + (desc ? '<div class="xs muted">' + desc + '</div>' : '') + '</div>';
    let o = '<div class="menu-wrap"><div class="menu-box"><div class="row"><div class="logo" style="font-size:28px">' + (n.mode === 'career' ? 'New Career' : 'Single Season Challenge') + '</div><span class="sp"></span><button class="btn" data-act="nav" data-arg="menu">Back</button></div>';
    if (n.mode === 'single') {
      o += '<h3 class="mt">Season</h3><div class="grid g4" style="grid-template-columns:repeat(5,minmax(0,1fr))">' + G.SEASON_YEARS.map(y => choice('year', y, y + ' ' + G.Seasons[y].name, G.Seasons[y].tagline)).join('') + '</div>';
      o += '<h3 class="mt">Scenario</h3><div class="grid g4">' + D.SCENARIOS.map(s => choice('scenario', s.id, s.name, s.goalText + ' (' + D.PROFILES[s.profile].name + ')')).join('') + '</div>';
    }
    o += '<h3 class="mt">Your team</h3><div class="grid g4">' + inp('num', 'Team number', 'number') + inp('name', 'Team name') + inp('school', 'School / organisation') +
      '<label class="f">Home region<select class="inp" data-chg="ng" data-k="region">' + D.REGIONS.map(r => '<option ' + (n.region === r ? 'selected' : '') + '>' + r + '</option>').join('') + '</select></label>' +
      '<label class="f">Primary colour<input class="inp" type="color" value="' + h(n.c1) + '" data-chg="ng" data-k="c1"></label><label class="f">Secondary colour<input class="inp" type="color" value="' + h(n.c2) + '" data-chg="ng" data-k="c2"></label></div>';
    if (n.mode === 'career' || n.scenario === 'custom') {
      o += '<h3 class="mt">Starting profile</h3><div class="grid g3">' + Object.keys(D.PROFILES).map(k => { const P = D.PROFILES[k]; return choice('profile', k, P.name + ' — ' + U.money(P.money), P.desc + ' ' + P.students + ' students, ' + P.mentors.length + ' mentors.'); }).join('') + '</div>';
    }
    o += '<h3 class="mt">Difficulty</h3><div class="grid g3">' + choice('diff', 'easy', 'Easy', 'Weaker opponents, fewer faults, more sponsor money.') + choice('diff', 'normal', 'Normal', 'The intended experience.') + choice('diff', 'hard', 'Hard', 'Stronger opponents, more faults, stingy sponsors.') + '</div>';
    if (n.mode === 'career') o += '<h3 class="mt">Season order</h3><div class="grid g2">' + choice('order', 'real', 'Real order', '2022 → 2023 → 2024 → 2025 → 2026') + choice('order', 'random', 'Random order', 'All five games, shuffled. The next game is a surprise at each Kickoff.') + '</div>';
    o += '<div class="row mt"><span class="sp"></span><button class="btn primary lg" data-act="startGame">Start ▶</button></div></div></div>';
    return o;
  } };
  UI.A.ng = (v, el) => { UI.st.ng[el.dataset.k] = el.dataset.k === 'num' ? Math.max(1, Math.min(99999, Number(v) || 1)) : v; };
  UI.A.ngSet = arg => { const [k, v] = arg.split('|'); UI.st.ng[k] = k === 'year' ? Number(v) : v; if (k === 'scenario') { const s = D.SCENARIOS.find(x => x.id === v); UI.st.ng.profile = s.profile; } UI.render(); };
  UI.A.startGame = function () {
    const n = UI.st.ng;
    if (!String(n.name).trim()) return UI.toast('Give your team a name', 'bad');
    const scen = n.mode === 'single' ? D.SCENARIOS.find(s => s.id === n.scenario) : null;
    G.Career.newGame({ mode: n.mode, team: { num: Number(n.num), name: String(n.name).trim(), school: n.school, c1: n.c1, c2: n.c2, region: n.region },
      profile: scen && !scen.custom ? scen.profile : n.profile, diff: n.diff, order: n.order, year: n.year, scenario: scen ? scen.id : null });
    G.Save.write('auto');
    UI.go('hq');
    if (G.S.phase === 'kickoff') UI.kickoffModal();

<script>/* js/dev.js */
'use strict';
/* FRC Manager — developer balance tools. Run in the browser console: G.Dev.balTest(100) */
(function () {
  const Dev = G.Dev = {};
  Dev.balTest = function (n, years) {
    n = n || 100;
    const out = {};
    const rng = G.makeRng(42);
    const pool = G.AI.makePool(rng, 300, 99999, 2022);
    const teams = Object.values(pool);
    for (const year of (years || G.SEASON_YEARS)) {
      const res = { scores: [], rp: {}, faults: 0, robots: 0, fouls: 0, cyc: [], end: [], errs: [], elite: [], eliteRp: {} };
      for (let i = 0; i < n; i++) {
        try {
          const pick = () => G.AI.entry(teams[rng.int(0, teams.length - 1)], year, 0.95, 1, rng);
          const m = G.Engine.create({ year, red: [pick(), pick(), pick()], blue: [pick(), pick(), pick()], seed: rng.int(1, 1e9), headless: true });
          const r = G.Engine.run(m);
          res.scores.push(r.red.score, r.blue.score);
          ['red', 'blue'].forEach(a => r[a].bonus.forEach(b => { res.rp[b.key] = (res.rp[b.key] || 0) + (b.ok ? 1 : 0); }));
          r.robots.forEach(x => { res.faults += x.faults.length; res.robots++; res.fouls += x.fouls; res.cyc.push(x.cycles); res.end.push(x.end && x.end.lvl > 0 ? 1 : 0); });
        } catch (e) { res.errs.push(e.message + ' ' + (e.stack || '').split('\n')[1]); if (res.errs.length > 3) break; }
      }
      const top = teams.slice().sort((a, b) => b.str - a.str).slice(0, 6);
      for (let i = 0; i < 10; i++) {
        const p = j => G.AI.entry(top[j], year, 1.0, 1, rng);
        const m = G.Engine.create({ year, red: [p(0), p(1), p(2)], blue: [p(3), p(4), p(5)], seed: rng.int(1, 1e9), headless: true });
        const r = G.Engine.run(m); res.elite.push(r.red.score, r.blue.score);
        ['red', 'blue'].forEach(a => r[a].bonus.forEach(b => { res.eliteRp[b.key] = (res.eliteRp[b.key] || 0) + (b.ok ? 1 : 0); }));
      }
      const s = res.scores.sort((a, b) => a - b);
      out[year] = {
        avg: Math.round(G.U.avg(s)), p10: s[Math.floor(s.length * 0.1)], p50: s[Math.floor(s.length * 0.5)], p90: s[Math.floor(s.length * 0.9)], elite: Math.round(G.U.avg(res.elite)),
        rp: Object.entries(res.rp).map(([k, v]) => k + ' ' + (v / (2 * n)).toFixed(2)).join(', '), eliteRp: Object.entries(res.eliteRp).map(([k, v]) => k + ' ' + (v / 20).toFixed(2)).join(', '),
        faults: (res.faults / res.robots).toFixed(2), fouls: (res.fouls / res.robots).toFixed(2), cyc: G.U.avg(res.cyc).toFixed(1), climb: G.U.avg(res.end).toFixed(2), errs: res.errs.join(' ; ')
      };
    }
    return out;
  };

  // Performance probe: the player's robot + 2 fixed average partners vs 3 fixed average opponents, same seeds every time.
  Dev.probe = function (S, ev, n) {
    n = n || 40;
    const prng = G.makeRng(99), pool = Object.values(G.AI.makePool(prng, 120, 99999, ev.year)).sort((a, b) => Math.abs(a.str - 50) - Math.abs(b.str - 50)).slice(0, 5);
    const ent = (t, k) => Object.assign(G.AI.entry(t, ev.year, 1, 1, G.makeRng(1000 + k)), { plan: { role: 'score' } });
    const me = Object.assign({}, G.Robot.matchEntry(S, ev), { plan: { role: 'score' } });
    let tot = 0;
    for (let i = 0; i < n; i++) {
      const m = G.Engine.create({ year: ev.year, red: [me, ent(pool[0], 1), ent(pool[1], 2)], blue: [ent(pool[2], 3), ent(pool[3], 4), ent(pool[4], 5)], seed: 5000 + i, headless: true });
      tot += G.Engine.run(m).red.score;
    }
    return tot / n;
  };

  // Fault rates per robot-match by season, split by reliability and by whether the opponents ran a defender.
  // G.Dev.faultTest(150) → { 2023: { comms, commsDead, brown, tip, ... , byRel, defended } }
  Dev.faultTest = function (n, years) {
    n = n || 150;
    const out = {}, rng = G.makeRng(11), pool = Object.values(G.AI.makePool(rng, 300, 99999, 2022));
    const kind = f => /disabled/.test(f) ? 'commsDead' : /Comms/.test(f) ? 'comms' : /Brownout/.test(f) ? 'brown' : /TIPPED/.test(f) ? 'tip' : /jam/i.test(f) ? 'jam' : /broke/.test(f) ? 'broke' : f === 'Climb failed' ? 'climbFail' : 'other';
    for (const year of (years || G.SEASON_YEARS)) {
      const c = {}, rel = { low: [0, 0], mid: [0, 0], high: [0, 0] }, dfd = { yes: [0, 0], no: [0, 0] };
      let robots = 0;
      for (let i = 0; i < n; i++) {
        const pick = () => G.AI.entry(pool[rng.int(0, pool.length - 1)], year, 0.95, 1, rng);
        const red = [pick(), pick(), pick()].map(e => Object.assign({}, e, { plan: { role: 'score' } }));
        const blue = [pick(), pick(), pick()].map(e => Object.assign({}, e, { plan: { role: 'score' } }));
        const defend = i % 2 === 0;
        if (defend) blue[0].plan = { role: 'defend' };
        const r = G.Engine.run(G.Engine.create({ year, red, blue, seed: rng.int(1, 1e9), headless: true }));
        r.robots.forEach((x, j) => {
          robots++;
          const ks = x.faults.map(kind);
          ks.forEach(k => c[k] = (c[k] || 0) + 1);
          const cap = (j < 3 ? red[j] : blue[j - 3]).cap, comm = ks.some(k => k === 'comms' || k === 'commsDead') ? 1 : 0;
          const b = cap.rel < 55 ? 'low' : cap.rel < 80 ? 'mid' : 'high';
          rel[b][0] += comm; rel[b][1]++;
          if (x.a === 'red') { const d = defend ? 'yes' : 'no'; dfd[d][0] += comm; dfd[d][1]++; }
        });
      }
      const o = {};
      Object.keys(c).forEach(k => o[k] = +(c[k] / robots).toFixed(3));
      o.commsMatchRate = Object.fromEntries(Object.entries(rel).map(([k, v]) => [k + ' (' + v[1] + ')', +(v[0] / Math.max(1, v[1])).toFixed(2)]));
      o.commsVsDefender = Object.fromEntries(Object.entries(dfd).map(([k, v]) => [k, +(v[0] / Math.max(1, v[1])).toFixed(2)]));
      out[year] = o;
    }
    return out;
  };

  // Does one defender beat three scorers? Same robots and seed, weakest robot defends vs. everyone scores.
  // G.Dev.defTest(300) → per season: margin change from defending and win rates.
  Dev.defTest = function (N, years) {
    N = N || 200;
    const out = {}, rng = G.makeRng(7), pool = Object.values(G.AI.makePool(rng, 300, 99999, 2022));
    for (const year of (years || G.SEASON_YEARS)) {
      let dSum = 0, winsD = 0, winsS = 0;
      for (let i = 0; i < N; i++) {
        const pick = () => G.AI.entry(pool[rng.int(0, pool.length - 1)], year, 0.95, 1, rng);
        const A = [pick(), pick(), pick()], B = [pick(), pick(), pick()], seed = rng.int(1, 1e9);
        const run = defend => {
          const a = A.map(e => Object.assign({}, e, { plan: { role: 'score' } }));
          if (defend) a.slice().sort((p, q) => (p.power || 0) - (q.power || 0))[0].plan = { role: 'defend' };
          const r = G.Engine.run(G.Engine.create({ year, red: a, blue: B.map(e => Object.assign({}, e, { plan: { role: 'score' } })), seed, headless: true }));
          return { margin: r.red.score - r.blue.score, win: r.red.win };
        };
        const s = run(false), d = run(true);
        dSum += d.margin - s.margin; winsD += d.win === 1 ? 1 : 0; winsS += s.win === 1 ? 1 : 0;
      }
      out[year] = { marginGain: +(dSum / N).toFixed(1), winAllScore: +(winsS / N).toFixed(2), winOneDefender: +(winsD / N).toFixed(2) };
    }
    return out;
  };

  // Plays a whole career automatically (no UI). Returns a log of key facts. G.Dev.autoplay({profile:'established'})
  Dev.autoplay = function (opts) {
    opts = opts || {};
    const log = [];
    const C = G.Career, S0 = C.newGame({ mode: opts.mode || 'career', team: { num: 4321, name: 'Test Bots', school: 'Test HS', c1: '#f5b800', c2: '#111111', region: 'Midwest' },
      profile: opts.profile || 'established', diff: 'normal', order: opts.order || 'real', year: opts.year || 2024, scenario: opts.scenario || null, seed: opts.seed });
    const S = G.S;
    let guard = 0;
    log.probes = []; log.testSpend = 0;
    const playEvent = () => {
      const ev = S.event;
      G.Ev.skipPractice(ev);
      if (opts.probe && ev.kind === 'regional') { const p = Dev.probe(S, ev); log.probes.push(p); log.push('  probe ' + ev.name + ': alliance avg ' + p.toFixed(1) + ' · conf ' + ev.conf.toFixed(2) + ' tune ' + ev.tune.toFixed(2) + ' cond ' + Math.round(G.Robot.condAvg(S)) + ' arrival ' + (ev.arrival ? ev.arrival.cond : '-')); }
      if (ev.stage === 'quals') G.Ev.simRestQuals(ev);
      let g2 = 0;
      while (ev.stage === 'selection' && g2++ < 50) {
        const p = ev.sel.pending;
        if (!p) break;
        if (p.type === 'invite') G.Ev.playerRespond(ev, true);
        else { const opr = G.Ev.opr(ev); const avail = ev.sel.pool.filter(t => !ev.sel.alliances.some(a => a && a.includes(t)) && !ev.sel.declined.includes(t) && t !== S.team.num).sort((a, b) => (opr[b] || 0) - (opr[a] || 0)); G.Ev.playerPick(ev, avail[0]); }
      }
      if (ev.stage === 'playoffs') { let m; let g3 = 0; while ((m = G.Ev.nextPlayoff(ev)) && g3++ < 40) { if (G.Ev.hasPlayer(G.Ev.poMatchObj(ev, m))) G.Career.beforePlayerMatch(S, ev); G.Ev.applyPlayoff(ev, m, G.Ev.runHeadless(ev, G.Ev.poMatchObj(ev, m))); } if (ev.po.done && ev.stage !== 'done') G.Ev.finishEvent(ev); }
      log.push(S.year + ' ' + ev.name + ': ' + (ev.result ? ev.result.finish + ' rank ' + ev.result.rank + ' awards ' + ev.result.awardNames.join('/') : ev.stage));
      C.leaveEvent(S);
    };
    while (S.phase !== 'end' && guard++ < 400) {
      // decisions each turn
      if (S.phase === 'off' && D.MONTHS[S.month] === 'Oct' || (S.mode === 'single' && S.phase === 'kickoff')) {
        S.offers.filter(o => o.slot === 'title').slice(0, 1).forEach(o => C.signSponsor(S, o.id, true));
        S.offers.filter(o => o.slot !== 'title').slice(0, 3).forEach(o => C.signSponsor(S, o.id, true));
        const regs = S.regionals.filter(r => [2, 4].includes(r.week) && !r.full);
        [2, 4].forEach(w => { const r = regs.find(x => x.week === w); if (r) C.register(S, r.id); });
        if (S.market.length && S.mentors.length < 6) C.hireMentor(S, S.market[0].id);
      }
      if (S.phase === 'off' && S.robot && D.MONTHS[S.month] === 'Jul' && !S.offReg.length) C.registerOffseason(S, 'os_jul');
      if (S.phase === 'off' && S.projects.length < 2) { const r = D.RESEARCH.find(x => !S.projects.some(p => p.rid === x.id)); G.Robot.startProject(S, { type: 'research', rid: r.id }); }
      if (S.phase === 'kickoff') {
        G.Seasons[S.year].subs.forEach(sd => {
          if (sd.id === 'soft') return;
          const cs = sd.concepts.filter(c => c.id !== 'none' && !G.Robot.reqOk(S, c));
          const c = cs[Math.min(cs.length - 1, 2)] || cs[0];
          const e = G.Robot.startProject(S, { type: 'build', sub: sd.id, concept: c.id, effort: 'std' });
          if (e) log.push('build fail ' + sd.id + ': ' + e);
        });
      }
      if ((S.phase === 'build' || S.phase === 'comp') && S.robot) {
        const subs = Object.keys(S.robot.subs).filter(k => S.robot.subs[k].ver && !S.projects.some(p => p.sub === k));
        subs.slice(0, 2).forEach(k => { const c = G.Seasons.concept(S.robot.year, k, S.robot.subs[k].concept); G.Robot.startProject(S, { type: 'upgrade', sub: k, focus: Object.keys(c.ceil)[0], effort: 'std', forConcept: c.id }); });
        if (S.robot.autoTier < 2) G.Robot.startProject(S, { type: 'auto' });
      }
      if (S.phase === 'review' && !log['rv' + S.year]) {
        log['rv' + S.year] = 1;
        const lv = D.EQUIP.reduce((s, e) => s + G.Shop.lvl(S, e.id), 0), mx = D.EQUIP.reduce((s, e) => s + e.levels.length, 0);
        log.push(S.year + ' review: money ' + S.money + ', facility levels ' + lv + '/' + mx + ', impact rating ' + Math.round(C.impactRating(S).score));
      }
      // grind: a player who maxes outreach, fundraising and facility spending every turn (economy / Impact tests)
      if (opts.grind && S.phase !== 'review' && S.phase !== 'end') {
        D.ACTIVITIES.slice().sort((a, b) => (b.kind === 'outreach') - (a.kind === 'outreach')).forEach(a => { for (let k = 0; k < 4; k++) if (a.kind === 'outreach' || C.fundFatigue(S, a.id) > 0.3) C.doActivity(S, a.id); });
        if (!S.season.impactDone && !S.projects.some(p => p.type === 'impact')) G.Robot.startProject(S, { type: 'impact' });
        if (S.feeders < 3 && S.money > 5000) C.setFeeders(S, 3);
        let g4 = 0;
        while (g4++ < 20) {
          const ups = D.EQUIP.map(e => ({ id: e.id, c: G.Shop.upgradeCost(S, e.id) })).filter(x => x.c != null && S.money - x.c >= (opts.reserve == null ? 25000 : opts.reserve)).sort((a, b) => a.c - b.c);
          if (!ups.length) break;
          G.Shop.upgrade(S, ups[0].id);
        }
        D.EQUIP.forEach(e => { if (G.Shop.lvl(S, e.id) && G.Shop.cond(S, e.id) < 50 && S.money > 20000) G.Shop.renovate(S, e.id); });
      }
      // split: test the testing-hours split (free practice field + game elements, spares kept stocked)
      if (opts.split != null) {
        if (G.Shop.lvl(S, 'pfield') < (opts.field || 1)) { S.shop.pfield.lvl = opts.field || 1; S.shop.pfield.cond = 100; }
        if (S.phase !== 'off' && S.equip.field !== S.year) S.equip.field = S.year;
        if (opts.practiceBot && S.robot) S.robot.practiceBot = true;
        S.shop.pfield.cond = 100;
        S.testSplit = opts.split;
        if (S.parts.spares < 4 && S.money > 2000) C.buySpares(S, 4);
      }
      G.Career.dueActivities(S).forEach(a => C.resolveActivity(S, a.id, 'hours'));
      if (S.incident) { if (G.Shop.resolve(S, G.R.int(0, S.incident.opts.length - 1))) G.Shop.resolve(S, 0); }
      const ev = C.eventThisTurn(S);
      if (ev && ev.def) {
        if (ev.def.kind === 'champs') C.registerChamps(S);
        if (ev.def.kind === 'regional') { const ir = C.impactRating(S); log.push('  impact rating ' + Math.round(ir.score) + (ir.submitted ? '' : ' (no submission)') + ', odds ' + Math.round(100 * C.impactOdds(S, ev.def, ir)) + '%'); }
        C.startEvent(S, ev.def); playEvent(); continue;
      }
      const before = C.dateLabel(S);
      const err = C.advance(S);
      if (err) { log.push('blocked at ' + before + ': ' + err.join(' ')); break; }
    }
    log.push('END phase=' + S.phase + ' money=' + S.money + ' legacy=' + S.legacy + ' support=' + S.support + ' turns=' + guard);
    S.history.forEach(hs => log.push(hs.year + ': legacy ' + hs.legacy + ', money ' + hs.money + ', earned ' + hs.earned + ', spent ' + hs.spent + ', champs ' + hs.champs + ', avgRP ' + hs.avgRP.toFixed(2) + ', outreach ' + hs.impactRaw + ', awards ' + hs.awards.join('/')));
    log.push('facilities ' + D.EQUIP.map(e => e.id + ' ' + G.Shop.lvl(S, e.id) + '/' + e.levels.length).join(', ') + ' · slots ' + G.Robot.slotText(S));
    return log;
  };
  const D = G.Data;
})();

</script>
<script>/* js/local.js */
'use strict';
/* FRC Manager — extras for the local copy (opened from index.html): download a save as a .json file. */
(function () {
  G.Save.exportFile = function () {
    if (!G.S) return;
    const blob = new Blob([G.Save.exportText()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'frc-manager-' + (G.S.team ? G.S.team.num : 'save') + '-' + G.S.year + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
})();

</script>
<script>
window.addEventListener('error', e => { try { G.UI.toast('Error: ' + e.message, 'bad'); } catch (_) {} });
G.UI.go('menu');
</script>
