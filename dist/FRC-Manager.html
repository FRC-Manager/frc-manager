      S.offResults.push(r); S.rep = Math.min(100, S.rep + 2 + (r.won ? 3 : 0));
      S.sponsors.forEach(s => s.sat = Math.min(100, s.sat + 3));
      S.morale = Math.min(100, S.morale + (r.won ? 8 : 3));
      C.inbox(S, 'Offseason: ' + ev.name, 'Result: ' + r.finish + '. Your students gained valuable experience (double XP).', 'event');
      return;
    }
    if (ev.kind === 'scrimmage') {
      S.lastTune = Math.max(S.lastTune, ev.tune + 0.1); S.lastConf = Math.max(S.lastConf, ev.conf + 0.1);
      C.inbox(S, 'Week 0 scrimmage complete', 'Your drivers and robot got real reps. Starting tuning/confidence at your first regional is higher.', 'event');
      return;
    }
    if (ev.kind === 'einstein') {
      S.season.einstein = true;
      if (r.won) { S.season.worldChamp = true; S.worldChamps++; S.rep = 100; S.morale = 100; S.lastChamp = S.year; C.inbox(S, 'WORLD CHAMPIONS!', 'Your alliance won Einstein. Unbelievable season!', 'event'); }
      else C.inbox(S, 'Einstein: ' + r.finish, 'Reaching Einstein is an achievement few teams ever manage.', 'event');
      if (r.finalist) S.lastChamp = S.year;
      S.pendingEinstein = false;
      return;
    }
    S.season.events.push(r);
    r.awards.forEach(a => S.season.awards.push(a));
    if (ev.kind === 'champs') {
      S.season.champsPlayoffs = r.playoffs;
      if (r.won) { S.season.divWin = true; S.pendingEinstein = true; S.lastDivision = { alliance: ev.alliances[G.Ev.playerAlliance(ev)], teams: ev.teams.slice(), caps: ev.caps, tune: ev.tune, conf: ev.conf, tuneAuto: ev.tuneAuto }; C.inbox(S, 'Division Champions!', 'You won the ' + S.champsDiv + ' Division and advance to Einstein!', 'event'); }
    }
    // reputation & morale
    S.rep = U.clamp(S.rep + (r.won ? 8 : r.finalist ? 4 : r.playoffs ? 2 : -1) + r.awards.length * 3, 0, 100);
    S.morale = U.clamp(S.morale + (r.won ? 12 : r.playoffs ? 4 : -3) + r.awards.length * 4, 0, 100);
    // champs qualification
    if (ev.kind === 'regional' && !S.season.champsQualified) {
      let why = '';
      if (r.won) why = 'Regional winner at ' + ev.name;
      else if (r.awards.includes('impact')) why = 'Impact Award at ' + ev.name;
      else if (r.awards.includes('ei')) why = 'Engineering Inspiration Award at ' + ev.name;
      else if (r.awards.includes('ras')) why = 'Rookie All-Star Award at ' + ev.name;
      if (why) { S.season.champsQualified = true; S.season.champsReason = why; C.inbox(S, 'Qualified for the Championship!', why + '. Register when the Championship turn arrives.', 'event'); }
    }
    C.checkSponsorGoals(S, false);
    const sum = ev.name + ': ranked ' + U.ord(r.rank) + ' of ' + r.size + ' (' + r.record + ')' + (r.playoffs ? ', alliance ' + r.alliance + ' ' + r.role + ' — ' + r.finish : ', no playoffs') + (r.awardNames.length ? '. Awards: ' + r.awardNames.join(', ') : '') + '.';
    C.inbox(S, 'Event complete: ' + ev.name, sum, 'event');
    G.News.afterEvent(S, r);
  };
  C.poolThreshold = S => ({ easy: 75, normal: 85, hard: 95 }[S.diff] || 85);
  C.poolTotal = S => { const p = S.season.events.filter(e => e.kind === 'regional').map(e => e.pool).sort((a, b) => b - a); return (p[0] || 0) + (p[1] || 0); };
  function poolCheck(S) {
    if (S.season.champsQualified) return;
    const tot = C.poolTotal(S);
    if (tot >= C.poolThreshold(S)) { S.season.champsQualified = true; S.season.champsReason = 'Regional Pool wildcard (' + tot + ' pts)'; C.inbox(S, 'Championship wildcard!', 'Your Regional Pool total of ' + tot + ' points earned a Championship spot.', 'event'); }
    else if (S.season.events.length) C.inbox(S, 'Regional Pool', 'Your pool total was ' + tot + ' points; the wildcard cut-off was ' + C.poolThreshold(S) + '. No Championship invitation this year.', 'event');
  }
  C.toChamps = function (S) {
    if (!S.season.champsQualified) poolCheck(S);
    if (!S.season.champsQualified && S.mode === 'career' && S.lastChamp === S.year - 1 && S.orderMode === 'real') { S.season.champsQualified = true; S.season.champsReason = 'Defending champions'; }
    S.phase = 'champs';
    if (S.season.champsQualified) {
      C.inbox(S, 'Championship', 'You are qualified (' + S.season.champsReason + '). Registration ' + U.money(D.FEES.champs) + ' + flights. Attend from the HQ screen, or Continue to skip.', 'event');
    } else C.toReview(S);
  };
  C.registerChamps = function (S) {
    if (S.champsPaid) return null;
    if (S.money < D.FEES.champs) return 'Not enough money';
    C.spend(S, D.FEES.champs, 'Championship registration');
    S.champsPaid = S.year;
    return null;
  };

  // ======================= review =======================
  C.legacyFor = function (s) {
    let p = 0;
    s.events.forEach(e => { if (e.kind === 'regional' && e.won) p += 100; e.awards.forEach(a => p += a === 'impact' ? 120 : a === 'ei' ? 80 : 30); });
    if (s.champsQualified) p += 50;
    if (s.divWin) p += 150;
    if (s.worldChamp) p += 400;
    return p;
  };
  // Blue banners: official event wins and Impact Awards (offseason events don't earn banners).
  C.eventBanners = function (e, year) {
    const out = [];
    if (e.kind === 'regional' && e.won) out.push({ award: 'Winner', year, event: e.name });
    if (e.kind === 'champs' && e.won) out.push({ award: 'Division Winner', year, event: e.name.replace('Championship — ', '') + ' · FIRST Championship' });
    if (e.kind === 'einstein' && e.won) out.push({ award: 'World Champions', year, event: 'Einstein Field · FIRST Championship', gold: true });
    if ((e.awards || []).includes('impact')) out.push({ award: 'Impact Award', year, event: e.name.replace('Championship — ', '') });
    return out;
  };
  C.banners = function (S) {
    const out = [];
    const add = (year, events, worldChamp) => {
      events.forEach(e => out.push(...C.eventBanners(e, year)));
      if (worldChamp) out.push(...C.eventBanners({ kind: 'einstein', won: true }, year));
    };
    S.history.forEach(h => add(h.year, h.events, h.worldChamp));
    if (S.season && S.season.events && !S.history.some(h => h.year === S.season.year)) add(S.season.year || S.year, S.season.events, S.season.worldChamp);
    return out;
  };
  C.toReview = function (S) {
    if (S.phase === 'review') return;
    const s = S.season;
    C.checkSponsorGoals(S, true);
    let dSup = 0;
    const TIER = { Minimum: [4, -14], Target: [8, -6], Stretch: [14, -2] };
    s.goals.forEach(g => { g.met = !!D.PROGRAM_GOALS[g.id].check(s); const t = TIER[g.tier] || [8, -6]; dSup += g.met ? t[0] : t[1]; });
    if (S.money < 0) dSup -= 20;
    dSup *= dSup < 0 ? ({ easy: 0.5, normal: 1, hard: 1.5 }[S.diff] || 1) : 1;
    S.support = Math.round(U.clamp(S.support + dSup, 0, 100));
    s.supportDelta = Math.round(dSup);
    s.legacy = C.legacyFor(s) + (S.money >= 0 ? 20 : 0);
    S.legacy += s.legacy;
    // sponsors
    const left = [];
    S.sponsors.forEach(sp => {
      sp.goals.forEach(g => { if (!g.met) sp.sat = Math.max(0, sp.sat - 8); });
      if (sp.exp === 'High' && !s.events.some(e => e.playoffs)) sp.sat = Math.max(0, sp.sat - 10);
      sp.seasonsLeft--;
      if (sp.seasonsLeft <= 0) {
        if (sp.slot !== 'grant' && G.R.chance(sp.sat / 100)) { sp.seasonsLeft = G.R.int(1, 2); sp.base = Math.round(sp.base * (0.9 + sp.sat / 250) / 250) * 250; C.inbox(S, 'Sponsor renewed: ' + sp.name, 'They renewed for ' + sp.seasonsLeft + ' more season(s) at ' + U.money(sp.base) + '.', 'money'); }
        else left.push(sp);
      }
    });
    S.sponsors = S.sponsors.filter(x => !left.includes(x));
    if (left.length) C.inbox(S, 'Sponsors leaving', left.map(x => x.name).join(', ') + ' did not renew. Look for new offers in October.', 'money');
    // mentors
    const gone = [];
    S.mentors.forEach(m => { m.contract--; if (m.contract <= 0 && G.R.chance(0.5 - S.morale / 300)) gone.push(m); else if (m.contract <= 0) m.contract = G.R.int(1, 2); });
    S.mentors = S.mentors.filter(m => !gone.includes(m));
    if (gone.length) C.inbox(S, 'Mentors moving on', gone.map(m => m.name).join(', ') + ' decided not to return next season.', 'staff');
    // knowledge decay
    const decay = S.equip.kb ? 0.1 : 0.2;
    D.AREAS.forEach(a => { if (!S.usedAreas[a.id] && !S.mentors.some(m => m.spec === a.id)) S.know[a.id] = Math.round((S.know[a.id] || 0) * (1 - decay)); });
    S.history.push({
      year: S.year, events: s.events, awards: s.awards, champs: s.champsQualified, divWin: s.divWin, einstein: s.einstein, worldChamp: s.worldChamp,
      goals: s.goals.map(g => ({ id: g.id, met: g.met, tier: g.tier })), money: S.money, legacy: s.legacy, support: S.support, rep: S.rep,
      earned: s.earned, spent: s.spent, avgRP: s.qualMatches ? s.rpSum / s.qualMatches : 0, impactRaw: s.impact
    });
    S.phase = 'review';
    S.champsPaid = null;
  };
  C.endReview = function (S) {
    const last = S.upcoming >= S.order.length || S.mode === 'single';
    if (last || (S.support <= 0 && !S.settings.noFail)) { S.phase = 'end'; S.endReason = S.support <= 0 && !last ? 'fired' : 'complete'; G.Save.write('auto'); return; }
    S.phase = 'off'; S.month = 0; S.week = 0;
    const imp = 0;
    S.season = newSeasonState(null); S.season.impact = imp;
    S.offReg = [];
    C.inbox(S, 'Offseason begins', 'Use the summer and fall to research new mechanisms, attend offseason events with last season\'s robot, recruit, and line up sponsors. The next game is revealed at Kickoff in January.', 'info');
  };
  C.grade = function (S) {
    const sc = D.SCENARIOS.find(x => x.id === S.scenario) || {};
    const h = S.history[S.history.length - 1] || {};
    const evs = h.events || [];
    const met = {
      rookieWin: (h.awards || []).includes('ras') || evs.some(e => e.playoffs), champs: h.champs, einstein: h.worldChamp, win: evs.some(e => e.won),
      avgRP25: h.avgRP >= 2.5, legacy: (h.legacy || 0) >= 150
    }[sc.goal];
    const leg = h.legacy || 0;
    let g = met ? (leg >= 300 ? 'S' : 'A') : leg >= 150 ? 'B' : leg >= 60 ? 'C' : 'D';
    return { grade: g, met: !!met, legacy: leg, goalText: sc.goalText || '' };
  };

  // ======================= offseason activities & purchases =======================
  // Weekly limits on non-development activities: D.ACT_LIMIT total and each type once (×4 for an offseason month)
  C.actLimits = function (S) {
    const key = turnKey(S);
    if (!S.actLog || S.actLog.key !== key) S.actLog = { key, counts: {}, total: 0 };
    const k = S.phase === 'off' ? 4 : 1;
    return { max: D.ACT_LIMIT * k, perType: k, used: S.actLog.total, counts: S.actLog.counts, unit: S.phase === 'off' ? 'month' : 'week' };
  };
  C.fundFatigue = (S, id) => Math.pow(D.FUND_FATIGUE, (S.season && S.season.fundN && S.season.fundN[id]) || 0);
  C.doActivity = function (S, id) {
    const a = D.ACTIVITIES.find(x => x.id === id), rng = G.R;
    const lim = C.actLimits(S);
    if (lim.used >= lim.max) return 'The team has already done ' + lim.max + ' activities this ' + lim.unit + '. Try again next ' + lim.unit + '.';
    if ((lim.counts[id] || 0) >= lim.perType) return 'Already done this ' + lim.unit + (lim.perType > 1 ? ' (' + lim.perType + '×)' : '') + '.';
    if (S.money < a.cost) return 'Not enough money';
    S.actLog.counts[id] = (S.actLog.counts[id] || 0) + 1; S.actLog.total++;
    if (a.cost) C.spend(S, a.cost, a.name);
    let msg = '';
    if (a.kind === 'outreach') {
      S.season.impact += a.impact; S.season.outreach++; S.rep = Math.min(100, S.rep + a.rep);
      msg = '+' + a.impact + ' outreach points, +' + a.rep + ' reputation';
    } else {
      // donor fatigue: each repeat of the same fundraiser in this program year (June–May) pays less
      const fat = C.fundFatigue(S, a.id);
      S.season.fundN = S.season.fundN || {};
      S.season.fundN[a.id] = (S.season.fundN[a.id] || 0) + 1;
      let g;
      if (a.grant) { const p = (0.25 + C.impactRating(S).parts.outreach / 300) * fat; g = rng.chance(p) ? rng.int(a.money[0], a.money[1]) : 0; }
      else g = Math.round(rng.range(a.money[0], a.money[1]) * (a.repScale ? 0.5 + S.rep / 100 : 1) * (S.mentors.some(m => m.role === 'biz') ? 1.15 : 1) * fat);
      if (g) C.earn(S, g, a.name);
      msg = g ? 'Raised ' + U.money(g) + (fat < 1 ? ' (repeat donors give less: ×' + fat.toFixed(2) + ')' : '') : 'The application was not funded this time.';
    }
    return { ok: true, msg };
  };
  // Facilities are bought/upgraded through G.Shop; only the per-season practice field is handled here.
  C.buyEquip = function (S, id) {
    if (id !== 'field') return G.Shop.upgrade(S, id);
    if ((S.equip.field === S.year && S.phase !== 'off') || S.equip.field === 'pending') return 'Owned';
    const cost = D.FIELD.cost;
    if (S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    C.spend(S, cost, D.FIELD.name);
    S.equip.field = S.phase === 'off' ? 'pending' : S.year;
    S.morale = Math.min(100, S.morale + 3);
    return null;
  };
  C.buyPart = function (S, id, tier) {
    const p = D.PARTS.find(x => x.id === id);
    const cur = S.parts[id] || 0;
    if (tier <= cur) return 'Already owned';
    let cost = p.tiers[tier].cost;
    if (C.hasPerk(S, 'partsDiscount')) cost *= 0.85;
    if (S.money < cost) return 'Not enough money';
    C.spend(S, cost, p.tiers[tier].name);
    S.parts[id] = tier;
    return null;
  };
  C.buyBatteries = (S, n) => G.Shop.buyBatteries(S, n);
  // Spare parts cost more when bought at an event (rush delivery to the pits).
  C.spareUnitPrice = function (S, atEvent) {
    return Math.round(D.SPARES_COST * (atEvent ? D.SPARES_EVENT_MULT : 1) * G.Shop.spareMult(S) * (C.hasPerk(S, 'partsDiscount') ? 0.85 : 1));
  };
  C.buySpares = function (S, n, atEvent) {
    const cost = n * C.spareUnitPrice(S, atEvent);
    if (S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    C.spend(S, cost, n + ' spare parts' + (atEvent ? ' (at event)' : ''));
    S.parts.spares += n;
    return null;
  };
  C.registerOffseason = function (S, id) {
    const o = D.OFFSEASON_EVENTS.find(x => x.id === id);
    if (S.offReg.includes(id)) return 'Registered';
    if (!S.robot) return 'You need last season\'s robot';
    if (D.MONTHS.indexOf(o.month) < S.month) return 'Already past';
    if (S.money < o.fee) return 'Not enough money';
    C.spend(S, o.fee, 'Offseason: ' + o.name);
    S.offReg.push(id);
    return null;
  };
  C.setFeeders = function (S, n) { S.feeders = U.clamp(n, 0, 3); };
})();

</script>
<script>/* js/systems/shop.js */
'use strict';
/* FRC Manager — workshop facilities (levels, wear, upgrade, renovate) and shop incidents */
(function () {
  const U = G.U, D = G.Data;
  const Shop = G.Shop = {};

  // =====================================================================
  // Facilities
  // =====================================================================
  Shop.item = id => D.EQUIP.find(e => e.id === id);
  Shop.get = (S, id) => (S.shop && S.shop[id]) || { lvl: 0, cond: 100, warned: 0 };
  Shop.lvl = (S, id) => Shop.get(S, id).lvl || 0;
  Shop.cond = (S, id) => Shop.get(S, id).cond;
  // Efficiency: 40% of the effect at 0 condition, 100% at full condition.
  Shop.eff = (S, id) => Shop.lvl(S, id) ? 0.4 + 0.6 * U.clamp(Shop.cond(S, id), 0, 100) / 100 : 0;
  Shop.fx = function (S, id, key, lvl, eff) {
    const it = Shop.item(id), l = lvl == null ? Shop.lvl(S, id) : lvl;
    if (!l || !it.fx[key]) return 0;
    return it.fx[key][l - 1] * (eff == null ? Shop.eff(S, id) : eff);
  };
  // Aggregate effects used by the rest of the game
  Shop.hwHoursMult = S => (1 - Shop.fx(S, 'printer', 'hours')) * (1 - Shop.fx(S, 'cnc', 'hours'));
  Shop.swHoursMult = S => 1 - Shop.fx(S, 'laptops', 'soft');
  Shop.gainMult = S => 1 + Shop.fx(S, 'cnc', 'gain');
  Shop.buildRel = S => Shop.fx(S, 'cnc', 'rel') + Shop.fx(S, 'lathe', 'rel');
  Shop.buildStat = S => Math.round(Shop.fx(S, 'cnc', 'stat'));
  Shop.spareMult = S => 1 - Shop.fx(S, 'lathe', 'spare');
  Shop.chargeRate = S => 0.35 + Shop.fx(S, 'charger', 'charge');
  Shop.repairMult = S => 1 + Shop.fx(S, 'pitcart', 'repair');
  Shop.travelMult = S => 1 - Shop.fx(S, 'trailer', 'travel');
  Shop.upkeep = S => D.EQUIP.reduce((s, e) => s + e.upkeep * Shop.lvl(S, e.id), 0);

  const FX_TEXT = {
    hours: v => '−' + Math.round(v * 100) + '% hardware project hours',
    slot: v => v ? '+' + v + ' project slot' : '',
    gain: v => '+' + Math.round(v * 100) + '% upgrade gains',
    rel: v => '+' + v.toFixed(1) + ' reliability on new builds',
    stat: v => '+' + v.toFixed(1) + ' starting stats on new builds',
    spare: v => '−' + Math.round(v * 100) + '% spare part prices',
    soft: v => '−' + Math.round(v * 100) + '% software project hours',
    charge: v => 'batteries recharge ' + Math.round(v / 0.35 * 100) + '% faster',
    repair: v => '+' + Math.round(v * 100) + '% pit repair speed',
    travel: v => '−' + Math.round(v * 100) + '% Local/Drive travel cost',
    tune: v => '+' + Math.round(v * 100) + ' starting tuning at events',
    test: v => Math.round(v) + ' testing h/week'
  };
  Shop.effectText = function (S, id, lvl, eff) {
    const it = Shop.item(id);
    return Object.keys(it.fx).map(k => k === 'slot' ? FX_TEXT.slot(lvl == null && eff == null ? Shop.slotOf(S, id) : Shop.fx(S, id, k, lvl, 1)) : FX_TEXT[k](Shop.fx(S, id, k, lvl, eff))).filter(Boolean).join(' · ');
  };
  // Project slots from facilities: whole slots, lost while a facility is below SLOT_COND condition (renovate to get it back)
  Shop.SLOT_COND = 35;
  Shop.slotOf = (S, id) => Shop.lvl(S, id) && Shop.cond(S, id) >= Shop.SLOT_COND ? Shop.fx(S, id, 'slot', null, 1) : 0;
  Shop.facilitySlots = S => D.EQUIP.reduce((n, e) => n + (e.fx.slot ? Shop.slotOf(S, e.id) : 0), 0);

  Shop.migrate = function (S) {
    if (!S) return;
    S.equip = S.equip || {};
    if (!S.shop) {
      S.shop = {};
      D.EQUIP.forEach(e => {
        const v = S.equip[e.id];
        const l = typeof v === 'number' ? v : v ? 1 : 0;
        S.shop[e.id] = { lvl: Math.min(l, e.levels.length), cond: 100, warned: 0 };
        delete S.equip[e.id];
      });
    }
    D.EQUIP.forEach(e => { if (!S.shop[e.id]) S.shop[e.id] = { lvl: 0, cond: 100, warned: 0 }; });
    if (S.incident === undefined) S.incident = null;
    if (S.devMods === undefined) S.devMods = null;
    if (S.pendingRisk === undefined) S.pendingRisk = null;
    if (S.incidentCool == null) S.incidentCool = 3;
    // battery fleet: individual batteries instead of one averaged number
    if (S.parts && !S.parts.batts) {
      const n = U.clamp(S.parts.batteries || 4, 1, D.BATT_LIMIT[0]);
      S.parts.batts = Array.from({ length: n }, () => ({ h: S.parts.battHealth || 1 }));
    }
    if (S.parts) { S.parts.batteries = S.parts.batts.length; delete S.parts.battHealth; }
    if (!S.boosts) S.boosts = [];
    if (!S.guests) S.guests = [];
    if (!S.actLog) S.actLog = { key: '', counts: {}, total: 0 };
    if (!S.regReminded) S.regReminded = {};
    if (S.testSplit == null) S.testSplit = 0.5; // share of testing hours that goes to driver practice
    // v2 Impact model: re-roll AI Impact strength once for older saves
    if (S.impV !== 2) { if (S.teams) Object.values(S.teams).forEach(t => { if (!t.rookie) t.impact = G.AI.impactRoll(G.makeRng(t.num * 7919 + 13), t.str); }); S.impV = 2; }
  };

  // =====================================================================
  // Battery fleet
  // =====================================================================
  Shop.battLimit = S => D.BATT_LIMIT[Math.min(2, Shop.lvl(S, 'charger'))];
  Shop.fleetHealth = S => (S.parts.batts.length ? U.avg(S.parts.batts.map(b => b.h)) : 0);
  // How many batteries a purchase can add/replace right now (empty slots + worn ones)
  Shop.battRoom = S => (Shop.battLimit(S) - S.parts.batts.length) + S.parts.batts.filter(b => b.h < 0.98).length;
  // Buying fills empty slots first, then automatically replaces the most worn batteries.
  Shop.buyBatteries = function (S, n) {
    const room = Shop.battRoom(S);
    if (room <= 0) return 'Every battery slot is full of healthy batteries';
    n = Math.min(n, room);
    const cost = n * D.BATTERY_COST * (G.Career.hasPerk(S, 'partsDiscount') ? 0.85 : 1);
    if (S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    G.Career.spend(S, cost, n + ' new batteries');
    for (let i = 0; i < n; i++) S.parts.batts.push({ h: 1 });
    S.parts.batts.sort((a, b) => b.h - a.h);
    const over = S.parts.batts.length - Shop.battLimit(S);
    if (over > 0) S.parts.batts.length = Shop.battLimit(S); // drop the most worn
    S.parts.batteries = S.parts.batts.length;
    return null;
  };
  Shop.ageBatteries = function (S, amt) { S.parts.batts.forEach(b => { b.h = Math.max(0.4, b.h - amt); }); };

  Shop.upgradeCost = function (S, id) { const it = Shop.item(id), l = Shop.lvl(S, id); return l < it.levels.length ? it.levels[l].cost : null; };
  Shop.renoCost = function (S, id) {
    const it = Shop.item(id), l = Shop.lvl(S, id);
    if (!l) return null;
    const miss = 100 - Shop.cond(S, id);
    if (miss < 1) return 0;
    return Math.max(100, Math.round(it.levels[l - 1].cost * D.RENO_RATE * miss / 100 / 50) * 50);
  };
  Shop.upgrade = function (S, id) {
    const cost = Shop.upgradeCost(S, id), it = Shop.item(id), f = S.shop[id];
    if (cost == null) return 'Already at the top level';
    if (S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    G.Career.spend(S, cost, (f.lvl ? 'Upgrade: ' : 'Buy: ') + it.levels[f.lvl].name);
    f.lvl++; f.cond = 100; f.warned = 0;
    S.morale = Math.min(100, S.morale + 3);
    return null;
  };
  Shop.renovate = function (S, id) {
    const cost = Shop.renoCost(S, id), it = Shop.item(id), f = S.shop[id];
    if (cost == null) return 'You don\'t own this yet';
    if (cost === 0) return 'Already in perfect condition';
    if (S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    G.Career.spend(S, cost, 'Renovate: ' + it.levels[f.lvl - 1].name);
    f.cond = 100; f.warned = 0;
    S.morale = Math.min(100, S.morale + 1);
    return null;
  };
  function warn(S, e, f) {
    const nm = e.levels[f.lvl - 1].name;
    if (f.cond < 35 && f.warned < 2) {
      f.warned = 2;
      G.Career.inbox(S, nm + ' is in bad shape', 'Condition is down to ' + Math.round(f.cond) + '%, so it now works at only ' + Math.round(Shop.eff(S, e.id) * 100) + '% efficiency. Students have started calling it "vintage". Renovate it in the Workshop for ' + U.money(Shop.renoCost(S, e.id)) + '.', 'shop');
    } else if (f.cond < 60 && f.warned < 1) {
      f.warned = 1;
      G.Career.inbox(S, nm + ' needs attention', 'Condition has dropped to ' + Math.round(f.cond) + '% (' + Math.round(Shop.eff(S, e.id) * 100) + '% efficiency). A renovation now costs ' + U.money(Shop.renoCost(S, e.id)) + ' in the Workshop.', 'shop');
    }
  }
  // kind: 'season' (per in-season week), 'off' (per offseason month), 'event' (per event attended)
  Shop.wear = function (S, kind, opts) {
    D.EQUIP.forEach(e => {
      const f = S.shop[e.id];
      if (!f || !f.lvl) return;
      if (kind === 'event' && e.id === 'trailer' && opts && opts.fly) return;
      const w = e.wear[kind] || 0;
      if (!w) return;
      f.cond = Math.max(0, f.cond - w * G.R.range(0.7, 1.3));
      warn(S, e, f);
    });
  };
  Shop.damage = function (S, id, amt) {
    const f = S.shop[id];
    if (!f || !f.lvl) return;
    f.cond = U.clamp(f.cond - amt, 0, 100);
    if (amt < 0 && f.cond >= 60) f.warned = 0;
    warn(S, Shop.item(id), f);
  };

  // =====================================================================
  // Development modifiers (last one turn = at most one week of work)
  // =====================================================================
  function modsText(m) {
    return Object.keys(D.DEV_CATS).filter(k => m[k] != null && m[k] !== 1)
      .map(k => D.DEV_CATS[k] + ' ' + (m[k] > 1 ? '+' : '−') + Math.round(Math.abs(m[k] - 1) * 100) + '%').join(', ');
  }
  Shop.modsText = modsText;
  function addMods(S, mods, why) {
    if (!mods) return;
    if (!S.devMods) S.devMods = { mods: {}, notes: [] };
    Object.keys(mods).forEach(k => { S.devMods.mods[k] = (S.devMods.mods[k] == null ? 1 : S.devMods.mods[k]) * mods[k]; });
    if (why) S.devMods.notes.push(why);
  }
  // Called when a turn's work is processed: resolves pending risks, returns this turn's category multipliers.
  Shop.turnMods = function (S) {
    if (S.pendingRisk) {
      const r = S.pendingRisk; S.pendingRisk = null;
      if (G.R.chance(r.p)) {
        addMods(S, r.mods, r.title);
        if (r.dmg) Object.keys(r.dmg).forEach(k => Shop.damage(S, k, r.dmg[k]));
        if (r.robot && S.robot) Object.values(S.robot.subs).forEach(s => { if (s.ver) s.cond = Math.max(0, s.cond - r.robot); });
        if (r.batt) G.R.shuffle(S.parts.batts.slice()).slice(0, 2).forEach(b => { b.h = Math.max(0.4, b.h - r.batt * 4); });
        G.Career.inbox(S, 'It happened: ' + r.title, r.hit + (r.mods ? ' (' + modsText(r.mods) + ' this turn.)' : ''), 'incident');
      } else G.Career.inbox(S, 'Dodged it: ' + r.title, r.miss, 'incident');
    }
    if (!S.devMods) return null;
    const m = Object.assign({}, S.devMods.mods);
    // An offseason turn is a month; incidents still only cost about one week of it.
    if (S.phase === 'off') Object.keys(m).forEach(k => { m[k] = 1 + (m[k] - 1) * 0.25; });
    return m;
  };
  Shop.clearMods = function (S) { S.devMods = null; };

  // =====================================================================
  // Incidents
  // =====================================================================
  const own = id => S => Shop.lvl(S, id) > 0;
  const lvlOf = (S, id) => Math.max(1, Shop.lvl(S, id));
  const pickMentor = S => (S.mentors.length ? G.R.pick(S.mentors).name : 'Your lead mentor');
  const ALL = m => ({ fab: m, soft: m, research: m });
  Shop.INCIDENTS = [
    // ---------------- with choices ----------------
    { id: 'cnc_defect', w: 3, req: own('cnc'), title: 'CNC spindle is grinding',
      body: () => 'Mid-cut, the CNC spindle started making a grinding noise. It still runs — for now.',
      opts: [
        { label: 'Ignore it and keep cutting', desc: '40% chance it breaks this week: Fabrication −60%, CNC condition −20',
          risk: { p: 0.4, mods: { fab: 0.4 }, dmg: { cnc: 20 }, hit: 'The spindle seized halfway through a gusset plate. Parts were cut by hand for the rest of the week.', miss: 'The grinding stopped on its own. Nobody knows why. Nobody is asking.' } },
        { label: 'Replace the bearing now', cost: S => 400 + 300 * lvlOf(S, 'cnc'), desc: 'No delay, CNC condition +10', fix: { cnc: 10 } }
      ] },
    { id: 'cnc_break', w: 2, req: own('cnc'), title: 'CNC router broke down', dmg: { cnc: 10 },
      body: () => 'The CNC threw a stepper-driver fault and won\'t home. A replacement board is a week away.',
      opts: [
        { label: 'Wait for the part', desc: 'Fabrication paused for a week (−100%)', mods: { fab: 0 } },
        { label: 'Outsource parts to a machine shop', cost: S => 900 + 400 * lvlOf(S, 'cnc'), desc: 'Fabrication −15% for a week', mods: { fab: 0.85 } }
      ] },
    { id: 'printer_clog', w: 3, req: own('printer'), title: '3D printers keep clogging',
      body: () => 'Half the printers are jamming. Someone bought the cheapest filament on the internet.',
      opts: [
        { label: 'Clean the nozzles and reprint', desc: 'Fabrication −25% this week', mods: { fab: 0.75 } },
        { label: 'Order new nozzles and good filament, express', cost: S => 150 + 150 * lvlOf(S, 'printer'), desc: 'No delay, printer condition +5', fix: { printer: 5 } }
      ] },
    { id: 'lathe_chatter', w: 2, req: own('lathe'), title: 'Lathe chuck is out of true',
      body: () => 'Shafts are coming off the lathe slightly oval. The machine shop is "fine, probably".',
      opts: [
        { label: 'Live with it', desc: '35% chance it gets worse: Fabrication −40%, Machine Shop condition −20',
          risk: { p: 0.35, mods: { fab: 0.6 }, dmg: { lathe: 20 }, hit: 'A chewed-up hex shaft finally convinced everyone. The lathe was tagged out while parts were re-made.', miss: 'Turns out "slightly oval" was within tolerance. Barely.' } },
        { label: 'Have the chuck rebuilt', cost: S => 300 + 200 * lvlOf(S, 'lathe'), desc: 'No delay, Machine Shop condition +10', fix: { lathe: 10 } }
      ] },
    { id: 'laptop_update', w: 3, req: own('laptops'), title: 'Bad update hit the programming laptops',
      body: () => 'An automatic update broke the robot code build tools on every programming laptop.',
      opts: [
        { label: 'Roll back by hand', desc: 'Software −70% this week', mods: { soft: 0.3 } },
        { label: 'Pay IT to reimage them tonight', cost: () => 400, desc: 'Software −15% this week', mods: { soft: 0.85 } }
      ] },
    { id: 'charger_smell', w: 2, req: own('charger'), title: 'Burning smell from the battery charger',
      body: () => 'Something on the charger smells like a warm electronics store. The fan is not spinning.',
      opts: [
        { label: 'Keep using it', desc: '40% chance: two batteries lose 24% health, Battery Station condition −25',
          risk: { p: 0.4, batt: 0.06, dmg: { charger: 25 }, hit: 'One charging bay cooked two batteries before anyone noticed.', miss: 'The fan started again after a firm tap. Classic.' } },
        { label: 'Replace the fan and wiring', cost: () => 150, desc: 'No risk, Battery Station condition +15', fix: { charger: 15 } }
      ] },
    { id: 'aluminum', w: 3, req: S => S.phase !== 'off', title: 'Aluminum tube is backordered',
      body: () => 'Your usual supplier is out of 2×1 box tube for two weeks.',
      opts: [
        { label: 'Wait and build from scraps', desc: 'Fabrication −50% this week', mods: { fab: 0.5 } },
        { label: 'Buy from a pricier supplier', cost: () => 700, desc: 'No delay' }
      ] },
    { id: 'power', w: 2, req: () => true, title: 'Power work in the tech wing',
      body: () => 'School facilities will cut power to the shop for two afternoons this week.',
      opts: [
        { label: 'Work around it', desc: 'All development −40% this week', mods: ALL(0.6) },
        { label: 'Rent a generator', cost: () => 500, desc: 'All development −10% this week', mods: ALL(0.9) }
      ] },
    { id: 'roof', w: 2, req: () => true, title: 'Roof leak over the electronics bench',
      body: () => 'Rain is dripping onto the electronics bench. Maintenance can come today if you pay for an emergency call.',
      opts: [
        { label: 'Put a bucket under it', desc: '35% chance of water damage: Software −50%, Fabrication −30%, robot condition −10',
          risk: { p: 0.35, mods: { soft: 0.5, fab: 0.7 }, robot: 10, hit: 'The bucket overflowed overnight. A motor controller and two laptops got wet.', miss: 'The bucket held. Someone please empty it.' } },
        { label: 'Pay for an emergency repair', cost: () => 350, desc: 'No impact' }
      ] },
    { id: 'cad_license', w: 2, req: () => true, title: 'CAD license server is down',
      body: () => 'The school\'s CAD license server crashed and the vendor\'s support line has a two-hour hold time.',
      opts: [
        { label: 'Work offline on sketches', desc: 'Fabrication −30%, Research −30% this week', mods: { fab: 0.7, research: 0.7 } },
        { label: 'Buy temporary licenses', cost: () => 300, desc: 'No delay' }
      ] },
    // ---------------- without choices ----------------
    { id: 'snow', w: 3, req: S => S.phase === 'build' && S.week <= 6, title: 'Snow day!',
      body: () => 'School is closed for two days. The students are building snowmen instead of robots.', mods: { fab: 0.5, soft: 0.7, research: 0.5 } },
    { id: 'exams', w: 2, req: S => S.phase === 'build' || (S.phase === 'off' && ['May', 'Dec'].includes(D.MONTHS[S.month])), title: 'Exam week',
      body: () => 'Exams are this week. Half the team is in the library and the other half should be.', mods: ALL(0.7) },
    { id: 'marshal', w: 2, req: () => true, title: 'Fire marshal inspection',
      body: () => 'The fire marshal closed the shop for a day to inspect the extension cord situation. It was not good.', mods: { fab: 0.8 } },
    { id: 'wifi', w: 2, req: () => true, title: 'School Wi-Fi is down',
      body: () => 'The network has been down for three days: no pushing code, no downloading datasheets.', mods: { soft: 0.6, research: 0.8 } },
    { id: 'sick', w: 2, req: S => S.mentors.length > 0, title: 'Mentor out sick',
      body: S => pickMentor(S) + ' is home with the flu. The shop runs a little slower without them.', mods: { fab: 0.8, soft: 0.85 } },
    { id: 'tooling', w: 2, req: () => true, title: 'Tooling donation',
      body: () => 'A retired machinist dropped off three boxes of end mills, taps and drill bits. Machines run better and the students are thrilled.', mods: { fab: 1.2 }, fix: { cnc: 8, lathe: 8, printer: 5 } },
    { id: 'sprint', w: 2, req: () => true, title: 'Weekend coding sprint',
      body: () => 'The programmers held an all-weekend coding sprint powered by questionable snacks.', mods: { soft: 1.4 } },
    { id: 'cleanup', w: 1, req: () => true, title: 'Mandatory shop clean-up',
      body: () => 'The principal toured the shop. A full clean-up day followed, and every tool now has a labeled home.', mods: { fab: 0.85 }, fixAll: 5 }
  ];
  Shop.optCost = (S, o) => (o.cost ? o.cost(S) : 0);

  Shop.rollIncident = function (S) {
    if (S.incident || !['off', 'build', 'comp'].includes(S.phase)) return;
    if (S.incidentCool > 0) { S.incidentCool--; return; }
    if (!G.R.chance(0.09)) return;
    const pool = Shop.INCIDENTS.filter(i => i.req(S));
    if (!pool.length) return;
    const inc = G.R.wpick(pool, i => i.w);
    S.incidentCool = 4;
    const body = inc.body(S);
    if (inc.opts) {
      S.incident = { id: inc.id, title: inc.title, body, opts: inc.opts.map(o => ({ label: o.label, desc: o.desc, cost: Shop.optCost(S, o) })) };
      if (inc.dmg) Object.keys(inc.dmg).forEach(k => Shop.damage(S, k, inc.dmg[k]));
      G.Career.inbox(S, 'Shop incident: ' + inc.title, body + '\n\nA decision is needed before you continue.', 'incident');
      return;
    }
    addMods(S, inc.mods, inc.title);
    if (inc.fix) Object.keys(inc.fix).forEach(k => Shop.damage(S, k, -inc.fix[k]));
    if (inc.fixAll) D.EQUIP.forEach(e => Shop.damage(S, e.id, -inc.fixAll));
    G.Career.inbox(S, (inc.mods && Object.values(inc.mods).some(v => v > 1) ? 'Good news: ' : 'Shop incident: ') + inc.title, body + '\n\nThis turn: ' + modsText(inc.mods) + '.', 'incident');
  };
  Shop.resolve = function (S, idx) {
    const cur = S.incident;
    if (!cur) return null;
    const inc = Shop.INCIDENTS.find(i => i.id === cur.id), o = inc.opts[idx];
    const cost = cur.opts[idx].cost;
    if (cost && S.money < cost) return 'Not enough money (' + U.money(cost) + ' needed)';
    if (cost) G.Career.spend(S, cost, 'Incident: ' + inc.title);
    addMods(S, o.mods, inc.title);
    if (o.fix) Object.keys(o.fix).forEach(k => Shop.damage(S, k, -o.fix[k]));
    if (o.risk) S.pendingRisk = Object.assign({ title: inc.title, desc: o.desc }, o.risk);
    G.Career.inbox(S, 'Decision: ' + inc.title, 'You chose: ' + o.label + (cost ? ' (' + U.money(cost) + ')' : '') + '. ' + o.desc + '.', 'incident');
    S.incident = null;
    return null;
  };

  // =====================================================================
  // Opportunities: school & sponsor events with positive, time-limited effects
  // boost kinds: slots (+project slots), hours (+% team hours), cat (progress × per category)
  // guests: temporary mentors in extra mentor slots
  // =====================================================================
  const turnsFor = (S, inSeason) => (S.phase === 'off' ? Math.max(1, Math.round(inSeason / 3)) : inSeason);
  const sponsorName = S => (S.sponsors.length ? G.R.pick(S.sponsors).name : null);
  function addBoost(S, b) { S.boosts.push(Object.assign({ id: U.uid('b') }, b)); }
  Shop.boostSlots = S => (S.boosts || []).filter(b => b.kind === 'slots').reduce((s, b) => s + b.value, 0) + (S.guests || []).filter(g => g.m.role === 'design' || g.m.role === 'fab').length;
  Shop.boostHours = S => (S.boosts || []).filter(b => b.kind === 'hours').reduce((s, b) => s + b.value, 0);
  Shop.guestHours = S => (S.guests || []).reduce((s, g) => s + g.m.hours, 0);
  Shop.boostMods = function (S) {
    const m = {};
    (S.boosts || []).filter(b => b.kind === 'cat').forEach(b => { m[b.cat] = (m[b.cat] || 1) * b.value; });
    return Object.keys(m).length ? m : null;
  };
  Shop.boostText = function (b) {
    if (b.kind === 'slots') return '+' + b.value + ' project slot' + (b.value > 1 ? 's' : '');
    if (b.kind === 'hours') return '+' + Math.round(b.value * 100) + '% team hours';
    return D.DEV_CATS[b.cat] + ' +' + Math.round((b.value - 1) * 100) + '%';
  };
  Shop.OPPS = [
    { id: 'guest', w: 3, req: S => S.sponsors.length > 0, run: S => {
      const sp = sponsorName(S), role = G.R.pick(['design', 'fab', 'prog']), m = D.makeMentor(G.R, role, G.R.int(3, 4));
      m.cost = 0; m.guest = sp; const turns = turnsFor(S, 4);
      S.guests.push({ m, turns });
      const rn = D.MENTOR_ROLES.find(r => r.id === role).name;
      return ['Guest mentor from ' + sp, sp + ' is lending one of its engineers, ' + m.name + ', as a guest ' + rn + ' (' + U.stars(m.stars) + ', ' + m.hours + ' h/week) for ' + turns + (S.phase === 'off' ? ' month' : ' week') + (turns > 1 ? 's' : '') + '. Guests take an extra mentor slot' + (role !== 'prog' ? ' and add a project slot' : '') + '.'];
    } },
    { id: 'room', w: 2, req: () => true, run: S => {
      const t = turnsFor(S, 3); addBoost(S, { kind: 'slots', value: 1, turns: t, title: 'Borrowed classroom' });
      return ['The school lends you a second room', 'The classroom next door is free after school, so a second build crew can work in parallel. +1 project slot for ' + t + (S.phase === 'off' ? ' month' : ' week') + (t > 1 ? 's' : '') + '.'];
    } },
    { id: 'late', w: 3, req: () => true, run: S => {
      const t = turnsFor(S, 2); addBoost(S, { kind: 'hours', value: 0.2, turns: t, title: 'Extended shop hours' });
      return ['Extended shop hours', 'The principal approved late shop nights with a custodian on duty. +20% team hours for ' + t + (S.phase === 'off' ? ' month' : ' week') + (t > 1 ? 's' : '') + '.'];
    } },
    { id: 'machine', w: 2, req: S => S.sponsors.length > 0, run: S => {
      const sp = sponsorName(S), t = turnsFor(S, 2); addBoost(S, { kind: 'cat', cat: 'fab', value: 1.3, turns: t, title: sp + ' machine shop' });
      return [sp + ' opens its machine shop', sp + ' is letting your fabrication crew use its machine shop on weekends. Fabrication +30% for ' + t + (S.phase === 'off' ? ' month' : ' week') + (t > 1 ? 's' : '') + '.'];
    } },
    { id: 'lab', w: 2, req: () => true, run: S => {
      const t = turnsFor(S, 2); addBoost(S, { kind: 'cat', cat: 'soft', value: 1.4, turns: t, title: 'University programming lab' });
      return ['University lab access', 'A nearby university lent its robotics lab and a grad student to your programmers. Software +40% for ' + t + (S.phase === 'off' ? ' month' : ' week') + (t > 1 ? 's' : '') + '.'];
    } },
    { id: 'innovate', w: 1, req: () => true, run: S => {
      const t = turnsFor(S, 2); addBoost(S, { kind: 'cat', cat: 'research', value: 1.5, turns: t, title: 'District innovation days' });
      return ['District innovation days', 'The school district gave your team two "innovation days" off regular classes. Research +50% for ' + t + (S.phase === 'off' ? ' month' : ' week') + (t > 1 ? 's' : '') + '.'];
    } },
    { id: 'engday', w: 2, req: S => S.projects.length > 0 && S.sponsors.length > 0, run: S => {
      const sp = sponsorName(S), p = S.projects.slice().sort((a, b) => (b.need - b.done) - (a.need - a.done))[0];
      const h = Math.round(Math.min(p.need - p.done - 1, G.R.int(40, 80)));
      if (h <= 0) return null;
      p.done += h;
      return [sp + ' engineering day', sp + ' sent a team of engineers for a day. They put ' + h + ' hours into "' + p.name + '" right away.'];
    } }
  ];
  Shop.rollBoost = function (S) {
    if (!['off', 'build', 'comp'].includes(S.phase)) return;
    if ((S.boostCool || 0) > 0) { S.boostCool--; return; }
    if (!G.R.chance(0.07)) return;
    const pool = Shop.OPPS.filter(o => o.req(S));
    const o = G.R.wpick(pool, x => x.w);
    const res = o && o.run(S);
    if (!res) return;
    S.boostCool = 4;
    G.Career.inbox(S, res[0], res[1], 'boost');
  };
  // Count down boosts and guest mentors after each turn's work
  Shop.tickBoosts = function (S) {
    S.boosts.forEach(b => b.turns--);
    S.boosts.filter(b => b.turns <= 0).forEach(b => G.Career.inbox(S, 'Boost ended: ' + b.title, Shop.boostText(b) + ' is over.', 'boost'));
    S.boosts = S.boosts.filter(b => b.turns > 0);
    S.guests.forEach(g => g.turns--);
    S.guests.filter(g => g.turns <= 0).forEach(g => G.Career.inbox(S, 'Guest mentor heads back', g.m.name + ' has returned to ' + g.m.guest + '. The students made a thank-you card with a CAD drawing on it.', 'boost'));
    S.guests = S.guests.filter(g => g.turns > 0);
  };
})();

</script>
<script>/* js/systems/news.js */
'use strict';
/* FRC Manager — random inbox content: small random events with effects, and team chatter (flavor only) */
(function () {
  const U = G.U, D = G.Data;
  const N = G.News = {};
  const R = () => G.R;
  const first = name => String(name).split(' ')[0];
  const student = S => (S.students.length ? first(R().pick(S.students).name) : 'A freshman');
  const mentor = S => (S.mentors.length ? R().pick(S.mentors).name : 'Your lead mentor');
  const driver = S => { const d = G.Career.driveTeam(S).driver; return d && d.name ? first(d.name) : student(S); };
  const rival = S => {
    const ts = Object.values(S.teams).filter(t => t.region === S.team.region && t.str > 55);
    const t = ts.length ? R().pick(ts) : R().pick(Object.values(S.teams));
    return t.num + ' ' + t.name;
  };
  const concept = (S, sub) => S.robot && S.robot.subs[sub] && S.robot.subs[sub].ver ? S.robot.subs[sub].concept : null;
  const inSeason = S => S.phase === 'build' || S.phase === 'comp' || S.phase === 'kickoff';
  const month = S => D.MONTHS[S.month];
  const ROBOT_NAMES = ['Sir Spins-a-Lot', 'Captain Torque', 'Gearbox Gertrude', 'The Toaster', 'Big Bertha', 'Sparky', 'Turbo Tortoise', 'Chonk', 'Professor Zip Tie', 'Bolt Bucket', 'Steve', 'Lady Hex Key', 'The Dishwasher', 'Mr. Brownout', 'Wheelie Nelson'];
  const FOODS = ['three trays of homemade lasagna', 'a mountain of pizza', 'dumplings for forty', 'a cooler of tamales', 'a cake shaped like a swerve module', 'enough cookies to void the weight limit'];
  const PLUSH = ['penguin', 'capybara', 'axolotl', 'shark', 'frog', 'goose'];

  // ---------------------------------------------------------------
  // Small random events with real effects (kind: news)
  // ---------------------------------------------------------------
  const EVENTS = [
    { w: 3, run: S => { S.rep = Math.min(100, S.rep + 3); return ['Local news feature', 'A local TV station ran a story on the team. ' + student(S) + ' said "robots" eleven times in a 40-second clip. Reputation +3.']; } },
    { w: 2, run: S => { const c = R().int(200, 600); G.Career.spend(S, c, 'Supplier rush shipping'); return ['Supplier delay', 'A parts order got stuck in a warehouse. You paid ' + U.money(c) + ' for rush shipping.']; } },
    { w: 3, run: S => { S.morale = Math.min(100, S.morale + 5); return ['Team bonding night', 'Pizza, board games and a very competitive round of robot trivia. Morale +5.']; } },
    { w: 2, run: S => { const g = R().int(300, 1200); G.Career.earn(S, g, 'Alumni donation'); return ['Alumni donation', 'A former team member who now works as an engineer donated ' + U.money(g) + '. The note said "buy good wire".']; } },
    { w: 2, req: S => S.robot && inSeason(S), run: S => { const ks = Object.keys(S.robot.subs).filter(k => S.robot.subs[k].ver && k !== 'soft'); if (!ks.length) return null; const k = R().pick(ks); S.robot.subs[k].hidden++; return ['Something sounds off…', student(S) + ' reports a strange noise from the ' + G.Seasons.sub(S.robot.year, k).name + '. It might be nothing. (A Systems Shakedown or Hardening would find out.)']; } },
    { w: 2, run: S => { S.parts.spares += 2; return ['Gracious Professionalism', 'Team ' + rival(S) + ' heard you were short on parts and dropped off two spare gearbox kits. +2 spare parts.']; } },
    { w: 2, run: S => { const g = R().int(300, 800); G.Career.earn(S, g, 'Hardware store donation'); return ['Hardware store donation', 'The local hardware store donated fasteners and paint worth ' + U.money(g) + '. In return, the robot will wear their sticker.']; } },
    { w: 2, run: S => { S.rep = Math.min(100, S.rep + 2); return ['Magazine feature', 'A STEM education magazine featured your outreach program. Reputation +2.']; } },
    { w: 1, req: S => S.studentsCount > 12, run: S => { S.studentsCount--; S.morale = Math.max(0, S.morale - 2); return ['A student left the team', 'A sophomore left to join the esports club. "The robots were too real." Team size −1, morale −2.']; } },
    { w: 2, run: S => { S.studentsCount++; return ['New student', 'A transfer student walked into the shop, said "I can weld", and was immediately adopted. Team size +1.']; } },
    { w: 2, run: S => { S.morale = Math.min(100, S.morale + 3); return ['Team shirts arrived', 'The new team shirts arrived and the team number is spelled correctly this year. Morale +3.']; } },
    { w: 2, req: S => S.sponsors.length > 0, run: S => { const sp = R().pick(S.sponsors); sp.sat = Math.min(100, sp.sat + 8); return ['Great sponsor visit', sp.name + ' stopped by and ' + student(S) + ' gave the best robot tour of their life. ' + sp.name + ' satisfaction +8.']; } },
    { w: 1, req: S => S.robot && S.phase === 'comp', run: S => { Object.values(S.robot.subs).forEach(s => { if (s.ver) s.cond = Math.max(0, s.cond - 8); }); return ['Robot cart incident', 'The robot cart hit a curb in the parking lot. The robot survived, mostly. Robot condition −8.']; } }
  ];

  // ---------------------------------------------------------------
  // Team chatter (kind: fun) — flavor only
  // ---------------------------------------------------------------
  const CHAT = [
    { req: S => S.phase === 'build' && S.robot && !S.season.robotName, title: 'Robot naming vote',
      body: S => { const n = R().shuffle(ROBOT_NAMES.slice()); S.season.robotName = n[0]; return 'The team voted on a name for the ' + S.year + ' robot. Winner: "' + n[0] + '". Runner-up: "' + n[1] + '". ' + student(S) + ' is demanding a recount.'; } },
    { title: 'Googly eyes proposal', body: S => student(S) + ' has proposed adding googly eyes to the robot. The motion passed 14–3. The design mentor abstained.' },
    { title: 'Late-night CAD', body: S => student(S) + ' was spotted doing CAD at 2 a.m. again. ' + mentor(S) + ' has confiscated their laptop charger "for their own good".' },
    { title: 'The zip tie talk', body: S => mentor(S) + ' gave a 40-minute talk on why zip ties are not a structural fastener. The robot currently contains 212 zip ties.' },
    { title: 'Label maker', body: S => mentor(S) + ' bought a label maker. Everything in the shop is now labeled, including the label maker.' },
    { title: 'Snack report', body: S => 'A parent brought ' + R().pick(FOODS) + '. Productivity dropped briefly, then soared.' },
    { title: 'Safety first', body: S => 'Safety captain ' + student(S) + ' handed out ' + R().int(14, 40) + ' safety-glasses reminders today. A new team record.' },
    { title: 'New pit mascot', body: S => 'Someone brought a ' + R().pick(PLUSH) + ' plushie to the shop. It is now the official pit mascot and has its own badge.' },
    { title: 'Parent group chat', body: () => 'The parent group chat has ' + R().int(120, 400) + ' unread messages. Most are about carpools. One is a lasagna recipe.' },
    { req: S => S.robot && inSeason(S), title: 'Drive practice', body: S => 'Drive practice: ' + driver(S) + ' set a personal-best cycle time and took a victory lap around the shop. The lap was slower.' },
    { req: S => inSeason(S), title: 'Rival reveal video', body: S => 'Team ' + rival(S) + ' posted their robot reveal. Your students have watched it ' + R().int(20, 90) + ' times and are "definitely not worried".' },
    { req: S => S.robot && inSeason(S), title: 'Reveal video stats', body: S => 'Your robot reveal reached ' + R().int(2, 40) + ',' + R().int(100, 999) + ' views. Top comment: "' + R().pick(['how is it that fast', 'clean wiring, respect', 'the bumpers are perfect', 'my grandma could drive that (compliment)', 'is that legal??', 'need the CAD please']) + '"' },
    { req: S => S.robot && inSeason(S) && G.Robot.weight(S) >= 115, title: 'The scale', body: S => 'The robot weighs ' + G.Robot.weight(S) + ' lb. The team now refers to the scale as "the enemy".' },
    { req: S => S.money < 5000, title: 'Swear jar', body: S => 'Treasurer ' + student(S) + ' started a swear jar. It is already the team\'s fourth-largest sponsor.' },
    { req: S => S.morale < 45, title: 'Quiet shop', body: () => 'The shop has been quiet lately. Someone made a playlist called "Robot Blues". It has 41 songs.' },
    { req: S => S.morale > 80, title: 'Team chant', body: () => 'Spirits are high. The team chant has gained a second verse and an optional dance.' },
    { req: S => concept(S, 'drive') === 'swerve', title: 'Swerve noises', body: S => 'The swerve modules are making a new noise. ' + student(S) + ' calls it "the song of my people".' },
    { req: S => concept(S, 'scorer') === 'turret', title: 'Turret tracking', body: S => student(S) + ' spent an hour making the turret track ' + mentor(S) + '\'s face. It works disturbingly well.' },
    { req: S => ['elev', 'elevw', 'amptrap'].includes(concept(S, 'scorer')) || concept(S, 'amp') === 'amptrap', title: 'Elevator test', body: () => 'Elevator test: it went up very fast and came down even faster. Nobody was hurt. One ceiling tile was.' },
    { req: S => S.robot && S.robot.subs.endgame && S.robot.subs.endgame.ver, title: 'Climb test', body: () => 'The first full climb on the practice rig worked. The team celebrated like it was a playoff win.' },
    // game-specific
    { req: S => S.year === 2022 && inSeason(S), title: 'Cargo escape', body: () => 'A cargo ball was launched over the practice net and into the hallway. The principal returned it personally.' },
    { req: S => S.year === 2022 && inSeason(S), title: 'Traversal debate', body: S => student(S) + ' insists the robot can do Traversal "if we believe hard enough".' },
    { req: S => S.year === 2023 && inSeason(S), title: 'Cones vs. cubes', body: () => 'The cone-versus-cube debate has split the team into two camps. They now sit at opposite ends of the shop.' },
    { req: S => S.year === 2023 && inSeason(S), title: 'Charge station', body: S => 'The practice charge station has become ' + student(S) + '\'s favorite place to eat lunch. It balances perfectly when they do.' },
    { req: S => S.year === 2024 && inSeason(S), title: 'Note in the ceiling', body: () => 'A note got stuck in the ceiling tiles. It has been named "Steve" and will not be removed.' },
    { req: S => S.year === 2024 && inSeason(S), title: 'Amp anxiety', body: S => student(S) + ' yells "AMPLIFY!" every time anyone touches a button. Including the microwave.' },
    { req: S => S.year === 2025 && inSeason(S), title: 'Coral dust', body: () => 'PVC dust is everywhere. The custodian has opinions and has shared them.' },
    { req: S => S.year === 2025 && inSeason(S), title: 'Algae count', body: () => 'Algae (the ball) in the shop: 37. Algae (the real kind) in the team fish tank: also too many.' },
    { req: S => S.year === 2026 && inSeason(S), title: 'Fuel everywhere', body: () => 'Fuel balls found so far: backpacks (4), the microwave (1), the principal\'s office (2), unaccounted for (lots).' },
    { req: S => S.year === 2026 && inSeason(S), title: 'Hub shift drills', body: S => student(S) + ' now announces "SHIFT CHANGE!" every 25 seconds during practice. Even during lunch.' },
    // calendar-specific
    { req: S => S.phase === 'off' && ['Jun', 'Jul', 'Aug'].includes(month(S)), title: 'Summer shop day', body: () => 'Summer shop day: a few students built a machine that makes smoothies. It is the most reliable mechanism you own.' },
    { req: S => S.phase === 'off' && ['Jun', 'Jul', 'Aug'].includes(month(S)), title: 'Alumni visit', body: S => 'An alum visited from college and said college robotics is "the same chaos, just with a bigger budget".' },
    { req: S => S.phase === 'off' && month(S) === 'Sep', title: 'Club fair', body: () => 'Club fair: the robot drove into the cafeteria and recruited three freshmen and one confused chemistry teacher.' },
    { req: S => S.phase === 'off' && month(S) === 'Oct', title: 'Halloween costumes', body: S => student(S) + ' came to the meeting dressed as a swerve module. Nobody understood it except the programmers.' },
    { req: S => S.phase === 'off' && month(S) === 'Dec', title: 'Holiday party', body: () => 'Holiday gift exchange: nine of the twelve gifts were hex key sets. Everyone was happy.' },
    { req: S => S.phase === 'off' && month(S) === 'Dec', title: 'Kickoff predictions', body: S => student(S) + '\'s prediction for next season\'s game: "robots throw robots". The pool is open at $1 a guess.' },
    { req: S => S.phase === 'off' && S.history.length > 0, title: 'Looking back', body: S => { const h = S.history[S.history.length - 1]; return 'Someone made a highlight video of the ' + h.year + ' season. The comment section is entirely parents, and it is wonderful.'; } }
  ];

  function post(S, title, body, kind) { G.Career.inbox(S, title, body, kind); }
  // Called once per turn
  N.turn = function (S) {
    if (R().chance(0.15)) {
      const pool = EVENTS.filter(e => !e.req || e.req(S));
      const e = R().wpick(pool, x => x.w);
      const res = e && e.run(S);
      if (res) post(S, res[0], res[1], 'news');
    }
    if (R().chance(0.32)) {
      const recent = new Set(S.inbox.slice(0, 25).map(m => m.title));
      const pool = CHAT.filter(c => (!c.req || c.req(S)) && !recent.has(c.title));
      if (pool.length) { const c = R().pick(pool); post(S, c.title, c.body(S), 'fun'); }
    }
  };
  N.kickoff = function (S) {
    const mf = G.Seasons[S.year].meta;
    if (mf && mf.faults) G.Career.inbox(S, 'Scouting report: what breaks this year', mf.faults + ' Expect brief comms drops at every event; clean wiring and a reliable, well-maintained robot keep them rare and short.', 'info');
    post(S, 'Kickoff watch party', R().int(18, 45) + ' students, ' + R().int(4, 12) + ' boxes of donuts and one very loud reaction when the ' + G.Seasons[S.year].name + ' field appeared on screen. ' + student(S) + ' has already sketched three robots on a napkin.', 'fun');
  };
  N.afterEvent = function (S, r) {
    if (!r || !R().chance(0.6)) return;
    const lines = r.won ? ['The bus ride home was one long chant. ' + driver(S) + ' slept clutching the banner.', 'The group chat has posted the winning-match video 63 times. Nobody is tired of it yet.']
      : r.playoffs ? ['The drive team got a standing ovation from the parents in the stands. ' + driver(S) + ' turned bright red.', student(S) + ' is already making a list of "things we fix before next time". It is four pages long.']
        : ['Tough event. ' + mentor(S) + ' gave a speech about learning from it that made two people cry, one of them ' + mentor(S).split(' ')[0] + '.', 'The team agreed on three things to fix and ate an entire gas station\'s worth of snacks on the way home.'];
    post(S, 'After ' + r.name, R().pick(lines), 'fun');
  };
})();

</script>
<script>/* js/render/draw.js */
'use strict';
/* FRC Manager — 2D rendering: season fields (top-down), robots (top-down + side profile), effects */
(function () {
  const E = G.Engine, FW = E.FW, FH = E.FH;
  const Rd = G.Render = {};
  const COL = {
    red: '#e5484d', blue: '#3e8cff', redS: 'rgba(229,72,77,0.16)', blueS: 'rgba(62,140,255,0.16)',
    carpet: '#2a3036', carpet2: '#262b31', line: 'rgba(235,240,245,0.55)', metal: '#9aa4ae', dark: '#1a1e23',
    cargoR: '#ff6b6b', cargoB: '#5aa2ff', cone: '#ffd23f', cube: '#9b6bff', note: '#ff9a3c', coral: '#f3efe6', algae: '#3fd0b0', fuel: '#ffd84a'
  };
  Rd.COL = COL;
  const alc = a => a === 'red' ? COL.red : COL.blue;
  const als = a => a === 'red' ? COL.redS : COL.blueS;

  function P(sym, a, x, y) { return a === 'blue' ? { x, y } : sym === 'mirror' ? { x: FW - x, y } : { x: FW - x, y: FH - y }; }
  function rect(ctx, s, x, y, w, h, fill, stroke, lw) {
    ctx.beginPath(); ctx.rect(x * s, y * s, w * s, h * s);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  // rect given in blue coords, converted for alliance a
  function arect(ctx, s, sym, a, x, y, w, h, fill, stroke, lw) {
    const p = P(sym, a, x, y), q = P(sym, a, x + w, y + h);
    rect(ctx, s, Math.min(p.x, q.x), Math.min(p.y, q.y), Math.abs(q.x - p.x), Math.abs(q.y - p.y), fill, stroke, lw);
  }
  function circ(ctx, s, x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function poly(ctx, s, pts, fill, stroke, lw) {
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x * s, p.y * s) : ctx.moveTo(p.x * s, p.y * s)); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function line(ctx, s, x0, y0, x1, y1, col, lw, dash) {
    ctx.beginPath(); ctx.moveTo(x0 * s, y0 * s); ctx.lineTo(x1 * s, y1 * s);
    ctx.strokeStyle = col; ctx.lineWidth = lw || 1.5; if (dash) ctx.setLineDash(dash); ctx.stroke(); if (dash) ctx.setLineDash([]);
  }
  function text(ctx, s, str, x, y, col, size, align) {
    ctx.fillStyle = col; ctx.font = '600 ' + Math.round((size || 11) * Math.max(0.85, Math.min(2.6, s / 62))) + 'px system-ui, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x * s, y * s);
  }
  function seeded(n) { const r = G.makeRng(n); return () => r.next(); }

  // ------------------------------------------------------------------
  // Field
  // ------------------------------------------------------------------
  // polygon given in blue coordinates, converted for alliance a
  function apoly(ctx, s, sym, a, pts, fill, stroke, lw) { poly(ctx, s, pts.map(p => P(sym, a, p[0], p[1])), fill, stroke, lw); }
  function aline(ctx, s, sym, a, x0, y0, x1, y1, col, lw, dash) { const p = P(sym, a, x0, y0), q = P(sym, a, x1, y1); line(ctx, s, p.x, p.y, q.x, q.y, col, lw, dash); }
  function atext(ctx, s, sym, a, str, x, y, col, size) { const p = P(sym, a, x, y); text(ctx, s, str, p.x, p.y, col, size); }
  // a ball with a soft highlight (cargo, algae, fuel)
  function ball(ctx, s, x, y, r, col) {
    circ(ctx, s, x, y, r, col, 'rgba(0,0,0,0.35)', 1);
    circ(ctx, s, x - r * 0.3, y - r * 0.3, r * 0.35, 'rgba(255,255,255,0.35)');
  }
  function ring(ctx, s, x, y, r, col, alpha) { ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; circ(ctx, s, x, y, r, null, col, Math.max(2, r * s * 0.55)); ctx.restore(); }
  const METAL = '#aab4be', DARKM = '#2c3238', TAPE = 'rgba(240,244,248,0.7)';
  Rd.field = function (ctx, year, s, m) {
    const S = G.Seasons[year], sym = S.sym;
    // carpet with subtle seams
    ctx.fillStyle = COL.carpet; ctx.fillRect(0, 0, FW * s, FH * s);
    for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? COL.carpet : COL.carpet2; ctx.fillRect(i * FW / 16 * s, 0, FW / 16 * s + 1, FH * s); }
    // guardrail and alliance walls with driver stations
    rect(ctx, s, 0.03, 0.03, FW - 0.06, FH - 0.06, null, '#59626c', Math.max(2, s * 0.06));
    [['blue', 0.0], ['red', FW - 0.1]].forEach(([a, x]) => {
      rect(ctx, s, x, 0.03, 0.1, FH - 0.06, alc(a));
      for (let i = 0; i < 3; i++) rect(ctx, s, x + (a === 'blue' ? 0.1 : -0.06), 1.4 + i * 2.05, 0.06, 1.2, 'rgba(255,255,255,0.18)');
    });
    line(ctx, s, FW / 2, 0.05, FW / 2, FH - 0.05, 'rgba(255,255,255,0.22)', 2);
    const fn = FIELD[year];
    if (fn) fn(ctx, s, sym, m);
  };

  const FIELD = {};
  FIELD[2022] = function (ctx, s, sym, m) {
    const cx = FW / 2, cy = FH / 2;
    ['blue', 'red'].forEach(a => {
      // two tarmac sections per alliance around the hub
      [[112, 174], [186, 248]].forEach(([d0, d1]) => {
        const pts = [];
        for (let d = d0; d <= d1; d += 6) { const g = d * Math.PI / 180; pts.push([cx + Math.cos(g) * 3.1, cy + Math.sin(g) * 3.1]); }
        for (let d = d1; d >= d0; d -= 6) { const g = d * Math.PI / 180; pts.push([cx + Math.cos(g) * 1.55, cy + Math.sin(g) * 1.55]); }
        apoly(ctx, s, sym, a, pts, als(a), alc(a), 2);
      });
      // hangar: low / mid / high / traversal rungs between four posts
      arect(ctx, s, sym, a, 0.12, 0.12, 3.05, 2.65, 'rgba(0,0,0,0.28)', alc(a), 2);
      [[0.22, 0.22], [3.07, 0.22], [0.22, 2.67], [3.07, 2.67]].forEach(p => { const q = P(sym, a, p[0], p[1]); rect(ctx, s, q.x - 0.09, q.y - 0.09, 0.18, 0.18, '#5d6670', METAL, 1); });
      ['LOW', 'MID', 'HIGH', 'TRAV'].forEach((nm, i) => {
        const x = 0.62 + i * 0.75;
        aline(ctx, s, sym, a, x, 0.3, x, 2.6, i >= 2 ? '#d7dde3' : METAL, 2 + i);
        atext(ctx, s, sym, a, nm, x, 2.9, alc(a), 8);
      });
      // terminal with the human player chute
      apoly(ctx, s, sym, a, [[0.08, 6.5], [1.7, 8.13], [0.08, 8.13]], als(a), alc(a), 2);
      aline(ctx, s, sym, a, 0.3, 7.45, 0.9, 8.05, '#e8edf2', 3);
      atext(ctx, s, sym, a, 'TERMINAL', 0.75, 7.75, alc(a), 7);
    });
    // hub: fender octagon, upper-hub net ring and the four lower exits
    const oct = []; for (let i = 0; i < 8; i++) { const g = (i * 45 + 22.5) * Math.PI / 180; oct.push({ x: cx + Math.cos(g) * 1.42, y: cy + Math.sin(g) * 1.42 }); }
    [45, 135, 225, 315].forEach(d => { const g = d * Math.PI / 180, ex = cx + Math.cos(g) * 1.62, ey = cy + Math.sin(g) * 1.62; circ(ctx, s, ex, ey, 0.22, '#3d454e', METAL, 1.5); });
    poly(ctx, s, oct, '#353c44', '#c8d0d8', 2.5);
    circ(ctx, s, cx, cy, 0.95, '#2b3138', '#8d97a1', 1.5);
    ctx.save(); ctx.setLineDash([3, 3]); circ(ctx, s, cx, cy, 0.68, '#3f4750', '#e8edf2', 2); ctx.restore();
    circ(ctx, s, cx, cy, 0.25, '#1d2227', METAL, 1);
    text(ctx, s, 'HUB', cx, cy + 0.42, '#e8edf2', 9);
    // cargo: live positions during a match, a typical spread otherwise
    if (m && m.cargo) m.cargo.forEach(c => { if (c.t <= m.t) ball(ctx, s, c.x, c.y, 0.12, c.c === 'red' ? COL.cargoR : COL.cargoB); });
    else { const r = seeded(2022); for (let i = 0; i < 18; i++) { const x = 1.2 + r() * (FW - 2.4), y = 0.6 + r() * (FH - 1.2); if (Math.hypot(x - cx, y - cy) < 2.1) continue; ball(ctx, s, x, y, 0.12, i % 2 ? COL.cargoR : COL.cargoB); } }
  };
  FIELD[2023] = function (ctx, s, sym, m) {
    ['blue', 'red'].forEach(a => {
      // community and loading zone tape
      apoly(ctx, s, sym, a, [[0.05, 0.05], [4.9, 0.05], [4.9, 5.5], [3.4, 5.5], [3.4, 5.55], [0.05, 5.55]], als(a), alc(a), 1.5);
      arect(ctx, s, sym, a, 13.2, 5.5, 3.3, 2.66, als(a), alc(a), 1.5);
      // grid: 3 rows x 9 columns; co-op grid in the middle
      arect(ctx, s, sym, a, 0.05, 0.12, 1.42, 5.28, '#23282e', alc(a), 2);
      arect(ctx, s, sym, a, 0.08, 1.87, 1.36, 1.76, null, 'rgba(255,255,255,0.35)', 1);
      const g = m && m.ss[a] ? m.ss[a].grid : null;
      for (let row = 0; row < 3; row++) for (let col = 0; col < 9; col++) {
        const x = 1.2 - row * 0.42, y = 0.5 + col * 0.56, p = P(sym, a, x, y);
        const type = row === 0 ? 'any' : ([1, 4, 7].includes(col) ? 'cube' : 'cone');

    else if (mp === 'low') { ctx.fillStyle = '#e8edf2'; ctx.fillRect(h * 0.55, -h * 0.5, h * 0.25, h); }
    else if (mp === 'ampbar') { ctx.fillStyle = '#e8edf2'; ctx.fillRect(-h * 0.8, -h * 0.85, h * 1.2, h * 0.12); }
    // shooter
    const sh = lk.shooter;
    if (sh === 'turret') {
      ctx.save();
      const ang = o.aim != null ? o.aim - (r.hd || 0) : 0;
      ctx.beginPath(); ctx.arc(-h * 0.1, 0, sz * 0.24, 0, 7); ctx.fillStyle = '#2f353c'; ctx.fill(); ctx.strokeStyle = lk.c2 || '#ffcf4a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.translate(-h * 0.1, 0); ctx.rotate(ang); ctx.fillStyle = '#e8edf2'; ctx.fillRect(0, -sz * 0.05, sz * 0.36, sz * 0.1);
      ctx.restore();
    } else if (sh === 'hood' || sh === 'pivot') {
      ctx.fillStyle = '#2f353c'; ctx.fillRect(-h * 0.6, -h * 0.4, h * 0.8, h * 0.8);
      ctx.strokeStyle = lk.c2 || '#ffcf4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-h * 0.2, 0, h * 0.35, -1.2, 1.2); ctx.stroke();
    } else if (sh === 'fixed') { ctx.fillStyle = '#2f353c'; ctx.fillRect(-h * 0.55, -h * 0.35, h * 0.7, h * 0.7); ctx.fillStyle = '#e8edf2'; ctx.fillRect(-h * 0.55, -h * 0.08, h * 0.7, h * 0.16); }
    else if (sh === 'dump') {
      ctx.fillStyle = '#2f353c'; ctx.fillRect(h * 0.2, -h * 0.86, h * 0.42, h * 1.72);
      ctx.fillStyle = lk.c2 || '#ffcf4a';
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(h * 0.41, -h * 0.68 + i * h * 0.34, sz * 0.055, 0, 7); ctx.fill(); }
    }
    // algae mech
    if (lk.algae === 'net') { ctx.beginPath(); ctx.arc(-h * 0.55, h * 0.45, sz * 0.12, 0, 7); ctx.fillStyle = COL.algae; ctx.fill(); }
    else if (lk.algae === 'proc') { ctx.fillStyle = COL.algae; ctx.fillRect(-h * 0.8, h * 0.35, h * 0.3, h * 0.3); }

    const cl = lk.climber;
    if (cl && cl !== 'none') {
      ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = cl === 'arms' ? 3 : 2;
      const len = cl === 'arms' ? 0.32 : cl === 'hook2' ? 0.22 : 0.16;
      [-1, 1].forEach(sd => { ctx.beginPath(); ctx.moveTo(-h * 0.85, sd * h * 0.6); ctx.lineTo(-h * 0.85 - sz * len, sd * h * 0.6); ctx.stroke(); });
    }
    // held piece
    if (r.held && !lk.hopper) {
      const t = r.heldType;
      const col = t === 'cone' ? COL.cone : t === 'cube' ? COL.cube : t === 'algae' ? COL.algae : t === 'coral' ? COL.coral : G.S && r.year === 2024 ? COL.note : null;
      ctx.rotate(-(r.hd || 0));
      if (t === 'cone') { ctx.beginPath(); ctx.moveTo(0, -sz * 0.2); ctx.lineTo(sz * 0.16, sz * 0.14); ctx.lineTo(-sz * 0.16, sz * 0.14); ctx.closePath(); ctx.fillStyle = COL.cone; ctx.fill(); }
      else if (t === 'cube') { ctx.fillStyle = COL.cube; ctx.fillRect(-sz * 0.14, -sz * 0.14, sz * 0.28, sz * 0.28); }
      else if (t === 'coral') { ctx.fillStyle = COL.coral; ctx.fillRect(-sz * 0.22, -sz * 0.06, sz * 0.44, sz * 0.12); }
      else if (t === 'algae') { ctx.beginPath(); ctx.arc(0, 0, sz * 0.17, 0, 7); ctx.fillStyle = COL.algae; ctx.fill(); }
      else if (o.year === 2024) { ctx.beginPath(); ctx.arc(0, 0, sz * 0.15, 0, 7); ctx.strokeStyle = COL.note; ctx.lineWidth = 4; ctx.stroke(); }
      else { for (let i = 0; i < Math.min(2, r.held); i++) { ctx.beginPath(); ctx.arc((i - (r.held > 1 ? 0.5 : 0)) * sz * 0.26, 0, sz * 0.12, 0, 7); ctx.fillStyle = r.a === 'red' ? COL.cargoR : COL.cargoB; ctx.fill(); } }
      ctx.rotate(r.hd || 0);
    }
    ctx.restore();
    // labels (unrotated)
    ctx.save();
    ctx.font = '700 ' + Math.max(9, Math.round(s * 0.27)) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
    ctx.strokeText(String(r.team), x, y + h + 8); ctx.fillText(String(r.team), x, y + h + 8);
    if (r.isPlayer) { ctx.beginPath(); ctx.arc(x, y, sz * 0.82, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]); }
    if (r.dead || r.fault) {
      ctx.fillStyle = r.dead ? 'rgba(20,20,20,0.6)' : 'rgba(255,170,0,0.35)'; ctx.fillRect(x - h, y - h, sz, sz);
      ctx.fillStyle = r.dead ? '#ff5c5c' : '#ffb020'; ctx.font = '800 ' + Math.round(sz * 0.5) + 'px system-ui'; ctx.fillText(r.dead ? '✕' : '!', x, y);
    }
    if (r.defBy) { ctx.strokeStyle = 'rgba(255,90,90,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, sz * 0.75, 0, 7); ctx.stroke(); }

  };
  function shade(hex, k) {
    const c = hex.replace('#', ''); const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);

  }
  Rd.shade = shade;

  // ------------------------------------------------------------------
  // Robot — side profile (Garage)
  // ------------------------------------------------------------------
  Rd.robotSide = function (ctx, W, H, look, a, team) {
    const lk = look || {};
    ctx.clearRect(0, 0, W, H);
    const gy = H - 24, s = Math.min(W / 2.0, (H - 30) / 1.45);
    // floor
    ctx.fillStyle = '#20252b'; ctx.fillRect(0, gy, W, 24);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();

    const wr = 0.075 * s;
    const nW = lk.drive === 'swerve' ? 2 : 3;

    ctx.fillStyle = frame; ctx.fillRect(x0, fy - 0.05 * s, fw, 0.07 * s);
    ctx.fillStyle = alc(a || 'blue'); ctx.fillRect(x0 - 0.06 * s, fy - 0.02 * s, fw + 0.12 * s, 0.13 * s);
    ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.round(0.08 * s) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(team || ''), cx, fy + 0.045 * s);
    const top = fy - 0.05 * s;
    // electronics belly pan
    ctx.fillStyle = '#2b3036'; ctx.fillRect(x0 + 0.08 * s, top - 0.08 * s, fw * 0.5, 0.08 * s);
    ctx.fillStyle = '#e5484d'; ctx.fillRect(x0 + 0.12 * s, top - 0.06 * s, 0.05 * s, 0.04 * s);
    // manipulator / elevator
    const mp = lk.manip;
    ctx.strokeStyle = '#d6dce2'; ctx.fillStyle = '#c3cad1';
    if (mp === 'elevator' || mp === 'elevwrist' || mp === 'ampbar') {
      const eh = (mp === 'ampbar' ? 0.35 : low ? 0.5 : 1.1) * s;
      ctx.fillRect(cx - 0.02 * s, top - eh, 0.04 * s, eh); ctx.fillRect(cx + 0.06 * s, top - eh * 0.92, 0.035 * s, eh * 0.92);
      ctx.fillStyle = frame; ctx.fillRect(cx - 0.02 * s, top - eh * 0.6, 0.2 * s, 0.08 * s);
      if (mp === 'elevwrist') { ctx.fillStyle = lk.c2 || '#ffcf4a'; ctx.save(); ctx.translate(cx + 0.18 * s, top - eh * 0.56); ctx.rotate(-0.5); ctx.fillRect(0, -0.03 * s, 0.22 * s, 0.07 * s); ctx.restore(); }
    } else if (mp === 'arm' || mp === 'dja') {
      ctx.lineWidth = 0.05 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 0.2 * s, top - 0.35 * s);
      if (mp === 'dja') { ctx.lineTo(cx + 0.1 * s, top - 0.85 * s); ctx.lineTo(cx + 0.55 * s, top - 0.7 * s); }
      else ctx.lineTo(cx + 0.45 * s, top - 0.65 * s);
      ctx.stroke();
      ctx.fillStyle = '#d6dce2'; ctx.fillRect(cx - 0.25 * s, top - 0.35 * s, 0.06 * s, 0.35 * s);
    } else if (mp === 'low') { ctx.fillStyle = '#d6dce2'; ctx.fillRect(x0 + fw - 0.05 * s, top - 0.2 * s, 0.12 * s, 0.05 * s); }
    // shooter
    const sh = lk.shooter;
    if (sh) {
      const sy = top - (low ? 0.12 : 0.28) * s, sx = cx - 0.15 * s;
      ctx.fillStyle = '#2f353c';
      if (sh === 'turret') { ctx.fillRect(sx - 0.18 * s, sy + 0.04 * s, 0.36 * s, 0.06 * s); ctx.beginPath(); ctx.arc(sx, sy, 0.12 * s, Math.PI, 0); ctx.fill(); ctx.strokeStyle = lk.c2 || '#ffcf4a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, 0.12 * s, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke(); }
      else if (sh === 'hood' || sh === 'pivot') { ctx.beginPath(); ctx.arc(sx, sy, 0.12 * s, 0, 7); ctx.fill(); ctx.strokeStyle = lk.c2 || '#ffcf4a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, 0.15 * s, Math.PI * 1.15, Math.PI * 1.75); ctx.stroke(); }
      else if (sh === 'fixed') { ctx.save(); ctx.translate(sx, sy); ctx.rotate(-0.9); ctx.fillRect(-0.05 * s, -0.05 * s, 0.32 * s, 0.1 * s); ctx.restore(); }
      else if (sh === 'dump') { ctx.fillRect(sx - 0.05 * s, sy - 0.12 * s, 0.42 * s, 0.24 * s); ctx.fillStyle = lk.c2 || '#ffcf4a'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(sx + 0.05 * s + i * 0.12 * s, sy, 0.045 * s, 0, 7); ctx.fill(); } ctx.fillStyle = '#2f353c'; }
      ctx.fillStyle = '#2f353c'; ctx.fillRect(sx - 0.03 * s, sy, 0.06 * s, top - sy);
    }
    // hopper
    if (lk.hopper) { const hh = Math.min(0.5, 0.15 + lk.hopper / 120) * s * (low ? 0.6 : 1); ctx.strokeStyle = '#aab3bc'; ctx.lineWidth = 2; ctx.strokeRect(x0 + 0.06 * s, top - hh, fw * 0.55, hh); ctx.fillStyle = 'rgba(255,216,74,0.35)'; ctx.fillRect(x0 + 0.06 * s, top - hh * 0.5, fw * 0.55, hh * 0.5); }
    // intake
    const it = lk.intake;
    if (it && it !== 'none') {
      const ix = it === 'dual' ? [x0 - 0.08 * s, x0 + fw + 0.08 * s] : [x0 + fw + 0.08 * s];
      ix.forEach(xx => { ctx.beginPath(); ctx.arc(xx, fy + (it === 'under' ? 0.06 : -0.04) * s, (it === 'wide' ? 0.06 : 0.05) * s, 0, 7); ctx.fillStyle = '#d9dee3'; ctx.fill(); });
      if (it === 'funnel') { ctx.strokeStyle = '#d9dee3'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0 + 0.1 * s, top - 0.55 * s); ctx.lineTo(x0 + 0.25 * s, top - 0.2 * s); ctx.lineTo(x0 + 0.4 * s, top - 0.55 * s); ctx.stroke(); }
      if (it === 'claw') { ctx.fillStyle = '#d9dee3'; ctx.fillRect(x0 + fw - 0.02 * s, top - 0.45 * s, 0.14 * s, 0.05 * s); }
    }

    const cl = lk.climber;
    if (cl && cl !== 'none') {
      const ch = { hook: 0.55, hook2: 0.75, arms: 0.95 }[cl] * s * (low ? 0.75 : 1), clx = x0 + 0.06 * s;
      ctx.fillStyle = '#ffcf4a'; ctx.fillRect(clx, top - ch, 0.035 * s, ch);

    if (lk.vision) { ctx.fillStyle = '#111'; ctx.fillRect(cx + 0.25 * s, top - 0.12 * s, 0.06 * s, 0.05 * s); ctx.fillStyle = '#4cff8a'; ctx.fillRect(cx + 0.31 * s, top - 0.11 * s, 0.015 * s, 0.03 * s); if (lk.vision > 1) { ctx.fillStyle = '#111'; ctx.fillRect(x0 + 0.1 * s, top - 0.16 * s, 0.06 * s, 0.05 * s); } }

    if (low) { ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(0, gy - 0.6 * s); ctx.lineTo(W, gy - 0.6 * s); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '10px system-ui'; ctx.textAlign = 'left'; ctx.fillText('trench clearance', 6, gy - 0.6 * s - 7); }
  };

  // ------------------------------------------------------------------
  // Effects
  // ------------------------------------------------------------------
  Rd.fx = function (ctx, s, m) {
    const now = m.t;
    m.fx = m.fx.filter(f => now - f.t < 1.2);
    m.fx.forEach(f => {
      const age = (now - f.t) / 1.2;
      if (f.k === 'shot') {
        const k = Math.min(1, age * 2.2);
        const x = f.x0 + (f.x1 - f.x0) * k, y = f.y0 + (f.y1 - f.y0) * k - Math.sin(k * Math.PI) * 0.6;

      } else if (f.k === 'pop') {

        text(ctx, s, f.text, f.x, f.y - 0.4 - age * 0.8, alc(f.a), 13);

  };

  // Scaled static preview of a season field with sample robots
  Rd.preview = function (canvas, year) {
    const ctx = canvas.getContext('2d'), s = canvas.width / FW;
    Rd.field(ctx, year, s, null);
  };

<script>/* js/ui/ui.js */
'use strict';
/* FRC Manager — UI framework + headquarters screens */
(function () {
  const U = G.U, D = G.Data, h = U.esc;
  const UI = G.UI = { screen: 'menu', p: {}, st: {}, A: {}, S: {}, jobs: [] };
  UI.prefs = Object.assign({ speed: 2 }, G.Save.settings());

  // ---------------- core ----------------
  // While an event is open, only event screens (and the full-screen menus) are reachable.
  UI.EVENT_SCREENS = ['event', 'prematch', 'live', 'mresult', 'menu', 'help', 'notes', 'settings', 'load', 'newgame'];
  UI.go = function (screen, p) {
    if (G.S && G.S.event && UI.EVENT_SCREENS.indexOf(screen) < 0) screen = 'event';
    UI.stopLive && UI.stopLive(); UI.screen = screen; UI.p = p || {}; UI.render();
    const mn = document.getElementById('main'); if (mn) mn.scrollTop = 0;
  };
  UI.render = function () {
    const app = document.getElementById('app');
    const scr = UI.S[UI.screen] || UI.S.menu;
    UI.jobs = [];
    let body;
    try { body = scr.html(); }
    catch (e) { console.error(e); body = '<div class="card"><b>Something went wrong rendering this screen.</b><pre class="sm muted">' + h(e.stack || e) + '</pre><button class="btn" data-act="nav" data-arg="hq">Back to HQ</button></div>'; }
    if (scr.full) app.innerHTML = body;
    else app.innerHTML = topbar() + '<div class="shell">' + sidebar(scr.nav || UI.screen) + '<div class="main" id="main">' + body + '</div></div>';
    UI.jobs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
    if (scr.after) scr.after();
    if (!UI.verChecked && UI.versionCheck) { UI.verChecked = true; setTimeout(UI.versionCheck, 350); } // "Updated to vX" once per new version
  };
  UI.job = f => UI.jobs.push(f);
  UI.modal = function (html, opts) {
    UI.closeModal();
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'modal';
    bg.innerHTML = '<div class="modal ' + (opts && opts.wide ? 'wide' : '') + '">' + html + '</div>';
    if (!(opts && opts.lock)) bg.addEventListener('click', e => { if (e.target === bg) UI.closeModal(); });
    document.body.appendChild(bg);
    if (opts && opts.after) opts.after();
  };
  UI.closeModal = function () { const m = document.getElementById('modal'); if (m) m.remove(); };
  UI.toast = function (msg, kind) {
    let box = document.querySelector('.toasts');
    if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
    const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
    box.appendChild(t); setTimeout(() => t.remove(), 3800);
  };
  UI.confirm = function (title, text, yes, onYes) {
    UI._yes = onYes;
    UI.modal('<h2>' + h(title) + '</h2><p class="muted" style="white-space:pre-wrap">' + h(text) + '</p><div class="row mt"><span class="sp"></span><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="confirmYes">' + h(yes || 'OK') + '</button></div>');
  };
  UI.A.closeModal = () => UI.closeModal();
  UI.A.confirmYes = () => { const f = UI._yes; UI.closeModal(); if (f) f(); };
  UI.err = function (e) { if (e) { UI.toast(typeof e === 'string' ? e : (e.join ? e.join(' ') : String(e)), 'bad'); return true; } return false; };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = UI.A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
  });

    const el = e.target.closest('[data-chg]');
