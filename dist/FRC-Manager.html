<script>/* js/systems/robot.js */
'use strict';
/* FRC Manager — player robot, development projects, tech knowledge, wear & repairs */
(function () {
  const U = G.U, D = G.Data;
  const Robot = G.Robot = {};
  const EFFORT = { rush: { name: 'Rush', h: 0.6, gain: 0.75, cost: 0.9, rel: -3 }, std: { name: 'Standard', h: 1, gain: 1, cost: 1, rel: 0 }, thorough: { name: 'Thorough', h: 1.4, gain: 1.2, cost: 1.15, rel: 2 } };
  Robot.EFFORT = EFFORT;
  Robot.WEIGHT_LIMIT = 125;

  // ---------------- Knowledge ----------------
  Robot.know = (S, area) => D.knowLevel(S.know[area] || 0);
  Robot.addXP = function (S, area, xp) {
    if (!area) return 0;
    let mult = 1 + (G.Career.hasPerk(S, 'xpBonus') ? 0.1 : 0);
    if (S.mentors.some(m => m.spec === area)) mult *= 1.5;
    const before = Robot.know(S, area);
    S.know[area] = Math.round((S.know[area] || 0) + xp * mult);
    S.usedAreas[area] = true;
    const after = Robot.know(S, area);
    if (after > before) G.Career.inbox(S, 'Knowledge level up: ' + D.AREA[area].name, 'Your team reached Level ' + after + ' in ' + D.AREA[area].name + '. Concepts that use it get higher ceilings, fewer build hours and better reliability.', 'know');
    return xp * mult;
  };
  const mainArea = c => (c.areas && c.areas[0]) || null;
  const statArea = (subId, c, stat) => subId === 'soft' && D.STAT_AREA[stat] ? D.STAT_AREA[stat] : mainArea(c);

  // ---------------- Robot lifecycle ----------------
  Robot.newSeason = function (S, year) {
    const subs = {};
    G.Seasons[year].subs.forEach(sd => { subs[sd.id] = { concept: null, ver: 0, stats: {}, rel: 0, cond: 100, w: 0, hidden: 0, hours: 0 }; });
    const soft = G.Seasons.concept(year, 'soft', 'code');
    const st = {};
    Object.keys(soft.base).forEach(k => st[k] = soft.base[k] + 3 * Robot.know(S, statArea('soft', soft, k)));
    subs.soft = { concept: 'code', ver: 1, stats: st, rel: 90, cond: 100, w: 0, hidden: 0, hours: 0 };
    S.robot = { year, subs, autoTier: 0, visionLvl: 0, practiceBot: false, pending: [], emergency: 0 };
    S.projects = S.projects.filter(p => p.type === 'research' || p.type === 'kb');
  };
  Robot.ceil = function (S, year, subId, c, stat) {
    let v = (c.ceil[stat] || 0) + 3 * Robot.know(S, statArea(subId, c, stat));
    const P = S.parts;
    if (subId === 'drive' && stat === 'speed') v += [0, 4, 8][P.motors || 0] + (c.id === 'swerve' && P.swerve === 2 ? 3 : 0);
    if (stat === 'scoreSpd') v += [0, 3, 6][P.motors || 0];
    if (stat === 'auto') v += P.sensors ? 5 : 0;
    return Math.min(99, v);
  };
  Robot.firstTime = (S, c) => c.cx >= 3 && mainArea(c) && Robot.know(S, mainArea(c)) === 0;
  Robot.reqOk = function (S, c) {
    if (c.req && c.req.part === 'swerve' && !(S.parts.swerve > 0)) return 'Needs swerve modules (Parts store)';
    return null;
  };
  Robot.weight = function (S) {
    if (!S.robot) return 0;
    return Math.round(Object.keys(S.robot.subs).reduce((s, k) => s + (S.robot.subs[k].ver ? S.robot.subs[k].w : 0), 0));
  };
  Robot.cap = function (S) {
    const R = S.robot;
    return G.Cap.build(R.year, R.subs, { autoTier: R.autoTier, visionLvl: R.visionLvl, parts: S.parts });
  };
  Robot.look = function (S) {
    const R = S.robot;
    const lk = G.Cap.look(R.year, R.subs, { visionLvl: R.visionLvl });
    lk.c1 = S.team.c1; lk.c2 = S.team.c2;
    return lk;
  };
  Robot.condAvg = function (S) {
    const subs = Object.keys(S.robot.subs).filter(k => k !== 'soft' && S.robot.subs[k].ver);
    return subs.length ? U.avg(subs.map(k => S.robot.subs[k].cond)) : 100;
  };
  Robot.hidden = S => Object.values(S.robot.subs).reduce((s, x) => s + (x.ver ? x.hidden : 0), 0);

  // ---------------- Projects ----------------
  function hwMult(S, subId) {
    let m = G.Shop.hwHoursMult(S);
    m *= 1 - 0.12 * G.Career.mentorSkill(S, 'fab') / 100;
    if (G.Career.hasPerk(S, 'fabSpeed')) m *= 0.9;
    if (S.parts.pneu && (subId === 'intake' || subId === 'scorer')) m *= 0.85;
    return m;
  }
  function swMult(S) {
    let m = G.Shop.swHoursMult(S);
    m *= 1 - 0.2 * G.Career.mentorSkill(S, 'prog') / 100;
    if (G.Career.hasPerk(S, 'progSpeed')) m *= 0.85;
    return m;
  }
  // Returns {hours, cost, name, err}
  Robot.quote = function (S, spec) {
    const year = S.robot ? S.robot.year : S.year;
    const ef = EFFORT[spec.effort || 'std'];
    let hours = 0, cost = 0, name = '', err = null;
    const sub = spec.sub && S.robot ? S.robot.subs[spec.sub] : null;
    const sd = spec.sub ? G.Seasons.sub(year, spec.sub) : null;
    if (['upgrade', 'harden', 'light'].includes(spec.type) && (!sub || !sub.ver)) return { hours: 0, cost: 0, name: '', err: 'Build this subsystem first' };
    if (spec.type !== 'research' && spec.type !== 'kb' && !S.robot) return { hours: 0, cost: 0, name: '', err: 'No robot this season yet' };
    switch (spec.type) {
      case 'build': {
        const c = G.Seasons.concept(year, spec.sub, spec.concept);
        err = Robot.reqOk(S, c);
        hours = c.hours * ef.h * (1 - 0.06 * Robot.know(S, mainArea(c))) * (Robot.firstTime(S, c) ? 1.2 : 1) * hwMult(S, spec.sub);
        cost = (c.cost + 250 * c.cx) * ef.cost;
        name = (sub && sub.ver ? 'Switch to ' : 'Build ') + c.name;
        break;
      }
      case 'upgrade': {
        const c = G.Seasons.concept(year, spec.sub, sub.concept);
        const soft = spec.sub === 'soft';
        hours = (soft ? 60 : 40 + 20 * c.cx) * ef.h * (1 - 0.06 * Robot.know(S, statArea(spec.sub, c, spec.focus))) * (soft ? swMult(S) : hwMult(S, spec.sub));
        cost = (soft ? 120 : 250 + 200 * c.cx) * ef.cost;
        name = sd.name + ' upgrade (' + (D.STAT[spec.focus] || spec.focus) + ')';
        break;
      }
      case 'harden': { const c = G.Seasons.concept(year, spec.sub, sub.concept); hours = (40 + 10 * c.cx) * hwMult(S, spec.sub); cost = 100 + 50 * c.cx; name = sd.name + ' hardening'; break; }
      case 'light': { hours = 40 * hwMult(S, spec.sub); cost = 150; name = sd.name + ' lightweighting'; break; }
      case 'auto': {
        const t = S.robot.autoTier;
        if (t >= 3) err = 'Best auto already';
        hours = (60 + 40 * (t + 1)) * swMult(S); cost = 100;
        name = 'Auto routine: ' + (G.Seasons[year].autoTiers[Math.min(3, t + 1)]);
        break;
      }
      case 'vision': {
        const l = S.robot.visionLvl;
        if (l >= 2) err = 'Vision maxed';
        else if ((S.parts.vision || 0) < l + 1) err = 'Needs ' + (l === 0 ? 'a camera' : 'dual camera + coprocessor') + ' (Parts store)';
        hours = 120 * (l + 1) * swMult(S); cost = 200;
        name = 'Vision Level ' + (l + 1) + (l === 0 ? ' (auto-aim)' : ' (shoot on the move)');
        break;
      }
      case 'practiceBot': {
        if (S.robot.practiceBot) err = 'Already built';
        const spent = Object.keys(S.robot.subs).reduce((s, k) => { const x = S.robot.subs[k]; if (!x.ver) return s; const c = G.Seasons.concept(year, k, x.concept); return s + (c ? c.cost : 0); }, 0);
        hours = 250 * hwMult(S); cost = 500 + 0.4 * spent; name = 'Practice robot';
        break;
      }
      case 'kb': { if (S.equip.kb) err = 'Already built'; hours = 60; cost = 0; name = 'Knowledge Base (wiki + CAD library)'; break; }
      case 'impact': { if (S.season && S.season.impactDone) err = 'Already submitted this season'; hours = 40; cost = 100; name = 'Impact Award submission'; break; }
      case 'research': {
        const r = D.RESEARCH.find(x => x.id === spec.rid);
        hours = r.hours * (1 - 0.04 * Robot.know(S, r.area)); cost = r.cost; name = r.name;
        break;
      }
    }
    if (spec.sub && S.projects.some(p => p.sub === spec.sub)) err = err || 'A project on this subsystem is already running';
    if (['auto', 'vision', 'practiceBot', 'impact'].includes(spec.type) && S.projects.some(p => p.type === spec.type)) err = err || 'Already in progress';
    if (spec.type === 'research' && S.projects.some(p => p.rid === spec.rid)) err = err || 'Already in progress';
    if (G.Career.hasPerk(S, 'partsDiscount') && spec.type !== 'research') cost *= 0.92;
    return { hours: Math.max(10, Math.round(hours)), cost: Math.round(cost), name, err };
  };
  // Permanent slots (base 2 + Design/Fab mentors + sponsor perk + facilities) are capped at MAX_SLOTS; temporary boost/guest slots go on top.
  Robot.MAX_SLOTS = 6;
  Robot.slotParts = S => ({ base: 2, mentors: S.mentors.filter(m => m.role === 'design' || m.role === 'fab').length, perk: G.Career.hasPerk(S, 'tempMentor') ? 1 : 0, facilities: G.Shop.facilitySlots(S), temp: G.Shop.boostSlots(S) });
  Robot.permSlots = S => { const p = Robot.slotParts(S); return Math.min(Robot.MAX_SLOTS, p.base + p.mentors + p.perk + p.facilities); };
  Robot.slots = S => Robot.permSlots(S) + G.Shop.boostSlots(S);
  Robot.slotText = S => { const p = Robot.slotParts(S), raw = p.base + p.mentors + p.perk + p.facilities; return p.base + ' base + ' + p.mentors + ' mentors' + (p.perk ? ' + 1 sponsor' : '') + ' + ' + p.facilities + ' facilities' + (raw > Robot.MAX_SLOTS ? ' (capped at ' + Robot.MAX_SLOTS + ')' : ' (max ' + Robot.MAX_SLOTS + ')') + (p.temp ? ' + ' + p.temp + ' temporary' : ''); };
  Robot.startProject = function (S, spec) {
    const q = Robot.quote(S, spec);
    if (q.err) return q.err;
    if (S.projects.length >= Robot.slots(S)) return 'All project slots are busy (' + Robot.slots(S) + '). Hire Design/Fabrication mentors or upgrade facilities for more (max ' + Robot.MAX_SLOTS + ' permanent).';
    if (S.money < q.cost) return 'Not enough money (' + U.money(q.cost) + ')';
    G.Career.spend(S, q.cost, q.name);
    S.projects.push(Object.assign({ id: U.uid('p'), name: q.name, need: q.hours, done: 0, prio: spec.prio || 'normal', cost: q.cost, started: G.Career.dateLabel(S) }, spec));
    return null;
  };
  Robot.cancelProject = function (S, id) {
    const p = S.projects.find(x => x.id === id);
    if (!p) return;
    S.projects = S.projects.filter(x => x !== p);
    const refund = Math.round(p.cost * 0.4 * (1 - p.done / p.need));
    if (refund > 0) G.Career.earn(S, refund, 'Refund: ' + p.name);
  };
  // Development category of a project (used by shop incidents and boosts)
  Robot.cat = p => (p.type === 'research' || p.type === 'kb' || p.type === 'impact') ? 'research' : (p.type === 'auto' || p.type === 'vision' || p.sub === 'soft') ? 'soft' : 'fab';
  // A sub-team can only put so many hours into one project per week (×4 for an offseason month).
  Robot.capFor = (S, p) => D.PROJ_CAP * (S.phase === 'off' ? 4 : 1) * (p.prio === 'high' ? 1.25 : p.prio === 'low' ? 0.75 : 1);
  // Plan how this turn's hours are shared: by priority, limited by each project's weekly cap and remaining work.
  // mods: optional { fab, soft, research } progress multipliers. Returns { give: {projectId: hours}, idle, hours }.
  Robot.alloc = function (S, hours, mods) {
    const W = { high: 3, normal: 2, low: 1 };
    const mult = p => (mods && mods[Robot.cat(p)] != null ? mods[Robot.cat(p)] : 1);
    const give = {};
    const rem = p => (p.need - p.done) / Math.max(mult(p), 0.01) - (give[p.id] || 0);
    const room = p => Robot.capFor(S, p) - (give[p.id] || 0);
    let left = Math.max(0, hours);
    for (let pass = 0; pass < 8 && left > 0.5; pass++) {
      const act = S.projects.filter(p => mult(p) > 0 && rem(p) > 0.01 && room(p) > 0.01);
      if (!act.length) break;
      const tw = act.reduce((s, p) => s + W[p.prio], 0);
      let used = 0;
      act.forEach(p => { const take = Math.min(left * W[p.prio] / tw, rem(p), room(p)); give[p.id] = (give[p.id] || 0) + take; used += take; });
      left -= used;
      if (used < 0.01) break;
    }
    return { give, idle: Math.max(0, left), hours, mult };
  };
  // ---------------- Development testing ----------------
  // Projects that can use practice-field testing time (everything except the Impact submission)
  Robot.testable = p => p.type !== 'impact' && p.type !== 'kb';
  Robot.testCap = S => D.TEST_PER_PROJ * (S.phase === 'off' ? 4 : 1);
  // How validated a project is: 0 (untested) … 1 (fully tested) → better upgrade quality on completion
  Robot.testQ = p => Math.min(1, (p.test || 0) / Math.max(1, p.need * D.TEST_Q));
  // Share development-testing hours between projects that are getting work this turn (each can absorb testCap).
  Robot.testPlan = function (S, devH, give) {
    const out = {}, cap = Robot.testCap(S);
    let left = Math.max(0, devH);
    for (let pass = 0; pass < 4 && left > 0.05; pass++) {
      // a project can only absorb testing in proportion to the build work going into it this turn
      const capOf = p => Math.min(cap, D.TEST_SHARE * (give[p.id] || 0));
      const act = S.projects.filter(p => Robot.testable(p) && capOf(p) - (out[p.id] || 0) > 0.01);
      if (!act.length) break;
      const each = left / act.length;
      act.forEach(p => { const t = Math.min(each, capOf(p) - (out[p.id] || 0)); out[p.id] = (out[p.id] || 0) + t; left -= t; });
    }
    return { give: out, idle: left };
  };
  // Apply this turn's hours (and development-testing hours); returns completed project names and testing use
  Robot.work = function (S, hours, mods, devH) {
    const a = Robot.alloc(S, hours, mods), done = [];
    const tp = Robot.testPlan(S, devH || 0, a.give), perH = D.TEST_GAIN / (S.phase === 'off' ? 4 : 1);
    let bonus = 0;
    S.projects.forEach(p => {
      const h = a.give[p.id] || 0, t = tp.give[p.id] || 0;
      const extra = h * a.mult(p) * t * perH; // testing catches problems early: less rework
      p.done += h * a.mult(p) + extra; p.lastHours = Math.round(h);
      p.test = (p.test || 0) + t; p.lastTest = t; bonus += extra;
    });
    S.projects.filter(p => p.done >= p.need - 0.01).forEach(p => { Robot.complete(S, p); done.push(p.name); });
    S.projects = S.projects.filter(p => p.done < p.need - 0.01);
    return { done, spare: a.idle, used: hours - a.idle, testUsed: (devH || 0) - tp.idle, testIdle: tp.idle, testBonus: bonus };
  };

  // ---------------- Weekly design suggestion ----------------
  const STAT_W = { scoreSpd: 1.25, accuracy: 1.25, intake: 1.0, speed: 0.95, endgame: 0.9, range: 0.85, agility: 0.6, push: 0.45, auto: 0.7, vision: 0.6, balance: 0.8, ampSkill: 0.7, amp: 0.7, algae: 0.7, traverse: 0.6, feed: 0.8 };
  Robot.suggest = function (S) {
    const R = S.robot;
    if (!R || R.year !== S.year || !['kickoff', 'build', 'comp'].includes(S.phase)) return null;
    const year = R.year, busy = k => S.projects.some(p => p.sub === k);
    const mk = (spec, title, reason) => { const q = Robot.quote(S, Object.assign({ effort: 'std' }, spec)); return q.err ? null : { spec: Object.assign({ effort: 'std' }, spec), title, reason, quote: q }; };
    const subs = G.Seasons[year].subs.filter(sd => sd.id !== 'soft');
    // 1) anything not built yet
    for (const sd of subs) {
      const s = R.subs[sd.id];
      if (s.ver || s.concept === 'none' || busy(sd.id)) continue;
      const opts = sd.concepts.filter(c => c.id !== 'none' && !Robot.reqOk(S, c));
      const score = c => Object.keys(c.ceil).reduce((t, k) => t + Robot.ceil(S, year, sd.id, c, k) * (STAT_W[k] || 0.7), 0) / Math.max(1, Object.keys(c.ceil).length) - (Robot.firstTime(S, c) ? 12 : 0) - c.cx * 2;
      const best = opts.sort((p, q) => score(q) - score(p))[0];
      if (best) { const r = mk({ type: 'build', sub: sd.id, concept: best.id }, 'Build the ' + sd.name + ': ' + best.name, 'Nothing is built for the ' + sd.name + ' yet, and the robot can\'t use it in matches until it is.'); if (r) return r; }
    }
    // 2) over the weight limit
    if (Robot.weight(S) > Robot.WEIGHT_LIMIT) {
      const k = Object.keys(R.subs).filter(k => R.subs[k].ver && k !== 'soft' && !busy(k)).sort((a, b) => R.subs[b].w - R.subs[a].w)[0];
      if (k) { const r = mk({ type: 'light', sub: k }, 'Lighten the ' + G.Seasons.sub(year, k).name, 'The robot is ' + Robot.weight(S) + ' lb — over the 125 lb limit, so it will fail inspection.'); if (r) return r; }
    }
    // 3) a weak link in reliability
    const weak = Object.keys(R.subs).filter(k => k !== 'soft' && R.subs[k].ver && !busy(k) && (R.subs[k].rel < 55 || R.subs[k].hidden > 0)).sort((a, b) => R.subs[a].rel - R.subs[b].rel)[0];
    if (weak) { const r = mk({ type: 'harden', sub: weak }, 'Harden the ' + G.Seasons.sub(year, weak).name, 'Its reliability is only ' + R.subs[weak].rel + (R.subs[weak].hidden ? ' and the crew suspects a hidden fault' : '') + '. Breakdowns in matches cost more than a slower upgrade.'); if (r) return r; }
    // 4) autonomous routine
    if (R.autoTier < 2 && !S.projects.some(p => p.type === 'auto')) { const r = mk({ type: 'auto' }, 'Write a better auto: ' + G.Seasons[year].autoTiers[R.autoTier + 1], 'Auto points are cheap to earn and count for bonus ranking points in several games.'); if (r) return r; }
    // 5) biggest weighted gap to a stat ceiling
    let best = null;
    Object.keys(R.subs).forEach(k => {
      const s = R.subs[k]; if (!s.ver || busy(k)) return;
      const c = G.Seasons.concept(year, k, s.concept); if (!c) return;
      Object.keys(c.ceil).forEach(st => {
        if (k === 'endgame' && !(c.caps && c.caps.endLevel)) return;
        const gap = Robot.ceil(S, year, k, c, st) - (s.stats[st] || 0);
        const v = gap * (STAT_W[st] || 0.7);
        if (gap > 4 && (!best || v > best.v)) best = { v, k, st, gap };
      });
    });
    if (best) return mk({ type: 'upgrade', sub: best.k, focus: best.st, forConcept: R.subs[best.k].concept },
      'Upgrade ' + G.Seasons.sub(year, best.k).name + ' — ' + (D.STAT[best.st] || best.st), 'It has the biggest useful gap on the robot: ' + R.subs[best.k].stats[best.st] + ' now, ceiling ' + (R.subs[best.k].stats[best.st] + best.gap) + '.');
    return null;
  };
  Robot.complete = function (S, p) {
    const rng = G.R, year = S.robot ? S.robot.year : S.year;
    const ef = EFFORT[p.effort || 'std'];
    const q = Robot.testQ(p), qt = q >= 0.2 ? ' Tested ' + Math.round(q * 100) + '% on the practice field.' : '';
    const R = S.robot;
    const designSkill = Math.max(G.Career.mentorSkill(S, 'design'), G.Career.hasPerk(S, 'tempMentor') ? 55 : 0);
    switch (p.type) {
      case 'build': {
        if (!R || R.year !== year) return;
        const c = G.Seasons.concept(year, p.sub, p.concept), sub = R.subs[p.sub];
        if (sub.ver && sub.concept !== p.concept) {
          const old = G.Seasons.concept(year, p.sub, sub.concept);
          if (old) Robot.addXP(S, mainArea(old), Math.round(sub.hours * 0.25 * 0.3));
        }
        const lvl = Robot.know(S, mainArea(c)), first = Robot.firstTime(S, c);
        const stats = {};
        Object.keys(c.base).forEach(k => { stats[k] = Math.min(Robot.ceil(S, year, p.sub, c, k), c.base[k] + 2 * Robot.know(S, statArea(p.sub, c, k)) + G.Shop.buildStat(S)); });
        let rel = 72 - 6 * c.cx + 4 * lvl + G.Shop.buildRel(S) + G.Career.mentorSkill(S, 'fab') / 20 - (first ? 15 : 0) + (ef.rel * 1.5)
          + (p.sub === 'drive' && c.id === 'swerve' && S.parts.swerve === 2 ? 5 : 0) + 5 * q;
        let hidden = (p.effort === 'rush' && rng.chance(0.5 * (1 - 0.5 * q)) ? 1 : 0) + (first && rng.chance(0.6 * (1 - 0.5 * q)) ? 1 : 0);
        Object.assign(sub, { concept: p.concept, ver: 1, stats, rel: Math.round(U.clamp(rel, 25, 95)), cond: 100, w: c.w, hidden, hours: p.need });
        c.areas.forEach((a, i) => Robot.addXP(S, a, Math.round(30 * ef.gain * (i === 0 ? 1 : 0.5))));
        G.Career.inbox(S, 'Built: ' + c.name, 'Your ' + G.Seasons.sub(year, p.sub).name + ' is now a ' + c.name + ' (v1).' + (first ? ' This is the team\'s first time building one, so expect teething problems.' : '') + qt, 'dev');
        break;
      }
      case 'upgrade': {
        if (!R) return;
        const sub = R.subs[p.sub], c = G.Seasons.concept(year, p.sub, sub.concept);
        if (!c || sub.concept !== p.forConcept && p.forConcept) return;
        const lvl = Robot.know(S, statArea(p.sub, c, p.focus));
        const frac = 0.25 * ef.gain * (0.6 + 0.4 * designSkill / 100) * (1 + 0.05 * lvl) * G.Shop.gainMult(S) * rng.range(0.85, 1.15) * (1 + 0.15 * q);
        const changes = [];
        Object.keys(c.ceil).forEach(k => {
          const cl = Robot.ceil(S, year, p.sub, c, k), cur = sub.stats[k] || 0;
          const f = k === p.focus ? frac : frac * 0.35;
          const nv = Math.round(cur + Math.max(0, cl - cur) * f);
          if (nv !== cur) changes.push((D.STAT[k] || k) + ' ' + cur + '→' + nv);
          sub.stats[k] = nv;
        });
        sub.ver++;
        sub.hours += p.need;
        if (p.sub !== 'soft') { sub.w += p.effort === 'rush' ? 1 : 0.6; sub.rel = U.clamp(sub.rel + ef.rel + Math.round(4 * q), 20, 97); }
        if (p.effort === 'rush' && rng.chance(0.4 * (1 - 0.5 * q))) sub.hidden++;
        (c.areas || []).forEach((a, i) => Robot.addXP(S, a, Math.round(30 * ef.gain * (i === 0 ? 1 : 0.4))));
        if (S.event && S.event.stage !== 'done' && p.sub !== 'soft') { R.pending.push(p.sub); G.Career.inbox(S, 'Upgrade ready: ' + p.name, 'Install it in the pits (practice block) to use it at this event. ' + changes.join(', '), 'dev'); }
        else G.Career.inbox(S, 'Upgrade complete: ' + p.name, (changes.join(', ') || 'Already near the ceiling.') + qt, 'dev');
        break;
      }
      case 'harden': {
        const sub = R.subs[p.sub];
        sub.rel = Math.round(sub.rel + (96 - sub.rel) * 0.35); sub.hidden = 0; sub.cond = 100;
        G.Career.inbox(S, 'Hardening complete', G.Seasons.sub(year, p.sub).name + ' reliability is now ' + sub.rel + ' and hidden faults were cleared.', 'dev');
        Robot.addXP(S, 'elec', 15);
        break;
      }
      case 'light': {
        const sub = R.subs[p.sub], d = rng.range(2, 6);
        sub.w = Math.max(1, sub.w - d);
        if (rng.chance(0.2)) sub.rel = Math.max(20, sub.rel - 3);
        G.Career.inbox(S, 'Lightweighting complete', 'Removed ' + d.toFixed(1) + ' lb from the ' + G.Seasons.sub(year, p.sub).name + '. Robot weight: ' + Robot.weight(S) + ' lb.', 'dev');
        break;
      }
      case 'auto': R.autoTier = Math.min(3, R.autoTier + 1); Robot.addXP(S, 'autoPath', 50); G.Career.inbox(S, 'New auto routine', 'The robot can now run: ' + G.Seasons[year].autoTiers[R.autoTier] + '.', 'dev'); break;
      case 'vision': R.visionLvl = Math.min(2, R.visionLvl + 1); R.subs.soft.stats.vision = Math.min(99, (R.subs.soft.stats.vision || 0) + 15); Robot.addXP(S, 'vision', 60); G.Career.inbox(S, 'Vision Level ' + R.visionLvl, R.visionLvl === 1 ? 'Auto-aim and auto-align are online.' : 'Pose estimation and shoot-on-the-move are online.', 'dev'); break;
      case 'practiceBot': R.practiceBot = true; S.parts.spares += 6; G.Career.inbox(S, 'Practice robot complete', 'A second robot for the practice field: +' + D.TEST_BOT_HOURS + ' testing hours a week, driver practice no longer wears the competition robot, and +10% starting tuning at events. +6 spare parts.', 'dev'); break;
      case 'kb': S.equip.kb = true; G.Career.inbox(S, 'Knowledge Base online', 'Knowledge decay between seasons is halved.', 'dev'); break;
      case 'impact': if (S.season) S.season.impactDone = true; G.Career.inbox(S, 'Impact submission ready', 'Your Impact story is submitted. You can now compete for the Impact Award at every regional this season (see the odds on HQ).', 'dev'); break;
      case 'research': {
        const r = D.RESEARCH.find(x => x.id === p.rid);
        const g = Robot.addXP(S, r.area, Math.round(r.xp * (1 + 0.2 * q)));
        G.Career.inbox(S, 'Research complete: ' + r.name, '+' + Math.round(g) + ' XP in ' + D.AREA[r.area].name + ' (now Level ' + Robot.know(S, r.area) + ').', 'know');
        break;
      }
    }
  };

  // ---------------- Events: entries, wear, repairs ----------------
  Robot.eventStart = function (S, ev) {
    // practice field facility + this season's game elements raise starting tuning
    const fieldTune = S.equip.field === ev.year ? 0.05 + G.Shop.fx(S, 'pfield', 'tune') : 0;
    let tune = 0.3 + fieldTune + (S.robot && S.robot.practiceBot ? 0.1 : 0) + (S.lastTune || 0) * 0.3;
    let conf = 0.3 + (S.practiceWeeks || 0) * 0.04 + (S.lastConf || 0) * 0.3;
    return { tune: U.clamp(tune, 0.2, 0.85), conf: U.clamp(conf, 0.2, 0.85) };
  };
  Robot.inspect = function (S, ev) {
    const R = S.robot;
    const notes = [];
    if (!R.subs.drive.ver) {
      const c = G.Seasons.concept(R.year, 'drive', 'kit');
      Object.assign(R.subs.drive, { concept: 'kit', ver: 1, stats: Object.assign({}, c.base), rel: 60, cond: 100, w: c.w, hidden: 0 });
      G.Career.spend(S, 600, 'Emergency kitbot drivetrain');
      S.morale = Math.max(0, S.morale - 8);
      notes.push('No drivetrain! The team bolted together an emergency kitbot chassis ($600).');
    }
    const w = Robot.weight(S);
    const ok = w <= Robot.WEIGHT_LIMIT;
    if (!ok) notes.push('Robot weighs ' + w + ' lb — over the ' + Robot.WEIGHT_LIMIT + ' lb limit. You must spend a practice block on emergency lightening.');
    return { ok, weight: w, notes };
  };
  Robot.emergencyLighten = function (S) {
    const R = S.robot, over = Robot.weight(S) - Robot.WEIGHT_LIMIT;
    if (over <= 0) return 'Robot is already legal.';
    const k = Object.keys(R.subs).filter(k => R.subs[k].ver && k !== 'soft' && k !== 'drive').sort((a, b) => R.subs[b].w - R.subs[a].w)[0] || 'drive';
    const sub = R.subs[k];
    sub.w -= over + 0.5;
    Object.keys(sub.stats).forEach(s => sub.stats[s] = Math.round(sub.stats[s] * 0.95));
    sub.rel = Math.max(20, sub.rel - 4);
    if (S.event) S.event.inspection.ok = true;
    return 'Drilled out ' + (over + 0.5).toFixed(1) + ' lb from the ' + G.Seasons.sub(R.year, k).name + ' (−5% stats, −4 reliability). Passed inspection.';
  };
  Robot.shakedown = function (S, p) {
    let found = 0;
    Object.values(S.robot.subs).forEach(s => { while (s.hidden > 0 && G.R.chance(p)) { s.hidden--; found++; } });
    return found;
  };
  Robot.installPending = function (S) { const n = S.robot.pending.length; S.robot.pending = []; return n; };
  Robot.matchEntry = function (S, ev) {
    const R = S.robot, subs = {};
    Object.keys(R.subs).forEach(k => { subs[k] = R.subs[k]; });
    // upgrades not yet installed at an event use previous stats: approximate by ignoring nothing (pending simply flags)
    const cap = G.Cap.build(R.year, subs, { autoTier: R.autoTier, visionLvl: R.visionLvl, parts: S.parts });
    if (R.pending.length) cap.scoreSpd = Math.round(cap.scoreSpd * 0.97);
    const dt = G.Career.driveTeam(S);
    return {
      team: S.team.num, cap, look: Robot.look(S), isPlayer: true,
      drv: { drive: dt.driver.attr.drive, comp: Math.round((dt.driver.attr.comp + dt.operator.attr.comp) / 2), aware: dt.driver.attr.aware, mech: dt.operator.attr.mech, hp: dt.hp.attr.hp, strat: dt.coachStrat },
      tune: ev ? ev.tune : 0.5, conf: ev ? ev.conf : 0.5, tuneAuto: ev ? ev.tuneAuto : 0,
      cond: Robot.condAvg(S), batt: ev && ev.batt != null ? ev.batt : 1, hidden: Math.max(0, Robot.hidden(S) - (ev ? ev.shake * 0.5 : 0)),
      power: G.Cap.power(R.year, cap)
    };
  };
  Robot.applyWear = function (S, rr, playoff) {
    const R = S.robot, P = G.Engine.PACE[rr.pace || 'bal'];
    const extra = 1 + rr.defTime / 30 + rr.contacts / 15;
    Object.keys(R.subs).forEach(k => {
      const s = R.subs[k];
      if (!s.ver || k === 'soft') return;
      let w = G.R.range(2.5, 5.5) * P.wear * (k === 'drive' ? extra : 1 + rr.cycles / 25);
      s.cond = Math.max(0, s.cond - w);
    });
    rr.faults.forEach(f => {
      if (/^Fell from/.test(f)) {
        // a fall from height: everything takes a beating, the climber worst; some bent parts go straight in the scrap bin
        Object.keys(R.subs).forEach(k => {
          const s = R.subs[k]; if (!s.ver || k === 'soft') return;
          s.cond = Math.max(0, s.cond - (k === 'endgame' ? G.R.range(45, 65) : k === 'drive' ? G.R.range(25, 40) : G.R.range(15, 30)));
        });
        if (G.R.chance(0.45)) { const ks = Object.keys(R.subs).filter(k => R.subs[k].ver && k !== 'soft'); if (ks.length) R.subs[G.R.pick(ks)].hidden++; }
        const bent = Math.min(S.parts.spares, G.R.int(1, 3));
        S.parts.spares -= bent;
        rr.scrapped = (rr.scrapped || 0) + bent;
        return;
      }
      const map = { 'Intake broke': 'intake', 'Scorer broke': 'scorer', 'Climber broke': 'endgame', 'TIPPED OVER': 'scorer' };
      const k = map[f];
      if (k && R.subs[k] && R.subs[k].ver) R.subs[k].cond = Math.max(0, R.subs[k].cond - 25);
    });
  };
  Robot.pitRepair = function (S, turnaround, bonus) {
    const R = S.robot;
    let pts = (6 + 5 * Math.min(turnaround, 8)) * G.Shop.repairMult(S) * (1 + G.Career.mentorSkill(S, 'fab') / 200) * (bonus || 1);
    let used = 0;
    const subs = Object.keys(R.subs).filter(k => k !== 'soft' && R.subs[k].ver).map(k => R.subs[k]).sort((a, b) => a.cond - b.cond);
    for (const s of subs) {
      if (pts <= 0) break;
      const cap = S.parts.spares > 0 ? 100 : Math.max(s.cond, 60);
      const need = Math.max(0, cap - s.cond), take = Math.min(need, pts);
      s.cond += take; pts -= take;
      // one spare covers D.SPARE_COND_PER_UNIT condition points; fractions carry over between repairs
      if (S.parts.spares > 0) S.parts.spareUse = (S.parts.spareUse || 0) + take / D.SPARE_COND_PER_UNIT;
    }
    const sp = Math.min(S.parts.spares, Math.floor(S.parts.spareUse || 0));
    S.parts.spares -= sp; used += sp;
    S.parts.spareUse = S.parts.spares > 0 ? Math.max(0, (S.parts.spareUse || 0) - sp) : 0;
    return used;
  };
  // Repairs at home use spare parts (one spare ≈ D.SPARE_COND_PER_UNIT condition points). Without spares the team
  // can only patch a subsystem up to D.NO_SPARE_COND. Returns { used: spares used, short: condition points left unrepaired }.
  Robot.homeRepair = function (S) {
    const R = S.robot; if (!R) return { used: 0, short: 0 };
    const P = S.parts, per = D.SPARE_COND_PER_UNIT;
    let short = 0;
    Object.keys(R.subs).map(k => R.subs[k]).filter(s => s.ver && s.cond < 100).sort((a, b) => a.cond - b.cond).forEach(s => {
      const credit = Math.max(0, P.spares - (P.spareUse || 0)) * per;
      const fix = Math.min(100 - s.cond, credit);
      s.cond += fix; P.spareUse = (P.spareUse || 0) + fix / per;
      if (s.cond < 99.5) { if (s.cond < D.NO_SPARE_COND) s.cond = D.NO_SPARE_COND; short += 100 - s.cond; }
      else s.cond = 100;
    });
    const used = Math.min(P.spares, Math.floor((P.spareUse || 0) + 1e-6));
    P.spares -= used; P.spareUse = P.spares > 0 ? Math.max(0, (P.spareUse || 0) - used) : 0;
    return { used, short: Math.round(short) };
  };
  // Spare parts needed to bring the robot back to 100% (for previews)
  Robot.repairNeed = function (S) {
    const R = S.robot; if (!R) return 0;
    return Object.keys(R.subs).reduce((t, k) => t + (R.subs[k].ver ? 100 - R.subs[k].cond : 0), 0) / D.SPARE_COND_PER_UNIT;
  };
  Robot.describe = function (S) {
    const R = S.robot, year = R.year;
    return G.Seasons[year].subs.map(sd => {
      const s = R.subs[sd.id];
      const c = s.ver ? G.Seasons.concept(year, sd.id, s.concept) : null;
      return { id: sd.id, name: sd.name, sub: s, concept: c };
    });
  };
})();

<script>/* js/systems/career.js */
'use strict';
/* FRC Manager — career systems: calendar & turns, finance, sponsors, staff, offseason, reviews, qualification */
(function () {
  const U = G.U, D = G.Data;
  const C = G.Career = {};
  const DIVS = ['Archimedes', 'Curie', 'Daly', 'Galileo', 'Hopper', 'Johnson', 'Milstein', 'Newton'];

  // ======================= helpers =======================
  C.inbox = function (S, title, body, kind, extra) {
    S.inbox.unshift(Object.assign({ id: U.uid('i'), title, body, kind: kind || 'info', date: C.dateLabel(S), read: false }, extra || {}));
    if (S.inbox.length > 120) S.inbox.length = 120;
  };
  C.spend = function (S, amt, desc) { amt = Math.round(amt); S.money -= amt; S.ledger.unshift({ d: C.dateLabel(S), desc, amt: -amt }); if (S.season) S.season.spent += amt; if (S.ledger.length > 300) S.ledger.length = 300; };
  C.earn = function (S, amt, desc) { amt = Math.round(amt); S.money += amt; S.ledger.unshift({ d: C.dateLabel(S), desc, amt }); if (S.season) S.season.earned += amt; if (S.ledger.length > 300) S.ledger.length = 300; };
  C.hasPerk = (S, id) => S.sponsors.some(s => s.perk === id);
  C.allMentors = S => S.mentors.concat((S.guests || []).map(g => g.m)); // includes temporary guest mentors
  C.mentorSkill = function (S, role) {
    const ms = C.allMentors(S).filter(m => m.role === role);
    let v = ms.length ? Math.max(...ms.map(m => m.skill)) : 0;
    if (role === 'design' && C.hasPerk(S, 'tempMentor')) v = Math.max(v, 55);
    return v;
  };

  C.coachCalls = function (S, playoff) { const st = C.mentorStars(S, 'coach'); return 3 + (st >= 3 ? 1 : 0) + (st >= 5 ? 1 : 0) + (playoff ? 1 : 0); };
  C.coachSkill = function (S) { const dt = C.driveTeam(S); return Math.max(C.mentorSkill(S, 'coach'), dt.coachStrat); };
  C.driveTeam = function (S) {
    const by = id => S.students.find(s => s.id === id);
    const pool = S.students.slice().sort((a, b) => (b.attr.drive + b.attr.comp) - (a.attr.drive + a.attr.comp));
    const fallback = { name: 'Walk-on', attr: { drive: 25, aware: 25, comp: 25, mech: 25, hp: 25, strat: 25 } };

    const operator = by(S.driveTeam.operator) || pool.find(s => s !== driver) || fallback;
    const hp = by(S.driveTeam.hp) || pool.find(s => s !== driver && s !== operator) || fallback;
    const coachSt = S.driveTeam.coach && S.driveTeam.coach !== 'mentor' ? by(S.driveTeam.coach) : null;
    const coachStrat = coachSt ? coachSt.attr.strat : Math.max(C.mentorSkill(S, 'coach'), C.mentorSkill(S, 'strat') * 0.8, 30);
    return { driver, operator, hp, coach: coachSt, coachStrat: Math.round(coachStrat) };
  };
  C.seasonName = (S, year) => { const s = G.Seasons[year || S.year]; return year || S.year ? s.year + ' ' + s.name : ''; };
  C.monthName = S => D.MONTHS[S.month];
  C.dateLabel = function (S) {
    if (!S) return '';
    const yr = S.year || '';
    switch (S.phase) {
      case 'off': return (S.preseason ? 'Pre-season' : 'Offseason') + ' · ' + D.MONTHS[S.month] + (S.preseason ? '' : ' ' + yr);
      case 'kickoff': return 'Kickoff · Jan ' + yr;
      case 'build': return (S.week === 7 ? 'Week 0' : 'Build Week ' + S.week) + ' · ' + (S.week <= 4 ? 'Jan' : 'Feb') + ' ' + yr;
      case 'comp': return 'Competition Week ' + S.week + ' · ' + (S.week <= 4 ? 'Mar' : 'Apr') + ' ' + yr;
      case 'champs': return 'Championship · Apr ' + yr;
      case 'review': return 'Season Review · ' + yr;
      case 'end': return 'Career complete';
    }
    return '';
  };

  // ======================= new game =======================
  function newSeasonState(year) {
    return { year: year || null, goals: [], events: [], awards: [], champsQualified: false, champsReason: '', champsPlayoffs: false, einstein: false, worldChamp: false, divWin: false,
      impactDone: false, impact: 0, outreach: 0, earned: 0, spent: 0, rpSum: 0, qualMatches: 0, matches: 0, faults: 0, legacy: 0 };
  }
  C.newGame = function (o) {
    const seed = o.seed || ((Date.now() ^ Math.floor(Math.random() * 1e9)) & 0x7fffffff); // o.seed: dev tests only
    G.R = new G.Rng(seed);
    const rng = G.R, P = D.PROFILES[o.profile];
    let order = G.SEASON_YEARS.slice();
    if (o.mode === 'career' && o.order === 'random') rng.shuffle(order);
    if (o.mode === 'single') order = [o.year];
    const scen = o.scenario ? D.SCENARIOS.find(s => s.id === o.scenario) : null;
    const S = G.S = {
      v: 1, mode: o.mode, seed, team: Object.assign({}, o.team), profile: o.profile, diff: o.diff || 'normal', orderMode: o.order || 'real',
      settings: Object.assign({ noFail: false }, o.settings || {}), scenario: scen ? scen.id : null, maxEvents: scen && scen.maxEvents ? scen.maxEvents : 4,
      order, si: -1, upcoming: 0, year: order[0], phase: 'off', month: 5, week: 0, preseason: o.mode === 'career',
      money: scen && scen.money ? scen.money : P.money, ledger: [], morale: scen && scen.morale ? scen.morale : 65, support: P.support, rep: P.rep,
      studentsCount: P.students, students: [], driveTeam: { driver: null, operator: null, hp: null, coach: 'mentor' },
      mentors: [], market: [], equip: { printer: 0, cnc: false, lathe: false, field: null, laptops: false, charger: false, pitcart: false, trailer: false, kb: false },
