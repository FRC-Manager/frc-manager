      d(0.35, 'wc-kicker') + 'EINSTEIN · ' + (fict ? '' : h(String(gyear)) + ' ') + h((Sz.name || '').toUpperCase()) + (titles > 1 && streak < 2 ? ' · ' + titles + '-TIME CHAMPIONS' : '') + '</div>' +
      d(0.5, 'wc-team') + S.team.num + ' · ' + h(String(S.team.name).toUpperCase()) + '</div>' +
      d(0.65, 'wc-you') + 'YOU ARE THE</div>' +
      '<div class="wc-title">' + yearTxt + ' ' + label + '</div>' +
      d(1.0, 'wc-bn') + UI.banner({ gold: true, award: streak >= 2 ? 'World Champions ×' + streak : 'World Champions', year, event: 'Einstein · ' + (S.champsDiv || '') }, true) + '</div>' +
      d(1.2, 'wc-msg') + story + '</div>' +
      d(1.4, 'wc-al') + al.map((t, i) => '<span class="wc-chip' + (t === me() ? ' me' : '') + '"><b>' + t + '</b> ' + h(t === me() ? S.team.name : ((S.teams[t] || {}).name || '')) + '<small>' + ['Captain', '1st pick', '2nd pick', 'Backup'][i] + '</small></span>').join('') + '</div>' +
      d(1.6, 'wc-qs') + '<div class="wc-h">WHAT PEOPLE ARE SAYING</div>' + quotes.map(q => '<div class="wc-q">“' + q[0] + '”<span>— ' + q[1] + '</span></div>').join('') + '</div>' +
      d(1.8) + '<button class="btn primary lg wc-btn" data-act="wcClose">' + UI.icon('trophy', 18) + ' Celebrate!</button></div>' +
      (eggTxt ? d(2.0, 'wc-egg') + '<b>Easter egg</b> · ' + h(eggTxt) + '</div>' : '') +
      '</div>', { wide: true, lock: true, cls: 'wcm' });
    UI.confetti(7000); setTimeout(() => UI.confetti(6000), 2200); setTimeout(() => UI.confetti(5000), 5200);
  };
  UI.A.wcClose = () => UI.closeModal();
  UI.wonEvent = (ev, R) => !!(ev && R && R.kind !== 'qual' && ev.result && ev.result.won && R.obj && R.obj.id === 'F');
})();

</script>
<script>/* js/ui/screens-menu.js */
'use strict';
/* FRC Manager — main menu, new game setup, load, help, settings, season review, career summary */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI;

  // =====================================================================
  // MAIN MENU
  // =====================================================================
  UI.S.menu = { full: true, html() {
    const auto = G.Save.meta('auto');
    return '<div class="menu-wrap"><div class="menu-box"><div class="logo">FRC <span>MANAGER</span></div><div class="muted mb">Run a FIRST Robotics Competition team across five seasons — 2022 to 2026. Unofficial fan game.</div>' +
      '<div class="grid g3 mt">' +
      '<div class="choice" data-act="newGame" data-arg="career"><div class="lg b">New Career</div><div class="sm muted">Five seasons, real or random order. Build a program that learns from every robot.</div></div>' +
      '<div class="choice" data-act="newGame" data-arg="single"><div class="lg b">Single Season Challenge</div><div class="sm muted">Pick one game and a scenario. Graded S to D.</div></div>' +
      '<div class="choice" data-act="continueGame" ' + (auto ? '' : 'style="opacity:.5"') + '><div class="lg b">Continue</div><div class="sm muted">' + (auto ? h(auto.team.num + ' ' + auto.team.name + ' · ' + auto.year + ' · ' + new Date(auto.savedAt).toLocaleString()) : 'No autosave yet') + '</div></div>' +
      '</div><div class="row mt wrap"><button class="btn" data-act="nav" data-arg="load">Load / import</button><button class="btn" data-act="nav" data-arg="help">How to play</button><button class="btn" data-act="nav" data-arg="notes">What\'s new in v' + h(G.VERSION) + '</button></div>' +
      '<div class="grid g5 mt">' + G.SEASON_YEARS.map(y => '<div class="card flat"><div class="xs muted">' + y + '</div><div class="b">' + h(G.Seasons[y].name) + '</div><canvas data-prev="' + y + '" width="330" height="164" style="width:100%;border-radius:6px;margin-top:6px"></canvas><div class="xs muted mt">' + h(G.Seasons[y].tagline) + '</div></div>').join('') + '</div>' +
      '<p class="xs dim mt">Version ' + h(G.VERSION) + ' · Not affiliated with or endorsed by FIRST®, Formula 1® or Frontier Developments. Sponsors, regionals and teams are fictional; team numbers are random.</p></div></div>';
  }, after() { document.querySelectorAll('canvas[data-prev]').forEach(c => G.Render.preview(c, Number(c.dataset.prev))); } };
  UI.A.continueGame = () => { if (G.Save.load('auto')) { UI.go(G.S.phase === 'end' ? 'end' : G.S.event ? 'event' : 'hq'); } else UI.toast('No autosave found', 'bad'); };

  // =====================================================================
  // NEW GAME
  // =====================================================================
  UI.A.newGame = function (mode) {
    const rng = G.makeRng(Date.now() & 0xffffff);
    UI.st.ng = { mode, num: rng.int(1000, 9999), name: D.teamName(rng), school: rng.pick(D.SCHOOLS) + ' High School', c1: UI.TEAM_COLORS[0].hex, c2: UI.TEAM_COLORS2[0].hex, avatar: rng.pick(UI.AVATARS), region: 'Midwest',
      profile: mode === 'single' ? 'established' : 'established', diff: 'normal', order: 'real', year: 2026, scenario: 'custom' };
    UI.go('newgame');
  };
  UI.S.newgame = { full: true, html() {
    const n = UI.st.ng;
    const inp = (k, lbl, type) => '<label class="f">' + lbl + '<input class="inp" type="' + (type || 'text') + '" value="' + h(n[k]) + '" data-chg="ng" data-k="' + k + '"></label>';
    const choice = (k, v, title, desc) => '<div class="choice ' + (n[k] === v ? 'on' : '') + '" data-act="ngSet" data-arg="' + k + '|' + v + '"><div class="b">' + title + '</div>' + (desc ? '<div class="xs muted">' + desc + '</div>' : '') + '</div>';
    let o = '<div class="menu-wrap"><div class="menu-box"><div class="row"><div class="logo" style="font-size:28px">' + (n.mode === 'career' ? 'New Career' : 'Single Season Challenge') + '</div><span class="sp"></span><button class="btn" data-act="nav" data-arg="menu">Back</button></div>';
    if (n.mode === 'single') {
      o += '<h3 class="mt">Season</h3><div class="grid g4" style="grid-template-columns:repeat(5,minmax(0,1fr))">' + G.SEASON_YEARS.map(y => choice('year', y, y + ' ' + G.Seasons[y].name, G.Seasons[y].tagline)).join('') + '</div>';
      o += '<h3 class="mt">Scenario</h3><div class="grid g4">' + D.SCENARIOS.map(s => choice('scenario', s.id, s.name, s.goalText + ' (' + D.PROFILES[s.profile].name + ')')).join('') + '</div>';
    }
    o += '<h3 class="mt">Your team</h3><div class="grid g4">' + inp('num', 'Team number', 'number') + inp('name', 'Team name') + inp('school', 'School / organisation') +
      '<label class="f">Home region<select class="inp" data-chg="ng" data-k="region">' + D.REGIONS.map(r => '<option ' + (n.region === r ? 'selected' : '') + '>' + r + '</option>').join('') + '</select></label>' +
      '</div>';
    // avatar and colours (the whole UI picks up the primary colour)
    o += '<div class="grid g3 mt"><div><div class="sm muted mb">Team colour</div><div class="swatches">' + UI.TEAM_COLORS.map(c => '<button class="swatch ' + (n.c1 === c.hex ? 'on' : '') + '" style="background:' + c.hex + '" title="' + c.name + '" data-act="ngSet" data-arg="c1|' + c.hex + '"></button>').join('') + '</div>' +
      '<div class="sm muted mb mt">Second colour</div><div class="swatches">' + UI.TEAM_COLORS2.map(c => '<button class="swatch ' + (n.c2 === c.hex ? 'on' : '') + '" style="background:' + c.hex + '" title="' + c.name + '" data-act="ngSet" data-arg="c2|' + c.hex + '"></button>').join('') + '</div></div>' +
      '<div class="span2"><div class="sm muted mb">Team emblem</div><div class="avpick">' + UI.AVATARS.map(a => '<button class="' + (n.avatar === a ? 'on' : '') + '" data-act="ngSet" data-arg="avatar|' + a + '" title="' + a + '">' + UI.avatar({ avatar: a, c1: n.c1, c2: n.c2 }, 40) + '</button>').join('') + '</div>' +
      '<div class="row mt">' + UI.avatar(n, 56) + '<div><div class="lg b">' + h(String(n.num)) + ' ' + h(n.name) + '</div><div class="sm muted">' + h(n.school) + ' · ' + h(n.region) + '</div></div></div></div></div>';
    if (n.mode === 'career' || n.scenario === 'custom') {
      o += '<h3 class="mt">Starting profile</h3><div class="grid g3">' + Object.keys(D.PROFILES).map(k => { const P = D.PROFILES[k]; return choice('profile', k, P.name + ' — ' + U.money(P.money), P.desc + ' ' + P.students + ' students, ' + P.mentors.length + ' mentors.'); }).join('') + '</div>';
    }
    o += '<h3 class="mt">Difficulty</h3><div class="grid g3">' + choice('diff', 'easy', 'Easy', 'Weaker opponents, fewer faults, more sponsor money.') + choice('diff', 'normal', 'Normal', 'The intended experience.') + choice('diff', 'hard', 'Hard', 'Stronger opponents, more faults, stingy sponsors.') + '</div>';
    if (n.mode === 'career') o += '<h3 class="mt">Season order</h3><div class="grid g2">' + choice('order', 'real', 'Real order', '2022 → 2023 → 2024 → 2025 → 2026') + choice('order', 'random', 'Random order', 'All five games, shuffled. The next game is a surprise at each Kickoff.') + '</div>';
    o += '<div class="row mt"><span class="sp"></span><button class="btn primary lg" data-act="startGame">Start ▶</button></div></div></div>';
    return o;
  } };
  UI.A.ng = (v, el) => { UI.st.ng[el.dataset.k] = el.dataset.k === 'num' ? Math.max(1, Math.min(99999, Number(v) || 1)) : v; };
  UI.A.ngSet = arg => { const [k, v] = arg.split('|'); UI.st.ng[k] = k === 'year' ? Number(v) : v; if (k === 'c1') UI.applyTheme(UI.st.ng); if (k === 'scenario') { const s = D.SCENARIOS.find(x => x.id === v); UI.st.ng.profile = s.profile; } UI.render(); };
  UI.A.startGame = function () {
    const n = UI.st.ng;
    if (!String(n.name).trim()) return UI.toast('Give your team a name', 'bad');
    const scen = n.mode === 'single' ? D.SCENARIOS.find(s => s.id === n.scenario) : null;
    G.Career.newGame({ mode: n.mode, team: { num: Number(n.num), name: String(n.name).trim(), school: n.school, c1: n.c1, c2: n.c2, avatar: n.avatar, region: n.region },
      profile: scen && !scen.custom ? scen.profile : n.profile, diff: n.diff, order: n.order, year: n.year, scenario: scen ? scen.id : null });
    G.Save.write('auto');
    UI.go('hq');
    if (G.S.phase === 'kickoff') UI.kickoffModal();
    else if (!UI.Tut.start('season')) UI.modal('<h2>Welcome, Lead Mentor</h2><p class="muted">It\'s October. The first game will be revealed at Kickoff in January. Sign sponsors (Finance), hire mentors, stock up on parts, register for regionals (Calendar) and start research (Design Office), then press <b>Continue</b>.</p><div class="row"><span class="sp"></span><button class="btn primary" data-act="closeModal">Let\'s go</button></div>');
  };

  // =====================================================================
  // LOAD
  // =====================================================================
  UI.S.load = { full: true, html() {
    const rows = G.Save.slots.map(s => {
      const m = G.Save.meta(s);
      return '<div class="card mb"><div class="row"><div class="sp"><b>' + (s === 'auto' ? 'Autosave' : 'Slot ' + s) + '</b><div class="sm muted">' + (m ? h(m.team.num + ' ' + m.team.name + ' · ' + m.year + ' · ' + (m.mode === 'career' ? 'Career' : 'Single season') + ' · ' + U.money(m.money) + ' · ' + new Date(m.savedAt).toLocaleString()) : 'Empty') + '</div></div>' +
        (m ? '<button class="btn primary" data-act="loadSlot" data-arg="' + s + '">Load</button><button class="btn bad" data-act="delSlot" data-arg="' + s + '">Delete</button>' : '') + '</div></div>';
    }).join('');
    return '<div class="menu-wrap"><div class="menu-box" style="max-width:720px"><div class="row"><div class="logo" style="font-size:28px">Load game</div><span class="sp"></span><button class="btn" data-act="nav" data-arg="menu">Back</button></div><div class="mt">' + rows + '</div>' +
      '<div class="card"><b>Import a save</b><p class="sm muted">Paste a save code from <b>☰ → Export save</b>, or choose a save file.</p>' +
      '<label class="f" for="impText">Save code<textarea id="impText" class="inp mono" rows="4" style="resize:vertical;font-size:11px" placeholder="Paste your save code here"></textarea></label>' +
      '<div class="row wrap mt"><input type="file" accept=".json,application/json" id="impFile" class="inp" style="flex:1;min-width:0"><button class="btn primary" data-act="importSave">Import</button></div></div></div></div>';
  } };
  UI.A.loadSlot = s => { if (G.Save.load(s)) UI.go(G.S.phase === 'end' ? 'end' : G.S.event ? 'event' : 'hq'); else UI.toast('Could not load', 'bad'); };
  UI.A.delSlot = s => UI.confirm('Delete save?', 'This cannot be undone.', 'Delete', () => { G.Save.remove(s); UI.render(); });
  UI.A.importSave = () => {
    const done = (ok, msg) => { if (ok) { G.Save.write('auto'); UI.go(G.S.phase === 'end' ? 'end' : G.S.event ? 'event' : 'hq'); } else UI.toast('Import failed: ' + msg + '.', 'bad'); };
    const txt = (document.getElementById('impText') || {}).value || '';
    if (txt.trim()) return G.Save.importText(txt, done);
    const f = document.getElementById('impFile').files[0];
    if (!f) return UI.toast('Paste a save code or choose a save file first.', 'bad');
    G.Save.importFile(f, done);
  };

  // =====================================================================
  // HELP / SETTINGS
  // =====================================================================
  // =====================================================================
  // VERSION NOTES ("What's new")
  // =====================================================================
  // Newest first. Keep G.VERSION (core.js) equal to the first entry.
  G.RELEASES = [
    { v: '2.3', title: 'Layout polish, smarter spare parts and a bigger Kickoff kit', notes: [
      'Shop → Electronics: products line up in three columns under their vendor (Apex Motion, Lumen Robotics, Kit of Parts), newest version first. A vendor without a version of a part shows an empty slot instead of shifting the others.',
      'Calendar: every month card is the same size and scrolls inside, empty months say so, and the Week 0 scrimmage card now sits above Week 1 in Regional registration.',
      'Auto-restock for spare parts now works all year. Every week (every month in the offseason) it keeps enough spares for driver practice and home repairs on both robots, using cash on hand. Before each event it buys what the event needs with a safety margin (falls and breakages can double the usual need). If money runs short it buys what it can and says so, instead of buying nothing.',
      'Every team gets a Kit of Parts at every Kickoff: 4 brushed motors, 2 low-profile encoders and 2 kitbot gearboxes. As in FRC, only rookies get a control hub, in a bigger first-season kit (8 motors, 4 encoders, 4 gearboxes and the hub). Established and powerhouse teams start with one leftover kit hub on the shelf (a powerhouse fills its third hub slot with it). The Kickoff pop-up lists the kit, and the inbox says if a full shelf recycled anything.',
      'The Alumni fundraising dinner is available from the first season for established and powerhouse teams (rookie teams still wait a season).',
      'Test chassis (Garage → Robot 2): a simple Kitbot Tank, Mecanum or West Coast Drive built from parts on the shelf early in the season, with no project slot (about 20–45 team hours). Even without a Practice Field it gives 6 testing hours a week: development testing for robot code, autos, vision and drivetrain projects at half the cost, and driver practice. With a Practice Field it counts as half a second robot. Driving a different drivetrain only partly carries over to the competition robot\'s familiarity.',
      'Winning the World Championship now opens a celebration: an animated trophy, rotating gold rays, shimmering "YOU ARE THE 20XX WORLD CHAMPIONS" (or "2023–2024 BACK-TO-BACK…", THREE-PEAT…), your new gold banner, your alliance, the story of the final, and what people are saying. There is an easter egg at the bottom too: the alliance that won that game\'s real Einstein, with the game named.',
      'Random-order careers now have their own timeline: seasons count up from 2022 in career order (2022, 2023, …) while the games are shuffled, so dates, banners, season titles and back-to-back headlines read in order. The real game\'s year only appears where it identifies the game (the easter egg).',
      'Established teams start with more older parts at different wear levels (extra Lumen motors, encoders and gearboxes): enough for a test chassis once the competition robot takes the best ones.',
      'More breathing room: section titles sit further from the cards above them, labels no longer touch their bars, and a few cards and pop-ups got more padding.'
    ] },
    { v: '2.2', title: 'Feeder programs, vendor launch events and FRC playoff tiebreakers', notes: [
      'Feeder programs have their own card on the Team page, under the Impact Award. Run up to 6 (FLL, FTC, camps, clubs), each with a focus: Balanced, Drive team, Technical, Strategy or Outreach. Programs grow over three school years (60% → 85% → 100% strength). Every September they add students to the team, and core recruits who come from a program bring the skills its focus trains (the roster shows where each one came from). Outreach programs add the most students and count most for Impact. Changing a focus costs a year of growth, except while a program is new. Older saves keep their programs as established, balanced ones.',
      'Finance shows title, partner and grant slots (for example Title 0/1, Partners 2/4, Grant 0/1). A deal signed this turn has an Undo button until you press Continue, and "Auto-pick best" fills every open slot with the best-value offers. Offers whose slot is full say so instead of showing Sign.',
      'Project slots now show on the Active projects card (Design Office) and the mentor count on the Your mentors card, instead of at the top of the page.',
      'Events: after the last practice block (or Auto-pick), the practice day stays on screen with what each block did and the readiness numbers. Press Continue to start qualifications.',
      'Fixed: a tied playoff game no longer leads to a "Finals 4". Ties follow the FRC tiebreakers: foul points first, then auto points and endgame points (2022 Hangar and 2023 Charge Station points come before auto). Only a game tied on all of them is replayed, and it shows as a replay (for example "Finals · Game 3 (replay)"). The result screen says which tiebreaker decided it, and the bracket marks the winner with *.',
      'Inbox replies are open only for the turn they arrive in: a week in season, a month in the offseason. Unanswered offers show as expired.',
      'Vendor launch events: every fall, 1–4 months before Kickoff, Apex Motion and Lumen Robotics each hold one launch with at least one new product (a launch before the first season too). Each launch gets a pop-up and an inbox post with the presentation, what the community says and your electrical lead\'s take. A rumor at the start of each offseason says when each vendor will launch, and the Calendar shows the launch months. No product line goes past version III in a career; the previous version stays on sale through the next season. Saves in progress keep the products already out and plan the rest under the new rules.'
    ] },
    { v: '2.1', title: 'Two robots, driver familiarity and mechanism kits', notes: [
      'Robot 1 and Robot 2 in the Garage. Either can be the competition robot (it gets the best electronics and goes to events); choose which one the drivers practice on each week. The practice robot project became "Build a full copy" in the Garage. A second robot adds up to 6 testing hours a week, makes practice on it up to 25% more effective and helps event tuning (more the closer it matches the competition robot), but a second set of electronics and copies is expensive.',
      'Build copy: make more of a finished subsystem design for the second robot or as a spare. Copies take about a quarter of the first build\'s hours, use team hours but no project slot (they sit under Fabrication), and need their own electronics and kits. The first one of a new concept or version is a prototype and costs 10% more.',
      'Driver familiarity for each subsystem: new mechanisms start low, new versions cost a little, very different concepts (a dumper to a turret, tank to swerve) cost a lot. Shop driving, practice and matches win it back; in matches a subsystem gives 85–100% of its stats.',
      'Storage holds up to 2 built units of each subsystem. Take old ones apart for spare parts and to get their mechanism kits back. At events, a spare identical to the competition robot\'s (in storage or on the other robot) can be swapped in to restore that subsystem to 100%.',
      'Mechanism kits per concept: a turret shooter uses a turret kit and a shooter kit, a traversal climber up to 4 climber kits. Partial sets help partly. New indexer & hopper kit; kit prices and slot limits adjusted, and motor and encoder slots raised for two robots.',
      'Kit of Parts electronics can now be bought any time (brushed motors, low-profile encoders, a basic control hub, kitbot gearboxes): very cheap and always in stock, for rookies and for teams caught short in season. They are much slower than Apex or Lumen parts, and mixing them with vendor electronics costs 5% more project hours and a little performance. A full shelf no longer accepts parts that would be thrown straight out.',
      'A turret shooter builds on fixed-shooter know-how: concepts now need knowledge in all their core areas (marked ★).',
      'Game elements: fixed preordered and bought sets showing 0% (they now count), preorders show as pending right away, and the practice field card shows element status. Without a Practice Field the kit game pieces are enough; Level 1 fits a quarter set, Level 2 a half, Level 3 a full set.',
      'Loophole fixes: taking a subsystem apart returns at most half its materials in spare parts, a bare second chassis no longer unlocks the second-robot bonuses, a Practice Field without game elements is never worse than none, copies can\'t soak up testing or extra hours, worn mechanism kits help less, and overdrafts in consecutive seasons cost more each time.',
      'Parts is now the Shop. Overtime weeks never lower fatigue, and fatigue is shown as a bar. Calendar months scroll on their own. The Team page is tidier, with the Impact Award under the drive team.'
    ] },
    { v: '2.0', title: 'Parts, fatigue and a new look', notes: [
      'New Parts screen with a real parts library: motors, encoders, control hubs and swerve modules from two electronics vendors (Apex Motion: premium; Lumen Robotics: value), plus drive gearboxes, cameras, pneumatics and optional mechanism kits.',
      'Sell parts you no longer need (Shop → Sell) for part of their price: the better their condition, the more you get. Only parts above 60% condition can be sold.',
      'Every build, including the practice robot, now uses parts. Parts are reusable but wear in matches and practice (slightly slower, more failures). The newest parts go on the competition robot, the rest on the practice robot. Each part type has slot limits; new parts replace the most worn.',
      'Mixing Apex and Lumen electronics costs 10% more hours on hardware and software projects and a little performance. Vendors release 2–3 new generations over a career; the old one stays on sale for a year.',
      'A free Kit of Parts at every Kickoff (bigger for rookies). In season, parts and field elements often sell out, so stock up before Kickoff. Mechanism kits make builds faster and remove first-build penalties.',
      'Game elements: quarter, half and full-field sets that wear down, only help up to your practice field\'s size, and can be preordered for next season.',
      'Extra hours: put spare hours into any project (in 1-hour steps) to raise its quality, with diminishing returns.',
      'Fatigue: leaving about 10% of a week\'s hours idle keeps it steady; overtime and competitions raise it. At events it causes incidents (wrong auto, flat battery, mixed-up scouting) and lowers scouting credibility. New Incidents tab at events, and a Week 7 rest week before the Championship.',
      'Skip any event on its week, and withdraw from any event in the Calendar (half refund only a month or more ahead). Fixed: the game could get stuck in the offseason with a negative balance.',
      'Outreach and fundraising: repeats within a month pay less (resets monthly). New activities unlocked by facilities, sponsors, mentors and the trailer, plus a team night that lowers fatigue.',
      'Team trailer: drive to far events instead of flying (cheaper, no air-freight damage), gentler sponsor demos and +20% robot outreach.',
      'Spare parts reset every season (none before the first), with an auto-restock toggle that buys what the next event needs.',
      'Sponsors: offers sit at a similar level for each difficulty, title sponsors pay about three times a partner, and offers grow a little with reputation and results. Top programs face sponsors who expect wins.',
      'STEM support fund when the balance is under $1,000: emergency money at a cost in reputation.',
      'Team emblem and team colours: the whole interface takes on your team colour. New icons throughout.',
      'Guided tours each season and at your first event and match (switch them off any time), "?" help on every screen, and a new How to play guide organized by topic.'
    ] },
    { v: '1.5', title: 'Debt, calendar & inbox update', notes: [
      'In-season debt: from Kickoff to the Championship you can spend into the red (down to −$50,000). The school clears it at the season review, with a hit to Program Support and reputation that grows with the debt, and the school board writes to you about it. Offseason spending still needs cash, and fundraisers now work even when the balance is negative.',
      'New program calendar: every turn from May to the season review, with events and results, project finish dates, sponsor duties, program milestones and money dates. Filter by category.',
      'Inbox: at least one news item and one to three chatter posts every turn, many about your own team (results, awards, mentors, school, reputation), with far fewer repeats.',
      'Inbox replies: some messages (rookie teams asking for help, interviews, scrimmage invitations, pit requests, school board meetings) let you reply for a small effect. Optional, no popups.',
      'Defense follows the real rules: pin limits (5 s in 2022–2024, 3 s in 2025–2026, then back off six feet) and each game\'s protected zones. No more robots stuck for long stretches.',
      'Turret shooters are much harder to defend: they aim and shoot on the move.',
      'Robots no longer overlap each other or drive through hubs, the Reef, Stage legs, the Barge leg, cages or Towers; stuck robots now steer around traffic.',
      'Systems Shakedown at an event now also rebuilds worn parts, bringing robot condition back to 100%.',
      'Graphics: 2022 shots use red and blue cargo, and 2022 low-goal robots show a bucket instead of the 2026 dumper.'
    ] },
    { v: '1.4', title: 'Season realism update', notes: [
      'REEFSCAPE (2025): the Barge now spans the whole midline, with each alliance\'s three cages and Net on its own half; Processors sit on each alliance\'s right.',
      'REEFSCAPE: alliances share two Coral Stations — the best scorer takes one and the others share the second, queueing at the chute.',
      'RAPID REACT (2022): cargo bounces out of the Hub all over the field, and robots chase their own color anywhere.',
      'CRESCENDO (2024): alliances learn to feed notes across the field and stockpile them for Amplify. A Source-lane defender cancels most of it. Your alliance picks it up through your new strategy read — Strategy mentor, drive coach, driver practice and events scouted — never a button.',
      'REBUILT (2026): new wide dumper shooter — huge throughput, worse under defense. Turrets now shrug off defense.',
      'REBUILT: Tower climbs are slow and risky, so most strong teams keep shooting instead. The default endgame plan is now "Only if worth it".',
      'New failure: a failed high climb can end in a fall — the robot is out for the match, badly damaged, and spare parts are scrapped.',
      'All five fields and the robots got a detail pass: real field elements, bumpers with team numbers, frames, electronics and intake rollers.'
    ] },
    { v: '1.3', title: 'Testing hours', notes: [
      'A Practice Field now gives weekly testing hours (8/12/16 h, +4 with a practice robot), like wind-tunnel time.',
      'Split them between development testing (faster, better upgrades; $40/h) and driver practice (drive-team skills and confidence; costs a few spare parts).',
      'Driver confidence matters more in matches: faster cycles, quicker alignment, fewer fouls and surer climbs.',
      'Repairs use spare parts. The robot arrives at events at 100% unless you\'re short on spares, flying, or did a sponsor demo that week; HQ previews the arrival condition.'
    ] },
    { v: '1.2', title: 'Awards, money and scouting', notes: [
      'The Impact Award is much harder: a multi-season Impact rating plus a submission. HQ shows your odds at each registered regional.',
      'Outreach and fundraising no longer use team hours; repeated fundraisers pay less within a program year.',
      'Facilities cost more, and upgraded 3D Printing, CNC, Machine Shop and Programming Station add project slots (6 permanent at most).',
      'Scouting shows what each robot actually did in qualifications — auto, climbs, fault-free matches, fouls, defense — and AI captains pick by it.',
      'Each season has its own weak spots (tip-overs in 2023, brownouts in 2026), and brief comms drops are now common.'
    ] },
    { v: '1.1', title: 'Program depth', notes: [
      'Battery fleet: up to 10 batteries (20 with a Smart Charging Station); new ones replace the most worn.',
      'Blue banners for event wins and Impact Awards, and a banner wall in History.',
      'Strategy follows the real games: one defender in 2022, 2024 and 2026; three scorers in 2023 and 2025. AI teams catch on during the season.',
      'Alliance captains can call partners to score or defend in the playoffs.',
      'Upgradable Practice Field, sponsor and school opportunities, weekly activity limits, an October registration reminder, a weekly suggested upgrade and a visual team-hours planner.'
    ] },
    { v: '1.0', title: 'First release', notes: [
      'Career mode (five seasons, real or random order) and the Single Season Challenge across 2022–2026.',
      'Budget, sponsors, mentors, facilities with wear, shop incidents and a lively inbox.',
      'Regionals, Championship qualification, live 2D matches with coach calls, alliance selection and double-elimination playoffs.'
    ] }
  ];
  const SEEN_KEY = 'frcm_seen_version';
  UI.S.notes = { full: true, html() {
    return '<div class="menu-wrap"><div class="menu-box" style="max-width:820px"><div class="row"><div class="logo" style="font-size:28px">What\'s new</div><span class="tag acc" style="margin-left:10px">v' + h(G.VERSION) + '</span><span class="sp"></span><button class="btn" data-act="back">Back</button></div>' +
      '<p class="muted">Version notes for FRC Manager. Saves from earlier versions keep working.</p>' +
      G.RELEASES.map((r, i) => '<div class="card mb' + (i === 0 ? ' hl' : '') + '"><div class="ct"><span class="tag ' + (i === 0 ? 'acc' : '') + '">v' + h(r.v) + '</span>&nbsp; ' + h(r.title) + (i === 0 ? ' <span class="xs good" style="margin-left:6px">Latest</span>' : '') + '</div>' +
        '<ul class="vnotes">' + r.notes.map(n => '<li>' + h(n) + '</li>').join('') + '</ul></div>').join('') +
      '</div></div>';
  } };
  // One-time popup when a player opens a newer version than they last saw (first-time players just get the menu).
  UI.versionCheck = function () {
    let seen = null;
    try { seen = localStorage.getItem(SEEN_KEY); localStorage.setItem(SEEN_KEY, G.VERSION); } catch (e) { return; }
    const hadSaves = (function () { try { return G.Save.slots.some(s => !!G.Save.meta(s)); } catch (e) { return false; } })();
    if (seen === G.VERSION || (!seen && !hadSaves)) return;
    const r = G.RELEASES[0];
    UI.modal('<h2>Updated to v' + h(r.v) + '</h2><div class="sub">' + h(r.title) + '</div><ul class="vnotes">' + r.notes.slice(0, 5).map(n => '<li>' + h(n) + '</li>').join('') + '</ul>' +
      '<div class="row mt"><button class="btn primary" data-act="nav2" data-arg="notes">See all version notes</button><span class="sp"></span><button class="btn" data-act="closeModal">Close</button></div>');
  };
  // How to play: see tutorial.js (guide by topic)
  UI.A.back = () => UI.go(G.S && G.S.team ? 'hq' : 'menu');
  UI.S.settings = { full: true, html() {
    const S = G.S;
    return '<div class="menu-wrap"><div class="menu-box" style="max-width:720px"><div class="row"><div class="logo" style="font-size:28px">Settings</div><span class="sp"></span><button class="btn" data-act="back">Back</button></div>' +
      '<div class="card mt"><label class="f">Default match speed<select class="inp" data-chg="prefSpeed">' + [1, 2, 4, 8].map(s => '<option value="' + s + '" ' + (UI.prefs.speed === s ? 'selected' : '') + '>' + s + '×</option>').join('') + '</select></label>' +
      (S && S.mode === 'career' ? '<label class="row mt"><input type="checkbox" data-chg="noFail" ' + (S.settings.noFail ? 'checked' : '') + '> No-fail mode (the program can\'t be cut when Program Support hits 0)</label>' : '') + '</div></div></div>';
  } };
  UI.A.prefSpeed = v => { UI.prefs.speed = Number(v); G.Save.saveSettings(UI.prefs); };
  UI.A.noFail = v => { G.S.settings.noFail = v; };

  // =====================================================================
  // SEASON REVIEW
  // =====================================================================
  UI.S.review = { nav: 'hq', html() {
    const S = G.S, hs = S.history[S.history.length - 1];
    if (!hs) return '<p>No review.</p>';
    let o = '<div class="xs muted">SEASON REVIEW</div><h1>' + h(G.Career.seasonName(G.S, hs.year)) + '</h1>';
    const head = hs.worldChamp ? 'WORLD CHAMPIONS' : hs.divWin ? 'Championship division winners' : hs.champs ? 'Championship qualifiers' : hs.events.some(e => e.won) ? 'Regional winners' : hs.events.some(e => e.playoffs) ? 'Playoff team' : 'Building season';
    o += '<div class="sub lg acc b">' + head + '</div><div class="grid g3">';
    o += UI.card('Events', hs.events.length ? '<table class="t"><tr><th>Event</th><th>Rank</th><th>Result</th></tr>' + hs.events.map(e => '<tr><td>' + h(e.name) + '</td><td>' + (e.rank ? e.rank + '/' + e.size : '') + '</td><td>' + h(e.finish) + (e.awardNames.length ? '<div class="xs acc">' + h(e.awardNames.join(', ')) + '</div>' : '') + '</td></tr>').join('') + '</table>' : '<p class="muted">No events attended.</p>');
    o += UI.card('Program goals', hs.goals.map(g => '<div class="row sm mb"><span class="' + (g.met ? 'good' : 'bad') + '">' + (g.met ? '✔' : '✘') + '</span><span class="tag">' + g.tier + '</span><span>' + h(D.PROGRAM_GOALS[g.id].text) + '</span></div>').join('') +
      '<div class="hr"></div><div class="kv"><span class="k">Program support</span><span>' + Math.round(S.support) + ' (' + (S.season.supportDelta >= 0 ? '+' : '') + (S.season.supportDelta || 0) + ')</span><span class="k">Reputation</span><span>' + Math.round(S.rep) + '</span><span class="k">Legacy this season</span><span class="acc b">+' + hs.legacy + '</span></div>');
    o += UI.card('Finances', '<div class="kv"><span class="k">Earned</span><span class="good">' + U.money(hs.earned) + '</span><span class="k">Spent</span><span class="bad">' + U.money(hs.spent) + '</span><span class="k">Balance</span><span class="' + (hs.money < 0 ? 'bad' : '') + ' b">' + U.money(hs.money) + '</span><span class="k">Avg RP / qual match</span><span>' + hs.avgRP.toFixed(2) + '</span>' +
      (S.season && S.season.debt ? '<span class="k">Debt covered by school</span><span class="bad">' + U.money(S.season.debt) + ' (support −' + S.season.debtPen.support + ', reputation −' + S.season.debtPen.rep + ')</span>' : '') + '</div>');
    o += '</div>';
    const last = S.upcoming >= S.order.length || S.mode === 'single';
    o += '<div class="hint mt">' + (last ? 'This was your final season.' : S.support <= 0 && !S.settings.noFail ? 'Program Support has collapsed — the school is ending the program.' : 'Next: the offseason. Graduation in June, recruiting in September, sponsors and registration in October, Kickoff in January.') + '</div>';
    o += '<div class="row mt"><span class="sp"></span><button class="btn primary lg" data-act="reviewNext">' + (last ? 'Final summary ▶' : 'Continue to offseason ▶') + '</button></div>';
    return o;
  } };
  UI.A.reviewNext = function () { const S = G.S; G.Career.advance(S); UI.go(S.phase === 'end' ? 'end' : 'hq'); };

  // =====================================================================
  // END / SUMMARY
  // =====================================================================
  UI.S.end = { nav: 'hq', html() {
    const S = G.S;
    let o = '';
    if (S.mode === 'single') {
      const g = G.Career.grade(S);
      o += '<div class="xs muted">SINGLE SEASON CHALLENGE</div><h1>Grade: <span class="acc" style="font-size:44px">' + g.grade + '</span></h1><div class="sub">' + h(g.goalText) + ' — ' + (g.met ? '<span class="good">achieved</span>' : '<span class="bad">not achieved</span>') + ' · legacy ' + g.legacy + '</div>';
    } else {
      const L = S.legacy;
      const title = S.endReason === 'fired' ? 'Program cut' : L >= 1500 ? 'Hall of Fame Program' : L >= 900 ? 'Dynasty' : L >= 500 ? 'Regional Powerhouse' : L >= 200 ? 'Rising Program' : 'Building Program';
      o += '<div class="xs muted">CAREER COMPLETE</div><h1>' + h(title) + '</h1><div class="sub">' + S.team.num + ' ' + h(S.team.name) + ' · Legacy points <b class="acc">' + L + '</b>' + (S.worldChamps ? ' · ' + S.worldChamps + '× World Champions' : '') + '</div>';
    }
    o += '<div class="card"><table class="t"><tr><th>Season</th><th>Events</th><th>Best result</th><th>Awards</th><th>Champs</th><th class="num">Legacy</th></tr>' + S.history.map(hs => {
      const best = hs.worldChamp ? 'World Champion' : hs.divWin ? 'Division winner' : hs.events.some(e => e.won) ? 'Regional winner' : hs.events.some(e => e.finalist) ? 'Finalist' : hs.events.some(e => e.playoffs) ? 'Playoffs' : '—';
      return '<tr><td>' + h(G.Career.seasonName(G.S, hs.year)) + '</td><td>' + hs.events.length + '</td><td>' + best + '</td><td>' + hs.awards.length + '</td><td>' + (hs.champs ? '✔' : '') + '</td><td class="num">' + hs.legacy + '</td></tr>';
    }).join('') + '</table></div>';
    const bn = G.Career.banners(S);
    if (bn.length) o += '<div class="card mt"><div class="ct">Banner wall ' + UI.tag(bn.length + ' banner' + (bn.length > 1 ? 's' : ''), 'acc') + '</div>' + UI.bannerWall(bn) + '</div>';
    const k = D.AREAS.map(a => ({ a, l: G.Robot.know(S, a.id) })).filter(x => x.l > 0).sort((p, q) => q.l - p.l);
    o += '<div class="card mt"><div class="ct">Knowledge legacy</div>' + (k.length ? k.map(x => UI.tag(x.a.name + ' Lv' + x.l, 'acc')).join(' ') : '<span class="muted">—</span>') + '</div>';
    o += '<div class="row mt"><button class="btn" data-act="nav" data-arg="history">Season details</button><span class="sp"></span><button class="btn primary" data-act="quitMenu">Main menu</button></div>';
    return o;
  } };
})();

</script>
<script>/* js/ui/screens-parts.js */
'use strict';
/* FRC Manager — Shop screen: what the robots use, the electronics store (two vendors), mechanical COTS,
   game elements (with next season's preorders), spare parts and batteries */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI, P = () => G.Parts;
  const pct = v => Math.round(v * 100) + '%';
  const vtag = v => '<span class="vtag" style="--vc:' + D.VENDORS[v].color + '">' + h(D.VENDORS[v].short) + '</span>';
  const healthBar = v => '<span class="mini">' + UI.bar(v * 100, 100, UI.colorFor(v * 100)) + '</span>';
  const stockTag = (S, id) => P().inSeason(S) ? (P().inStock(S, id) ? UI.tag('in stock', 'good') : UI.tag('sold out this week', 'bad')) : UI.tag('in stock', 'good');

  UI.S.parts = { html() {
    const S = G.S, tab = UI.st.partsTab || 'robot';
    const season = P().inSeason(S);
    let o = UI.head('Shop', 'parts', 'Motors, electronics and mechanisms for your robots. Parts last for years but wear with use.' + (season ? ' <span class="warn">In season, parts often sell out: check back each week.</span>' : ' <span class="good">Offseason: everything is in stock. Stock up before Kickoff.</span>'), 'parts');
    const ny = P().nextYear(S);
    o += UI.tabs(tab, [['robot', 'Your robots', 'garage'], ['elec', 'Electronics', 'chip'], ['cots', 'Mechanical COTS', 'gear'], ['elem', 'Game elements', 'elements']].concat(ny != null ? [['pre', 'Preorder', 'truck']] : []).concat([['sell', 'Sell', 'money'], ['spares', 'Spares & batteries', 'battery']]), 'partsTab');
    if (tab === 'robot') o += robotTab(S);
    else if (tab === 'sell') o += sellTab(S);
    else if (tab === 'pre') o += preTab(S);
    else if (tab === 'elec') o += elecTab(S);
    else if (tab === 'cots') o += cotsTab(S);
    else if (tab === 'elem') o += elemTab(S);
    else o += sparesTab(S);
    return o;
  } };
  UI.A.partsTab = t => { UI.st.partsTab = t; UI.render(); };

  // ---------- your robots: allocation, health, vendor mix ----------
  function robotTab(S) {
    const a = P().alloc(S), pr = S.robot ? P().profile(S) : null, R0 = S.robot, ci = R0 ? R0.comp || 0 : 0, pb = !!(R0 && R0.bots && (Object.keys(a.need.prac).length || D.PART_CATS.some(c => (a.prac[c.id] || []).length)));
    let o = '';
    if (pr) {
      const vs = Object.keys(pr.vendors);
      o += '<div class="grid g3 mb">' +
        '<div class="card flat"><div class="ct">' + UI.it('chip', 'Control system') + '</div>' + (vs.length ? vs.map(v => vtag(v) + ' ' + pr.vendors[v]).join(' ') : '<span class="muted">Kit parts only</span>') +
        (pr.mixed ? '<div class="warnbox mt">Mixed control systems: hardware and software projects take 10% longer, and the robot loses a little reliability and speed.</div>' : pr.kopMix ? '<div class="warnbox mt">Kit of Parts electronics next to vendor ones: hardware and software projects take 5% longer, and the robot loses a little reliability and speed.</div>' : '<div class="xs good mt">' + UI.icon('check', 13) + ' One control system</div>') + '</div>' +
        '<div class="card flat"><div class="ct">' + UI.it('motor', 'Performance') + '</div>' + UI.stat('Motors', pr.motor * 100) + UI.stat('Sensors', pr.enc * 100) + (a.need.comp.swerve ? UI.stat('Swerve', pr.swerve * 100) : '') + '</div>' +
        '<div class="card flat"><div class="ct">' + UI.it('spare', 'Wear') + '</div>' + UI.stat('Average health', pr.health * 100, null, UI.colorFor(pr.health * 100)) + '<div class="xs muted">Worn parts barely slow the robot, but they fail more often. New parts automatically go on the competition robot.</div></div></div>';
      if (pr.short) o += '<div class="warnbox mb">The competition robot is short of ' + pr.short + ' part' + (pr.short > 1 ? 's' : '') + ' (kit parts fill in at low performance). Buy them in the Electronics tab.</div>';
    } else o += '<div class="hint mb">No robot this season yet. At Kickoff you get the Kit of Parts; everything else comes from here. Every build needs motors (and more), so stock up now: in season, parts often sell out.</div>';
    // preferred control system
    o += '<div class="row wrap mb"><span class="sm muted">Competition robot uses:</span>' + [[null, 'Best parts (may mix)'], ['A', 'Apex first'], ['B', 'Lumen first']].map(x => '<button class="btn sm ' + ((S.vendorPref || null) === x[0] ? 'sel' : '') + '" data-act="vendorPref" data-arg="' + (x[0] || '') + '">' + h(x[1]) + '</button>').join('') + '</div>';
    // inventory table
    o += '<table class="t"><tr><th>Part</th><th class="num">On shelf</th><th class="num">' + (R0 ? h(R0.bots[ci].name) + ' (competes)' : 'Competition') + '</th>' + (pb ? '<th class="num">' + h(R0.bots[1 - ci].name) + '</th>' : '') + '<th>Health</th><th>Mix</th></tr>' + D.PART_CATS.map(c => {
      const list = P().items(S, c.id); if (!list.length && !(a.need.comp[c.id])) return '';
      const nc = c.kit ? (a.comp[c.id] || []).length : (a.need.comp[c.id] || 0), np = c.kit ? (a.prac[c.id] || []).length : (a.need.prac[c.id] || 0);
      const hAvg = list.length ? U.avg(list.map(x => x.h)) : 1;
      const mix = {}; list.forEach(x => { const p = P().prod(x.p); const k = p.v === 'C' ? p.name : p.name; mix[k] = (mix[k] || 0) + 1; });
      const short = !c.kit && nc > list.length;
      return '<tr><td>' + UI.it(c.icon, h(c.short)) + '</td><td class="num">' + list.length + '<span class="dim">/' + c.max + '</span></td><td class="num ' + (short ? 'bad' : '') + '">' + (c.kit ? (nc ? nc + ' built in' : '—') : nc || '—') + '</td>' + (pb ? '<td class="num">' + (np || '—') + '</td>' : '') +
        '<td>' + (list.length ? healthBar(hAvg) + ' <span class="xs muted">' + pct(hAvg) + '</span>' : '') + '</td><td class="xs muted">' + Object.keys(mix).map(k => mix[k] + '× ' + h(k)).join(', ') + '</td></tr>';
    }).join('') + '</table>';
    // per-subsystem bill of materials
    if (S.robot) {
      const R = S.robot, year = R.year;
      const rows = G.Seasons[year].subs.filter(sd => sd.id !== 'soft' && R.subs[sd.id].ver).map(sd => {
        const s = R.subs[sd.id], c = G.Seasons.concept(year, sd.id, s.concept), b = P().bom(year, sd.id, c);
        return '<div class="row sm"><span class="b">' + h(sd.name) + '</span><span class="muted">' + h(c.name) + '</span><span class="sp"></span>' + Object.keys(b).map(k => b[k] + ' ' + h(D.PART_CAT[k].short.toLowerCase())).join(' · ') + (s.kits ? ' ' + Object.keys(s.kits).map(k => UI.tag(s.kits[k] + ' ' + D.PART_CAT[k].short.toLowerCase().replace(/s$/, s.kits[k] > 1 ? 's' : ''), 'info')).join(' ') : '') + '</div>';
      });
      if (rows.length) o += '<div class="mt">' + UI.card(UI.it('garage', 'What each subsystem uses'), rows.join('') + '<div class="xs muted mt">Plus one control hub per robot' + (R.visionLvl ? ' and ' + R.visionLvl + ' camera' + (R.visionLvl > 1 ? 's' : '') : '') + '. A second robot needs its own set of electronics.</div>') + '</div>';
    }
    return o;
  }
  UI.A.vendorPref = v => { G.S.vendorPref = v || null; UI.render(); };

  // ---------- selling parts ----------
  // Each part is a chip: its condition and resale value. Parts above 60% the robots don't need can be sold.
  function sellTab(S) {
    let o = '<div class="hint mb">' + UI.icon('money', 14) + ' Sell parts you no longer need for part of their price: about ' + Math.round(D.RESALE * 100) + '% of today\'s list price at full condition, less as they wear. Only parts above ' + Math.round(D.SELL_MIN * 100) + '% condition can be sold, Kit of Parts items can\'t, and you can\'t sell below what your robots need.</div>';
    let any = false;
    D.PART_CATS.forEach(c => {
      const list = P().items(S, c.id).filter(it => P().prod(it.p) && P().prod(it.p).price && P().prod(it.p).v !== 'K');
      if (!list.length) return;
      any = true;
      const groups = {};
      list.forEach(it => { (groups[it.p] = groups[it.p] || []).push(it); });
      const room = P().sellRoom(S, c.id);
      o += '<div class="card mb"><div class="ct">' + UI.it(c.icon, h(c.short)) + '<span class="sp"></span><span class="xs muted">' + list.length + ' owned · ' + (room ? 'up to ' + room + ' can go' : 'all in use by your robots') + '</span></div>' +
        Object.keys(groups).map(pid => {
          const pr = P().prod(pid), its = groups[pid].slice().sort((a, b) => b.h - a.h);
          const sellable = its.filter(it => !P().sellBlock(S, c.id, it)).sort((a, b) => a.h - b.h).slice(0, room); // most worn go first
          const total = sellable.reduce((t, it) => t + P().resale(S, it), 0);
          return '<div class="sellrow"><div class="row sm"><b>' + h(pr.name) + '</b>' + (pr.v === 'A' || pr.v === 'B' ? vtag(pr.v) : '') + '<span class="sp"></span>' +
            (sellable.length > 1 ? '<button class="btn sm" data-act="sellAll" data-arg="' + c.id + '|' + pid + '">Sell all ' + sellable.length + ' · +' + U.money(total) + '</button>' : '') + '</div>' +
            '<div class="row wrap gap4 mt">' + its.map(it => {
              const why = P().sellBlock(S, c.id, it), v = P().resale(S, it);
              return '<button class="pchip" data-act="sellPart" data-arg="' + c.id + '|' + it.id + '" ' + (why ? 'disabled title="' + h(why) + '"' : 'title="Sell for ' + U.money(v) + '"') + '><i style="background:' + UI.colorFor(it.h * 100) + '"></i>' + Math.round(it.h * 100) + '%' + (why ? '' : ' · ' + U.money(v)) + '</button>';
            }).join('') + '</div></div>';
        }).join('') + '</div>';
    });
    if (!any) o += '<p class="muted">Nothing to sell: Kit of Parts items can\'t be resold.</p>';
    return o;
  }
  UI.A.sellPart = arg => {
    const [cat, id] = arg.split('|'), r = G.Parts.sell(G.S, cat, id);
    if (typeof r === 'string') return UI.err(r);
    UI.toast('Sold ' + r.name + ' for ' + U.money(r.amount), 'good'); UI.render();
  };
  UI.A.sellAll = arg => {
    const [cat, pid] = arg.split('|'), S = G.S;
    const its = G.Parts.items(S, cat).filter(it => it.p === pid && !G.Parts.sellBlock(S, cat, it));
    UI.confirm('Sell ' + its.length + '× ' + G.Parts.prod(pid).name + '?', 'You get ' + U.money(its.reduce((t, it) => t + G.Parts.resale(S, it), 0)) + '. Parts your robots need are kept.', 'Sell', () => {
      let got = 0, n = 0;
      G.Parts.items(S, cat).filter(it => it.p === pid).sort((a, b) => a.h - b.h).forEach(it => { const r = G.Parts.sell(S, cat, it.id); if (r && typeof r === 'object') { got += r.amount; n++; } });
      UI.toast('Sold ' + n + ' for ' + U.money(got), 'good'); UI.render();
    });
  };

  // ---------- electronics store ----------
  function prodCard(S, x) {
    const p = x.prod, owned = P().items(S, p.cat).filter(i => i.p === p.id).length, price = P().price(S, p), ok = P().inStock(S, p.id) || !P().inSeason(S);
    const qty = p.cat === 'motor' ? [1, 4, 8] : p.cat === 'swerve' ? [1, 4] : p.cat === 'enc' ? [1, 4] : p.cat === 'gearbox' ? [1, 2] : [1];
    return '<div class="pcard ' + (x.ending ? 'old' : '') + '" style="--vc:' + D.VENDORS[p.v].color + '"><div class="row wrap gap4"><b>' + h(p.name) + '</b>' + (x.isNew ? UI.tag('NEW', 'acc') : '') + (x.ending ? UI.tag('last year on sale', 'warn') : '') + '<span class="sp"></span>' + vtag(p.v) + '</div>' +
      '<div class="statrow"><span class="n">Performance</span>' + UI.bar(p.perf * 100, 100, D.VENDORS[p.v].color) + '<span class="v">' + Math.round(p.perf * 100) + '</span></div>' +
      '<div class="row sm wrap"><span class="b">' + U.money(price) + '</span><span class="muted">each · owned ' + owned + '</span><span class="sp"></span>' + (p.v === 'K' ? UI.tag('always in stock', 'good') : stockTag(S, p.id)) + '</div>' +
      '<div class="row wrap gap4 mt">' + qty.map(n => '<button class="btn sm" data-act="buyProd" data-arg="' + p.id + '|' + n + '" ' + (ok ? '' : 'disabled') + '>+' + n + ' · ' + U.money(n * price) + '</button>').join('') + '</div></div>';
  }
  function elecTab(S) {
    const sale = P().forSale(S);
    let o = '<div class="grid g3 vcols vhead mb">' + ['A', 'B', 'K'].map(v => '<div class="card flat vendor" style="--vc:' + D.VENDORS[v].color + '"><div class="row">' + UI.icon('bolt', 20) + '<b class="lg">' + h(D.VENDORS[v].name) + '</b>' + UI.tag(D.VENDORS[v].tag) + '</div><div class="sm muted">' + h(D.VENDORS[v].desc) + '</div></div>').join('') + '</div>';
    o += '<div class="hint mb">' + UI.icon('info', 14) + ' Pick one control system if you can: mixing Apex and Lumen electronics on the competition robot costs 10% more hours on hardware and software projects and a little performance. <b>Kit of Parts</b> electronics (brushed motors, low-profile encoders, a basic hub) are very cheap and never sell out, which helps rookies and teams caught short in season, but they are much slower, and using them next to Apex or Lumen parts costs 5% more hours and a little performance. Each vendor holds a launch event every fall (September to December, before Kickoff) with at least one new product; the previous version stays on sale through the next season, and no product line goes past version III.</div>';
    // one column per vendor (Apex | Lumen | Kit of Parts), lined up under the vendor cards; newest version first
    D.ELEC_CATS.forEach(cat => {
      const c = D.PART_CAT[cat];
      o += '<h2 class="sect">' + UI.it(c.icon, h(c.name)) + ' <span class="xs muted">' + h(c.desc) + ' · you have ' + P().count(S, cat) + '/' + c.max + '</span></h2>';
      o += '<div class="grid g3 vcols">' + ['A', 'B', 'K'].map(v => {
        const list = sale.filter(x => x.prod.cat === cat && x.prod.v === v).sort((a, b) => (a.ending ? 1 : 0) - (b.ending ? 1 : 0));
        return '<div class="col">' + (list.length ? list.map(x => prodCard(S, x)).join('') : '<div class="pcard empty xs muted">No ' + h(D.VENDORS[v].name) + ' version of this part.</div>') + '</div>';
      }).join('') + '</div>';
    });
    return o;
  }
  UI.A.buyProd = arg => {
    const [id, n] = arg.split('|'), r = G.Parts.buy(G.S, id, Number(n));
    if (typeof r === 'string') return UI.err(r);
    UI.toast('Bought ' + ((r && r.bought) || n) + '× ' + G.Parts.prod(id).name + (r && r.replaced ? ' (replaced ' + r.replaced + ' worn part' + (r.replaced > 1 ? 's' : '') + ')' : ''), 'good');
    UI.render();
  };

  // ---------- mechanical COTS ----------
  function cotsTab(S) {
    let o = '<div class="hint mb">' + UI.icon('info', 14) + ' Mechanical parts come from many suppliers and always fit. Drive gearboxes, cameras and pneumatics are used like electronics. <b>Mechanism kits are optional:</b> each concept can use a set (a turret shooter: a turret kit and a shooter kit; a traversal climber: up to 4 climber kits). A full set makes the build ' + Math.round((1 - D.KIT_HOURS) * 100) + '% faster, uses ' + Math.round((1 - D.KIT_COST) * 100) + '% less material and removes first-build penalties; a partial set gives part of that. Kits stay in the subsystem they were built into (on either robot or in storage); take a stored subsystem apart in the Garage to free them. Kits wear with use, and worn kits help less (down to half). Without kits, the team fabricates its own.</div>';
    o += '<div class="grid g3">' + D.COTS_CATS.map(cat => {
      const c = D.PART_CAT[cat], p = P().prod(cat + 'C'), price = P().price(S, p), have = P().count(S, cat), ok = P().inStock(S, p.id) || !P().inSeason(S);
      const free = c.kit ? P().kitsFree(S, cat) : null, full = have >= c.max;
      return '<div class="pcard" style="--vc:' + D.VENDORS.C.color + '"><div class="row">' + UI.icon(c.icon, 18) + '<b>' + h(c.name) + '</b><span class="sp"></span>' + stockTag(S, p.id) + '</div><div class="xs muted">' + h(c.desc) + (c.kit ? ' Helps ' + h(Object.keys(D.KIT_FOR_AREA).filter(k => D.KIT_FOR_AREA[k] === cat).map(k => D.AREA[k].name.toLowerCase()).join(' and ')) + ' builds.' : '') + '</div>' +
        '<div class="row sm mt"><span class="b">' + U.money(price) + '</span><span class="muted">owned ' + have + '/' + c.max + (c.kit ? ' · ' + free + ' free' + (have - free > 0 ? ' · ' + (have - free) + ' in subsystems' : '') : '') + '</span><span class="sp"></span><button class="btn sm" data-act="buyProd" data-arg="' + p.id + '|1" ' + (ok && !full ? '' : 'disabled') + '>' + (full ? 'Full' : 'Buy') + '</button></div></div>';
    }).join('') + '</div>';
    o += '<h2 class="mt">' + UI.it('box', 'Kit of Parts') + ' <span class="xs muted">cheap, basic, always in stock</span></h2><div class="grid g3">' + P().forSale(S).filter(x => x.prod.v === 'K' && !D.PART_CAT[x.prod.cat].elec).map(x => prodCard(S, x)).join('') + '</div>';
    return o;
  }

  // ---------- game elements ----------
  function elemTab(S) {
    const y = P().elemYear(S), ny = P().nextYear(S), fs = P().fieldSize(S), season = P().inSeason(S);
    let o = '<div class="hint mb">' + UI.icon('pfield', 14) + ' ' + (fs ? 'Your Practice Field (Level ' + G.Shop.lvl(S, 'pfield') + ') fits a ' + P().setName(fs).toLowerCase() + ' set of elements' : 'No Practice Field yet: the kit game pieces are all you need, so only buy sets as spares for later') + '. Bigger sets than the field add nothing; worn sets count for less. Driver practice wears them like parts. You can store up to ' + D.ELEM_MAX + ' fields\' worth, so stocking a spare set before the season protects you from in-season shortages.</div>';
    if (y != null) {
      const sets = P().elemSets(S, y), fill = P().elemFill(S, y), q = P().elemQ(S, y);
      o += UI.card(UI.it('elements', (season ? 'This season' : 'Last season') + ': ' + y + ' ' + h(G.Seasons[y].name)),
        '<div class="grid g2"><div>' + UI.stat('Field filled', fill * 100, null, UI.colorFor(fill * 100)) + UI.stat('Driver-practice quality', q * 100, null, UI.colorFor(q * 100)) +
        '<div class="row wrap gap4 mt">' + (S.elemKop && S.elemKop[y] ? '<span class="tag">Kit game pieces</span>' : '') + sets.map(e => '<span class="tag">' + P().setName(e.s) + ' set ' + pct(e.h) + '</span>').join('') + P().elemPending(S, y).map(e => '<span class="tag info">' + P().setName(e.s) + ' set · pending</span>').join('') + (sets.length ? '' : '<span class="xs muted">no sets</span>') + '</div></div>' +
        '<div class="col">' + D.ELEM_SETS.map(e => elemBtn(S, e, false, season)).join('') + '</div></div>');
    }
    if (ny != null) {
      const pend = P().elemPending(S, ny);
      o += '<div class="mt">' + UI.card(UI.it('truck', 'Next season (' + ny + ')'), '<div class="row wrap gap4">' + (pend.length ? pend.map(e => '<span class="tag info">' + P().setName(e.s) + ' set · pending</span>').join('') + '<span class="xs muted">arrives with the Kit of Parts at Kickoff</span>' : '<span class="sm muted">Nothing on order yet.</span>') + '<span class="sp"></span><button class="btn sm" data-act="partsTab" data-arg="pre">Preorder</button></div>') + '</div>';
    }
    if (y == null && ny == null) o += '<p class="muted">No game to buy elements for right now.</p>';
    return o;
  }
  // ---------- preorders: next season's game elements, delivered at Kickoff ----------
  function preTab(S) {
    const ny = P().nextYear(S);
    if (ny == null) return '<p class="muted">Preorders open after the season review.</p>';
    const pre = (S.elemPre && S.elemPre[ny]) || [];
    return UI.card(UI.it('truck', 'Preorder next season\'s field elements'), '<div class="sm muted mb">The game is revealed at Kickoff. Preordered elements arrive with the Kit of Parts and never sell out, while in-season orders often do. Match the size to your practice field (' + (P().fieldSize(S) ? P().setName(P().fieldSize(S)).toLowerCase() + ' set now' : 'none yet: the kit pieces are enough') + '); a spare set guards against wear.</div>' +
      '<div class="grid g2"><div class="sm">' + (pre.length ? '<div class="mb">' + UI.icon('check', 14) + ' On order (pending until Kickoff):</div><div class="row wrap gap4">' + pre.map(e => '<span class="tag info">' + P().setName(e.s) + ' set · pending</span>').join('') + '</div>' : '<span class="muted">Nothing on order yet.</span>') + '</div><div class="col">' + D.ELEM_SETS.map(e => elemBtn(S, e, true)).join('') + '</div></div>');
  }
  function elemBtn(S, e, pre, season) {
    const price = Math.round(e.price * (D.PART_PRICE_DIFF[S.diff] || 1)), ok = pre || !season || P().inStock(S, 'elem' + e.id);
    return '<div class="row sm"><span>' + h(e.name) + '</span><span class="sp"></span>' + (pre ? '' : season ? stockTag(S, 'elem' + e.id) : '') + '<button class="btn sm" data-act="buyElem" data-arg="' + e.id + '|' + (pre ? 1 : 0) + '" ' + (ok ? '' : 'disabled') + '>' + (pre ? 'Preorder' : 'Buy') + ' · ' + U.money(price) + '</button></div>';
  }
  UI.A.buyElem = arg => { const [id, pre] = arg.split('|'); if (!UI.err(G.Parts.buyElem(G.S, id, pre === '1'))) { UI.toast(pre === '1' ? 'Preordered: arrives at Kickoff' : 'Field elements bought', 'good'); UI.render(); } };

  // ---------- spares and batteries ----------
  function sparesTab(S) {
    const C = G.Career, up = C.spareUnitPrice(S, false), next = (function () { const regs = S.regionals.filter(r => S.registered.includes(r.id) && !S.eventsDone[r.id]).sort((a, b) => a.week - b.week); return regs[0] ? Object.assign({ kind: 'regional' }, regs[0]) : null; })();
    const est = next && S.robot ? C.spareEstimate(S, 'regional') : null;
    let o = UI.card(UI.it('spare', 'Spare parts ' + UI.tag(S.parts.spares + ' on hand', S.parts.spares ? '' : 'warn')),
      '<div class="sm muted mb">Spare parts are specific to this season\'s robot: repairs at home and in the pits use them, and they are cleared out at each Kickoff (none before your first season). One spare restores about ' + D.SPARE_COND_PER_UNIT + ' condition points. ' + U.money(up) + ' each here, ' + U.money(C.spareUnitPrice(S, true)) + ' at events.</div>' +
      '<div class="row wrap gap4">' + [2, 5, 10].map(n => '<button class="btn sm" data-act="buySpares" data-arg="' + n + '">+' + n + ' · ' + U.money(n * up) + '</button>').join('') + '</div>' +
      '<label class="row sm mt"><input type="checkbox" data-chg="autoSpares" ' + (S.autoSpares ? 'checked' : '') + '> Auto-restock</label><div class="xs muted">Every ' + (S.phase === 'off' ? 'month' : 'week') + ' it keeps enough spares for driver practice and home repairs on both robots (cash only), and before each event it buys what the event needs' + (est != null ? ' (next event: about ' + est + ', you have ' + S.parts.spares + ')' : '') + '.' + (S.lastRestock && S.lastRestock.bought ? ' Last turn: bought ' + S.lastRestock.bought + '.' : '') + (S.lastRestock && S.lastRestock.short ? ' <span class="warn">Not enough cash for all ' + S.lastRestock.want + ' last turn.</span>' : '') + '</div>');
    o += '<div class="mt">' + UI.card(UI.it('battery', 'Batteries'), UI.batteryRow(S)) + '</div>';
    return o;
  }
  UI.A.autoSpares = v => { G.S.autoSpares = !!v; UI.render(); };
})();

</script>
<script>/* js/ui/tutorial.js */
'use strict';
/* FRC Manager — guided tours (each season, first event, first match) and the categorized How to play guide */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI;
  const ic = (n, s) => UI.icon(n, s || 16);
  const flow = list => '<div class="diagram">' + list.map((x, i) => (i ? '<span class="arr">→</span>' : '') + '<span class="node">' + ic(x[0], 14) + h(x[1]) + '</span>').join('') + '</div>';

  // =====================================================================
  // Tours: a card next to the highlighted control, Back / Next / Skip, and "Don't show tutorials"
  // =====================================================================
  const TOURS = {
    season: () => [
      { icon: 'trophy', title: 'Your season at a glance', body: 'You are the Lead Mentor. You don\'t drive: you run the program behind the robot.', diagram: flow([['design', 'Plan the week'], ['play', 'Continue'], ['event', 'Compete'], ['history', 'Season review']]) },
      { sel: '[data-act="continue"]', icon: 'play', title: 'Continue = next turn', points: ['One turn is a <b>week</b> in season and a <b>month</b> in the offseason.', 'Team hours are spent when you press it.', 'Budget, morale, support, reputation and (in season) fatigue sit up here.'] },
      { sel: '.nav[data-arg="hq"]', screen: 'hq', icon: 'hq', title: 'Headquarters', points: ['This week\'s to-do and your next event.', 'Robot, projects, money and goals in one place.'] },
      { sel: '.nav[data-arg="inbox"]', icon: 'inbox', title: 'Inbox', points: ['News, results and decisions.', 'Some messages take an optional <b>reply</b> with a small effect.'] },
      { sel: '.nav[data-arg="design"]', screen: 'design', icon: 'design', title: 'Design Office', points: ['Pick a <b>concept</b> for each subsystem, then upgrade it. <b>Build copy</b> makes more of a finished design.', 'Projects share the team hours. Give a project <b>extra hours</b> to raise its quality.', 'Leave about <b>10% idle</b> each week to keep fatigue steady.'] },
      { sel: '.nav[data-arg="garage"]', screen: 'garage', icon: 'garage', title: 'Garage: two robots', points: ['<b>Robot 1</b> and <b>Robot 2</b>: pick which one competes and which one the drivers practice on.', 'Fit built subsystems to either robot; spares wait in storage.', 'Drivers need practice with each new mechanism (<b>familiarity</b>).'] },
      { sel: '.nav[data-arg="parts"]', screen: 'parts', icon: 'parts', title: 'Shop', points: ['Every build needs motors and electronics. Kickoff brings a small free kit.', 'Two vendors: <b>Apex</b> (premium) and <b>Lumen</b> (value). Mixing them costs a little.', 'In season, parts often <b>sell out</b>: stock up before Kickoff.'] },
      { sel: '.nav[data-arg="workshop"]', icon: 'workshop', title: 'Workshop', points: ['Facilities speed up projects and add project slots.', 'They wear down: renovate or upgrade.'] },
      { sel: '.nav[data-arg="team"]', icon: 'team', title: 'Team', points: ['Choose the drive team.', 'Outreach and fundraising (each repeat in a month pays less).'] },
      { sel: '.nav[data-arg="finance"]', icon: 'finance', title: 'Finance', points: ['Sign sponsors in October; they pay at Kickoff.', 'In season you may go into debt; under ' + U.money(D.STEM_FUND.below) + ' the STEM fund can help.'] },
      { sel: '.nav[data-arg="calendar"]', icon: 'calendar', title: 'Calendar', points: ['The whole year with filters.', 'Register for regionals (weeks 1–6). Week 7 is a rest week before the Championship.', 'Withdraw a month ahead for a half refund.'] },
      { sel: '.helpq', icon: 'help', title: 'Need more?', points: ['The <b>?</b> on every screen opens its guide.', 'The full guide is in <b>☰ → How to play</b>.'] }
    ],
    event: () => [
      { icon: 'event', title: 'Your first event', body: 'An event runs in stages:', diagram: flow([['spare', 'Practice'], ['play', 'Qualifications'], ['team', 'Alliance selection'], ['trophy', 'Playoffs']]) },
      { sel: '.card .ct', icon: 'spare', title: 'Practice day', points: ['Spend practice blocks on tuning, driver reps, auto, scouting or a <b>Systems Shakedown</b> (rebuilds the robot to 100%).'] },
      { sel: '.card.mt .ct', icon: 'spare', title: 'Pit crew', points: ['Repairs between matches use <b>spare parts</b>. Buying them here costs double.', 'A spare subsystem in storage identical to the robot\'s can be <b>swapped in</b> to restore it to 100%.'] },
      { icon: 'fatigue', title: 'Fatigue at events', points: ['Team fatigue is locked in when the event starts.', 'Tired teams make mistakes: wrong auto, flat battery, mixed-up scouting. See the <b>Incidents</b> and <b>Scouting</b> tabs.'] }
    ],
    match: () => [
      { icon: 'play', title: 'Your first match', points: ['Set the plan: pace, role (score / defend / feed), target and endgame.', 'Watch it live or simulate it.'] },
      { icon: 'mentors', title: 'Coach Calls', points: ['A few calls per match: change pace or role, go for the endgame, reset a faulted robot.', 'Defense follows the real rules: pins are limited and some zones are protected.'] }
    ]
  };
  const Tut = UI.Tut = { cur: null };
  Tut.enabled = () => !G.Save.settings().noTut;
  Tut.setEnabled = on => { const st = G.Save.settings(); st.noTut = !on; G.Save.saveSettings(st); };
  // start(id, force): season tours run every season; event and match tours only the first time
  Tut.start = function (id, force) {
    if (!force && !Tut.enabled()) return false;
    const S = G.S;
    if (!force && S && id !== 'season') { S.tutSeen = S.tutSeen || {}; if (S.tutSeen[id]) return false; S.tutSeen[id] = true; }
    Tut.cur = { id, steps: TOURS[id](), i: 0 };
    setTimeout(Tut.show, 60);
    return true;
  };
  Tut.close = function () {
    document.querySelectorAll('.tut-spot').forEach(e => e.classList.remove('tut-spot'));
    const c = document.getElementById('tutcard'); if (c) c.remove();
    Tut.cur = null;
  };
  Tut.show = function () {
    const t = Tut.cur; if (!t) return;
    document.querySelectorAll('.tut-spot').forEach(e => e.classList.remove('tut-spot'));
    const st = t.steps[t.i];
    if (st.screen && UI.screen !== st.screen && !(G.S && G.S.event)) { UI.go(st.screen); }
    let card = document.getElementById('tutcard');
    if (!card) { card = document.createElement('div'); card.id = 'tutcard'; card.className = 'tut-card'; document.body.appendChild(card); }
    card.innerHTML = '<div class="row"><span class="tico">' + ic(st.icon || 'info', 22) + '</span><h3>' + h(st.title) + '</h3><span class="sp"></span><div class="tut-dots">' + t.steps.map((x, k) => '<i class="' + (k === t.i ? 'on' : '') + '"></i>').join('') + '</div></div>' +
      (st.body ? '<div class="sm muted">' + st.body + '</div>' : '') + (st.diagram || '') + (st.points ? '<ul class="sm">' + st.points.map(p => '<li>' + p + '</li>').join('') + '</ul>' : '') +
      '<div class="row mt"><label class="row xs muted"><input type="checkbox" data-chg="tutOff" ' + (Tut.enabled() ? '' : 'checked') + '> Don\'t show tutorials</label><span class="sp"></span>' +
      (t.i ? '<button class="btn sm" data-act="tutBack">Back</button>' : '<button class="btn sm ghost" data-act="tutSkip">Skip</button>') +
      '<button class="btn sm primary" data-act="tutNext">' + (t.i === t.steps.length - 1 ? 'Done' : 'Next') + '</button></div>';
    const el = st.sel ? document.querySelector(st.sel) : null;
    if (el) {
      el.classList.add('tut-spot');
      const r = el.getBoundingClientRect(), W = window.innerWidth, Hh = window.innerHeight, cw = Math.min(380, W - 32);
      let x = r.right + 14, y = r.top;
      if (x + cw > W - 16) { x = Math.max(16, Math.min(W - cw - 16, r.left)); y = r.bottom + 12; }
      card.style.left = x + 'px'; card.style.top = Math.max(16, Math.min(Hh - card.offsetHeight - 16, y)) + 'px'; card.style.transform = '';
    } else { card.style.left = '50%'; card.style.top = '50%'; card.style.transform = 'translate(-50%, -50%)'; }
  };
  UI.A.tutNext = () => { const t = Tut.cur; if (!t) return; if (t.i >= t.steps.length - 1) return Tut.close(); t.i++; Tut.show(); };
  UI.A.tutBack = () => { const t = Tut.cur; if (!t || !t.i) return; t.i--; Tut.show(); };
  UI.A.tutSkip = () => Tut.close();
  UI.A.tutOff = v => { Tut.setEnabled(!v); if (v) { UI.toast('Tutorials off. Turn them back on in Settings or How to play.'); Tut.close(); } };
  // re-place the card after each render (screens change under it)
  const baseRender = UI.render;
  UI.render = function () { baseRender.apply(UI, arguments); if (Tut.cur) setTimeout(Tut.show, 0); };
  window.addEventListener('resize', () => { if (Tut.cur) Tut.show(); });

  // hooks: kickoff → season tour; first event; first match
  UI.A.kickoffDone = () => { UI.closeModal(); UI.go('hq'); Tut.start('season'); };
  const baseGo = UI.go;
  UI.go = function (screen, p) {
    baseGo(screen, p);
    if (!G.S || Tut.cur) return;
    if (screen === 'event' && G.S.event && G.S.event.kind !== 'einstein') Tut.start('event');
    if (screen === 'prematch') Tut.start('match');
  };

  // =====================================================================
  // How to play: categories with short, icon-led sections
  // =====================================================================
  const CATS = [
    { id: 'basics', icon: 'hq', name: 'Basics', desc: 'Turns, goals and the season loop', secs: [
      { icon: 'play', t: 'The loop', d: flow([['calendar', 'Offseason (months)'], ['bolt', 'Kickoff'], ['design', 'Build weeks 1–7'], ['event', 'Competition weeks 1–7'], ['trophy', 'Championship'], ['history', 'Review']]), li: ['Each <b>Continue</b> is one week in season, one month in the offseason.', 'Build week 7 is <b>Week 0</b> (scrimmage week). Competition week 7 has no regionals: a rest week before the Championship.'] },
      { icon: 'trophy', t: 'Goals and Program Support', li: ['At Kickoff the school sets three goals (minimum, target, stretch).', 'Meeting them raises <b>Program Support</b>; missing them lowers it. At 0 the program is cut (unless No-fail is on).', 'Reputation brings sponsors, recruits and scrimmage invitations.'] },
      { icon: 'inbox', t: 'Inbox', li: ['At least one news item and one to three chatter posts every turn.', 'Some messages take a <b>reply</b> (optional): small effects like reputation, spare parts or extra practice. Reply in the turn it arrives (a week in season, a month in the offseason) or the offer lapses.'] }
    ] },
    { id: 'design', icon: 'design', name: 'Design & hours', desc: 'Concepts, projects, extra hours, fatigue', secs: [
      { icon: 'design', t: 'Concepts and projects', li: ['Pick a <b>concept</b> for each subsystem at Kickoff, then run <b>upgrades</b> with a focus stat and an effort level.', 'The first one of a new concept or version is a <b>prototype</b> (+10% materials) and goes on the competition robot.', 'Each project absorbs up to 80 h a week (±25% by priority); project slots come from mentors and facilities.', 'Keep the robot under <b>125 lb</b>.'] },

    o += '<h2 class="mt">' + ic(cur.icon, 20) + ' ' + h(cur.name) + '</h2>' + cur.secs.map(s => '<div class="help-sec"><h3>' + ic(s.icon, 18) + h(s.t) + '</h3>' + (s.d || '') + '<ul>' + s.li.map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('');
