    return { comp, prac, short, pshort, need: n };
  };
  // What the competition robot's parts are worth: perf by category (0–1), average health, mixed control systems
  // cached on a cheap signature (robot, inventory sizes, wear tick), because ceilings ask for it a lot
  let pcache = {};
  const sig = S => (S.robot && S.robot.bots ? S.robot.bots.map(b => Object.keys(b.subs).map(k => b.subs[k] && b.subs[k].ver ? b.subs[k].concept + b.subs[k].ver : '-').join(',')).join('/') + 'c' + (S.robot.comp || 0) + 'v' + S.robot.visionLvl : '') + '|' +
    D.PART_CATS.map(c => P.count(S, c.id)).join(',') + '|' + S.vendorPref + '|' + S.projects.map(p => p.type + p.sub + p.concept + (p.bot == null ? '' : p.bot)).join(',') + '|' + (S.wearTick || 0);
  // which: 'comp' (the competition robot, default) or 'prac' (the other robot)
  P.profile = function (S, which) {
    const k = sig(S) + (which || 'comp');
    if (pcache[k] && pcache.S === S) return pcache[k];
    if (pcache.S !== S || Object.keys(pcache).length > 8) pcache = { S };
    return (pcache[k] = profile(S, which === 'prac' ? 'prac' : 'comp'));
  };
  function profile(S, side) {
    const a = P.alloc(S), out = { motor: 0, enc: 0, swerve: 0, ctrl: 0, health: 1, mixed: false, vendors: {}, short: 0 };
    let hs = 0, hn = 0;
    const lists = a[side], need = a.need[side], short = side === 'prac' ? a.pshort : a.short;
    ['motor', 'enc', 'swerve', 'ctrl'].forEach(cat => {
      const nd = need[cat] || 0, got = lists[cat] || [];
      if (nd) out[cat] = got.reduce((s, it) => s + PROD[it.p].perf, 0) / nd;
      got.forEach(it => { const v = PROD[it.p].v; out.vendors[v] = (out.vendors[v] || 0) + 1; });
      out.short += short[cat] || 0;
    });
    Object.keys(lists).forEach(cat => lists[cat].forEach(it => { hs += it.h; hn++; }));
    if (hn) out.health = hs / hn;
    out.mixed = !!(out.vendors.A && out.vendors.B);
    out.kopMix = !!(out.vendors.K && (out.vendors.A || out.vendors.B)); // kit electronics next to vendor ones
    return out;
  }
  P.devMult = S => { if (!S.robot) return 1; const pp = P.profile(S); return pp.mixed ? D.MIX_HOURS : pp.kopMix ? D.KOP_MIX_HOURS : 1; };

  // ======================= wear =======================
  const DRIVE_CATS = { swerve: 1, gearbox: 1 };
  P.wearMatch = function (S, rr) {
    if (!S.inv) return;
    const a = P.alloc(S), rng = R(), hit = 1 + Math.min(1.5, ((rr && rr.defTime) || 0) / 40);
    S.wearTick = (S.wearTick || 0) + 1;
    Object.keys(a.comp).forEach(cat => a.comp[cat].forEach(it => {
      it.h = Math.max(D.PART_MIN_HEALTH, it.h - rng.range(D.PART_WEAR_MATCH[0], D.PART_WEAR_MATCH[1]) * (DRIVE_CATS[cat] ? hit : 1));
    }));
  };
  P.wearPractice = function (S, hours, bi) {
    if (!S.inv || !hours) return;
    const a = P.alloc(S), use = S.robot && bi != null && bi !== (S.robot.comp || 0) ? a.prac : a.comp;
    S.wearTick = (S.wearTick || 0) + 1;
    Object.keys(use).forEach(cat => use[cat].forEach(it => { it.h = Math.max(D.PART_MIN_HEALTH, it.h - hours * D.PART_WEAR_PRACTICE * R().range(0.6, 1.4)); }));
  };

  // ======================= game elements =======================
  // The game whose elements matter now: this season's in season, last season's in the offseason (offseason events)
  P.elemYear = S => (P.inSeason(S) ? S.year : (S.robot ? S.robot.year : null));
  P.nextYear = S => (['off', 'review'].includes(S.phase) && S.upcoming < S.order.length ? S.order[S.upcoming] : null);
  P.elemSets = (S, y) => (S.elem && S.elem[y]) || [];
  P.elemCov = (S, y) => P.elemSets(S, y).reduce((t, e) => t + e.s * e.h, 0);
  P.fieldSize = S => D.FIELD_SIZE[Math.min(3, G.Shop.lvl(S, 'pfield'))];
  // 0–1: how much of your practice field the elements fill (a bigger set than your field adds nothing)
  P.elemFill = function (S, y) {
    if (y == null) return 0;
    const fs = P.fieldSize(S);
    if (!fs) return S.elemKop && S.elemKop[y] ? 1 : 0; // no practice field: the kit game pieces are all you need
    return Math.min(1, P.elemCov(S, y) / fs);
  };
  // Sets on order for a season (shown as pending until they arrive at Kickoff)
  P.elemPending = (S, y) => (y != null && S.elemPre && S.elemPre[y]) || [];
  P.setName = sz => (sz >= 1 ? 'Full' : sz >= 0.5 ? 'Half' : 'Quarter');
  // Driver-practice quality: kit game pieces alone give a little, a full field of elements gives everything
  P.elemQ = function (S, y) {
    if (y == null) return 0.25;
    const base = S.elemKop && S.elemKop[y] ? D.ELEM_KOP_Q : 0.15;
    return base + (1 - base) * P.elemFill(S, y);
  };
  P.elemRoom = (S, y) => D.ELEM_MAX - P.elemSets(S, y).reduce((t, e) => t + e.s, 0) - ((S.elemPre && S.elemPre[y]) || []).reduce((t, e) => t + e.s, 0);
  // Buy a set for this season's game (in season: often sold out), last season's (offseason), or preorder next season's
  P.buyElem = function (S, setId, pre) {
    const set = D.ELEM_SETS.find(x => x.id === setId);
    const y = pre ? P.nextYear(S) : P.elemYear(S);
    if (y == null) return pre ? 'Preorders open after the season review' : 'No game to buy elements for yet';
    if (!pre && P.inSeason(S) && !P.inStock(S, 'elem' + setId)) return 'Sold out this week. Field elements are scarce in season: preorder before Kickoff next time.';
    const cost = Math.round(set.price * (D.PART_PRICE_DIFF[S.diff] || 1));
    { const e = G.Career.afford(S, cost); if (e) return e; }
    if (pre) {
      if (P.elemRoom(S, y) < set.size - 1e-6) return 'You can store at most ' + D.ELEM_MAX + ' fields\' worth of elements';
      G.Career.spend(S, cost, 'Preorder: ' + set.name + ' (' + y + ')');
      S.elemPre = S.elemPre || {}; (S.elemPre[y] = S.elemPre[y] || []).push({ s: set.size });
      return null;
    }
    G.Career.spend(S, cost, set.name + ' (' + y + ')');
    S.elem = S.elem || {};
    const list = S.elem[y] = S.elem[y] || [];
    list.push({ id: U.uid('e'), s: set.size, h: 1 });
    // over the storage limit: the most worn sets are recycled
    list.sort((a, b) => b.h - a.h);
    while (list.reduce((t, e) => t + e.s, 0) > D.ELEM_MAX + 1e-6) list.pop();
    return null;
  };
  // Driver practice wears the sets that are actually on the field (best ones first, up to the field size)
  P.wearElem = function (S, y, hours) {
    if (y == null || !hours) return;
    let room = P.fieldSize(S);
    if (!room) return;
    P.elemSets(S, y).slice().sort((a, b) => b.h - a.h).forEach(e => {
      if (room <= 0) return;
      const use = Math.min(e.s, room); room -= use;
      e.h = Math.max(0.2, e.h - hours * D.ELEM_WEAR * (use / P.fieldSize(S)) * R().range(0.7, 1.3));
    });
  };

  P.kopText = kit => [kit.motor ? kit.motor + ' brushed motors' : '', kit.enc ? kit.enc + ' low-profile encoders' : '', kit.gearbox ? kit.gearbox + ' kitbot gearboxes' : '', kit.ctrl ? (kit.ctrl > 1 ? kit.ctrl + ' control hubs' : 'a basic control hub') : ''].filter(Boolean).join(', ');
  // ======================= season hooks =======================
  P.kickoff = function (S, first) {
    const rookie = S.profile === 'rookie' && first, kit = rookie ? D.KOP_ROOKIE : D.KOP, full = [];
    Object.keys(kit).forEach(cat => {
      // the kit is always handed out; only if a shelf is already full does the weakest part (often the kit one) get recycled
      const drop = P.add(S, cat, cat + 'K', kit[cat], 1);
      if (drop) full.push(drop + ' ' + D.PART_CAT[cat].short.toLowerCase());
    });
    S.lastKop = { kit, rookie, full, year: S.year };
    S.elemKop = S.elemKop || {}; S.elemKop[S.year] = true;
    const pre = S.elemPre && S.elemPre[S.year];
    if (pre && pre.length) { S.elem = S.elem || {}; S.elem[S.year] = (S.elem[S.year] || []).concat(pre.map(e => ({ id: U.uid('e'), s: e.s, h: 1 }))); delete S.elemPre[S.year]; }
    G.Career.inbox(S, rookie ? 'Rookie Kit of Parts' : 'Kit of Parts', 'This season\'s ' + (rookie ? 'rookie kit (bigger than the yearly kit every team gets)' : 'kit') + ' is in: ' + P.kopText(kit) + ' and a few ' + G.Seasons[S.year].pieceName.toLowerCase() + '.' +
      (full.length ? ' Some shelves were already full, so the weakest parts were recycled (' + full.join(', ') + ').' : '') +
      (pre && pre.length ? ' Your preordered field elements arrived too.' : '') + ' Anything else comes from the Shop, and in season it often sells out.', 'dev');
  };
  // ======================= product launch events =======================
  const CAT_WORD = { motor: 'motors', enc: 'encoders', ctrl: 'control hubs', swerve: 'swerve modules' };
  const LAUNCH_INTRO = {
    A: [
      'Apex Motion rented a convention hall, dimmed the lights and let a fog machine run for a full minute before anyone said a word. Then the CEO walked out holding a single box.',
      'The Apex Motion livestream opened with a countdown clock, a drone shot of the factory and a drum solo. Fourteen thousand people watched; about thirty stayed for the spec sheet.',
      'At the Apex Motion keynote, the lead engineer pulled a cloth off a pedestal and the room went quiet. Somebody in the back said "finally".',
      'Apex Motion launched with a cinematic trailer, a waitlist and a press kit printed on brushed aluminum. The trailer had a slow-motion shot of a motor shaft. Twice.'
    ],
    B: [
      'Lumen Robotics announced its launch with a forum post at 6 a.m. titled "some new stuff". It had one photo, a price list and a spreadsheet of test data.',
      'Lumen\'s founder livestreamed from the warehouse floor, between pallets, holding the new parts up to a phone camera. The audio cut out twice. Nobody minded.',
      'Lumen Robotics launched by mailing samples to fifty rookie teams and reposting the unboxing videos they sent back.',
      'Lumen\'s launch was a twelve-minute video: what changed, what it costs, when it ships. Then it ended. The comments called it "refreshing".'
    ]
  };
  const LAUNCH_TAG = {
    motorA: '"More torque per gram than anything we have ever made. And yes, the fan is louder."',
    motorB: 'Close to the premium motors for a lot less money, with the same mounting pattern as before.',
    encA: '"Zero drift. We checked. Twice." Faster reads and a tougher housing.',
    encB: 'Same footprint, faster reads, and a connector that no longer wiggles loose by the third match of the day.',
    ctrlA: 'Built-in IMU, live CAN diagnostics and an LED ring that is "strictly for diagnostics".',
    ctrlB: 'More channels, better brownout protection, and it still fits where the old one did.',
    swerveA: 'Lower profile, faster steering and tool-free tread swaps. The demo video drifts sideways for nine seconds straight.',
    swerveB: 'A bigger bearing, a stiffer plate and, finally, a module that survives curbs and bumps.'
  };
  const LAUNCH_TALK = {
    any: [
      ['Pre-ordered before the livestream ended.', 'a lead mentor on Team {t}'],
      ['Cool. Now ship the ones I ordered last year.', 'a forum comment with 412 upvotes'],
      ['Our programmers already want to rewrite everything for it.', 'a student on Team {t}'],
      ['I will wait for the teardown video.', 'a cautious electrical mentor'],
      ['Lead time is six weeks. Kickoff is in {k}. Do the math.', 'a team treasurer'],
      ['Our sponsor asked if we were buying it. Our sponsor is now buying it.', 'Team {t}'],
      ['Does it come in team colors?', 'a rookie, asking the important questions'],
      ['The spec sheet has more footnotes than our Impact essay.', 'the strategy lead on Team {t}'],
      ['We bought forty of the old ones last week. Of course.', 'a very tired mentor on Team {t}'],
      ['Someone in the chat asked if it is legal. It is legal.', 'an FRC volunteer']
    ],
    A: [
      ['It costs how much?', 'the entire chat, at once'],
      ['The fog machine drew more current than our drivetrain.', 'a student on Team {t}'],
      ['Beautiful. Expensive. Beautiful.', 'a mentor on Team {t}'],
      ['Every top-ten team will run it by Week 1. Watch.', 'a scouting lead on Team {t}']
    ],
    B: [
      ['Lumen keeps doing more with less. Respect.', 'a rookie mentor'],
      ['The stream buffered for ten minutes and it was still the best launch of the year.', 'a forum regular'],
      ['Most of the performance for a lot less money. Our treasurer cried a little, in a good way.', 'Team {t}'],
      ['No fog machine, no drum solo, just a price. I love it.', 'a mentor on Team {t}']
    ]
  };
  function someTeam(S, rng) {
    const ks = S.teams ? Object.keys(S.teams).filter(n => Number(n) !== S.team.num) : [];
    return ks.length ? rng.pick(ks) : String(rng.int(100, 9999));
  }
  // Called at the start of each offseason month: vendors whose launch is this month put their new products on sale
  P.launchMonth = function (S) {
    if (S.phase !== 'off') return;
    const idx = P.buyIdx(S), rng = R();
    ['A', 'B'].forEach(v => {
      const rs = (S.vendorPlan || []).filter(r => r.v === v && r.idx === idx && r.mo === S.month);
      if (!rs.length) return;
      const V = D.VENDORS[v], year = S.order[idx] || S.year + 1, toKick = 8 - S.month;
      const prods = rs.map(r => {
        const g = P.genAt(S, r.cat, v), np = PROD[r.cat + v + g], op = PROD[r.cat + v + (g - 1)];
        const own = P.items(S, r.cat).reduce((m, it) => Math.max(m, (PROD[it.p] || {}).perf || 0), 0);
        return { id: np.id, cat: r.cat, name: np.name, oldName: op.name, perf: np.perf, oldPerf: op.perf, price: P.price(S, np), oldPrice: P.price(S, op), tag: LAUNCH_TAG[r.cat + v] || '', own };
      });
      const talk = rng.shuffle(LAUNCH_TALK[v].slice()).slice(0, rng.int(1, 2)).concat(rng.shuffle(LAUNCH_TALK.any.slice())).slice(0, 3)
        .map(([t, w]) => [t.replace('{k}', toKick + ' month' + (toKick > 1 ? 's' : '')), w.replace('{t}', someTeam(S, rng))]);
      const best = prods.slice().sort((a, b) => (b.perf - b.own) - (a.perf - a.own))[0];
      const take = !best.own ? 'Your electrical lead: "We have never run ' + CAT_WORD[best.cat] + ' like these. Worth a look before Kickoff."'
        : best.perf - best.own >= 0.1 ? 'Your electrical lead wants the ' + best.name + ' on the competition robot: a clear step up from what is on the shelf.'
          : 'Your electrical lead: "What we have is close enough. No need to rush."';
      const L = { id: U.uid('L'), v, vendor: V.name, month: D.MONTHS[S.month], year, toKick, intro: rng.pick(LAUNCH_INTRO[v]), prods, talk, take };
      L.title = V.name + ' launch: ' + prods.map(p => p.name).join(' & ');
      const text = L.intro + '\n\n' + prods.map(p => p.name + ' — performance ' + Math.round(p.oldPerf * 100) + ' → ' + Math.round(p.perf * 100) + ', ' + U.money(p.price) + ' each. ' + p.tag).join('\n') +
        '\n\nWhat people are saying:\n' + talk.map(([t, w]) => '“' + t + '” — ' + w).join('\n') + '\n\n' + take +
        '\n\nOn sale now in the Shop. ' + prods.map(p => p.oldName).join(' and ') + (prods.length > 1 ? ' stay' : ' stays') + ' on sale through the ' + year + ' season, then ' + (prods.length > 1 ? 'they are' : 'it is') + ' discontinued. Parts you own keep working.';
      G.Career.inbox(S, L.title, text, 'dev', { launch: L.id });
      (S.launchQueue = S.launchQueue || []).push(L);
    });
  };
  // Rumors at the start of each offseason (and at the start of a career): when each vendor will launch, and roughly what
  P.teaser = function (S) {
    const idx = P.buyIdx(S), rs = (S.vendorPlan || []).filter(r => r.idx === idx && !P.released(S, r));
    if (!rs.length) return;
    const lines = ['A', 'B'].map(v => { const x = rs.filter(r => r.v === v); return x.length ? D.VENDORS[v].name + ': launch event in ' + D.MONTHS[x[0].mo] + '. The rumor is new ' + x.map(r => CAT_WORD[r.cat]).join(' and ') + '.' : null; }).filter(Boolean);
    G.Career.inbox(S, 'Vendor launch season', 'Both electronics vendors launch new products this fall, 1–4 months before Kickoff.\n\n' + lines.join('\n') + '\n\nIf you are about to stock up on those parts, it may be worth waiting. New products cost a little more; the older ones stay on sale through next season.', 'dev');
  };
  P.announce = P.teaser; // older callers

  // ======================= setup & migration =======================
  P.setup = function (S, rng) {
    S.inv = {}; D.PART_CATS.forEach(c => S.inv[c.id] = []);
    (D.START_PARTS[S.profile] || []).forEach(([cat, v, n, h]) => P.add(S, cat, v === 'C' || v === 'K' ? cat + v : cat + v + 1, n, h));
    S.elem = {}; S.elemPre = {}; S.elemKop = {}; S.vendorPref = null;
    P.planReleases(S, rng);
    P.rollStock(S);
  };
  // v2.0 saved element sets without a size: recover it from the ledger ("Half-field set (2026)"), else assume a quarter
  function fixElemSizes(S) {
    const bad = [];
    [S.elem || {}, S.elemPre || {}].forEach(m => Object.keys(m).forEach(y => (m[y] || []).forEach(e => { if (!(e.s > 0)) bad.push({ e, y }); })));
    if (!bad.length) return;
    const bought = {};
    (S.ledger || []).slice().reverse().forEach(l => { const mm = /(Quarter|Half|Full)-field set \((\d{4})\)/.exec(l.desc || ''); if (mm) (bought[mm[2]] = bought[mm[2]] || []).push({ Quarter: 0.25, Half: 0.5, Full: 1 }[mm[1]]); });
    bad.forEach(b => { const q = bought[b.y]; b.e.s = q && q.length ? q.shift() : 0.25; });
  }
  // v2.2 launch events: earlier plans had no launch month. Past and current releases stay released;
  // future seasons are planned again under the new rules (one launch per vendor per season, at most version III).
  function migrateLaunches(S) {
    if (!S.vendorPlan || S.mode !== 'career' || S.vendorPlan.every(r => r.mo != null)) return;
    const idx = P.buyIdx(S);
    S.vendorPlan = S.vendorPlan.filter(r => r.idx <= idx).map(r => Object.assign(r, { mo: 0 }));
    P.planReleases(S, G.makeRng((S.team ? S.team.num : 1) * 31 + idx), P.inSeason(S) ? idx + 1 : idx);
  }
  P.migrate = function (S) {
    if (S && S.inv) { fixElemSizes(S); migrateLaunches(S); return; }
    if (!S || S.inv) return;
    const rng = G.makeRng((S.seed || 1) * 31 + 7), old = S.parts || {};
    S.inv = {}; D.PART_CATS.forEach(c => S.inv[c.id] = []);
    if (old.motors) P.add(S, 'motor', 'motor' + (old.motors >= 2 ? 'A' : 'B') + '1', 14, 0.85);
    if (old.swerve) P.add(S, 'swerve', 'swerve' + (old.swerve >= 2 ? 'A' : 'B') + '1', 4, 0.85);
    if (old.sensors) P.add(S, 'enc', 'encB1', 6, 0.85);
    if (old.vision) P.add(S, 'camera', 'cameraC', old.vision, 0.9);
    if (old.pneu) P.add(S, 'pneu', 'pneuC', 1, 0.9);
    S.elem = {}; S.elemPre = {}; S.elemKop = {};
    if (S.robot) S.elemKop[S.robot.year] = true;
    if (S.equip && S.equip.field === S.year) S.elem[S.year] = [{ id: U.uid('e'), s: 1, h: 0.9 }];
    else if (S.equip && S.equip.field === 'pending' && P.nextYear(S)) S.elemPre[P.nextYear(S)] = [{ s: 1 }];
    if (S.equip) S.equip.field = null;
    // a robot built before parts existed keeps working: fill what it needs with Lumen parts
    if (S.robot) P.shortage(S).forEach(m => P.add(S, m.cat, D.PART_CAT[m.cat].elec ? m.cat + 'B1' : m.cat + 'C', m.n, 0.8));
    P.planReleases(S, rng);
    P.rollStock(S);
  };
})();

</script>
<script>/* js/systems/news.js */
'use strict';
/* FRC Manager — inbox life: news (some with small effects, some you can reply to) and team chatter.
   Every turn (a week in season, a month in the offseason) brings at least one news item and one to three chatter
   posts. Each template has a cooldown so the same story does not come round again for months. */
(function () {
  const U = G.U, D = G.Data;
  const N = G.News = {};
  const R = () => G.R;
  const first = name => String(name).split(' ')[0];
  const student = S => (S.students.length ? first(R().pick(S.students).name) : 'A freshman');
  const student2 = (S, not) => { const p = S.students.filter(s => first(s.name) !== not); return p.length ? first(R().pick(p).name) : 'another student'; };
  const mentorObj = S => (S.mentors.length ? R().pick(S.mentors) : null);
  const mentor = S => { const m = mentorObj(S); return m ? m.name : 'Your lead mentor'; };
  const mentorOf = (S, role) => S.mentors.find(m => m.role === role) || null;
  const driver = S => { const d = G.Career.driveTeam(S).driver; return d && d.name ? first(d.name) : student(S); };
  const teamName = S => S.team.num + ' ' + S.team.name;
  const others = S => Object.values(S.teams || {}).filter(t => t.num !== S.team.num);
  const rivalT = S => {
    const ts = others(S).filter(t => t.region === S.team.region && t.str > 55);
    const pool = ts.length ? ts : others(S);
    return pool.length ? R().pick(pool) : { num: 254, name: 'Rival Robotics', str: 70 };
  };
  const rival = S => { const t = rivalT(S); return t.num + ' ' + t.name; };
  const rookie = S => { const ts = others(S).filter(t => t.str < 40); const t = ts.length ? R().pick(ts) : null; return t ? t.num + ' ' + t.name : (9000 + R().int(100, 999)) + ' the ' + R().pick(['Gearheads', 'Bolts', 'Circuit Breakers', 'Iron Owls', 'Robo Raptors']); };
  const concept = (S, sub) => S.robot && S.robot.subs[sub] && S.robot.subs[sub].ver ? S.robot.subs[sub].concept : null;
  const inSeason = S => S.phase === 'build' || S.phase === 'comp' || S.phase === 'kickoff';
  const month = S => D.MONTHS[S.month];
  const off = S => S.phase === 'off';
  const lastEv = S => (S.season && S.season.events.length ? S.season.events[S.season.events.length - 1] : null);
  const lastSeason = S => (S.history.length ? S.history[S.history.length - 1] : null);
  const regName = S => (D.REGIONS ? S.team.region : 'your region');
  const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
  const turnNo = S => S.newsTurn || 0;
  const seen = S => S.newsSeen || (S.newsSeen = {});
  const fresh = (S, id, cd) => { const t = seen(S)[id]; return t == null || turnNo(S) - t >= cd; };
  const addRep = (S, v) => { S.rep = U.clamp(Math.round((S.rep + v) * 10) / 10, 0, 100); };
  const addMorale = (S, v) => { S.morale = U.clamp(S.morale + v, 0, 100); };
  const wearRobot = (S, lo, hi) => { let w = 0; if (S.robot) Object.values(S.robot.subs).forEach(s => { if (s.ver && s !== S.robot.subs.soft) { const d = R().range(lo, hi); s.cond = Math.max(0, s.cond - d); w += d; } }); return w; };
  const ROBOT_NAMES = ['Sir Spins-a-Lot', 'Captain Torque', 'Gearbox Gertrude', 'The Toaster', 'Big Bertha', 'Sparky', 'Turbo Tortoise', 'Chonk', 'Professor Zip Tie', 'Bolt Bucket', 'Steve', 'Lady Hex Key', 'The Dishwasher', 'Mr. Brownout', 'Wheelie Nelson'];
  const FOODS = ['three trays of homemade lasagna', 'a mountain of pizza', 'dumplings for forty', 'a cooler of tamales', 'a cake shaped like a swerve module', 'enough cookies to void the weight limit', 'a slow cooker of chili', 'two hundred samosas'];
  const PLUSH = ['penguin', 'capybara', 'axolotl', 'shark', 'frog', 'goose', 'otter'];
  const GAME = { 2022: 'RAPID REACT', 2023: 'CHARGED UP', 2024: 'CRESCENDO', 2025: 'REEFSCAPE', 2026: 'REBUILT' };

  // =================================================================
  // Replies: a message can carry options; picking one applies a small effect. Optional, never a popup.
  // =================================================================
  const REPLY = {
    interview: [
      { text: 'Send the team captain', run: S => { addRep(S, 0.5); return 'The captain was calm, clear and only said "basically" six times. Reputation +0.5.'; } },
      { text: 'Bring the robot too', req: S => S.robot, run: S => { addRep(S, 1); const w = inSeason(S) ? wearRobot(S, 2, 5) : 0; return 'The robot drove circles around the reporter and stole the show. Reputation +1' + (w ? ', robot condition slightly down from the demo.' : '.'); } },
      { text: 'Politely decline', run: () => 'You thanked them and kept the team focused on the shop.' }
    ],
    rookie: [
      { text: 'Send two students on Saturday', run: S => { addRep(S, 1); S.actHours += 8; return 'Your students helped them wire their first drivetrain. They sent a photo of it driving. Reputation +1, 8 team hours used.'; } },
      { text: 'Give them a spare part', req: S => S.parts.spares > 0, run: S => { S.parts.spares--; addRep(S, 0.5); return 'One spare gearbox is now living a better life on a rookie robot. Spare parts −1, reputation +0.5.'; } },
      { text: 'Point them to the online guides', run: () => 'You sent a list of good tutorials. They said thanks.' }
    ],
    scrimmage: [
      { text: 'Accept: bring the competition robot', req: S => S.robot, run: S => {
        S.practiceWeeks = Math.min(D.DRILL_CAP, (S.practiceWeeks || 0) + 1);
        S.lastConf = Math.min(0.9, (S.lastConf || 0) + 0.05);
        const dt = G.Career.driveTeam(S); if (dt.driver.id) G.Career.studentXP(S, dt.driver, ['drive', 'comp'], 0.6);
        S.actHours += 6;
        const c0 = G.Robot.condAvg(S); wearRobot(S, 6, 12);
        return 'Real matches against a real defender. Your drivers came home sharper (+1 week of driver practice, a little more confidence at your next event), but the robot took a beating (condition −' + Math.round(c0 - G.Robot.condAvg(S)) + '%).';
      } },
      { text: 'Send the drive team with the practice robot', req: S => G.Robot.twoBots(S), run: S => { S.practiceWeeks = Math.min(D.DRILL_CAP, (S.practiceWeeks || 0) + 0.5); S.actHours += 4; return 'The practice robot took the hits. +0.5 week of driver practice, no wear on the competition robot.'; } },
      { text: 'Decline: we need the build time', run: () => 'You declined. The shop stayed busy.' }
    ],
    sponsorPost: [
      { text: 'Post a thank-you video', run: (S, d) => { const sp = S.sponsors.find(x => x.id === d.sp); if (sp) sp.sat = Math.min(100, sp.sat + 4); addRep(S, 0.3); return (sp ? sp.name : 'The sponsor') + ' loved it and shared it with the whole company. Satisfaction +4.'; } },
      { text: 'Just like and share it', run: () => 'You shared it. Nice and easy.' }
    ],
    forum: [
      { text: 'Post a teaser photo', run: S => { addRep(S, 1); return 'A blurry photo of a gearbox started a 300-reply thread. Reputation +1.'; } },
      { text: 'Share your CAD and code openly', req: S => S.robot, run: S => { addRep(S, 1.5); S.actHours += 4; return 'Other teams are learning from your design, and they say so. Reputation +1.5 (4 hours spent cleaning up the files).'; } },
      { text: 'Stay quiet', run: () => 'Mystery is also a strategy.' }
    ],
    board: [
      { text: 'Send students to present', run: S => { S.support = U.clamp(S.support + 1, 0, 100); S.actHours += 6; return 'Three students explained what an encoder is to the school board. Two board members asked follow-up questions. Program support +1.'; } },
      { text: 'Send a written report', run: S => { S.support = U.clamp(S.support + 0.5, 0, 100); return 'The report was read into the minutes. Program support +0.5.'; } },
      { text: 'Skip it', run: () => 'The meeting went ahead without you.' }
    ],
    borrow: [
      { text: 'Lend them a spare', req: S => S.parts.spares > 0, run: S => { S.parts.spares--; addRep(S, 1); return 'They made their next match with your part on the robot. The whole pit area heard about it. Spare parts −1, reputation +1.'; } },
      { text: 'Lend tools and a student', run: S => { addRep(S, 0.5); return 'Your pit crew helped them rebuild. Reputation +0.5.'; } },
      { text: 'Sorry, we need everything', run: () => 'You kept your spares. Fair enough.' }
    ],
    parent: [
      { text: 'Yes: run a fundraiser', run: S => { const g = R().int(250, 600); G.Career.earn(S, g, 'Parent-run fundraiser'); return 'The parents ran a car wash and a raffle. +' + U.money(g) + '.'; } },
      { text: 'Cook for build nights instead', run: S => { addMorale(S, 3); return 'Build nights now come with dinner. Morale +3.'; } }
    ],
    alumni: [

  function replyMsg(key, extra) {

  N.replyOptions = function (S, m) {
    if (!m.reply || m.replied != null) return [];
    if (m.until != null && turnNo(S) > m.until) return [];
    return REPLY[m.reply.key].map((o, i) => ({ i, text: o.text, ok: !o.req || o.req(S) }));
  };
  N.reply = function (S, id, i) {
    const m = S.inbox.find(x => x.id === id);
    if (!m || !m.reply || m.replied != null) return null;
    const o = REPLY[m.reply.key][i];
    if (!o || (o.req && !o.req(S))) return null;
    const res = o.run(S, m.reply.data || {});
    m.replied = i; m.outcome = res; m.read = true;
    return res;
  };

    { id: 'chant', req: S => S.morale > 80, title: 'Team chant', body: () => 'Spirits are high. The team chant has gained a second verse and an optional dance.' },
    { id: 'swerve', req: S => concept(S, 'drive') === 'swerve', title: 'Swerve noises', body: S => 'The swerve modules are making a new noise. ' + student(S) + ' calls it "the song of my people".' },
    { id: 'turret', req: S => concept(S, 'scorer') === 'turret', title: 'Turret tracking', body: S => student(S) + ' spent an hour making the turret track ' + mentor(S) + '\'s face. It works disturbingly well.' },
    { id: 'elev', req: S => ['elev', 'elevw', 'amptrap'].includes(concept(S, 'scorer')) || concept(S, 'amp') === 'amptrap', title: 'Elevator test', body: () => 'Elevator test: it went up very fast and came down even faster. Nobody was hurt. One ceiling tile was.' },
    { id: 'climb', req: S => S.robot && S.robot.subs.endgame && S.robot.subs.endgame.ver, title: 'Climb test', body: () => 'The first full climb on the practice rig worked. The team celebrated like it was a playoff win.' },
    // results, awards, reputation
    { id: 'banner', req: S => S.season && S.season.events.some(e => e.won), title: 'The banner', body: S => 'The new blue banner is hanging in the shop. ' + student(S) + ' says good morning to it every day.' },
    { id: 'loss', req: S => lastEv(S) && !lastEv(S).playoffs, title: 'Fix list', body: S => student(S) + ' pinned a "never again" list on the wall after ' + lastEv(S).name + '. Item one is "check the battery". Item two is also "check the battery".' },
    { id: 'pick', req: S => lastEv(S) && lastEv(S).role === '2nd pick', title: 'The second pick', body: S => 'Being picked last at ' + lastEv(S).name + ' has become a team motto: "Second pick, first in our hearts."' },
    { id: 'capt', req: S => lastEv(S) && lastEv(S).role === 'Captain', title: 'Alliance captain', body: S => driver(S) + ' still has the alliance selection sign from ' + lastEv(S).name + '. It is now laminated.' },
    { id: 'impactP', req: S => inSeason(S) && S.projects.some(p => p.type === 'impact'), title: 'Impact practice', body: S => student(S) + ' and ' + student2(S, '') + ' are rehearsing the Impact presentation in the hallway. The janitor can now recite it.' },
    { id: 'awardC', req: S => S.season && S.season.awards.length, title: 'Award shelf', body: S => 'The award shelf needed a second bracket. ' + mentor(S) + ' made one on the CNC. It is overbuilt.' },
    { id: 'fans', req: S => S.rep >= 65, title: 'Fan mail', body: S => 'A kid from the elementary school sent the team a drawing of your robot. It has wings. ' + student(S) + ' wants to add wings.' },
    { id: 'joinAsk', req: S => S.rep >= 55 && off(S), title: 'Recruits', body: () => 'Three middle schoolers asked when they are old enough to join. The answer was "soon", followed by a robot demo.' },
    // mentors
    { id: 'mDonut', req: S => S.mentors.length, title: 'Donut Friday', body: S => mentor(S) + ' brought two dozen donuts. The programmers took eleven of them before anyone noticed.' },
    { id: 'mArgue', req: S => S.mentors.length >= 2, title: 'Mentor debate', body: S => { const a = R().pick(S.mentors), b = R().pick(S.mentors.filter(x => x !== a)); return a.name + ' and ' + b.name + ' have been arguing about tabs versus spaces for twenty minutes. The students are taking bets.'; } },
    { id: 'mCoach', req: S => mentorOf(S, 'coach'), title: 'Drive coach drills', body: S => mentorOf(S, 'coach').name + ' set up cones in the parking lot and timed every drill. ' + driver(S) + ' now dreams in cycle times.' },
    { id: 'mProg', req: S => mentorOf(S, 'prog'), title: 'Code review', body: S => mentorOf(S, 'prog').name + ' reviewed the robot code and left ' + R().int(30, 120) + ' comments. The most common was "why?"' },
    { id: 'mFab', req: S => mentorOf(S, 'fab'), title: 'Machine shop rules', body: S => mentorOf(S, 'fab').name + ' laminated the machine shop rules and hung them at eye level. Rule 7 is just "no".' },

    { id: 'mStrat', req: S => mentorOf(S, 'strat'), title: 'Scouting app', body: S => mentorOf(S, 'strat').name + ' and the scouts rebuilt the scouting app. It now has a dark mode and a button that just says "defense?"' },

    { id: 'bus', req: S => S.phase === 'comp', title: 'Bus playlist', body: S => 'The bus playlist for the next event is ' + R().int(4, 9) + ' hours long. ' + student(S) + ' has veto power and is using it.' },

    // parts and robot state
    { id: 'spares0', req: S => S.robot && S.parts.spares <= 1, title: 'Empty bins', body: S => 'The spare parts bins are nearly empty. ' + student(S) + ' labeled one "hope".' },
    { id: 'cond', req: S => S.robot && G.Robot.condAvg(S) < 70, title: 'Held together', body: S => 'The robot is currently held together by ' + R().pick(['three hose clamps and optimism', 'a lot of zip ties', 'sheer willpower']) + '. A Systems Shakedown at the next event would rebuild it.' },
    { id: 'battery', req: S => S.robot && inSeason(S), title: 'Battery cart', body: S => student(S) + ' built a battery cart with labelled slots and charge timers. It is the best-organized thing the team owns.' },
    { id: 'bumpers', req: S => S.phase === 'build' && S.week >= 4, title: 'Bumper night', body: S => 'Bumper night: ' + R().int(3, 9) + ' students, two staple guns and one sewing machine that is older than the school.' },

    { id: 'g22a', req: S => S.year === 2022 && inSeason(S), title: 'Cargo escape', body: () => 'A cargo ball was launched over the practice net and into the hallway. The principal returned it personally.' },

    { id: 'g23b', req: S => S.year === 2023 && inSeason(S), title: 'Charge station', body: S => 'The practice charge station has become ' + student(S) + '\'s favorite place to eat lunch. It balances perfectly when they do.' },
    { id: 'g23c', req: S => S.year === 2023 && inSeason(S), title: 'Tipped cone', body: S => 'A tipped cone has been sitting on the practice field for a week. Nobody can pick it up. It has become a landmark.' },
    { id: 'g24a', req: S => S.year === 2024 && inSeason(S), title: 'Note in the ceiling', body: () => 'A note got stuck in the ceiling tiles. It has been named "Steve" and will not be removed.' },

    { id: 'g24c', req: S => S.year === 2024 && inSeason(S), title: 'Note feeding', body: S => student(S) + ' has been lobbing notes across the shop "to practice feeding". ' + mentor(S) + ' has been lobbing them back.' },

    { id: 'g25b', req: S => S.year === 2025 && inSeason(S), title: 'Algae count', body: () => 'Algae (the ball) in the shop: 37. Algae (the real kind) in the team fish tank: also too many.' },
    { id: 'g25c', req: S => S.year === 2025 && inSeason(S), title: 'Deep cage', body: S => student(S) + ' timed the deep climb on the practice cage: ' + R().int(4, 9) + ' seconds. They have the stopwatch photo as their phone background.' },
    { id: 'g26a', req: S => S.year === 2026 && inSeason(S), title: 'Fuel everywhere', body: () => 'Fuel balls found so far: backpacks (4), the microwave (1), the principal\'s office (2), unaccounted for (lots).' },
    { id: 'g26b', req: S => S.year === 2026 && inSeason(S), title: 'Hub shift drills', body: S => student(S) + ' now announces "SHIFT CHANGE!" every 25 seconds during practice. Even during lunch.' },
    { id: 'g26c', req: S => S.year === 2026 && inSeason(S), title: 'Trench clearance', body: S => 'The robot cleared the practice trench by ' + R().int(1, 9) + ' millimetres. ' + mentor(S) + ' asked for "a little more margin, please".' },
    // calendar
    { id: 'summer', req: S => off(S) && ['Jun', 'Jul', 'Aug'].includes(month(S)), title: 'Summer shop day', body: () => 'Summer shop day: a few students built a machine that makes smoothies. It is the most reliable mechanism you own.' },
    { id: 'alumV', req: S => off(S) && ['Jun', 'Jul', 'Aug'].includes(month(S)), title: 'Alumni visit', body: () => 'An alum visited from college and said college robotics is "the same chaos, just with a bigger budget".' },
    { id: 'camp', req: S => off(S) && ['Jun', 'Jul'].includes(month(S)), title: 'Summer camp', body: S => student(S) + ' is teaching a summer robotics camp for fifth graders. They have been asked "can it shoot lasers" 40 times.' },
    { id: 'fair', req: S => off(S) && month(S) === 'Sep', title: 'Club fair', body: () => 'Club fair: the robot drove into the cafeteria and recruited three freshmen and one confused chemistry teacher.' },
    { id: 'fresh', req: S => off(S) && ['Sep', 'Oct'].includes(month(S)), title: 'Freshman training', body: S => 'Freshman training week: ' + student(S) + ' taught the new members how to use a drill press, then how to use it safely, then how to use it safely again.' },
    { id: 'hallo', req: S => off(S) && month(S) === 'Oct', title: 'Halloween costumes', body: S => student(S) + ' came to the meeting dressed as a swerve module. Nobody understood it except the programmers.' },
    { id: 'thanks', req: S => off(S) && month(S) === 'Nov', title: 'Thankful wall', body: () => 'The "thankful" wall in the shop has 63 sticky notes. Eleven are about the 3D printer.' },
    { id: 'holiday', req: S => off(S) && month(S) === 'Dec', title: 'Holiday party', body: () => 'Holiday gift exchange: nine of the twelve gifts were hex key sets. Everyone was happy.' },
    { id: 'predict', req: S => off(S) && month(S) === 'Dec', title: 'Kickoff predictions', body: S => student(S) + '\'s prediction for next season\'s game: "robots throw robots". The pool is open at $1 a guess.' },
    { id: 'look', req: S => off(S) && S.history.length > 0, title: 'Looking back', body: S => { const h = S.history[S.history.length - 1]; return 'Someone made a highlight video of the ' + h.year + ' season. The comment section is entirely parents, and it is wonderful.'; } },
    { id: 'offbot', req: S => off(S) && S.robot, title: 'Offseason projects', body: S => student(S) + ' wants to put the old robot\'s shooter on a go-kart "for science". ' + mentor(S) + ' has not said no yet.' }
  ];

  function post(S, title, body, kind, extra) { G.Career.inbox(S, title, body, kind, extra); }
  // weighted pick among templates that are allowed now and off cooldown; if everything is on cooldown, the stalest one
  function pickT(S, list, cd) {
    const ok = list.filter(e => { try { return !e.req || e.req(S); } catch (err) { return false; } });
    const fr = ok.filter(e => fresh(S, e.id, e.cd || cd));
    if (fr.length) return R().wpick(fr, e => e.w || 1);
    return ok.sort((a, b) => (seen(S)[a.id] || 0) - (seen(S)[b.id] || 0))[0] || null;
  }
  function runNews(S, e) {
    if (!e) return false;
    const res = e.run(S);
    if (!res) return false;
    seen(S)[e.id] = turnNo(S);
    if (res[2] && res[2].reply) res[2].until = turnNo(S); // replies are open for this turn only (a week in season, a month in the offseason)
    post(S, res[0], res[1], 'news', res[2]);
    return true;
  }
  // Called once per turn
  N.turn = function (S) {
    S.newsTurn = turnNo(S) + 1;
    // at least one news item: now and then one with an effect, otherwise a story about the FRC world or your program
    let got = false;
    if (R().chance(0.17)) got = runNews(S, pickT(S, EVENTS, 10));
    for (let k = 0; k < 4 && !got; k++) got = runNews(S, pickT(S, NEWS, 12));
    if (R().chance(0.2)) runNews(S, pickT(S, NEWS, 12));
    // one to three chatter posts
    const n = 1 + (R().chance(0.45) ? 1 : 0) + (R().chance(0.15) ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const c = pickT(S, CHAT, 16);
      if (!c) break;
      seen(S)[c.id] = turnNo(S);
      post(S, c.title, c.body(S), 'fun');
    }
  };
  N.kickoff = function (S) {
    const mf = G.Seasons[S.year].meta;
    if (mf && mf.faults) G.Career.inbox(S, 'Scouting report: what breaks this year', mf.faults + ' Expect brief comms drops at every event; clean wiring and a reliable, well-maintained robot keep them rare and short.', 'info');
    post(S, 'Kickoff watch party', R().int(18, 45) + ' students, ' + R().int(4, 12) + ' boxes of donuts and one very loud reaction when the ' + G.Seasons[S.year].name + ' field appeared on screen. ' + student(S) + ' has already sketched three robots on a napkin.', 'fun');
  };
  N.afterEvent = function (S, r) {
    if (!r) return;
    const lines = r.won ? ['The bus ride home was one long chant. ' + driver(S) + ' slept clutching the banner.', 'The group chat has posted the winning-match video 63 times. Nobody is tired of it yet.', mentor(S) + ' let the drive team ring the shop bell. It is not a bell. It is a pot and a wrench.']
      : r.playoffs ? ['The drive team got a standing ovation from the parents in the stands. ' + driver(S) + ' turned bright red.', student(S) + ' is already making a list of "things we fix before next time". It is four pages long.', 'The scouts were right about the opposing alliance. They would like everyone to remember that.']
        : ['Tough event. ' + mentor(S) + ' gave a speech about learning from it that made two people cry, one of them ' + mentor(S).split(' ')[0] + '.', 'The team agreed on three things to fix and ate an entire gas station\'s worth of snacks on the way home.', student(S) + ' spent the ride home re-watching every match and taking notes. The notes are mostly arrows.'];
    post(S, 'After ' + r.name, R().pick(lines), 'fun');
  };
})();

</script>
<script>/* js/render/draw.js */
'use strict';
/* FRC Manager — 2D rendering: season fields (top-down), robots (top-down + side profile), effects */
(function () {
  const E = G.Engine, FW = E.FW, FH = E.FH;
  const Rd = G.Render = {};
  const COL = {
    red: '#e5484d', blue: '#3e8cff', redS: 'rgba(229,72,77,0.16)', blueS: 'rgba(62,140,255,0.16)',
    carpet: '#2a3036', carpet2: '#262b31', line: 'rgba(235,240,245,0.55)', metal: '#9aa4ae', dark: '#1a1e23',
    cargoR: '#ff6b6b', cargoB: '#5aa2ff', cone: '#ffd23f', cube: '#9b6bff', note: '#ff9a3c', coral: '#f3efe6', algae: '#3fd0b0', fuel: '#ffd84a'
  };
  Rd.COL = COL;
  const alc = a => a === 'red' ? COL.red : COL.blue;
  const als = a => a === 'red' ? COL.redS : COL.blueS;

  function P(sym, a, x, y) { return a === 'blue' ? { x, y } : sym === 'mirror' ? { x: FW - x, y } : { x: FW - x, y: FH - y }; }
  function rect(ctx, s, x, y, w, h, fill, stroke, lw) {
    ctx.beginPath(); ctx.rect(x * s, y * s, w * s, h * s);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  // rect given in blue coords, converted for alliance a
  function arect(ctx, s, sym, a, x, y, w, h, fill, stroke, lw) {
    const p = P(sym, a, x, y), q = P(sym, a, x + w, y + h);
    rect(ctx, s, Math.min(p.x, q.x), Math.min(p.y, q.y), Math.abs(q.x - p.x), Math.abs(q.y - p.y), fill, stroke, lw);
  }
  function circ(ctx, s, x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function poly(ctx, s, pts, fill, stroke, lw) {
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x * s, p.y * s) : ctx.moveTo(p.x * s, p.y * s)); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function line(ctx, s, x0, y0, x1, y1, col, lw, dash) {
    ctx.beginPath(); ctx.moveTo(x0 * s, y0 * s); ctx.lineTo(x1 * s, y1 * s);
    ctx.strokeStyle = col; ctx.lineWidth = lw || 1.5; if (dash) ctx.setLineDash(dash); ctx.stroke(); if (dash) ctx.setLineDash([]);
  }
  function text(ctx, s, str, x, y, col, size, align) {
    ctx.fillStyle = col; ctx.font = '600 ' + Math.round((size || 11) * Math.max(0.85, Math.min(2.6, s / 62))) + 'px system-ui, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x * s, y * s);
  }
  function seeded(n) { const r = G.makeRng(n); return () => r.next(); }

  // ------------------------------------------------------------------
  // Field
  // ------------------------------------------------------------------
  // polygon given in blue coordinates, converted for alliance a
  function apoly(ctx, s, sym, a, pts, fill, stroke, lw) { poly(ctx, s, pts.map(p => P(sym, a, p[0], p[1])), fill, stroke, lw); }
  function aline(ctx, s, sym, a, x0, y0, x1, y1, col, lw, dash) { const p = P(sym, a, x0, y0), q = P(sym, a, x1, y1); line(ctx, s, p.x, p.y, q.x, q.y, col, lw, dash); }
  function atext(ctx, s, sym, a, str, x, y, col, size) { const p = P(sym, a, x, y); text(ctx, s, str, p.x, p.y, col, size); }
  // a ball with a soft highlight (cargo, algae, fuel)
  function ball(ctx, s, x, y, r, col) {
    circ(ctx, s, x, y, r, col, 'rgba(0,0,0,0.35)', 1);
    circ(ctx, s, x - r * 0.3, y - r * 0.3, r * 0.35, 'rgba(255,255,255,0.35)');
  }
  function ring(ctx, s, x, y, r, col, alpha) { ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; circ(ctx, s, x, y, r, null, col, Math.max(2, r * s * 0.55)); ctx.restore(); }
  const METAL = '#aab4be', DARKM = '#2c3238', TAPE = 'rgba(240,244,248,0.7)';
  Rd.field = function (ctx, year, s, m) {
    const S = G.Seasons[year], sym = S.sym;
    // carpet with subtle seams
    ctx.fillStyle = COL.carpet; ctx.fillRect(0, 0, FW * s, FH * s);
    for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? COL.carpet : COL.carpet2; ctx.fillRect(i * FW / 16 * s, 0, FW / 16 * s + 1, FH * s); }
    // guardrail and alliance walls with driver stations
    rect(ctx, s, 0.03, 0.03, FW - 0.06, FH - 0.06, null, '#59626c', Math.max(2, s * 0.06));
    [['blue', 0.0], ['red', FW - 0.1]].forEach(([a, x]) => {
      rect(ctx, s, x, 0.03, 0.1, FH - 0.06, alc(a));
      for (let i = 0; i < 3; i++) rect(ctx, s, x + (a === 'blue' ? 0.1 : -0.06), 1.4 + i * 2.05, 0.06, 1.2, 'rgba(255,255,255,0.18)');
    });
    line(ctx, s, FW / 2, 0.05, FW / 2, FH - 0.05, 'rgba(255,255,255,0.22)', 2);
    const fn = FIELD[year];
    if (fn) fn(ctx, s, sym, m);
  };

  const FIELD = {};
  FIELD[2022] = function (ctx, s, sym, m) {
    const cx = FW / 2, cy = FH / 2;
    ['blue', 'red'].forEach(a => {
      // two tarmac sections per alliance around the hub
      [[112, 174], [186, 248]].forEach(([d0, d1]) => {
        const pts = [];
        for (let d = d0; d <= d1; d += 6) { const g = d * Math.PI / 180; pts.push([cx + Math.cos(g) * 3.1, cy + Math.sin(g) * 3.1]); }
        for (let d = d1; d >= d0; d -= 6) { const g = d * Math.PI / 180; pts.push([cx + Math.cos(g) * 1.55, cy + Math.sin(g) * 1.55]); }
        apoly(ctx, s, sym, a, pts, als(a), alc(a), 2);
      });
      // hangar: low / mid / high / traversal rungs between four posts
      arect(ctx, s, sym, a, 0.12, 0.12, 3.05, 2.65, 'rgba(0,0,0,0.28)', alc(a), 2);
      [[0.22, 0.22], [3.07, 0.22], [0.22, 2.67], [3.07, 2.67]].forEach(p => { const q = P(sym, a, p[0], p[1]); rect(ctx, s, q.x - 0.09, q.y - 0.09, 0.18, 0.18, '#5d6670', METAL, 1); });
      ['LOW', 'MID', 'HIGH', 'TRAV'].forEach((nm, i) => {
        const x = 0.62 + i * 0.75;
        aline(ctx, s, sym, a, x, 0.3, x, 2.6, i >= 2 ? '#d7dde3' : METAL, 2 + i);
        atext(ctx, s, sym, a, nm, x, 2.9, alc(a), 8);
      });
      // terminal with the human player chute
      apoly(ctx, s, sym, a, [[0.08, 6.5], [1.7, 8.13], [0.08, 8.13]], als(a), alc(a), 2);
      aline(ctx, s, sym, a, 0.3, 7.45, 0.9, 8.05, '#e8edf2', 3);
      atext(ctx, s, sym, a, 'TERMINAL', 0.75, 7.75, alc(a), 7);
    });
    // hub: fender octagon, upper-hub net ring and the four lower exits
    const oct = []; for (let i = 0; i < 8; i++) { const g = (i * 45 + 22.5) * Math.PI / 180; oct.push({ x: cx + Math.cos(g) * 1.42, y: cy + Math.sin(g) * 1.42 }); }

    if (!t || !t.c1) { root.style.removeProperty('--accent'); root.style.removeProperty('--accent2'); root.style.removeProperty('--accent-ink'); return; }
    const hex = t.c1.replace('#', ''), n = parseInt(hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    // keep the accent bright enough on a dark background
    if (lum < 0.45) { const k = 0.45 / Math.max(0.05, lum); r = Math.min(255, Math.round(r * k)); g = Math.min(255, Math.round(g * k)); b = Math.min(255, Math.round(b * k)); }
    const mix = (c, w) => Math.round(c + (255 - c) * w);
    root.style.setProperty('--accent', 'rgb(' + r + ',' + g + ',' + b + ')');
    root.style.setProperty('--accent2', 'rgb(' + mix(r, 0.3) + ',' + mix(g, 0.3) + ',' + mix(b, 0.3) + ')');
    root.style.setProperty('--accent-ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#14171b' : '#ffffff');
  };
})();
(function () {
  const UI = G.UI, h = G.U.esc;

  UI.helpBtn = topic => '<button class="btn ghost sm helpq" data-act="helpTopic" data-arg="' + topic + '" title="How this works">' + UI.icon('help', 18) + '</button>';
  // Screen header: icon, title, help button, one-line subtitle
  UI.head = (title, icon, sub, topic) => '<div class="row head">' + (icon ? '<span class="hico">' + UI.icon(icon, 22) + '</span>' : '') + '<h1>' + h(title) + '</h1><span class="sp"></span>' + (topic ? UI.helpBtn(topic) : '') + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '');
  // Title with a leading icon for cards
  UI.it = (icon, text) => '<span class="it">' + UI.icon(icon, 16) + '<span>' + text + '</span></span>';
  // Small tabs row: [[id, label, icon]]
  UI.tabs = (cur, list, act) => '<div class="tabs">' + list.map(x => '<button class="tab ' + (cur === x[0] ? 'on' : '') + '" data-act="' + act + '" data-arg="' + x[0] + '">' + (x[2] ? UI.icon(x[2], 15) : '') + '<span>' + h(x[1]) + '</span>' + (x[3] ? '<span class="badge">' + x[3] + '</span>' : '') + '</button>').join('') + '</div>';
})();

</script>
<script>/* js/ui/screens-event.js */
'use strict';
/* FRC Manager — event screens: hub, practice, quals, alliance selection, playoffs, pre-match, live match, results */
(function () {
  const U = G.U, D = G.Data, h = U.esc, UI = G.UI;
  const Ev = () => G.S.event;
  const me = () => G.S.team.num;
  const tname = n => n === me() ? G.S.team.name : (G.S.teams[n] ? G.S.teams[n].name : '');
  const tlink = (n) => '<a href="#" data-act="scoutTeam" data-arg="' + n + '" class="' + (n === me() ? 'b' : '') + '" style="' + (n === me() ? 'color:var(--accent2)' : 'color:inherit') + '">' + n + '</a>';

  // =====================================================================

  UI.S.event = { nav: 'event', after() { const ev = Ev(); if (ev && ev.stage === 'done' && ev.result && ev.result.won && ev.kind === 'einstein' && !ev.wcShown) return UI.worldChampModal(ev); if (ev && ev.stage === 'done' && ev.result && ev.result.won && !ev.party) { ev.party = true; UI.confetti(); } }, html() {

    const K = G.Ev.KIND[ev.kind], rk = ev.rank[me()];
    let o = '<div class="row"><div><h1>' + h(ev.name) + '</h1><div class="sub">' + h(K.name) + (ev.week ? ' · Week ' + ev.week : '') + ' · ' + ev.teams.length + ' teams · ' + h(G.Career.seasonName(G.S, ev.year)) + '</div></div><span class="sp"></span>' +
      (rk && rk.played ? '<div class="kpi"><span class="v xl">' + U.ord(G.Ev.rankOf(ev, me())) + '</span><span class="l">Rank · ' + rk.w + '-' + rk.l + '-' + rk.t + ' · ' + (rk.rp / rk.played).toFixed(2) + ' RS</span></div>' : '') + '</div>';
    const stages = ['practice', 'quals', 'selection', 'playoffs', 'done'], stage = ev.pracReview ? 'practice' : ev.stage;
    o += '<div class="row wrap mb">' + stages.filter(s => !(ev.kind === 'scrimmage' && (s === 'selection' || s === 'playoffs')) && !(ev.kind === 'einstein' && (s === 'practice' || s === 'quals' || s === 'selection'))).map(s => UI.tag(s.toUpperCase(), s === stage ? 'acc' : stages.indexOf(s) < stages.indexOf(stage) ? 'good' : '')).join(' ') + '</div>';
    if (stage === 'practice') o += practiceView(ev);
    else if (ev.stage === 'quals') o += qualsView(ev);
    else if (ev.stage === 'selection') o += selectionView(ev);
    else if (ev.stage === 'playoffs') o += playoffView(ev);
    else o += doneView(ev);
    if (ev.stage !== 'done' && S.robot) o += pitCard(ev);
    if (stage !== 'practice' && ev.kind !== 'einstein') o += tabs(ev);

  // Condition of each subsystem on the competition robot, with "swap in spare" where an identical spare is in storage

      const sp = G.Robot.spareFor(S, k);
      return '<div class="row gap4">' + '<div class="sp">' + UI.stat(G.Seasons.sub(R.year, k).name, R.subs[k].cond, null, UI.colorFor(R.subs[k].cond)) + '</div>' +
        (sp ? '<button class="btn sm" data-act="swapSpare" data-arg="' + k + '" title="An identical spare (v' + sp.ver + ', ' + Math.round(sp.cond) + '%) from storage or the other robot">Swap in spare · ' + Math.round(sp.cond) + '%</button>' : '') + '</div>';
    }).join('');
  };
  UI.A.swapSpare = k => {
    const r = G.Robot.swapSpare(G.S, k);

    UI.toast(r.name + ': spare swapped in (' + r.from + '% → ' + r.to + '%). The worn one went to ' + r.where + '.', 'good'); G.Save.write('auto'); UI.render();
  };
  // ---------------- pit crew: condition + spare parts at event prices ----------------
  function pitCard(ev) {
    const S = G.S, R = S.robot, C = G.Career;

    return '<div class="card mt"><div class="ct">Pit crew<span class="sp"></span>' + UI.tag(S.parts.spares + ' spare parts', S.parts.spares ? '' : 'bad') + '</div>' +
      '<div class="grid g2"><div>' + (conds || '<p class="muted">Nothing built yet.</p>') + '</div><div class="col">' +
      '<div class="sm muted">Before each match the pit crew repairs the robot. One spare part restores about ' + D.SPARE_COND_PER_UNIT + ' condition points. With no spares left, repairs stop at 60%.</div>' +
      '<div class="row wrap gap4">' + [2, 5, 10].map(n => '<button class="btn sm" data-act="buySparesEvent" data-arg="' + n + '">Buy ' + n + ' · ' + U.money(n * up) + '</button>').join('') + '</div>' +

  function practiceView(ev) {
    const S = G.S;
    let o = '';
    if (ev.inspection && ev.inspection.notes.length) o += '<div class="warnbox mb">' + ev.inspection.notes.map(h).join('<br>') + '</div>';

    o += '<div class="grid g2"><div class="card"><div class="ct">' + (ev.pracReview ? 'Practice day complete' : 'Practice day — block ' + (ev.practice.used.length + 1) + ' of ' + ev.practice.blocks) + '</div>';
    const mustLighten = ev.inspection && !ev.inspection.ok;

      const nm = id => id === 'auto' ? 'Auto-picked blocks' : id === 'lighten' ? 'Emergency lightening' : ((G.Ev.PRACTICE.find(x => x.id === id) || {}).name || id);
      o += '<div class="col">' + (ev.pracLog || []).map((x, i) => '<div class="sm"><b>' + (i + 1) + '. ' + h(nm(x.p)) + '</b><div class="xs muted">' + x.out.map(h).join(' ') + '</div></div>').join('') + '</div>' +
        '<div class="row mt"><span class="sp"></span><button class="btn primary" data-act="endPractice">Continue to ' + (ev.stage === 'playoffs' ? 'playoffs' : 'qualifications') + '</button></div></div>';
    } else {
    o += '<div class="col">' + (mustLighten ? '<button class="btn primary" data-act="practice" data-arg="lighten">Emergency lightening (required to pass inspection)</button>' :
      G.Ev.PRACTICE.map(p => '<button class="btn" data-act="practice" data-arg="' + p.id + '" style="text-align:left;white-space:normal"><b>' + h(p.name) + '</b> <span class="xs muted">' + h(p.desc) + (p.id === 'install' ? ' (' + S.robot.pending.length + ' pending)' : '') + '</span></button>').join('')) + '</div>';
    o += '<div class="row mt"><span class="sp"></span><button class="btn sm" data-act="skipPractice">Auto-pick remaining blocks</button></div></div>';
    }
    o += '<div class="card"><div class="ct">Readiness</div>' + UI.stat('Robot tuning', ev.tune * 100) + UI.stat('Driver confidence', ev.conf * 100) + UI.stat('Auto bonus', ev.tuneAuto * 500) +
      UI.stat('Condition', G.Robot.condAvg(S), null, UI.colorFor(G.Robot.condAvg(S))) +
      (S.robot && G.Robot.famAvg(S.robot, S.robot.comp || 0) != null ? UI.stat('Driver familiarity', G.Robot.famAvg(S.robot, S.robot.comp || 0) * 100, null, UI.colorFor(G.Robot.famAvg(S.robot, S.robot.comp || 0) * 100)) : '') +
      '<div class="sm mt">' + UI.icon('fatigue', 14) + ' Fatigue ' + UI.fatigueBar(ev.fatigue == null ? 30 : ev.fatigue) + ' <b>' + Math.round(ev.fatigue == null ? 30 : ev.fatigue) + '</b> (' + G.Career.fatigueLabel(ev.fatigue == null ? 30 : ev.fatigue) + ') · ' + UI.icon('scout', 14) + ' scouting credibility <b>' + Math.round((ev.scoutCred || 1) * 100) + '%</b></div>' + '<div class="sm muted mt">Batteries ' + S.parts.batts.length + ' (' + Math.round(G.Shop.fleetHealth(S) * 100) + '% health) · spares ' + S.parts.spares + ' · weight ' + G.Robot.weight(S) + ' lb</div>' +
      (ev.log.length ? '<div class="hr"></div>' + ev.log.slice(-6).map(l => '<div class="sm">• ' + h(l) + '</div>').join('') : '') + '</div></div>';
    return o;
  }
  UI.A.practice = function (p) { const ev = Ev(); if (ev.stage !== 'practice') return; const out = G.Ev.doPractice(ev, p); out.forEach(x => ev.log.push(x)); (ev.pracLog = ev.pracLog || []).push({ p, out }); if (ev.stage !== 'practice') ev.pracReview = true; UI.toast(out.join(' '), 'good'); G.Save.write('auto'); UI.render(); };
  UI.A.skipPractice = function () {

    G.Ev.skipPractice(ev);
    (ev.pracLog = ev.pracLog || []).push({ p: 'auto', out: ev.log.slice(n0) });
    ev.pracReview = true; G.Save.write('auto'); UI.render();
  };
  UI.A.endPractice = function () { const ev = Ev(); if (ev) { ev.pracReview = false; G.Save.write('auto'); UI.render(); } };

  function matchTeamsLine(mt) {
    return '<span class="pill-red">' + mt.red.map(tlink).join(' ') + '</span> vs <span class="pill-blue">' + mt.blue.map(tlink).join(' ') + '</span>';
  }
  function qualsView(ev) {
    const left = G.Ev.playerMatchesLeft(ev);
    const next = ev.quals.slice(ev.qi).find(G.Ev.hasPlayer);
    let o = '<div class="grid g2"><div class="card hl"><div class="ct">Qualification matches ' + UI.tag(left + ' left for you', 'acc') + '</div>';
    if (next) {
      const gap = ev.quals.indexOf(next) - ev.qi;
      o += '<div class="mb">Next: <b>Qual ' + next.n + '</b> ' + matchTeamsLine(next) + '</div><div class="sm muted mb">' + (gap > 0 ? gap + ' other match' + (gap > 1 ? 'es' : '') + ' before yours (pit time for repairs).' : 'You\'re up next.') + '</div>' +
        '<div class="row wrap"><button class="btn primary" data-act="nextQual">Prepare match ▶</button><button class="btn" data-act="simQual">Simulate it</button><button class="btn" data-act="simAllQuals">Simulate all remaining</button></div>';
    } else o += '<p>All your qualification matches are done.</p><button class="btn primary" data-act="finishQuals">Continue</button>';
    o += '</div><div class="card"><div class="ct">Your results</div>' + resultsList(ev) + '</div></div>';
    return o;
  }
  function resultsList(ev) {
    if (!ev.playerResults.length) return '<p class="muted">No matches yet.</p>';
    return '<table class="t"><tr><th>Match</th><th class="num">Score</th><th>Result</th><th class="num">RP</th><th>Faults</th></tr>' + ev.playerResults.map(r => '<tr><td>' + h(r.id) + '</td><td class="num">' + r.our + '–' + r.their + '</td><td class="' + (r.win === 1 ? 'good' : r.win === 0 ? 'bad' : 'warn') + '">' + (r.win === 1 ? 'W' : r.win === 0 ? 'L' : 'T') + '</td><td class="num">' + (String(r.id).startsWith('Q') ? r.rp : '—') + '</td><td class="xs warn">' + h(r.faults.join(', ')) + '</td></tr>').join('') + '</table>';
  }
  function prepQual(ev, mt) { if (!mt.prepped) { G.Career.beforePlayerMatch(G.S, ev); mt.prepped = true; } UI.st.match = { kind: 'qual', mt }; }
  UI.A.nextQual = function () {

  UI.A.simQual = function () {

  UI.A.simAllQuals = function () { const ev = Ev(); G.Ev.simRestQuals(ev); G.Save.write('auto'); UI.render(); };

  // ---------------- selection ----------------
  function selectionView(ev) {

    for (let k = 0; k < 8; k++) { const a = sel.alliances[k] || []; o += '<tr class="' + (a.includes(me()) ? 'me' : '') + '"><td>' + (k + 1) + '</td><td>' + (a[0] ? tlink(a[0]) : '') + '</td><td>' + (a[1] ? tlink(a[1]) : '') + '</td><td>' + (a[2] ? tlink(a[2]) : '') + '</td></tr>'; }

        '<div class="row"><button class="btn primary" data-act="selRespond" data-arg="1">Accept</button><button class="btn bad" data-act="selRespond" data-arg="0">Decline</button></div>';
    } else if (sel.pending && sel.pending.type === 'pick') {
      o += '<div class="ct">Your pick — Alliance ' + (sel.pending.k + 1) + ' (' + (sel.round === 1 ? 'first' : 'second') + ' round)</div>' + (sel.pending.declinedMsg ? '<div class="warnbox mb">' + h(sel.pending.declinedMsg) + '</div>' : '') + pickTable(ev);
    } else if (sel.done) o += '<p>Alliance selection complete.</p>';
    else o += '<p class="muted">Waiting…</p>';
    o += '</div></div>';
    return o;
  }
  // ---- scouting data cells (observed in this event's qualification matches) ----
  const pctTxt = v => v == null ? '<span class="dim">—</span>' : '<span style="color:' + UI.colorFor(v * 100) + '">' + Math.round(v * 100) + '%</span>';
  const OBS_HEAD = '<th class="num" title="Points this robot scored itself, per match">Pts/m</th><th class="num" title="Matches where its autonomous routine ran as planned">Auto</th><th title="Successful endgame climbs out of attempts, and the usual level">Climb</th><th class="num" title="Matches without a breakdown, brownout, jam or comms loss (✕ = times disabled)">Fault-free</th><th class="num" title="Fouls per match">Fouls</th><th class="num" title="Matches spent playing defense">Def</th>';
  function obsCells(ev, t) {
    const o = G.Ev.obsShown(ev, t), Sz = G.Seasons[ev.year];
    if (!o) return '<td class="dim xs" colspan="6">no matches yet</td>';
    const climb = o.climbTry ? pctTxt(o.climb) + ' <span class="xs dim" title="' + (ev.year === 2023 ? 'Docks that ended Engaged' : 'Successful climbs / attempts') + '">' + Math.round((o.climb || 0) * o.climbTry) + '/' + o.climbTry + (ev.year === 2023 ? ' eng' : o.climbLvl ? ' ' + h(Sz.endNames[Math.round(o.climbLvl)] || '') : '') + '</span>' : '<span class="dim">—</span>';
    return '<td class="num">' + o.pts.toFixed(1) + '</td><td class="num">' + pctTxt(o.auto) + '</td><td class="nowrap">' + climb + '</td><td class="num">' + pctTxt(o.rel) + (o.dead ? ' <span class="xs bad" title="Disabled ' + o.dead + '×">' + o.dead + '✕</span>' : '') + '</td><td class="num">' + o.fouls.toFixed(1) + '</td><td class="num">' + (o.def || '<span class="dim">0</span>') + '</td>';
  }
  function pickTable(ev) {

    return '<div class="xs muted mb">Sorted by pick value: OPR discounted by breakdowns, plus auto and climb consistency, fouls, and what your alliance still needs. Hover the headers for details.</div>' +
      '<div style="max-height:440px;overflow:auto"><table class="t tight"><tr><th>Team</th><th class="num">OPR</th>' + OBS_HEAD + '<th class="num">Value</th><th></th></tr>' + rows.slice(0, 30).map((r, i) => {
      return '<tr><td class="nowrap">' + tlink(r.t) + (i < 3 ? ' ' + UI.tag('rec', 'acc') : '') + '<div class="xs muted">#' + G.Ev.rankOf(ev, r.t) + ' · ' + h(r.sc.arch || '') + '</div></td><td class="num">' + (opr[r.t] || 0) + '</td>' + obsCells(ev, r.t) + '<td class="num b">' + r.v.toFixed(1) + '</td><td><button class="btn sm primary" data-act="selPick" data-arg="' + r.t + '">Pick</button></td></tr>';

  UI.A.selPick = function (t) { const ev = Ev(); const ok = G.Ev.playerPick(ev, Number(t)); if (!ok) UI.toast('They declined!', 'bad'); UI.render(); };

  // ---------------- playoffs ----------------
  function bmatch(ev, id) {

    const cls = (i) => m.winner == null ? '' : m.winner === i ? 'w' : 'l';
    return '<div class="bm ' + (m.red === pa || m.blue === pa ? 'me' : '') + '"><div class="xs muted">' + id + (m.bye ? ' (bye)' : '') + '</div><div class="al ' + cls(m.red) + '"><span class="red">' + al(m.red) + '</span><span>' + sc('red') + '</span></div><div class="al ' + cls(m.blue) + '"><span class="blue">' + al(m.blue) + '</span><span>' + sc('blue') + '</span></div></div>';
  }
  UI.bracket = function (ev) {
    const col = (t, ids) => '<div><div class="xs muted mb">' + t + '</div>' + ids.map(i => bmatch(ev, i)).join('') + '</div>';
    return '<div class="bracket">' + col('Upper R1', ['M1', 'M2', 'M3', 'M4']) + col('Lower R1 · Upper R2', ['M5', 'M6', 'M7', 'M8']) + col('Lower R2 · Upper Final', ['M9', 'M10', 'M11']) + col('Lower R3 · Lower Final', ['M12', 'M13']) + col('Finals (best of 3)', ['F']) + '</div>';
  };
  function playoffView(ev) {
    const pa = G.Ev.playerAlliance(ev);
