<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Manager Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05070a; color: #cfd6dd; font: 14px Inter, system-ui, sans-serif; }
  canvas { display: block; width: 100%; max-width: 1280px; margin: 0 auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 16px; flex-wrap: wrap; }
  input[type=range] { width: min(640px, 70vw); }
  button { background: #1b222b; color: #e6ebf0; border: 1px solid #2a333d; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #st { color: #f5b800; }
  #app { display: none; }
</style>
</head>
<body>
<!-- 90-second reveal video for FRC Manager. Open through a local web server (not file://), press Render MP4.
     It loads the whole game (engine, renderer, world simulation and map geometry), shows real screens captured from
     the game (media/reveal-shots, made with the screenshot harness), synthesizes the soundtrack with Web Audio and
     encodes H.264/AAC with WebCodecs + mp4-muxer. -->
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="bar">
  <input id="seek" type="range" min="0" max="90" step="0.05" value="0">
  <span id="tm">0.00 s</span>
  <button id="play">Play (no sound)</button>
  <button id="render">Render MP4</button>
  <span id="st"></span>
</div>
<div id="app"></div>
<script src="../../js/core.js"></script>
<script src="../../js/data/seasons.js"></script>
<script src="../../js/data/seasons-classic.js"></script>
<script src="../../js/data/world.js"></script>
<script src="../../js/data/eras.js"></script>
<script src="../../js/data/parts.js"></script>
<script src="../../js/sim/engine.js"></script>
<script src="../../js/sim/rules.js"></script>
<script src="../../js/sim/rules-classic.js"></script>
<script src="../../js/sim/ai.js"></script>
<script src="../../js/sim/event.js"></script>
<script src="../../js/systems/robot.js"></script>
<script src="../../js/systems/career.js"></script>
<script src="../../js/systems/shop.js"></script>
<script src="../../js/systems/parts.js"></script>
<script src="../../js/systems/news.js"></script>
<script src="../../js/systems/world.js"></script>
<script src="../../js/systems/scouting.js"></script>
<script src="../../js/render/draw.js"></script>
<script src="../../js/render/draw-classic.js"></script>
<script src="../../js/ui/ui.js"></script>
<script src="../../js/ui/icons.js"></script>
<script src="../../js/ui/screens-world.js"></script>
<script src="../../js/dev.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="trailer.js"></script>
</body>
</html>
